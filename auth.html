var L=[
/* ---------- 1 ---------- */
{id:`lesson-1`,track:`auth`,trackName:`Auth and security`,title:`Authentication vs authorization, and what gets asked`,min:9,
 promise:`Two words that sound alike and are asked in every backend interview. Get the difference crisp, then see the map of the whole topic.`,
 blocks:[
 {t:`plain`,h:`<b>Authentication</b> answers "who are you?". <b>Authorization</b> answers "what are you allowed to do?". Authentication always comes first. You cannot decide what someone may do until you know who they are.`},
 {t:`analogy`,h:`At an office building, the guard at the gate checks your ID card. That is authentication. Your card then opens only the floors you work on. That is authorization. A valid card does not open every door.`},
 {t:`diagram`,cap:`The request meets authentication first. Authorization is checked after the system knows who you are.`,d:{w:420,alt:`Flow: Request goes to Authentication, then Authorization, then the resource`,nodes:[
   {id:`rq`,t:`Request`,x:10,y:20,w:80,k:`state`},
   {id:`an`,t:`Authentication`,s:`who are you?`,x:120,y:6,w:130},
   {id:`az`,t:`Authorization`,s:`what may you do?`,x:280,y:6,w:130},
   {id:`r1`,t:`401 Unauthorized`,x:100,y:80,w:150,k:`note`,m:[`identity not proven`]},
   {id:`r2`,t:`403 Forbidden`,x:270,y:80,w:140,k:`note`,m:[`known, but not allowed`]}],
  edges:[{a:`rq`,b:`an`},{a:`an`,b:`az`},{a:`an`,b:`r1`,k:`uses`},{a:`az`,b:`r2`,k:`uses`}]}},
 {t:`p`,h:`<h2>The status codes people mix up</h2>`},
 {t:`two`,a:{h:`401 Unauthorized`,b:`The name is misleading. It really means "unauthenticated": no valid credentials were given. The client can fix it by logging in or sending a valid token.`},b:{h:`403 Forbidden`,b:`The server knows who you are and says no. Logging in again will not help. You need a different permission.`}},
 {t:`p`,h:`<h2>The map of this course</h2>`},
 {t:`cards`,items:[
   {h:`Lesson 2: Sessions and tokens`,b:`Two ways to remember a logged-in user. Which one scales, and why.`},
   {h:`Lesson 3: JWT`,b:`What is inside one, how to check it, and the famous "how do you revoke it?" question.`},
   {h:`Lesson 4: OAuth2 and OIDC`,b:`"Login with Google" explained. The flow that gets asked most.`},
   {h:`Lesson 5: Spring Security`,b:`The filter chain, the config you actually write, and method-level rules.`},
   {h:`Lesson 6: Access models and API safety`,b:`RBAC, passwords, CSRF, CORS and service-to-service calls.`},
   {h:`Lesson 7: Questions with full answers`,b:`Eleven questions worked end to end.`}]},
 {t:`remember`,h:`Interview guides on auth for experienced developers keep returning to the same cluster: sessions versus JWT, how to revoke a token, the OAuth2 authorization-code flow with PKCE, and Spring Security configuration. Weight your time that way.`},
 {t:`mistake`,h:`Saying "authentication and authorization" as one blur. Interviewers often start with this to see if you are precise. Keep two sentences ready: one for each word, and the 401 versus 403 difference.`},
 {t:`check`,q:`A user is logged in but opens the admin page. Which status code, and why?`,a:`403. The system knows who they are (authenticated), but they lack the permission (not authorized). 401 would mean the system could not tell who they are.`}
]},

/* ---------- 2 ---------- */
{id:`lesson-2`,track:`auth`,trackName:`Auth and security`,title:`Sessions vs tokens: how a server remembers you`,min:12,
 promise:`HTTP forgets you after every request. There are two ways to fix that. Knowing the trade-off between them is the base of every auth answer.`,
 blocks:[
 {t:`plain`,h:`HTTP is <b>stateless</b>. Every request arrives as a stranger. After login, something must travel with each request to say "it is still me". That something is either a <b>session id</b> (a reference) or a <b>token</b> (the proof itself).`},
 {t:`analogy`,h:`A <b>session</b> is a cloakroom ticket: a small number, and the coat stays in the cloakroom. A <b>token</b> is a signed passport: everything about you is printed on it, and any officer can check the stamp without calling anyone.`},
 {t:`two`,a:{h:`Session (stateful)`,b:`Server stores the user's details in memory, Redis or a database. The browser holds only a random id in a cookie. Each request: look up the id.`},b:{h:`Token (stateless)`,b:`Server signs a token containing the user id and roles. The client sends it back each time. Server only verifies the signature. No lookup.`}},
 {t:`diagram`,cap:`Session: the server keeps the data. Token: the client carries it.`,d:{w:420,alt:`Two lanes comparing session lookup with token verification`,nodes:[
   {id:`b1`,t:`Browser`,x:6,y:14,w:84},
   {id:`s1`,t:`Server A`,x:170,y:14,w:84},
   {id:`st`,t:`Session store`,s:`Redis`,x:318,y:6,w:96},
   {id:`b2`,t:`Client`,x:6,y:110,w:84},
   {id:`s2`,t:`Server A or B`,x:170,y:110,w:110},
   {id:`nt`,t:`No store needed`,x:318,y:116,w:96,k:`note`,m:[`just verify`]}],
  edges:[{a:`b1`,b:`s1`,l:`cookie`},{a:`s1`,b:`st`,l:`lookup`},{a:`b2`,b:`s2`,l:`token`},{a:`s2`,b:`nt`,k:`uses`}]}},
 {t:`p`,h:`<h2>The trade-off, honestly</h2>`},
 {t:`cards`,items:[
   {h:`Session wins at: revoking`,b:`Delete the session on the server and the user is out instantly. Useful for "log out everywhere" and for banning an account.`},
   {h:`Token wins at: scaling`,b:`Any server can verify it. No shared store on the hot path. Good for many microservices and mobile apps.`},
   {h:`Session cost`,b:`A shared store (Redis) or sticky load balancing, so every server can find the session.`},
   {h:`Token cost`,b:`Hard to revoke before it expires. Bigger on the wire. Anything inside it can go stale.`}]},
 {t:`code`,cap:`Session login in Spring MVC (what a classic web app does)`,code:`@PostMapping("/login")
public ResponseEntity<Void> login(@RequestBody LoginRequest req, HttpSession session) {
    User u = users.verify(req.email(), req.password());   // throws if wrong
    session.setAttribute("userId", u.getId());             // server keeps this
    return ResponseEntity.ok().build();                    // JSESSIONID cookie is set for you
}`},
 {t:`code`,use:true,cap:`How it is used`,code:`// 1. Browser sends POST /login with email and password.
// 2. Server replies: Set-Cookie: JSESSIONID=9F3A...; HttpOnly; Secure
// 3. Every later request carries Cookie: JSESSIONID=9F3A...
// 4. Server looks 9F3A... up and finds userId=42. With Spring Session + Redis,
//    ANY server in the cluster can do that lookup.`},
 {t:`remember`,h:`The honest answer to "which is better" is <b>it depends</b>. Browser app with one backend: sessions are simple and revocable. Mobile app, many services, or third-party APIs: tokens. Say which you would pick for the case in front of you, and why.`},
 {t:`mistake`,h:`Claiming "JWT is more secure than sessions". It is not. It is a different trade. A session id in an HttpOnly cookie is very safe. A JWT in localStorage is exposed to any script injected into the page.`},
 {t:`check`,q:`Your app runs on 10 servers behind a load balancer and uses sessions. Users keep getting logged out. What went wrong, and what are two fixes?`,a:`Each server holds sessions in its own memory, so a request landing on another server finds nothing. Fix 1: put sessions in a shared store such as Redis (Spring Session). Fix 2: sticky sessions at the load balancer, which is weaker because a server restart still loses its users. A third option is stateless tokens.`}
]},

/* ---------- 3 ---------- */
{id:`lesson-3`,track:`auth`,trackName:`Auth and security`,title:`JWT: what is inside, and the revocation question`,min:14,
 promise:`JWT comes up in almost every interview. Learn the parts, the checks you must do, and the one question everyone gets stuck on.`,
 blocks:[
 {t:`plain`,h:`A <b>JWT</b> (JSON Web Token) is three pieces joined by dots: <b>header.payload.signature</b>. The header says how it was signed. The payload carries <b>claims</b>, which are facts such as user id, roles and expiry. The signature proves nobody changed the first two parts.`},
 {t:`analogy`,h:`It is a postcard, not a sealed letter. Anyone can read what is written on it. The signature is a tamper seal: if someone edits the card, the seal no longer matches. So never put secrets, such as a password, in a JWT.`},
 {t:`code`,cap:`A decoded JWT (the payload part)`,code:`{
  "sub": "42",                  // subject: the user id
  "iss": "https://auth.myapp.in",  // issuer: who created it
  "aud": "orders-api",          // audience: who it is meant for
  "exp": 1767225600,            // expiry (seconds since 1970)
  "iat": 1767224700,            // issued at
  "roles": ["USER", "ADMIN"],
  "jti": "a1b2c3"               // unique id of this token
}`},
 {t:`p`,h:`<h2>Two ways to sign</h2>`},
 {t:`two`,a:{h:`HS256 (shared secret)`,b:`One secret signs and verifies. Simple. But every service that verifies can also forge tokens. Fine for one app.`},b:{h:`RS256 (key pair)`,b:`Auth server signs with a private key. Services verify with the public key. They cannot forge. Preferred when many services consume the token.`}},
 {t:`p`,h:`<h2>What you must check on every request</h2>`},
 {t:`steps`,items:[
   [`Signature.`,` Verify with the right key. Pin the algorithm you expect.`],
   [`Expiry (exp).`,` Reject expired tokens.`],
   [`Issuer (iss).`,` It must be your auth server, not someone else's.`],
   [`Audience (aud).`,` The token must be meant for this API.`],
   [`Then roles.`,` Only after the four checks above, read the claims and authorize.`]]},
 {t:`code`,use:true,cap:`How it is used: validating a token in Spring Boot (resource server)`,code:`# application.yml - Spring fetches the public keys and checks signature, exp and iss for you
spring:
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: https://auth.myapp.in

// In a controller, the verified token is handed to you:
@GetMapping("/me")
public Map<String,Object> me(@AuthenticationPrincipal Jwt jwt) {
    return Map.of("userId", jwt.getSubject(), "roles", jwt.getClaimAsStringList("roles"));
}`},
 {t:`p`,h:`<h2>The famous question: how do you revoke a JWT?</h2><p>A signed token is valid until <code>exp</code>, with no server call. So "log out" cannot just delete it. Interview guides call this out as a common trap. The honest answer has layers.</p>`},
 {t:`steps`,items:[
   [`Keep access tokens short.`,` Five to fifteen minutes. A stolen token dies quickly.`],
   [`Add a refresh token.`,` Long-lived, stored on the server side, revocable. The client swaps it for a new access token. Rotate it on each use.`],
   [`Denylist the jti.`,` For emergencies, store revoked token ids in Redis until they expire. This brings back one lookup, and that is the honest cost.`],
   [`Rotate signing keys.`,` For a mass compromise, change the key and every old token fails.`]]},
 {t:`p`,h:`<h2>Where does the client keep it?</h2>`},
 {t:`cards`,items:[
   {h:`localStorage`,b:`Easy, but any injected script can read it (XSS).`},
   {h:`HttpOnly Secure cookie`,b:`Scripts cannot read it. But the browser sends it automatically, so you must protect against CSRF with SameSite and CSRF tokens.`}]},
 {t:`mistake`,h:`Decoding a JWT without verifying the signature, then trusting the roles inside. Reading is not trusting. Another classic: accepting <code>alg: none</code> or letting the token pick its own algorithm. Always pin the algorithm on the server.`},
 {t:`check`,q:`A user changes their role from ADMIN to USER, but their old token still says ADMIN for 10 more minutes. What are your options?`,a:`Accept the delay, because short expiry bounds the damage. Or make sensitive endpoints re-check the role in the database. Or put a version number in the token and compare it to the stored version. Or denylist that token id. Each trades a little statelessness for freshness.`}
]},

{id:`lesson-4`,track:`auth`,trackName:`Auth and security`,title:`OAuth2 and OpenID Connect: "Login with Google"`,min:15,
 promise:`OAuth2 is the most misunderstood topic here. This lesson fixes it with one picture and one rule.`,
 blocks:[
 {t:`plain`,h:`<b>OAuth2</b> is about <b>delegated access</b>. It lets an app act on your behalf without ever seeing your password. It is an <b>authorization</b> framework. <b>OpenID Connect (OIDC)</b> is a thin layer on top that adds <b>authentication</b>: an ID token that says who the user is.`},
 {t:`analogy`,h:`A hotel gives you a keycard. The card opens only your room, for your stay. You never get the master key, and the hotel can cancel the card without changing any locks. The access token is that keycard.`},
 {t:`p`,h:`<h2>The four roles</h2>`},
 {t:`cards`,items:[
   {h:`Resource owner`,b:`The user who owns the data.`},
   {h:`Client`,b:`The app that wants access (your web app).`},
   {h:`Authorization server`,b:`Logs the user in and issues tokens (Keycloak, Okta, Auth0, Azure AD, Google).`},
   {h:`Resource server`,b:`The API that holds the data and checks the access token.`}]},
 {t:`p`,h:`<h2>The flow that gets asked: Authorization Code with PKCE</h2>`},
 {t:`diagram`,cap:`The user logs in at the auth server, never at your app. Your app receives a short code, then swaps it for tokens.`,d:{w:420,alt:`Authorization code flow between browser, client app, auth server and API`,nodes:[
   {id:`u`,t:`User and browser`,x:10,y:10,w:130},
   {id:`c`,t:`Client app`,x:280,y:10,w:130},
   {id:`a`,t:`Auth server`,x:10,y:120,w:130},
   {id:`r`,t:`Resource API`,x:280,y:120,w:130}],
  edges:[{a:`u`,b:`a`,l:`1 login and consent`,o:-6},{a:`a`,b:`c`,l:`2 code`,o:12},{a:`c`,b:`a`,l:`3 code + verifier`,o:12},{a:`c`,b:`r`,l:`4 access token`,o:0}]}},
 {t:`steps`,items:[
   [`Redirect.`,` Your app sends the browser to the auth server with a <code>code_challenge</code> (a hash of a secret it just made).`],
   [`Login and consent.`,` The user signs in at the auth server and agrees.`],
   [`Code comes back.`,` The browser returns to your app with a one-time <b>authorization code</b>. The code alone is useless.`],
   [`Swap.`,` Your app sends the code plus the original secret (<code>code_verifier</code>) to the auth server and receives an access token, a refresh token and, with OIDC, an ID token.`],
   [`Call the API.`,` Send <code>Authorization: Bearer access_token</code>. The API checks it.`]]},
 {t:`remember`,h:`<b>PKCE</b> (said "pixy") stops a stolen code from being used. Only the app that made the secret can finish the swap. It started for mobile apps and is now recommended for every client. The newer OAuth 2.1 draft requires it and drops the implicit and password grants.`},
 {t:`p`,h:`<h2>Which grant for which job</h2>`},
 {t:`cards`,items:[
   {h:`Authorization code + PKCE`,b:`Users logging in through a browser or mobile app. The default answer.`},
   {h:`Client credentials`,b:`Service-to-service, no user. Example: the billing job calls the orders API.`},
   {h:`Refresh token`,b:`Get a new access token without asking the user to log in again.`},
   {h:`Implicit and password grant`,b:`Legacy and discouraged. Say you would not use them.`}]},
 {t:`code`,use:true,cap:`How it is used: a Spring Boot app that logs users in through Google or Keycloak`,code:`# application.yml
spring:
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: my-client-id
            client-secret: my-client-secret
            scope: openid,profile,email

@Bean
SecurityFilterChain chain(HttpSecurity http) throws Exception {
    http.authorizeHttpRequests(a -> a.anyRequest().authenticated())
        .oauth2Login(Customizer.withDefaults());   // adds /oauth2/authorization/google
    return http.build();
}`},
 {t:`two`,a:{h:`Access token`,b:`Presented to the API. Says what you may do. Short-lived. The API may treat it as opaque or as a JWT.`},b:{h:`ID token (OIDC)`,b:`Read by the client app. Says who logged in. Always a JWT. Never send it to an API as a credential.`}},
 {t:`mistake`,h:`Saying "I used OAuth2 to log users in". OAuth2 alone does not say who the user is. Say "OIDC on top of OAuth2". Another slip: calling the ID token and the access token the same thing.`},
 {t:`check`,q:`Your nightly settlement job needs to call the payments API. There is no user. Which grant?`,a:`Client credentials. The job authenticates as itself with a client id and secret (or a signed assertion), gets an access token with only the scopes it needs, and calls the API.`}
]},

{id:`lesson-5`,track:`auth`,trackName:`Auth and security`,title:`Spring Security: the filter chain and the config you write`,min:16,
 promise:`Spring Security feels like magic until you see that it is just a chain of filters. Then every question about it becomes answerable.`,
 blocks:[
 {t:`plain`,h:`Spring Security is a list of <b>servlet filters</b> that every web request passes through before it reaches your controller. Each filter does one job: check CORS, read the token, check CSRF, decide if the request is allowed. If one says no, the request stops there.`},
 {t:`analogy`,h:`Airport security. Passport check, then baggage scan, then boarding gate. You must pass each one in order. Your controller is the plane. Most days it never sees the people who were turned back.`},
 {t:`diagram`,cap:`Servlet container to a single entry filter, which runs your own ordered chain, then the controller.`,d:{w:420,alt:`Request flows through DelegatingFilterProxy, FilterChainProxy, security filters and then the controller`,nodes:[
   {id:`rq`,t:`Request`,x:10,y:70,w:70,k:`state`},
   {id:`fp`,t:`FilterChainProxy`,s:`one entry point`,x:100,y:50,w:120},
   {id:`f1`,t:`Filters in order`,x:240,y:6,w:170,m:[`CORS, CSRF, Logout`,`Bearer token or Basic`,`ExceptionTranslation`,`AuthorizationFilter`]},
   {id:`ct`,t:`Controller`,x:265,y:150,w:120}],
  edges:[{a:`rq`,b:`fp`},{a:`fp`,b:`f1`},{a:`f1`,b:`ct`,l:`if allowed`}]}},
 {t:`p`,h:`<h2>The config you actually write (Spring Security 6, Boot 3)</h2><p>Since version 6 you define a <code>SecurityFilterChain</code> bean. The old <code>WebSecurityConfigurerAdapter</code> was removed. Interviewers like to check that you know this.</p>`},
 {t:`code`,cap:`A stateless REST API secured with JWT`,code:`@Configuration
@EnableWebSecurity
@EnableMethodSecurity            // turns on @PreAuthorize (replaces @EnableGlobalMethodSecurity)
public class SecurityConfig {

    @Bean
    SecurityFilterChain api(HttpSecurity http) throws Exception {
        http
          .csrf(csrf -> csrf.disable())                       // fine for pure bearer-token APIs
          .sessionManagement(s -> s.sessionCreationPolicy(SessionCreationPolicy.STATELESS))
          .authorizeHttpRequests(auth -> auth
              .requestMatchers("/health", "/public/**").permitAll()
              .requestMatchers("/admin/**").hasRole("ADMIN")
              .anyRequest().authenticated())                  // everything else needs a valid token
          .oauth2ResourceServer(o -> o.jwt(Customizer.withDefaults()));
        return http.build();
    }

    @Bean
    PasswordEncoder passwordEncoder() {
        return new BCryptPasswordEncoder();                   // slow on purpose
    }
}`},
 {t:`code`,use:true,cap:`How it is used: rules on methods and reading the current user`,code:`@Service
public class OrderService {

    @PreAuthorize("hasRole('ADMIN') or #userId == authentication.name")
    public List<Order> ordersOf(String userId) { ... }   // admin, or the owner themselves

    @PostAuthorize("returnObject.ownerId == authentication.name")
    public Order get(long id) { ... }                    // checked after it loads
}

@GetMapping("/orders")
public List<Order> mine(Authentication auth) {           // injected by Spring
    return orderService.ordersOf(auth.getName());
}`},
 {t:`p`,h:`<h2>How a username and password login works inside</h2>`},
 {t:`steps`,items:[
   [`Filter reads the credentials.`,` It builds an unauthenticated <code>Authentication</code> object.`],
   [`AuthenticationManager.`,` It hands the object to a <code>ProviderManager</code>, which asks each <code>AuthenticationProvider</code>.`],
   [`DaoAuthenticationProvider.`,` It loads the user through your <code>UserDetailsService</code> and compares the password using the <code>PasswordEncoder</code>.`],
   [`Success.`,` A fully authenticated object, with authorities, is stored in the <code>SecurityContext</code>, which is held per thread in <code>SecurityContextHolder</code>.`],
   [`Later code reads it.`,` <code>@PreAuthorize</code> and <code>Authentication</code> parameters read from that context.`]]},
 {t:`cards`,items:[
   {h:`hasRole("ADMIN") vs hasAuthority("ROLE_ADMIN")`,b:`Same thing. <code>hasRole</code> adds the <code>ROLE_</code> prefix for you. A classic gotcha when roles come from a JWT claim and the prefix is missing.`},
   {h:`Filter order matters`,b:`Your custom JWT filter must sit before the authorization filter, with <code>addFilterBefore</code>.`},
   {h:`Context is per thread`,b:`Async work and new threads lose the logged-in user unless you propagate the context.`}]},
 {t:`mistake`,h:`Disabling CSRF protection everywhere "because it was giving errors". That is only safe for stateless APIs that read a bearer header. If your app uses cookie sessions, the browser sends the cookie on its own, and CSRF protection is what stops a malicious page from using it.`},
 {t:`check`,q:`A request with a valid token gets a 403 from <code>hasRole("ADMIN")</code>, but the token has <code>roles: ["ADMIN"]</code>. What do you check first?`,a:`How the claim becomes authorities. By default Spring maps the <code>scope</code> claim to <code>SCOPE_...</code> authorities and does not read your <code>roles</code> claim at all. Configure a <code>JwtAuthenticationConverter</code> with the right claim name and prefix, so ADMIN becomes <code>ROLE_ADMIN</code>.`}
]},

{id:`lesson-6`,track:`auth`,trackName:`Auth and security`,title:`Access models and API safety in the real world`,min:14,
 promise:`How permissions are modelled, how passwords are stored, which attacks to name, and how services trust each other.`,
 blocks:[
 {t:`p`,h:`<h2>Models for deciding who may do what</h2>`},
 {t:`cards`,items:[
   {h:`RBAC: role-based`,b:`Users get roles (ADMIN, MANAGER, USER). Roles carry permissions. Simple and the most common. Weak when rules depend on the data itself.`},
   {h:`ABAC: attribute-based`,b:`Decide using attributes: user's department, resource owner, time of day, amount. Flexible, harder to audit.`},
   {h:`ACL or ownership`,b:`Per-object lists: "Riya can edit this doc". Fits sharing features like Drive.`},
   {h:`Scopes`,b:`What an app may do on a user's behalf (<code>orders.read</code>). Not the same as the user's own roles.`}]},
 {t:`remember`,h:`A strong answer mixes them: roles for broad access, plus an ownership check for each record. "A manager role does not let me read every user's order, only my team's." Always check <b>object-level</b> access, not just the role.`},
 {t:`code`,cap:`The bug that gets people on bug-bounty lists (IDOR) and the fix`,code:`// BAD: any logged-in user can read any order by changing the id in the URL
@GetMapping("/orders/{id}")
public Order get(@PathVariable long id) { return repo.findById(id).orElseThrow(); }

// GOOD: the query itself includes the owner
@GetMapping("/orders/{id}")
public Order get(@PathVariable long id, Authentication auth) {
    return repo.findByIdAndOwnerId(id, auth.getName()).orElseThrow(NotFoundException::new);
}`},
 {t:`p`,h:`<h2>Storing passwords</h2>`},
 {t:`steps`,items:[
   [`Never store plain text, and never encrypt.`,` Encryption can be reversed. You need one-way hashing.`],
   [`Use a slow, salted hash.`,` BCrypt, Argon2 or PBKDF2. A salt is random data per user, so two equal passwords look different. Slowness makes guessing expensive.`],
   [`Not plain SHA-256 or MD5.`,` They are built to be fast, which helps an attacker.`],
   [`Spring helps.`,` <code>PasswordEncoderFactories.createDelegatingPasswordEncoder()</code> stores a prefix such as <code>{bcrypt}</code>, so you can change algorithms later.`]]},
 {t:`p`,h:`<h2>Attacks to be able to name and stop</h2>`},
 {t:`cards`,items:[
   {h:`SQL injection`,b:`User input becomes part of a query. Fix: prepared statements and JPA parameters, never string concatenation.`},
   {h:`XSS`,b:`Attacker script runs in a victim's browser. Fix: escape output, a Content-Security-Policy, HttpOnly cookies.`},
   {h:`CSRF`,b:`A malicious site makes the browser send your cookie to your app. Fix: CSRF token, SameSite cookies.`},
   {h:`CORS (not an attack)`,b:`A browser rule about which other sites may call your API from JavaScript. It does not protect your server from non-browser clients.`},
   {h:`Brute force`,b:`Many password guesses. Fix: rate limit, lockout or delays, and multi-factor login.`},
   {h:`Broken access control`,b:`Top of the OWASP list. The IDOR above is one kind.`}]},
 {t:`p`,h:`<h2>Between your own services</h2>`},
 {t:`steps`,items:[
   [`Edge check.`,` The API gateway validates the token once: signature, expiry, rate limit.`],
   [`Pass the identity on.`,` Forward the token, or a trimmed internal token, to services behind it.`],
   [`Each service still authorizes.`,` Do not assume "it came from the gateway, so it is fine". A mistake in one route then exposes everything.`],
   [`Service to service.`,` Use client credentials tokens, or mutual TLS, so a service proves who it is.`]]},
 {t:`code`,use:true,cap:`How it is used: a service calling another with a client-credentials token`,code:`# application.yml for the billing service
spring.security.oauth2.client:
  registration.orders-client:
    provider: keycloak
    authorization-grant-type: client_credentials
    client-id: billing
    client-secret: my-secret
    scope: orders.read

@Bean
WebClient ordersApi(OAuth2AuthorizedClientManager mgr) {
    var f = new ServletOAuth2AuthorizedClientExchangeFilterFunction(mgr);
    f.setDefaultClientRegistrationId("orders-client");    // token is fetched and refreshed for you
    return WebClient.builder().baseUrl("http://orders").apply(f.oauth2Configuration()).build();
}`},
 {t:`mistake`,h:`Putting the client secret in source code or in a mobile app. Anything shipped to a user's device is public. Secrets belong in a vault, environment variables or a secret manager, and public clients (browser, mobile) use PKCE with no secret at all.`},
 {t:`check`,q:`Why is hashing with SHA-256 and a salt still a poor choice for passwords?`,a:`SHA-256 is designed to be fast, so an attacker with a GPU can try billions of guesses per second. BCrypt, Argon2 and PBKDF2 have a tunable cost, which makes every guess slow. The salt only stops precomputed tables, not fast guessing.`}
]},

{id:`lesson-7`,track:`auth`,trackName:`Auth and security`,title:`Auth questions with full answers`,min:40,
 promise:`Eleven questions as they are asked. Say your answer out loud first, then open it. Each one gives the steps, the trade-offs and the follow-ups.`,
 blocks:[
 {t:`qbank`,items:[
 {n:`Authentication vs authorization`,tag:`Basics`,where:`Opening question in many Java and Spring rounds, including service companies in Pune`,
  ask:`What is the difference between authentication and authorization? Give an example and name the status codes.`,
  quality:`Precision in two sentences, an example, and the 401/403 detail.`,
  steps:[[`Define each.`,` Authentication proves who you are. Authorization decides what you may do.`],[`Order.`,` Authentication first. Authorization needs an identity.`],[`Example.`,` A bank app: login proves you are Riya. Viewing only your own account is authorization.`],[`Codes.`,` 401 when identity is missing or invalid. 403 when identity is known but access is denied.`]],
  trade:`None really. The depth comes from the follow-up: where does each happen in Spring? Authentication in a filter, authorization in the AuthorizationFilter and in method security.`,
  follow:`Where are roles stored? What is the SecurityContext? What does 404 instead of 403 hide?`},
 {n:`Session or JWT: which and why`,tag:`Design`,where:`Asked in nearly every microservices and security round`,
  ask:`You are building a web app and a mobile app on a Spring Boot backend with many services. Sessions or JWT?`,
  quality:`A reasoned choice, not a slogan. Name the revocation problem and the scaling problem.`,
  steps:[[`State the need.`,` Mobile clients and many services push toward stateless tokens.`],[`Choose.`,` Short-lived JWT access token plus a server-side refresh token.`],[`Name the cost.`,` Access tokens cannot be revoked instantly. Mitigate with short expiry, refresh rotation and a denylist for emergencies.`],[`Browser case.`,` Keep the token in an HttpOnly Secure SameSite cookie, and add CSRF protection.`]],
  trade:`Sessions: easy revocation, but a shared store. JWT: no store, but harder to revoke and the payload is readable.`,
  follow:`Where do you store the token? How does refresh rotation work? What if the refresh token is stolen?`},
 {n:`How do you revoke a JWT?`,tag:`Trap`,where:`Called out repeatedly in interview write-ups as the question that exposes shallow JWT knowledge`,
  ask:`A user's token was stolen. How do you stop it working before it expires?`,
  quality:`Admit that pure JWT cannot be revoked, then give layered mitigations.`,
  steps:[[`Be honest.`,` A signed token is valid until exp unless you add state.`],[`Prevent.`,` Short expiry, so the window is small.`],[`React.`,` Add its <code>jti</code> to a Redis denylist with a TTL equal to the token's remaining life. Every request checks the list.`],[`Reset.`,` Revoke the refresh token. For a wide breach, rotate the signing key.`]],
  code:{cap:`Denylist check as a small filter`,code:`@Component
class RevokedTokenFilter extends OncePerRequestFilter {
    private final StringRedisTemplate redis;
    RevokedTokenFilter(StringRedisTemplate redis) { this.redis = redis; }

    @Override
    protected void doFilterInternal(HttpServletRequest req, HttpServletResponse res, FilterChain chain)
            throws ServletException, IOException {
        var auth = SecurityContextHolder.getContext().getAuthentication();
        if (auth instanceof JwtAuthenticationToken t
                && Boolean.TRUE.equals(redis.hasKey("revoked:" + t.getToken().getId()))) {
            res.sendError(401, "token revoked");
            return;
        }
        chain.doFilter(req, res);
    }
}`,use:`// User clicks "log out everywhere" or support flags the account:
redis.opsForValue().set("revoked:" + jti, "1", Duration.ofMinutes(remainingMinutes));
// The next request carrying that token is refused with 401.`},
  trade:`The denylist brings back a lookup on each request, though it is tiny and fast. You trade a little statelessness for control.`,
  follow:`Why set a TTL on the entry? What about refresh token reuse detection? Would opaque tokens fit better?`},
 {n:`Explain the OAuth2 authorization code flow with PKCE`,tag:`OAuth2`,where:`Standard for Spring Security, Keycloak and Okta based roles`,
  ask:`Walk me through "Login with Google". Which party does what?`,
  quality:`Name the four roles, the order of the steps, and say why the code is swapped instead of sending the token straight back.`,
  steps:[[`Roles.`,` User, client app, authorization server, resource server.`],[`Redirect.`,` Client sends the browser to the auth server with a code challenge.`],[`Consent.`,` User logs in at the auth server. The client never sees the password.`],[`Code.`,` The browser is redirected back with a one-time code.`],[`Swap.`,` The client sends code plus verifier directly to the token endpoint and gets tokens. Because this is a back-channel call, tokens never pass through the browser URL.`]],
  trade:`More round trips than a plain login. In return the password stays at one place and access is scoped and revocable.`,
  follow:`What does PKCE defend against? Why is implicit flow discouraged? What is the difference between access token and ID token?`},
 {n:`OAuth2 versus OpenID Connect`,tag:`OAuth2`,where:`Common follow-up to the flow question`,
  ask:`Is OAuth2 an authentication protocol?`,
  quality:`A clear no, then what OIDC adds.`,
  steps:[[`OAuth2.`,` Authorization: grants an app limited access to resources.`],[`Gap.`,` An access token does not have to say who the user is, or even be readable by the client.`],[`OIDC.`,` Adds the <code>openid</code> scope, an <b>ID token</b> (a JWT with the user's identity), and a standard userinfo endpoint.`],[`Result.`,` "Login with Google" is OIDC. "Let this app read my calendar" is plain OAuth2.`]],
  trade:`OIDC needs a provider that supports it. Almost all do.`,
  follow:`What claims are in an ID token? What is the nonce for? Where do you validate the ID token?`},
 {n:`Secure a Spring Boot REST API with JWT`,tag:`Spring`,where:`Very common coding-discussion question`,
  ask:`Show how you would protect a REST API so that only valid tokens get in and only admins can reach /admin.`,
  quality:`Modern config (SecurityFilterChain), stateless, role mapping, and knowing what Spring does for you.`,
  steps:[[`Dependencies.`,` <code>spring-boot-starter-oauth2-resource-server</code>.`],[`Point at the issuer.`,` Set <code>issuer-uri</code>. Spring fetches the keys and validates signature, exp and iss.`],[`Chain bean.`,` Stateless sessions, permit public paths, role rules, <code>oauth2ResourceServer(jwt)</code>.`],[`Map roles.`,` Convert the <code>roles</code> claim into <code>ROLE_</code> authorities.`],[`Method rules.`,` Add <code>@PreAuthorize</code> for finer checks.`]],
  code:{cap:`Mapping a roles claim to authorities`,code:`@Bean
JwtAuthenticationConverter jwtAuthConverter() {
    var grants = new JwtGrantedAuthoritiesConverter();
    grants.setAuthoritiesClaimName("roles");
    grants.setAuthorityPrefix("ROLE_");
    var conv = new JwtAuthenticationConverter();
    conv.setJwtGrantedAuthoritiesConverter(grants);
    return conv;
}
// then: .oauth2ResourceServer(o -> o.jwt(j -> j.jwtAuthenticationConverter(jwtAuthConverter())))`,use:`// With the converter in place, this now works for a token with roles: ["ADMIN"]
.requestMatchers("/admin/**").hasRole("ADMIN")`},
  trade:`Trusting an external auth server means you depend on it being up. Spring caches its keys, so brief outages are survivable.`,
  follow:`What if you must support two issuers? How do you test secured endpoints? (<code>@WithMockUser</code> or the <code>jwt()</code> request post-processor.)`},
 {n:`How does the Spring Security filter chain work?`,tag:`Spring`,where:`Asked to test depth beyond configuration`,
  ask:`What happens to a request from the moment it reaches the server until your controller runs?`,
  quality:`Names the pieces in order, and explains where authentication and authorization happen.`,
  steps:[[`Entry.`,` A servlet filter, <code>DelegatingFilterProxy</code>, hands over to <code>FilterChainProxy</code>.`],[`Pick a chain.`,` <code>FilterChainProxy</code> chooses the first <code>SecurityFilterChain</code> whose matcher fits the request.`],[`Run the filters.`,` CORS, CSRF, then the authentication filter (bearer token, form login, basic).`],[`Authenticate.`,` The filter produces an <code>Authentication</code> via <code>AuthenticationManager</code> and stores it in <code>SecurityContext</code>.`],[`Authorize.`,` <code>AuthorizationFilter</code> checks the rules. Failure becomes 401 or 403 through <code>ExceptionTranslationFilter</code>.`],[`Controller.`,` Method security can add checks around your service methods.`]],
  trade:`A long chain is powerful but harder to debug. Turn on <code>logging.level.org.springframework.security=DEBUG</code> to see which filter acted.`,
  follow:`How do you add a custom filter? Why is the SecurityContext thread-bound? How do you support two chains, one for /api and one for the web UI?`},
 {n:`Store passwords correctly`,tag:`Security`,where:`A staple in banking and fintech interviews`,
  ask:`How should an application store user passwords? What would you do if the database leaks?`,
  quality:`One-way, salted, slow hashing, and the plan for a breach.`,
  steps:[[`Hash, do not encrypt.`,` Nobody should be able to recover the password.`],[`Slow and salted.`,` BCrypt or Argon2, with a per-user salt and a tuned cost.`],[`Upgrade path.`,` Delegating encoder keeps an algorithm tag, so you can rehash at next login.`],[`If leaked.`,` Hashes make mass cracking costly. Force resets, invalidate sessions and tokens, notify, and offer multi-factor login.`]],
  trade:`Higher cost means slower logins and higher CPU. Tune it to about 100 to 300 ms on your hardware.`,
  follow:`What is a pepper? Why not SHA-256? How do you add MFA?`},
 {n:`CSRF, XSS and CORS`,tag:`Security`,where:`Frequent in full-stack and security-aware backend rounds`,
  ask:`Explain CSRF, XSS and CORS. When do you need CSRF protection?`,
  quality:`Three crisp definitions, and the link between cookies and CSRF.`,
  steps:[[`CSRF.`,` A malicious site triggers a request to your app, and the browser attaches your cookie. Fix: CSRF token and SameSite cookies.`],[`When needed.`,` Whenever authentication rides on cookies the browser sends automatically. Not needed for APIs that read a bearer header.`],[`XSS.`,` Attacker script runs in the user's page. Fix: output escaping, CSP, HttpOnly cookies.`],[`CORS.`,` A browser policy on cross-origin JavaScript calls. Configure allowed origins explicitly. It is not server-side protection.`]],
  trade:`Strict SameSite and CSP can break embedded or cross-site use. Test those flows.`,
  follow:`Why is <code>Access-Control-Allow-Origin: *</code> with credentials rejected? Where does a pre-flight request come from?`},
 {n:`Secure communication between microservices`,tag:`Microservices`,where:`Asked after any microservices design`,
  ask:`Ten services talk to each other. How do you make sure only the right callers get through?`,
  quality:`Layered: edge, identity propagation, per-service checks, service identity.`,
  steps:[[`Gateway.`,` Validate tokens, apply rate limits, strip unsafe headers.`],[`Propagate the user.`,` Forward the JWT so each service knows who the user is.`],[`Service identity.`,` Client-credentials tokens or mutual TLS for calls with no user.`],[`Authorize per service.`,` Each service checks scopes and ownership. The gateway is not the only guard.`],[`Network.`,` Private network, and a service mesh policy if you run one.`]],
  trade:`More checks add small latency and setup. Skipping them means one breach opens everything.`,
  follow:`What is token exchange? How do you rotate secrets? How do you audit who called what?`},
 {n:`Role-based access in a multi-tenant app`,tag:`Design`,where:`Typical in SaaS and fintech product companies`,
  ask:`Customers (tenants) share one system. How do you make sure tenant A never sees tenant B's data?`,
  quality:`Tenant id comes from the verified token, and is enforced in the data layer, not only in the controller.`,
  steps:[[`Source of truth.`,` Take the tenant id from the verified token, never from a request parameter.`],[`Carry it.`,` Keep it in a request-scoped holder.`],[`Enforce at the data layer.`,` Every query includes the tenant id. Hibernate filters or row-level security in the database remove the chance of forgetting.`],[`Roles inside a tenant.`,` Roles are per tenant: a user can be ADMIN in one and VIEWER in another.`],[`Test.`,` A test that logs in as tenant A and tries tenant B's ids must return 404.`]],
  trade:`Shared schema is cheap but one bug leaks data. Separate schemas or databases cost more and isolate better.`,
  follow:`How do you handle a support user who may cross tenants? How do you run migrations across tenants?`}
 ]},

var STAGES=[
 {l:'1 server',hurt:'Nothing yet.',fix:'One app server and one database is a perfectly good start. Spend your effort on a clean data model and the right indexes.',cost:'None, and that is the point. Every extra part is something to run and debug.'},
 {l:'Slow queries',hurt:'Pages slow down because the app and database share one machine, and some queries scan whole tables.',fix:'Add indexes. Move the database to its own machine. Use a bigger machine if needed.',cost:'A bigger machine has a ceiling, and one failure still takes everything down.'},
 {l:'Read-heavy',hurt:'The database is busy answering the same read questions again and again.',fix:'Add a cache for popular data. Add read replicas (copies for reading).',cost:'Data can be slightly stale. You now have to decide when to refresh the cache.'},
 {l:'One server is not enough',hurt:'One app server cannot take the traffic, and if it dies, the site is down.',fix:'Run several identical app servers behind a load balancer. Keep them stateless, so any server can handle any request.',cost:'You must move user sessions out of server memory, and handle deployments carefully.'},
 {l:'Slow work blocks users',hurt:'Sending emails or making reports makes users wait. Spikes of traffic can overwhelm the database.',fix:'Put slow work on a queue and let workers process it in the background.',cost:'Duplicates can happen, so workers must be safe to run twice. Users see "pending" for a while.'},
 {l:'Data too big',hurt:'One database cannot hold all the data or take all the writes.',fix:'Split the data across several databases by a key, such as user id. This is sharding.',cost:'Queries across shards are hard, and a popular key can overload one shard.'},
 {l:'Global users',hurt:'Users far from your servers get slow responses, and one data-center outage takes everyone down.',fix:'Serve static files from a CDN. Run in more than one region and route users to the nearest one.',cost:'Data in different regions can briefly disagree, and the bill grows a lot.'}
];

function el(tag,cls,html){var e=document.createElement(tag);if(cls)e.className=cls;if(html!=null)e.innerHTML=html;return e}

function fmt(n){
  if(n>=1e9)return (n/1e9).toFixed(1)+' B';
  if(n>=1e6)return (n/1e6).toFixed(1)+' M';
  if(n>=1e3)return (n/1e3).toFixed(1)+' K';
  return n<10?n.toFixed(1):String(Math.round(n));
}
function fmtBytes(n){var u=['B','KB','MB','GB','TB','PB'],i=0;while(n>=1000&&i<u.length-1){n/=1000;i++}return (n<10?n.toFixed(1):Math.round(n))+' '+u[i]}

function buildCalc(){
  var box=el('div','check');
  box.appendChild(el('div','label','Try it'));
  box.appendChild(el('p',null,'Change the numbers and watch what moves. Start with the example from above.'));
  box.appendChild(el('div','fields',
    '<div class="field"><label for="c-dau">Daily users (millions)</label><input id="c-dau" type="number" min="0" step="any" value="10"></div>'+
    '<div class="field"><label for="c-act">Actions per user per day</label><input id="c-act" type="number" min="0" step="any" value="20"></div>'+
    '<div class="field"><label for="c-rpw">Reads for every 1 write</label><input id="c-rpw" type="number" min="0" step="any" value="10"></div>'));
  var out=el('div','out');out.setAttribute('aria-live','polite');box.appendChild(out);
  var msg=el('div','box');box.appendChild(msg);
  function num(id){var v=parseFloat(box.querySelector(id).value);return isFinite(v)&&v>=0?v:0}
  function run(){
    var dau=num('#c-dau')*1e6,act=num('#c-act'),rpw=num('#c-rpw');
    var day=dau*act,avg=day/86400,pk=avg*3,w=pk/(rpw+1),r=pk-w;
    var data=day/(rpw+1)*1000*365;
    out.innerHTML=
      '<div><span>Requests per day</span><b>'+fmt(day)+'</b></div>'+
      '<div><span>Average per second</span><b>'+fmt(avg)+'</b></div>'+
      '<div><span>Busy-hour per second (x3)</span><b>'+fmt(pk)+'</b></div>'+
      '<div><span>Reads per second at peak</span><b>'+fmt(r)+'</b></div>'+
      '<div><span>Writes per second at peak</span><b>'+fmt(w)+'</b></div>'+
      '<div><span>New data per year (1 KB per write)</span><b>'+fmtBytes(data)+'</b></div>';
    var m;
    if(r<1000&&w<500)m='<b>What this means:</b> one well-tuned database can handle this. Keep it simple.';
    else if(r<10000)m='<b>What this means:</b> reads are the pressure. Add a cache and maybe read replicas.';
    else m='<b>What this means:</b> reads are very high. You need a cache layer, and likely a CDN for static files.';
    if(w>=5000)m+=' Writes are high too, so think about a queue and splitting the data.';
    msg.innerHTML='<p>'+m+'</p>';
  }
  box.addEventListener('input',run);run();
  return box;
}

function buildStages(){
  var wrap=el('div','sec'),sel=2;

function buildDiagram(b){
  var spec=b.d,NS='http://www.w3.org/2000/svg';
  function s(tag,attrs,text){var e=document.createElementNS(NS,tag);for(var k in attrs)e.setAttribute(k,attrs[k]);if(text!=null)e.textContent=text;return e}
  var W=spec.w||420,byId={};
  spec.nodes.forEach(function(n){
    var hdr=n.k==='state'?34:(n.k==='note'?0:(n.s?38:28));
    var ml=n.m?n.m.length:0;
    if(n.k==='state')n.h=34;
    else if(n.k==='note')n.h=ml*14+14;
    else n.h=hdr+(ml?10+14*ml:0);
    n.hdr=hdr;byId[n.id]=n;
  });
  var H=0;spec.nodes.forEach(function(n){H=Math.max(H,n.y+n.h)});H+=14;
  var svg=s('svg',{viewBox:'0 0 '+W+' '+H,role:'img','aria-label':spec.alt||''});
  var defs=s('defs',{});
  function marker(id,w,h,rx,ry,child){
    var m=s('marker',{id:id,viewBox:'0 0 '+w+' '+h,refX:rx,refY:ry,markerWidth:w,markerHeight:h,markerUnits:'userSpaceOnUse',orient:'auto'});
    m.appendChild(child);defs.appendChild(m);
  }
  var uid='m'+Math.floor(Math.random()*1e6);
  marker(uid+'t',12,12,11,6,s('path',{d:'M1,1 L11,6 L1,11 z','class':'mk-tri'}));
  marker(uid+'o',12,12,11,6,s('path',{d:'M1,1 L11,6 L1,11','class':'mk-open'}));
  marker(uid+'f',12,12,11,6,s('path',{d:'M1,1 L11,6 L1,11 z','class':'mk-fill'}));
  marker(uid+'d',14,12,0,6,s('path',{d:'M1,6 L7,1 L13,6 L7,11 z','class':'mk-tri'}));
  svg.appendChild(defs);
  function clip(n,tx,ty){
    var cx=n.x+n.w/2,cy=n.y+n.h/2,dx=tx-cx,dy=ty-cy;
    if(dx===0&&dy===0)return [cx,cy];
    var t=Math.min(dx!==0?(n.w/2)/Math.abs(dx):1e9,dy!==0?(n.h/2)/Math.abs(dy):1e9);
    return [cx+dx*t,cy+dy*t];
  }
  spec.edges.forEach(function(e){
    var A=byId[e.a],B=byId[e.b];
    var ax=A.x+A.w/2,ay=A.y+A.h/2,bx=B.x+B.w/2,by=B.y+B.h/2;
    var dx=bx-ax,dy=by-ay,len=Math.sqrt(dx*dx+dy*dy)||1,o=e.o||0;
    var nx=-dy/len*o,ny=dx/len*o;
    var p1=clip(A,bx+nx,by+ny),p2=clip(B,ax+nx,ay+ny);
    p1=[p1[0]+nx,p1[1]+ny];p2=[p2[0]+nx,p2[1]+ny];
    var k=e.k||'arrow',dash=(k==='implements'||k==='uses');
    var line=s('line',{x1:p1[0],y1:p1[1],x2:p2[0],y2:p2[1],'class':'dg-e'+(dash?' dash':'')});
    if(k==='extends'||k==='implements')line.setAttribute('marker-end','url(#'+uid+'t)');
    else if(k==='uses')line.setAttribute('marker-end','url(#'+uid+'o)');
    else if(k==='has'){line.setAttribute('marker-start','url(#'+uid+'d)');line.setAttribute('marker-end','url(#'+uid+'o)')}
    else line.setAttribute('marker-end','url(#'+uid+'f)');
    svg.appendChild(line);
    if(e.l){
      var mx=(p1[0]+p2[0])/2,my=(p1[1]+p2[1])/2,lw=e.l.length*5.6+10;
      svg.appendChild(s('rect',{x:mx-lw/2,y:my-8,width:lw,height:15,rx:3,'class':'dg-lb'}));
      svg.appendChild(s('text',{x:mx,y:my+3.5,'class':'dg-l'},e.l));
    }
  });
  spec.nodes.forEach(function(n){
    var cls=n.k==='iface'?'dg-if':(n.k==='state'?'dg-st':(n.k==='note'?'dg-note':'dg-box'));
    svg.appendChild(s('rect',{x:n.x,y:n.y,width:n.w,height:n.h,rx:n.k==='state'?17:6,'class':cls}));
    if(n.k==='note'){
      (n.m||[]).forEach(function(l,i){svg.appendChild(s('text',{x:n.x+n.w/2,y:n.y+16+i*14,'class':'dg-n'},l))});
      return;
    }
    if(n.s)svg.appendChild(s('text',{x:n.x+n.w/2,y:n.y+15,'class':'dg-s'},'«'+n.s+'»'));
    svg.appendChild(s('text',{x:n.x+n.w/2,y:n.y+(n.k==='state'?22:(n.s?31:19)),'class':'dg-t'},n.t));
    if(n.m&&n.m.length){
      svg.appendChild(s('line',{x1:n.x,y1:n.y+n.hdr,x2:n.x+n.w,y2:n.y+n.hdr,'class':'dg-sep'}));
      n.m.forEach(function(l,i){svg.appendChild(s('text',{x:n.x+8,y:n.y+n.hdr+6+(i+1)*14-3,'class':'dg-m'},l))});
    }
  });
  var wrap=el('div','diagram');
  wrap.appendChild(svg);
  if(b.cap)wrap.appendChild(el('p','dcap',b.cap));
  return wrap;
}

      if(q.code.use){

var P={lld:['Design a parking lot','Design an elevator system','Design Splitwise (shared expenses)','Design a library system','Design a vending machine','Design an LRU cache','Design a chess game','Design an ATM','Design a movie ticket booking system','Design a logging framework'],
 hld:['Design a URL shortener','Design a news feed','Design a chat application','Design a video streaming service','Design a ride-hailing app','Design a notification system','Design a web crawler','Design search autocomplete','Design a payment system','Design a ticket booking system']};
var timerState={remaining:1200,running:false,endAt:0,id:null};
function buildDrill(){
  var box=el('div','check'),kind='lld',cur='';
  box.appendChild(el('div','label','Today\'s drill'));
  var pill=el('span','pill','LLD');var pw=el('div');pw.appendChild(pill);box.appendChild(pw);
  var prompt=el('p',null,'');prompt.style.cssText='font:600 1.2rem/1.4 var(--font-display)';box.appendChild(prompt);
  var r1=el('div','row');
  var bl=el('button','reveal','New LLD prompt'),bh=el('button','reveal','New HLD prompt');bl.type=bh.type='button';
  r1.appendChild(bl);r1.appendChild(bh);box.appendChild(r1);
  var time=el('div','timer','20:00');box.appendChild(time);
  var phase=el('p',null,'Ready when you are.');box.appendChild(phase);
  var r2=el('div','row');
  var st=el('button','btn','Start'),rs=el('button','btn ghost','Reset');st.type=rs.type='button';
  r2.appendChild(st);r2.appendChild(rs);box.appendChild(r2);
  function pick(k){kind=k;var l=P[k],p=cur;while(p===cur)p=l[Math.floor(Math.random()*l.length)];cur=p;prompt.textContent=p;pill.textContent=k.toUpperCase()}
  function render(){
    var rem=timerState.remaining,m=Math.floor(rem/60),s=rem%60;
    time.textContent=(m<10?'0':'')+m+':'+(s<10?'0':'')+s;
    var el_=1200-rem,txt;
    if(rem<=0)txt='Time. Now write one line: what did I skip or hand-wave?';
    else if(!timerState.running&&el_===0)txt='Ready when you are. Talk out loud.';
    else if(el_<300)txt='Clarify: ask questions, pick three must-haves and one key quality.';
    else if(el_<900)txt=kind==='lld'?'Model: nouns, verbs, who owns what, what will change.':'Model: numbers, the two actions, smallest design, what breaks first.';
    else txt='Stress and trade: two users at once, a new requirement, then the template sentence.';
    phase.textContent=txt;
    st.textContent=timerState.running?'Pause':(rem<=0||rem===1200?'Start':'Resume');
  }
  function tick(){
    timerState.remaining=Math.max(0,Math.ceil((timerState.endAt-Date.now())/1000));
    if(timerState.remaining<=0){timerState.running=false;clearInterval(timerState.id);timerState.id=null}
    render();
  }
  st.addEventListener('click',function(){
    if(timerState.running){timerState.running=false;clearInterval(timerState.id);timerState.id=null;render();return}
    if(timerState.remaining<=0)timerState.remaining=1200;
    timerState.running=true;timerState.endAt=Date.now()+timerState.remaining*1000;
    timerState.id=setInterval(tick,500);render();
  });
  rs.addEventListener('click',function(){timerState.running=false;clearInterval(timerState.id);timerState.id=null;timerState.remaining=1200;render()});
  bl.addEventListener('click',function(){pick('lld');render()});
  bh.addEventListener('click',function(){pick('hld');render()});
  pick('lld');render();
  return box;
}

    var a=document.createElement('a');a.href='#'+l.id;
    if(i===cur)a.setAttribute('aria-current','page');
    a.innerHTML='<span class="n">'+(i+1)+'</span><span>'+l.title+'</span><span class="'+(done[l.id]?'tick':'min')+'">'+(done[l.id]?'&#10003; done':l.min+' min')+'</span>';
    a.addEventListener('click',function(){closeList()});
    host.appendChild(a);
  });
}
function closeList(){$('#list').classList.remove('open');$('#menu-btn').setAttribute('aria-expanded','false')}
$('#menu-btn').addEventListener('click',function(){
  var o=$('#list').classList.toggle('open');this.setAttribute('aria-expanded',o?'true':'false');
});
function meter(){
  var n=0;L.forEach(function(l){if(done[l.id])n++});
  $('#meter').style.width=Math.round(n/L.length*100)+'%';
}
function draw(){
  cur=idx();
  var l=L[cur];
  document.body.setAttribute('data-track',l.track);
  $('#where').textContent='Lesson '+(cur+1)+' of '+L.length+' · '+l.trackName;
  var host=$('#lesson');host.innerHTML='';
  var head=el('div');
  head.appendChild(el('div','kicker',l.trackName+' · about '+l.min+' minutes'));
  head.appendChild(el('h1',null,l.title));
  head.appendChild(el('p','promise',l.promise));
  host.appendChild(head);
  l.blocks.forEach(function(b){renderBlock(b,host)});
  var dr=el('label','done-row');
  var cb=document.createElement('input');cb.type='checkbox';cb.checked=!!done[l.id];
  cb.addEventListener('change',function(){if(cb.checked)done[l.id]=1;else delete done[l.id];save();meter();drawList()});
  dr.appendChild(cb);dr.appendChild(el('span',null,'I finished this lesson'));
  host.appendChild(dr);
  var nav=el('div','nav');
  var pv=el('button','btn ghost','Previous');pv.type='button';pv.disabled=cur===0;
  var nx=el('button','btn',cur===L.length-1?'Back to lesson 1':'Next lesson');nx.type='button';
  pv.addEventListener('click',function(){if(cur>0)location.hash=L[cur-1].id});
  nx.addEventListener('click',function(){location.hash=L[cur===L.length-1?0:cur+1].id});
  nav.appendChild(pv);nav.appendChild(nx);host.appendChild(nav);
  meter();drawList();
}
window.addEventListener('hashchange',function(){draw();window.scrollTo(0,0)});
draw();
})();
</script>
