{id:`lesson-1`,track:`patterns`,trackName:`Design patterns`,title:`What patterns are, and which ones get asked`,min:10,
 promise:`A map of the whole topic first, so you know where each pattern fits and which ones deserve your time.`,
 blocks:[
 {t:`plain`,h:`A <b>design pattern</b> is a named, proven answer to a problem that keeps coming up. It is not code to copy. It is a shared vocabulary, so you can say "use Strategy here" and everyone knows the shape of the solution.`},
 {t:`analogy`,h:`Cooks do not describe a dish step by step every time. They say "tadka" or "dum biryani", and everyone knows the method. Patterns are those names for software.`},
 {t:`p`,h:`<h2>The three families</h2>`},
 {t:`cards`,items:[
   {h:`Creational`,pic:`How objects get made`,b:`Singleton, Factory Method, Abstract Factory, Builder, Prototype.`,small:`Use when creating objects is messy, repeated or needs control.`},
   {h:`Structural`,pic:`How objects fit together`,b:`Adapter, Decorator, Proxy, Facade, Composite, Bridge, Flyweight.`,small:`Use when you are wrapping, combining or simplifying existing pieces.`},
   {h:`Behavioural`,pic:`How objects talk and share work`,b:`Strategy, Observer, State, Command, Chain of Responsibility, Template Method, Iterator and more.`,small:`Use when behaviour changes, or when objects must react to each other.`}]},
 {t:`p`,h:`<h2>What the research says gets asked</h2><p>Prep guides list the same twelve patterns as the most frequently asked in LLD interviews: <b>Singleton, Factory Method, Builder, Adapter, Decorator, Composite, Facade, Strategy, Observer, State, Chain of Responsibility and Command.</b> One guide says Strategy, Observer, State and Factory are the most tied to common machine-coding problems like payments, notifications and ATMs. For Java and Spring roles, interviewers also ask where Spring uses patterns (Proxy, Template Method, Singleton scope) and compare similar pairs such as Strategy versus State.</p>`},
 {t:`remember`,h:`A guide on frequently asked patterns says it plainly: <b>interviewers evaluate your reasoning more than your vocabulary.</b> Explain why a pattern fits and what it costs. Naming it is the smallest part.`},
 {t:`p`,h:`<h2>Problem to pattern: the quick map</h2><p>This is the most useful table in the whole topic. Start from the problem you feel.</p>`},
 {t:`cards`,items:[
   {h:`"I have a long if-else choosing an algorithm"`,b:`<b>Strategy.</b> Lesson 2.`},
   {h:`"When X changes, many things must react"`,b:`<b>Observer.</b> Lesson 3.`},
   {h:`"Behaviour depends on what stage it is in"`,b:`<b>State.</b> Lesson 4.`},
   {h:`"Callers should not know which class gets created"`,b:`<b>Factory.</b> Lesson 5.`},
   {h:`"There must be exactly one of these"`,b:`<b>Singleton.</b> Lesson 6.`},
   {h:`"This object has many optional fields"`,b:`<b>Builder.</b> Lesson 7.`},
   {h:`"I need to add features by stacking them"`,b:`<b>Decorator.</b> Lesson 8.`},
   {h:`"I need to control access to an object"`,b:`<b>Proxy.</b> Lesson 8.`},
   {h:`"This old API has the wrong shape"`,b:`<b>Adapter.</b> Lesson 9.`},
   {h:`"Calling five subsystems is confusing"`,b:`<b>Facade.</b> Lesson 9.`},
   {h:`"I need undo, queues or logs of actions"`,b:`<b>Command.</b> Lesson 10.`},
   {h:`"A request passes through several checks"`,b:`<b>Chain of Responsibility.</b> Lesson 10.`}]},
 {t:`mistake`,h:`Using a pattern because it sounds impressive. A pattern adds classes. If the problem does not hurt yet, the simple code is the better answer. The rule is to add a plug only where you can name the next variation.`},
 {t:`check`,q:`Your code has <code>if (type.equals("UPI")) ... else if (type.equals("CARD")) ...</code> and a new payment type arrives every month. Which family and which pattern?`,a:`Behavioural, and Strategy. Each payment type becomes its own class behind one interface, so a new type is a new class with no edit to the existing code.`}
]},

/* ---------- 19 ---------- */
{id:`lesson-2`,track:`patterns`,trackName:`Design patterns`,title:`Strategy: swap the behaviour`,min:12,
 promise:`The most asked pattern. Here it gets a full treatment with a diagram, a payment example and the Spring version.`,
 blocks:[
 {t:`plain`,h:`<b>Strategy</b> puts each way of doing something in its own class behind one interface. The caller holds the interface and can swap the behaviour, even while the program runs.`},
 {t:`analogy`,h:`Google Maps asks "how are you travelling?". Car, bike and walking are three strategies for the same job: find a route. The app does not change when you pick another one.`},
 {t:`diagram`,cap:`Loan only knows the FineRule plug. The concrete rules are swappable.`,d:{alt:`Class diagram: Loan uses the FineRule interface, implemented by StandardFine and StudentFine`,nodes:[
   {id:`l`,x:10,y:20,w:150,t:`Loan`,m:[`FineRule rule`,`fine(daysLate)`]},
   {id:`i`,x:240,y:10,w:170,t:`FineRule`,s:`interface`,m:[`fine(daysLate)`],k:`iface`},
   {id:`a`,x:185,y:140,w:110,t:`StandardFine`,m:[`fine(daysLate)`]},
   {id:`b`,x:305,y:140,w:105,t:`StudentFine`,m:[`fine(daysLate)`]}],
  edges:[{a:`l`,b:`i`,k:`has`,l:`uses`},{a:`a`,b:`i`,k:`implements`},{a:`b`,b:`i`,k:`implements`}]}},
 {t:`p`,h:`<h2>Example: choosing how to pay</h2>`},
 {t:`code`,cap:`Each payment method is a strategy`,code:`interface PaymentStrategy {\n  PaymentResult pay(long amountPaise);\n}\n\nclass UpiPayment implements PaymentStrategy {\n  public PaymentResult pay(long amt) { /* call UPI gateway */ return ok(); }\n}\nclass CardPayment implements PaymentStrategy {\n  public PaymentResult pay(long amt) { /* call card gateway */ return ok(); }\n}\n\nclass Checkout {\n  PaymentResult checkout(PaymentStrategy method, long amt) {\n    return method.pay(amt);        // no if-else on type\n  }\n}`},
 {t:`code`,use:true,cap:`How it is used`,code:`Checkout checkout = new Checkout();

checkout.checkout(new UpiPayment(), 49_900);    // pays Rs 499.00 by UPI
checkout.checkout(new CardPayment(), 49_900);   // same call, different behaviour

// A new wallet option next month? Write WalletPayment implements PaymentStrategy.
// Checkout does not change at all.`},
 {t:`p`,h:`<h2>Picking the strategy at runtime</h2><p>Keep the strategies in a map keyed by name, so the choice is data, not code. In Spring this is very natural: inject all implementations at once.</p>`},
 {t:`code`,cap:`Spring injects every implementation into a map`,code:`@Service\nclass PaymentService {\n  private final Map<String, PaymentStrategy> strategies;\n\n  // key = bean name, e.g. "upiPayment", "cardPayment"\n  PaymentService(Map<String, PaymentStrategy> strategies) {\n    this.strategies = strategies;\n  }\n\n  PaymentResult pay(String method, long amt) {\n    PaymentStrategy s = strategies.get(method);\n    if (s == null) throw new IllegalArgumentException(method);\n    return s.pay(amt);\n  }\n}`},
 {t:`code`,use:true,cap:`How it is used`,code:`@RestController
class PaymentController {
  private final PaymentService payments;
  PaymentController(PaymentService payments) { this.payments = payments; }

  // POST /pay?method=upiPayment&amount=49900
  @PostMapping("/pay")
  PaymentResult pay(@RequestParam String method, @RequestParam long amount) {
    return payments.pay(method, amount);   // the request parameter picks the strategy
  }
}
// Mark UpiPayment and CardPayment with @Component. Spring finds them and
// fills the map: {"upiPayment" -> ..., "cardPayment" -> ...}`},
 {t:`p`,h:`<h2>Java already has it</h2><p>A <code>Comparator</code> is a strategy for ordering. With a lambda, a strategy needs no class at all: <code>list.sort((a, b) -> a.price - b.price)</code>.</p>`},
 {t:`mistake`,h:`Creating a strategy for something that never varies, or putting so little in each strategy that they only differ by one number. In that case, one class with a parameter is enough (for example a single <code>FlatRateFine(perDay)</code> class).`},
 {t:`check`,q:`Where does Strategy show up in these LLD problems: parking lot, ride sharing, chess?`,a:`Parking lot: the fee calculation (hourly, flat, weekend). Ride sharing: pricing and driver matching. Chess: how each piece moves, one strategy per piece type.`},
 {t:`remember`,h:`<b>One interface, many interchangeable algorithms, chosen by the caller.</b> If you hear "it depends on the type", think Strategy first.`}
]},

/* ---------- 20 ---------- */
{id:`lesson-3`,track:`patterns`,trackName:`Design patterns`,title:`Observer: tell everyone who cares`,min:12,
 promise:`How one change can notify many listeners without the source knowing who they are. Includes the Spring way and the classic leak.`,
 blocks:[
 {t:`plain`,h:`<b>Observer</b> lets a subject keep a list of listeners (observers) and tell them all when something changes. The subject does not know or care what each listener does.`},
 {t:`analogy`,h:`A WhatsApp group. When someone posts, everyone in the group gets it. The sender does not phone each member. Members can join and leave at any time.`},
 {t:`diagram`,cap:`PriceFeed is the subject. Chart and Alert are observers. New observers need no change to PriceFeed.`,d:{alt:`Class diagram: Subject notifies Observer interface, PriceFeed extends Subject, Chart and Alert implement Observer`,nodes:[
   {id:`s`,x:10,y:10,w:150,t:`Subject`,m:[`attach(observer)`,`detach(observer)`,`notifyAll()`]},
   {id:`o`,x:240,y:10,w:170,t:`Observer`,s:`interface`,m:[`update(event)`],k:`iface`},
   {id:`p`,x:10,y:150,w:150,t:`PriceFeed`,m:[`setPrice(p)`]},
   {id:`c`,x:190,y:150,w:105,t:`Chart`,m:[`update(event)`]},
   {id:`x`,x:305,y:150,w:105,t:`Alert`,m:[`update(event)`]}],
  edges:[{a:`s`,b:`o`,k:`has`,l:`notifies`},{a:`p`,b:`s`,k:`extends`},{a:`c`,b:`o`,k:`implements`},{a:`x`,b:`o`,k:`implements`}]}},
 {t:`p`,h:`<h2>The code</h2>`},
 {t:`code`,cap:`A plain Java version`,code:`interface OrderListener { void onOrderPlaced(Order o); }\n\nclass OrderService {\n  private final List<OrderListener> listeners = new CopyOnWriteArrayList<>();\n\n  void subscribe(OrderListener l) { listeners.add(l); }\n  void unsubscribe(OrderListener l) { listeners.remove(l); }\n\n  void placeOrder(Order o) {\n    save(o);\n    for (OrderListener l : listeners) {\n      try { l.onOrderPlaced(o); }\n      catch (Exception e) { /* one bad listener must not stop others */ }\n    }\n  }\n}\n\n// Email, SMS and analytics each implement OrderListener.`},
 {t:`code`,use:true,cap:`How it is used`,code:`OrderService orders = new OrderService();

orders.subscribe(o -> System.out.println("Email sent for " + o.id()));
orders.subscribe(o -> System.out.println("SMS sent for " + o.id()));
orders.subscribe(o -> analytics.track("order_placed", o.id()));

orders.placeOrder(new Order("ORD-101"));
// Email sent for ORD-101
// SMS sent for ORD-101
// (analytics event recorded)
// OrderService never learned what any listener does.`},
 {t:`p`,h:`<h2>The Spring version</h2><p>Spring has this built in. You publish an event, and any bean with a listener method receives it.</p>`},
 {t:`code`,cap:`Spring events`,code:`record OrderPlaced(Order order) {}\n\n@Service\nclass OrderService {\n  private final ApplicationEventPublisher events;\n  OrderService(ApplicationEventPublisher events) { this.events = events; }\n\n  void placeOrder(Order o) {\n    save(o);\n    events.publishEvent(new OrderPlaced(o));\n  }\n}\n\n@Component\nclass EmailListener {\n  @EventListener\n  void on(OrderPlaced e) { /* send email */ }\n}`},
 {t:`code`,use:true,cap:`How it is used`,code:`@RestController
class OrderController {
  private final OrderService orders;
  OrderController(OrderService orders) { this.orders = orders; }

  @PostMapping("/orders")
  String place(@RequestBody Order order) {
    orders.placeOrder(order);      // saves, then publishes OrderPlaced
    return "placed";
  }
}
// Want a new reaction later? Write another @Component with an @EventListener
// method for OrderPlaced. OrderService and the controller are not touched.`},
 {t:`p`,h:`<h2>Things to say out loud</h2>`},
 {t:`steps`,items:[
   [`Push or pull`,`Push sends the data inside the event. Pull sends a small signal and the observer asks for what it needs. Push is simpler. Pull suits big or varied data.`],
   [`Failure isolation`,`One failing observer must not stop the others, so catch errors per observer.`],
   [`Memory leak (the lapsed listener)`,`If an observer subscribes and never unsubscribes, the subject keeps it alive forever. Always provide unsubscribe, or use weak references.`],
   [`Threads`,`Use a thread-safe list such as <code>CopyOnWriteArrayList</code>, or listeners added during notification can break the loop.`],
   [`Sync or async`,`By default the caller waits for all observers. For slow listeners, use an executor or a queue.`]]},
 {t:`two`,a:{h:`Observer`,b:`The subject holds the observers directly. In one process, simple and immediate.`},b:{h:`Publish-subscribe`,b:`A broker such as Kafka sits between sender and receivers. They never know each other, and can run in different services and at different times.`}},
 {t:`mistake`,h:`Hidden chains. Observer A changes something that triggers observer B, which triggers C. Debugging becomes a hunt. Keep reactions simple, and log events.`},
 {t:`check`,q:`Which LLD problems use Observer?`,a:`Notifications (an order event reaches email, SMS and push), stock or price updates (chart, alerts, portfolio), ride sharing (rider and driver both react to trip state), and parking lot availability boards.`},
 {t:`remember`,h:`<b>One change, many reactions, and the source does not know who is listening.</b>`}
]},

{id:`lesson-4`,track:`patterns`,trackName:`Design patterns`,title:`State: behaviour that follows the stage`,min:12,
 promise:`How to replace a pile of status checks with small classes. Two diagrams: the classes, and the stage map.`,
 blocks:[
 {t:`plain`,h:`<b>State</b> makes each stage of an object's life its own class. The object hands its work to its current state, and the state decides what happens and what the next stage is.`},
 {t:`analogy`,h:`A traffic light. Red, green and amber each know what comes next. Nobody writes "if colour is red and timer is zero then...". Each colour handles it.`},
 {t:`p`,h:`<h2>The stage map</h2><p>Draw this first. It is the real design. Each arrow is an allowed move, and any move not drawn is illegal.</p>`},
 {t:`diagram`,cap:`Vending machine stages. Pressing "select" in Idle is not on the map, so it is rejected.`,d:{alt:`State diagram: Idle to HasMoney on insert coin, HasMoney to Dispensing on select item, Dispensing back to Idle when item given`,nodes:[
   {id:`i`,x:20,y:20,w:100,t:`Idle`,k:`state`},
   {id:`h`,x:250,y:20,w:130,t:`HasMoney`,k:`state`},
   {id:`d`,x:135,y:130,w:120,t:`Dispensing`,k:`state`}],
  edges:[{a:`i`,b:`h`,k:`arrow`,l:`insert coin`},{a:`h`,b:`d`,k:`arrow`,l:`select item`},{a:`d`,b:`i`,k:`arrow`,l:`item given`}]}},
 {t:`p`,h:`<h2>The classes</h2>`},
 {t:`diagram`,cap:`The machine holds a State. Each stage is a class that implements it.`,d:{alt:`Class diagram: VendingMachine holds a State interface, implemented by IdleState and HasMoneyState`,nodes:[
   {id:`m`,x:10,y:10,w:170,t:`VendingMachine`,m:[`State state`,`insertCoin()`,`selectItem()`,`setState(s)`]},
   {id:`s`,x:250,y:10,w:160,t:`State`,s:`interface`,m:[`insertCoin()`,`selectItem()`,`dispense()`],k:`iface`},
   {id:`a`,x:170,y:160,w:110,t:`IdleState`,m:[`insertCoin()`,`selectItem()`]},
   {id:`b`,x:290,y:160,w:120,t:`HasMoneyState`,m:[`insertCoin()`,`selectItem()`]}],
  edges:[{a:`m`,b:`s`,k:`has`,l:`holds`},{a:`a`,b:`s`,k:`implements`},{a:`b`,b:`s`,k:`implements`}]}},
 {t:`code`,cap:`Two states in code`,code:`class VendingMachine {\n  private State state = new IdleState();\n  void setState(State s) { this.state = s; }\n  void insertCoin(int amt) { state.insertCoin(this, amt); }\n  void selectItem(String code) { state.selectItem(this, code); }\n}\n\nclass IdleState implements State {\n  public void insertCoin(VendingMachine m, int amt) {\n    m.addMoney(amt);\n    m.setState(new HasMoneyState());      // move to next stage\n  }\n  public void selectItem(VendingMachine m, String code) {\n    throw new IllegalStateException("Insert money first");\n  }\n}\n\nclass HasMoneyState implements State {\n  public void insertCoin(VendingMachine m, int amt) { m.addMoney(amt); }\n  public void selectItem(VendingMachine m, String code) {\n    m.reserve(code);\n    m.setState(new DispensingState());\n  }\n}`},
 {t:`code`,cap:`The missing pieces the demo needs`,code:`interface State {\n  void insertCoin(VendingMachine m, int amt);\n  void selectItem(VendingMachine m, String code);\n}\n\nclass DispensingState implements State {\n  public void insertCoin(VendingMachine m, int amt) {\n    throw new IllegalStateException("Please wait, dispensing");\n  }\n  public void selectItem(VendingMachine m, String code) {\n    throw new IllegalStateException("Already dispensing");\n  }\n}\n\n// Extra methods inside VendingMachine\nvoid addMoney(int amt) { balance += amt; }\nvoid reserve(String code) { selected = code; }\nvoid dispense() {\n  System.out.println("Dispensed " + selected + ", balance " + balance);\n  balance = 0; selected = null;\n  setState(new IdleState());            // back to the start\n}`},
 {t:`code`,use:true,cap:`How it is used`,code:`VendingMachine vm = new VendingMachine();        // starts in IdleState

try {
  vm.selectItem("A1");                           // Idle: not allowed
} catch (IllegalStateException e) {
  System.out.println(e.getMessage());            // Insert money first
}

vm.insertCoin(20);        // Idle -> HasMoney
vm.insertCoin(10);        // stays HasMoney, balance 30
vm.selectItem("A1");      // HasMoney -> Dispensing
vm.dispense();            // prints: Dispensed A1, balance 30  (then back to Idle)
vm.insertCoin(10);        // works again

// Wrapped in a service (one machine object per physical machine):
@Service
class VendingService {
  private final VendingMachine machine = new VendingMachine();

  synchronized String buy(int coin, String code) {   // one customer at a time
    machine.insertCoin(coin);
    machine.selectItem(code);
    machine.dispense();
    return "ok";
  }
}`},
 {t:`two`,a:{h:`Use classes when`,b:`There are many stages, each with different rules, or the stages will grow. Order lifecycle, ATM, ticket, payment.`},b:{h:`Use an enum when`,b:`There are two or three stages with simple rules. An enum with a switch is shorter and clear enough.`}},
 {t:`p`,h:`<h2>State versus Strategy</h2><p>They look identical in a diagram. The difference is who changes the plug. In <b>Strategy</b>, the caller picks the behaviour from outside. In <b>State</b>, the object changes its own behaviour as it moves through stages.</p>`},
 {t:`mistake`,h:`Keeping a <code>status</code> string and checking it in every method. Rules get scattered, and one forgotten check allows an illegal move. State classes put each rule in one place.`},
 {t:`check`,q:`An order can be PLACED, PAID, SHIPPED, DELIVERED or CANCELLED. A customer tries to cancel a DELIVERED order. How does State handle it?`,a:`DeliveredState implements <code>cancel()</code> by rejecting it. There is no arrow from Delivered to Cancelled on the stage map. No if-chain anywhere has to remember this rule.`},
 {t:`remember`,h:`<b>Draw the stage map first.</b> Each stage becomes a class, each arrow becomes a state change inside a method.`}
]},

{id:`lesson-5`,track:`patterns`,trackName:`Design patterns`,title:`Factory: hide which class gets created`,min:14,
 promise:`Three related patterns, from simplest to most advanced, so you can answer "Factory Method versus Abstract Factory" with confidence.`,
 blocks:[
 {t:`plain`,h:`A <b>factory</b> is the one place that decides which class to create. Callers ask for what they need and get an object that follows an interface, without ever writing <code>new</code> on a concrete class.`},
 {t:`analogy`,h:`You order "a cab" in an app. You do not choose the driver or the car. The app creates the right ride for you.`},
 {t:`p`,h:`<h2>1. Simple factory</h2><p>A class or method with a decision inside it. Not an official GoF pattern, but the one you will write most often.</p>`},
 {t:`diagram`,cap:`Callers ask the factory. They only know the Notifier interface.`,d:{alt:`Class diagram: NotifierFactory creates Notifier, implemented by Email, Sms and WhatsApp`,nodes:[
   {id:`f`,x:10,y:20,w:160,t:`NotifierFactory`,m:[`create(type)`]},
   {id:`n`,x:250,y:10,w:160,t:`Notifier`,s:`interface`,m:[`send(message)`],k:`iface`},
   {id:`e`,x:10,y:150,w:120,t:`Email`,m:[`send(message)`]},
   {id:`s`,x:150,y:150,w:120,t:`Sms`,m:[`send(message)`]},
   {id:`w`,x:290,y:150,w:120,t:`WhatsApp`,m:[`send(message)`]}],
  edges:[{a:`f`,b:`n`,k:`arrow`,l:`returns`},{a:`e`,b:`n`,k:`implements`},{a:`s`,b:`n`,k:`implements`},{a:`w`,b:`n`,k:`implements`}]}},
 {t:`code`,cap:`A registry map avoids a giant switch`,code:`class NotifierFactory {\n  private final Map<String, Supplier<Notifier>> registry = Map.of(\n      "EMAIL",    EmailNotifier::new,\n      "SMS",      SmsNotifier::new,\n      "WHATSAPP", WhatsAppNotifier::new);\n\n  Notifier create(String type) {\n    Supplier<Notifier> s = registry.get(type);\n    if (s == null) throw new IllegalArgumentException(type);\n    return s.get();\n  }\n}`},
 {t:`code`,use:true,cap:`How it is used`,code:`NotifierFactory factory = new NotifierFactory();

Notifier n = factory.create("SMS");      // the caller never writes "new SmsNotifier()"
n.send("Your order has shipped");

// In a service, the channel usually comes from the user's settings:
@Service
class AlertService {
  private final NotifierFactory factory;
  AlertService(NotifierFactory factory) { this.factory = factory; }

  void alert(User u, String msg) {
    factory.create(u.preferredChannel()).send(msg);    // "EMAIL", "SMS", ...
  }
}`},
 {t:`p`,h:`<h2>2. Factory method</h2><p>A parent class defines the steps and leaves "which object to create" to a subclass method.</p>`},
 {t:`code`,cap:`Subclass decides the product`,code:`abstract class ReportJob {\n  void run() {\n    Exporter e = createExporter();    // the factory method\n    e.write(buildData());\n  }\n  protected abstract Exporter createExporter();\n}\n\nclass SalesReport extends ReportJob {\n  protected Exporter createExporter() { return new CsvExporter(); }\n}\nclass AuditReport extends ReportJob {\n  protected Exporter createExporter() { return new PdfExporter(); }\n}`},
 {t:`code`,use:true,cap:`How it is used`,code:`ReportJob sales = new SalesReport();
sales.run();       // builds the data, writes a CSV file

ReportJob audit = new AuditReport();
audit.run();       // same steps, writes a PDF instead

// A scheduler only knows ReportJob:
List<ReportJob> nightly = List.of(new SalesReport(), new AuditReport());
nightly.forEach(ReportJob::run);`},
 {t:`p`,h:`<h2>3. Abstract factory</h2><p>A factory that makes a <b>matching family</b> of objects. Use it when the pieces must belong together, such as India payment pieces versus global ones.</p>`},
 {t:`diagram`,cap:`Each factory creates a matching set. You never mix a UPI payment with a USD refund.`,d:{alt:`Class diagram: GatewayFactory interface implemented by IndiaFactory and GlobalFactory, each creating its own payment and refund classes`,nodes:[
   {id:`g`,x:90,y:10,w:240,t:`GatewayFactory`,s:`interface`,m:[`createPayment()`,`createRefund()`],k:`iface`},
   {id:`i`,x:10,y:130,w:190,t:`IndiaFactory`,m:[`createPayment()`,`createRefund()`]},
   {id:`o`,x:220,y:130,w:190,t:`GlobalFactory`,m:[`createPayment()`,`createRefund()`]},
   {id:`p1`,x:10,y:260,w:95,t:`UpiPayment`,m:[`pay()`]},
   {id:`r1`,x:112,y:260,w:90,t:`InrRefund`,m:[`refund()`]},
   {id:`p2`,x:220,y:260,w:100,t:`CardPayment`,m:[`pay()`]},
   {id:`r2`,x:328,y:260,w:82,t:`UsdRefund`,m:[`refund()`]}],
  edges:[{a:`i`,b:`g`,k:`implements`},{a:`o`,b:`g`,k:`implements`},{a:`i`,b:`p1`,k:`uses`},{a:`i`,b:`r1`,k:`uses`},{a:`o`,b:`p2`,k:`uses`},{a:`o`,b:`r2`,k:`uses`}]}},
 {t:`cards`,items:[
   {h:`Simple factory`,b:`One method with a decision. Most common. Easy to explain.`},
   {h:`Factory method`,b:`A subclass decides what to create. Used inside frameworks and base classes.`},
   {h:`Abstract factory`,b:`A factory of factories for matching families. Rare, and mostly asked as a comparison.`},
   {h:`In Java and Spring`,b:`<code>Calendar.getInstance()</code> and <code>List.of()</code> are static factories. Spring's <code>BeanFactory</code> and <code>ApplicationContext</code> create your beans.`}]},
 {t:`mistake`,h:`A factory with a long switch that must be edited for every new type. Use a registry map, or let Spring inject all implementations, so a new type needs no edit to the factory.`},
 {t:`check`,q:`Interviewer: "Factory Method versus Abstract Factory?" Give the one-line answer.`,a:`Factory Method creates <b>one</b> product and lets a subclass choose which. Abstract Factory creates a <b>family</b> of related products so they always match.`},
 {t:`remember`,h:`<b>Callers ask for what they need, and the factory decides which class.</b>`}
]},

{id:`lesson-6`,track:`patterns`,trackName:`Design patterns`,title:`Singleton: exactly one`,min:12,
 promise:`The easiest pattern to explain and the one with the most follow-up questions: thread safety, serialization, testing and clusters.`,
 blocks:[
 {t:`plain`,h:`<b>Singleton</b> guarantees one instance of a class and gives everyone a way to reach it. It suits things that must be shared and single: configuration, a connection pool, a logger.`},
 {t:`diagram`,cap:`Every caller gets the same object. The constructor is private so nobody can create another.`,d:{alt:`Three services all call getInstance on one Config class`,nodes:[
   {id:`a`,x:10,y:10,w:110,t:`ServiceA`,k:`state`},
   {id:`b`,x:155,y:10,w:110,t:`ServiceB`,k:`state`},
   {id:`c`,x:300,y:10,w:110,t:`ServiceC`,k:`state`},
   {id:`g`,x:60,y:120,w:300,t:`Config`,m:[`- static Config INSTANCE`,`- Config()   // private`,`+ static getInstance()`]}],
  edges:[{a:`a`,b:`g`,k:`arrow`},{a:`b`,b:`g`,k:`arrow`,l:`getInstance()`},{a:`c`,b:`g`,k:`arrow`}]}},
 {t:`p`,h:`<h2>Four ways to write it</h2>`},
 {t:`steps`,items:[
   [`Eager`,`Create it when the class loads: <code>private static final Config INSTANCE = new Config();</code>. Simple and thread-safe. The drawback is it is created even if never used.`],
   [`Holder class (lazy, recommended)`,`A private inner class holds the instance. It loads only on first use, and the JVM guarantees safe class loading. No locks needed.`],
   [`Enum`,`<code>enum Config { INSTANCE; }</code>. Safe against threads, reflection and serialization. Often called the best Java answer.`],
   [`Double-checked locking`,`Check, lock, check again. The field must be <code>volatile</code>, or another thread may see a half-built object. More code, so use only if asked.`]]},
 {t:`code`,cap:`Holder and double-checked locking`,code:`// Holder: lazy and thread-safe\nclass Config {\n  private Config() {}\n  private static class Holder {\n    static final Config INSTANCE = new Config();\n  }\n  static Config getInstance() { return Holder.INSTANCE; }\n}\n\n// Double-checked locking\nclass Registry {\n  private static volatile Registry instance;   // volatile matters\n  private Registry() {}\n  static Registry getInstance() {\n    if (instance == null) {                    // 1st check, no lock\n      synchronized (Registry.class) {\n        if (instance == null) {                // 2nd check, with lock\n          instance = new Registry();\n        }\n      }\n    }\n    return instance;\n  }\n}`},
 {t:`code`,use:true,cap:`How it is used`,code:`Config a = Config.getInstance();
Config b = Config.getInstance();
System.out.println(a == b);                   // true: the very same object

// Typical use: read a shared setting from anywhere (assuming Config has get(key))
String url = Config.getInstance().get("db.url");

// Preferred in Spring: the container keeps one instance and injects it
@Service
class ReportService {
  private final Config config;
  ReportService(Config config) { this.config = config; }   // easy to fake in a test
}`},
 {t:`p`,h:`<h2>Why people criticise it</h2>`},
 {t:`steps`,items:[
   [`Hidden global state`,`Any code can reach it, so dependencies are invisible.`],
   [`Hard to test`,`You cannot easily replace it with a fake in a unit test.`],
   [`Per JVM only`,`With three servers there are three singletons. If you truly need one across a cluster, you need a distributed lock or leader election (for example Redis or ZooKeeper), and that is a different problem.`]]},
 {t:`remember`,h:`<b>Spring singleton scope is not the Singleton pattern.</b> It means one instance per application context, created by the container, and your class stays an ordinary class with a public constructor. It gets you the benefit without the hidden global.`},
 {t:`check`,q:`Why must the field in double-checked locking be <code>volatile</code>?`,a:`Creating an object takes several steps, and without volatile the JVM may let another thread see the reference before the object is fully built. Volatile forbids that reordering, so no thread sees a half-built object.`}
]},

{id:`lesson-7`,track:`patterns`,trackName:`Design patterns`,title:`Builder and Prototype`,min:11,
 promise:`Two creational patterns. Builder is asked far more often, and it solves a problem you have certainly met: constructors with too many parameters.`,
 blocks:[
 {t:`plain`,h:`<b>Builder</b> builds a complex object step by step, with named steps, and produces it at the end. <b>Prototype</b> creates a new object by copying an existing one.`},
 {t:`p`,h:`<h2>The problem Builder solves</h2><p>This is called the telescoping constructor problem. Which argument is which?</p>`},
 {t:`code`,bad:true,cap:`Hard to read, easy to get the order wrong`,code:`new Order("U42", "PUNE-411001", null, true, 2, "DIWALI10", false);`},
 {t:`diagram`,cap:`The client chains named steps on the builder, then build() makes the order.`,d:{alt:`Client uses OrderBuilder which creates Order`,nodes:[
   {id:`c`,x:160,y:10,w:100,t:`Client`,k:`state`},
   {id:`b`,x:10,y:100,w:160,t:`OrderBuilder`,m:[`item(x)`,`coupon(c)`,`address(a)`,`build()`]},
   {id:`o`,x:280,y:100,w:130,t:`Order`,m:[`items`,`coupon`,`address`]}],
  edges:[{a:`c`,b:`b`,k:`uses`,l:`chains calls`},{a:`b`,b:`o`,k:`arrow`,l:`creates`}]}},
 {t:`code`,good:true,cap:`Readable and validated`,code:`Order order = Order.builder()\n    .userId("U42")\n    .address("PUNE-411001")\n    .item("book", 2)\n    .coupon("DIWALI10")\n    .build();\n\nclass Order {\n  private final String userId, address, coupon;\n  private final Map<String, Integer> items;\n\n  private Order(Builder b) {                // only the builder can call\n    this.userId = b.userId; this.address = b.address;\n    this.coupon = b.coupon; this.items = Map.copyOf(b.items);\n  }\n\n  static Builder builder() { return new Builder(); }\n\n  static class Builder {\n    private String userId, address, coupon;\n    private final Map<String, Integer> items = new HashMap<>();\n\n    Builder userId(String v)  { userId = v;  return this; }\n    Builder address(String v) { address = v; return this; }\n    Builder coupon(String v)  { coupon = v;  return this; }\n    Builder item(String n, int q) { items.put(n, q); return this; }\n\n    Order build() {\n      if (userId == null || items.isEmpty())\n        throw new IllegalStateException("userId and items required");\n      return new Order(this);\n    }\n  }\n}`},
 {t:`code`,use:true,cap:`How it is used in a controller`,code:`@PostMapping("/orders")
ResponseEntity<Order> create(@RequestBody OrderRequest r) {
  Order order = Order.builder()
      .userId(r.userId())
      .address(r.address())
      .coupon(r.coupon())            // optional: may be null
      .item(r.sku(), r.qty())
      .build();                      // throws if userId or items are missing

  return ResponseEntity.ok(orderService.save(order));
}`},
 {t:`cards`,items:[
   {h:`Why it is good`,b:`Named steps read clearly, optional fields are easy, the finished object can be immutable, and validation happens in one place (<code>build()</code>).`},
   {h:`In real code`,b:`Lombok's <code>@Builder</code> writes this for you. Spring's <code>UriComponentsBuilder</code> and <code>StringBuilder</code> follow the idea too.`},
   {h:`Cost`,b:`Extra code for the builder class. Not worth it for an object with two or three fields.`}]},
 {t:`p`,h:`<h2>Prototype in a minute</h2><p>If creating an object is expensive (loading data, heavy setup), copy an existing one and change what differs. In Java the usual advice is a <b>copy constructor</b> instead of <code>Cloneable</code>, which is awkward and easy to misuse.</p>`},
 {t:`two`,a:{h:`Shallow copy`,b:`Copies the references. The original and the copy share the same inner objects, so changing one changes the other.`},b:{h:`Deep copy`,b:`Copies the inner objects too. The two are fully independent. Slower, and what you usually want.`}},
 {t:`check`,q:`When would you NOT use a builder?`,a:`When the class has only a few fields and no optional ones. A plain constructor or a Java <code>record</code> is simpler and clearer.`},
 {t:`remember`,h:`<b>Builder: many fields, many optional, readable steps, validated at the end.</b>`}
]},

/* ---------- 25 ---------- */
{id:`lesson-8`,track:`patterns`,trackName:`Design patterns`,title:`Decorator and Proxy`,min:15,
 promise:`Both wrap another object, which is why interviewers love asking how they differ. The answer is about intent.`,
 blocks:[
 {t:`plain`,h:`<b>Decorator</b> wraps an object to <b>add features</b>. <b>Proxy</b> wraps an object to <b>control access</b> to it. Both wrappers share the same interface as the thing they wrap, so callers cannot tell the difference.`},
 {t:`p`,h:`<h2>Decorator: stack features</h2>`},
 {t:`analogy`,h:`Ordering a coffee. Espresso is the base. Add milk, then syrup. Each add-on wraps the previous drink and adds to the price and description. You can stack them in any order and any number.`},
 {t:`diagram`,cap:`Each decorator is a Coffee that holds another Coffee.`,d:{alt:`Class diagram: Coffee interface implemented by Espresso, MilkDecorator and SyrupDecorator, which wrap another Coffee`,nodes:[
   {id:`c`,x:130,y:10,w:160,t:`Coffee`,s:`interface`,m:[`cost()`],k:`iface`},
   {id:`e`,x:10,y:140,w:110,t:`Espresso`,m:[`cost()`]},
   {id:`m`,x:140,y:140,w:130,t:`MilkDecorator`,m:[`Coffee inner`,`cost()`]},
   {id:`s`,x:285,y:140,w:130,t:`SyrupDecorator`,m:[`Coffee inner`,`cost()`]},
   {id:`n`,x:80,y:250,w:260,k:`note`,m:[`cost() = inner.cost() + extra`]}],
  edges:[{a:`e`,b:`c`,k:`implements`},{a:`m`,b:`c`,k:`implements`},{a:`s`,b:`c`,k:`implements`}]}},
 {t:`code`,cap:`Stacking decorators`,code:`interface Coffee { double cost(); }\n\nclass Espresso implements Coffee {\n  public double cost() { return 120; }\n}\n\nclass MilkDecorator implements Coffee {\n  private final Coffee inner;\n  MilkDecorator(Coffee inner) { this.inner = inner; }\n  public double cost() { return inner.cost() + 20; }\n}\n\nclass SyrupDecorator implements Coffee {\n  private final Coffee inner;\n  SyrupDecorator(Coffee inner) { this.inner = inner; }\n  public double cost() { return inner.cost() + 15; }\n}\n\nCoffee order = new SyrupDecorator(new MilkDecorator(new Espresso()));\norder.cost();   // 155`},
 {t:`code`,use:true,cap:`How it is used`,code:`Coffee plain   = new Espresso();
Coffee latte   = new MilkDecorator(new Espresso());
Coffee special = new SyrupDecorator(new MilkDecorator(new Espresso()));

System.out.println(plain.cost());      // 120.0
System.out.println(latte.cost());      // 140.0
System.out.println(special.cost());    // 155.0

// Stacking at run time from what the customer ordered:
Coffee build(List<String> addOns) {
  Coffee c = new Espresso();
  for (String a : addOns) {
    if (a.equals("milk"))  c = new MilkDecorator(c);
    if (a.equals("syrup")) c = new SyrupDecorator(c);
  }
  return c;
}
build(List.of("milk", "syrup", "milk")).cost();    // 120 + 20 + 15 + 20 = 175.0`},
 {t:`p`,h:`<b>You already use it:</b> <code>new BufferedReader(new InputStreamReader(new FileInputStream(f)))</code> stacks features onto a stream, and <code>Collections.unmodifiableList(list)</code> wraps a list.`},
 {t:`p`,h:`<h2>Proxy: control access</h2>`},
 {t:`analogy`,h:`A receptionist. You do not walk into the manager's room. The receptionist checks your appointment first, then lets you through, and may just answer a simple question without bothering the manager.`},
 {t:`diagram`,cap:`The proxy looks like the service, does its checks, then delegates to the real one.`,d:{alt:`Class diagram: Client uses Service interface, implemented by RealService and ServiceProxy, which delegates to RealService`,nodes:[
   {id:`c`,x:10,y:10,w:100,t:`Client`,k:`state`},
   {id:`s`,x:170,y:10,w:150,t:`Service`,s:`interface`,m:[`request()`],k:`iface`},
   {id:`r`,x:10,y:140,w:125,t:`RealService`,m:[`request()`]},
   {id:`p`,x:250,y:140,w:160,t:`ServiceProxy`,m:[`check access / cache`,`request()`]}],
  edges:[{a:`c`,b:`s`,k:`uses`},{a:`r`,b:`s`,k:`implements`},{a:`p`,b:`s`,k:`implements`},{a:`p`,b:`r`,k:`arrow`,l:`delegates`}]}},
 {t:`cards`,items:[
   {h:`Virtual proxy`,b:`Creates the heavy object only when first needed (lazy loading, such as a big image).`},
   {h:`Protection proxy`,b:`Checks permissions before allowing the call.`},
   {h:`Caching proxy`,b:`Returns a saved answer for repeated calls.`},
   {h:`Remote proxy`,b:`Stands in for an object in another machine, so a network call looks like a local one.`}]},
 {t:`code`,cap:`A caching proxy in code`,code:`interface PriceService { double priceOf(String sku); }\n\nclass RealPriceService implements PriceService {\n  public double priceOf(String sku) { /* slow database call */ return 499.0; }\n}\n\nclass CachingPriceProxy implements PriceService {\n  private final PriceService real;\n  private final Map<String, Double> cache = new ConcurrentHashMap<>();\n  CachingPriceProxy(PriceService real) { this.real = real; }\n\n  public double priceOf(String sku) {\n    return cache.computeIfAbsent(sku, real::priceOf);   // real is called only on a miss\n  }\n}`},
 {t:`code`,use:true,cap:`How it is used`,code:`PriceService prices = new CachingPriceProxy(new RealPriceService());\n\nprices.priceOf("SKU-1");    // slow: goes to the real service\nprices.priceOf("SKU-1");    // fast: answered from the proxy's cache\n\n// The caller cannot tell the difference:\n@Service\nclass CartService {\n  private final PriceService prices;          // the proxy or the real one\n  CartService(PriceService prices) { this.prices = prices; }\n\n  double total(List<String> skus) {\n    return skus.stream().mapToDouble(prices::priceOf).sum();\n  }\n}`},
 {t:`p`,h:`<h2>Proxy in Spring, and the gotcha</h2><p><code>@Transactional</code>, <code>@Cacheable</code> and <code>@Async</code> work through proxies. Spring wraps your bean in a proxy that starts the transaction, calls your method, then commits or rolls back. It uses a JDK dynamic proxy when the bean has an interface, otherwise a CGLIB subclass proxy.</p>`},
 {t:`mistake`,h:`<b>Self-invocation.</b> If one method in a class calls another method of the same class, the call goes straight to <code>this</code> and skips the proxy. So <code>@Transactional</code> on the second method does nothing. Move the method to another bean, or inject the bean into itself. This is a very common Spring interview question.`},
 {t:`two`,a:{h:`Decorator`,b:`<b>Intent:</b> add behaviour. Usually the client builds the stack of wrappers itself. You can stack many.`},b:{h:`Proxy`,b:`<b>Intent:</b> control access. Usually one proxy, often created for you (by a framework). The client thinks it holds the real thing.`}},
 {t:`check`,q:`A class wraps a service and logs how long each call takes. Decorator or Proxy?`,a:`It adds behaviour (timing) without controlling access, so Decorator is the honest answer. Many people call it a proxy, because in Spring that is the mechanism (an AOP proxy). Say which you mean: "the intent is a decorator, and Spring implements it with a proxy".`},
 {t:`remember`,h:`<b>Decorator adds. Proxy guards.</b> Same shape, different purpose.`}
]},

{id:`lesson-9`,track:`patterns`,trackName:`Design patterns`,title:`Adapter and Facade (and Bridge)`,min:14,
 promise:`Three structural patterns that are easy to confuse. Each one answers a different question.`,
 blocks:[
 {t:`plain`,h:`<b>Adapter</b> makes an existing class fit an interface you expect. <b>Facade</b> gives one simple door to a messy set of classes. <b>Bridge</b> keeps two things that vary independently from tangling together.`},
 {t:`p`,h:`<h2>Adapter: fix the plug</h2>`},
 {t:`analogy`,h:`A travel adapter. Your charger has a two-pin plug and the wall has a three-pin socket. You do not rebuild either one. The adapter sits between them.`},
 {t:`diagram`,cap:`Your code only knows PaymentGateway. The adapter translates calls to the old bank API.`,d:{alt:`Client uses PaymentGateway interface, implemented by LegacyBankAdapter, which calls LegacyBank`,nodes:[
   {id:`c`,x:10,y:10,w:100,t:`Client`,k:`state`},
   {id:`t`,x:160,y:10,w:250,t:`PaymentGateway`,s:`interface`,m:[`pay(rupees)`],k:`iface`},
   {id:`a`,x:160,y:120,w:250,t:`LegacyBankAdapter`,m:[`pay(rupees)`,`// converts rupees to paise`]},
   {id:`l`,x:160,y:230,w:250,t:`LegacyBank`,m:[`makeTxn(paise, id)`]}],
  edges:[{a:`c`,b:`t`,k:`uses`},{a:`a`,b:`t`,k:`implements`},{a:`a`,b:`l`,k:`arrow`,l:`calls`}]}},
 {t:`code`,cap:`The adapter in Java`,code:`interface PaymentGateway { void pay(double rupees); }\n\n// Old class we cannot change\nclass LegacyBank {\n  void makeTxn(long paise, String id) { /* ... */ }\n}\n\nclass LegacyBankAdapter implements PaymentGateway {\n  private final LegacyBank bank;\n  LegacyBankAdapter(LegacyBank bank) { this.bank = bank; }\n\n  public void pay(double rupees) {\n    long paise = Math.round(rupees * 100);\n    bank.makeTxn(paise, UUID.randomUUID().toString());\n  }\n}`},
 {t:`code`,use:true,cap:`How it is used`,code:`PaymentGateway gateway = new LegacyBankAdapter(new LegacyBank());
gateway.pay(499.50);       // adapter turns it into 49950 paise and calls makeTxn(...)

// The rest of the app only ever sees PaymentGateway:
@Service
class CheckoutService {
  private final PaymentGateway gateway;
  CheckoutService(PaymentGateway gateway) { this.gateway = gateway; }

  void checkout(Order o) { gateway.pay(o.totalRupees()); }
}
// Replace the old bank later? Write NewBankAdapter. CheckoutService is untouched.`},
 {t:`p`,h:`<b>Where you see it:</b> wrapping third-party SDKs so the rest of your code does not depend on them, and Spring MVC's <code>HandlerAdapter</code>, which lets the dispatcher call different kinds of controllers the same way.`},
 {t:`p`,h:`<h2>Facade: one simple door</h2>`},
 {t:`analogy`,h:`A hotel front desk. To get a cab, laundry and a late checkout you could phone three departments. Or you ask the desk, and it handles the rest.`},
 {t:`diagram`,cap:`The client calls one method. The facade calls the four subsystems in the right order.`,d:{alt:`Client calls CheckoutFacade, which calls Inventory, Payment, Shipping and Tax`,nodes:[
   {id:`c`,x:5,y:100,w:85,t:`Client`,k:`state`},
   {id:`f`,x:115,y:84,w:140,t:`CheckoutFacade`,m:[`placeOrder()`]},
   {id:`i`,x:300,y:10,w:110,t:`Inventory`,m:[`reserve()`]},
   {id:`p`,x:300,y:72,w:110,t:`Payment`,m:[`charge()`]},
   {id:`s`,x:300,y:134,w:110,t:`Shipping`,m:[`schedule()`]},
   {id:`t`,x:300,y:196,w:110,t:`Tax`,m:[`calculate()`]}],
  edges:[{a:`c`,b:`f`,k:`arrow`},{a:`f`,b:`i`,k:`arrow`},{a:`f`,b:`p`,k:`arrow`},{a:`f`,b:`s`,k:`arrow`},{a:`f`,b:`t`,k:`arrow`}]}},
 {t:`code`,cap:`A facade`,code:`class CheckoutFacade {\n  private final Inventory inventory;\n  private final Payment payment;\n  private final Shipping shipping;\n  private final Tax tax;\n  // constructor omitted\n\n  Receipt placeOrder(Cart cart, Card card) {\n    inventory.reserve(cart);\n    double total = cart.total() + tax.calculate(cart);\n    payment.charge(card, total);\n    shipping.schedule(cart);\n    return new Receipt(cart, total);\n  }\n}`},
 {t:`code`,use:true,cap:`How it is used`,code:`@RestController
class OrderController {
  private final CheckoutFacade checkout;
  OrderController(CheckoutFacade checkout) { this.checkout = checkout; }

  @PostMapping("/checkout")
  Receipt place(@RequestBody CheckoutRequest r) {
    return checkout.placeOrder(r.cart(), r.card());   // ONE call
  }
}
// The controller knows nothing about inventory, tax, payment or shipping.`},
 {t:`p`,h:`<b>Where you see it:</b> a Spring <code>@Service</code> that coordinates several repositories and clients. Watch the size: if the facade grows into a giant class doing everything, split it.`},
 {t:`p`,h:`<h2>Bridge in one paragraph</h2><p>Suppose notifications come in kinds (alert, reminder) and channels (email, SMS). Subclassing every combination gives AlertEmail, AlertSms, ReminderEmail, ReminderSms, and it explodes. Bridge keeps <b>two separate hierarchies</b>: a Notification that <i>has</i> a Channel. Add a channel and nothing else changes.</p>`},
 {t:`two`,a:{h:`Adapter`,b:`Made <b>after</b> the fact to fix a mismatch between two existing things. Changes the shape of one interface.`},b:{h:`Bridge`,b:`Planned <b>up front</b> to let two dimensions vary on their own. Design, not repair.`}},
 {t:`check`,q:`Adapter versus Facade in one sentence each.`,a:`Adapter changes one interface into another that the client expects. Facade does not convert anything. It hides many classes behind a simpler interface.`},
 {t:`remember`,h:`<b>Adapter: wrong shape, make it fit. Facade: too many parts, give one door. Bridge: two kinds of variation, keep them apart.</b>`}
]},

{id:`lesson-10`,track:`patterns`,trackName:`Design patterns`,title:`Command, Template Method and Chain of Responsibility`,min:16,
 promise:`Three behavioural patterns that appear in framework code you already use. Each has a diagram and a plain example.`,
 blocks:[
 {t:`p`,h:`<h2>Command: turn an action into an object</h2>`},
 {t:`plain`,h:`<b>Command</b> wraps a request as an object with <code>execute()</code> (and often <code>undo()</code>). Because an action is now an object, you can store it, queue it, log it, repeat it or reverse it.`},
 {t:`analogy`,h:`A restaurant order slip. The waiter writes the request on paper and hands it to the kitchen. The slip can wait, be queued, or be cancelled. The waiter does not cook.`},
 {t:`diagram`,cap:`The editor keeps commands. Each command knows its receiver and how to undo itself.`,d:{alt:`Editor holds Command interface, implemented by InsertText and DeleteText, which both call Document`,nodes:[
   {id:`e`,x:10,y:10,w:140,t:`Editor`,m:[`Command cmd`,`run()`,`undo()`]},
   {id:`c`,x:230,y:10,w:180,t:`Command`,s:`interface`,m:[`execute()`,`undo()`],k:`iface`},
   {id:`i`,x:150,y:150,w:120,t:`InsertText`,m:[`execute()`,`undo()`]},
   {id:`d`,x:290,y:150,w:120,t:`DeleteText`,m:[`execute()`,`undo()`]},
   {id:`r`,x:170,y:270,w:140,t:`Document`,m:[`insert()`,`delete()`]}],
  edges:[{a:`e`,b:`c`,k:`has`,l:`holds`},{a:`i`,b:`c`,k:`implements`},{a:`d`,b:`c`,k:`implements`},{a:`i`,b:`r`,k:`arrow`},{a:`d`,b:`r`,k:`arrow`}]}},
 {t:`code`,cap:`Undo with a stack of commands`,code:`interface Command { void execute(); void undo(); }\n\nclass InsertText implements Command {\n  private final Document doc; private final String text; private int pos;\n  InsertText(Document doc, String text) { this.doc = doc; this.text = text; }\n  public void execute() { pos = doc.length(); doc.insert(pos, text); }\n  public void undo()    { doc.delete(pos, text.length()); }\n}\n\nclass Editor {\n  private final Deque<Command> history = new ArrayDeque<>();\n  void run(Command c) { c.execute(); history.push(c); }\n  void undo() { if (!history.isEmpty()) history.pop().undo(); }\n}`},
 {t:`code`,use:true,cap:`How it is used`,code:`Document doc = new Document();
Editor editor = new Editor();

editor.run(new InsertText(doc, "Hello"));
editor.run(new InsertText(doc, " World"));
System.out.println(doc.text());       // Hello World

editor.undo();
System.out.println(doc.text());       // Hello
editor.undo();
System.out.println(doc.text());       // (empty)`},
 {t:`p`,h:`<b>Where you see it:</b> undo and redo, job queues, scheduled tasks (a <code>Runnable</code> is a command), and event sourcing (a log of commands).`},
 {t:`p`,h:`<h2>Template Method: fixed steps, flexible parts</h2>`},
 {t:`plain`,h:`<b>Template Method</b> defines the steps of an algorithm in a parent class, and lets subclasses fill in some of the steps. The order is fixed. Only the details change.`},
 {t:`analogy`,h:`A recipe card for any curry: heat oil, add masala, add the main ingredient, simmer, serve. Chicken, paneer and dal fill in the main ingredient step. The method stays the same.`},
 {t:`diagram`,cap:`export() is final. Subclasses supply read() and write().`,d:{alt:`DataExporter abstract class with final export method, extended by CsvExporter and JsonExporter`,nodes:[
   {id:`t`,x:80,y:10,w:260,t:`DataExporter`,s:`abstract class`,m:[`final export()  // template`,`abstract read()`,`abstract write()`],k:`iface`},
   {id:`c`,x:30,y:150,w:160,t:`CsvExporter`,m:[`read()`,`write()`]},
   {id:`j`,x:230,y:150,w:160,t:`JsonExporter`,m:[`read()`,`write()`]}],
  edges:[{a:`c`,b:`t`,k:`extends`},{a:`j`,b:`t`,k:`extends`}]}},
 {t:`code`,cap:`The template`,code:`abstract class DataExporter {\n  public final void export() {      // final: order cannot be changed\n    List<Row> rows = read();\n    validate(rows);                 // shared step\n    write(rows);\n  }\n  protected abstract List<Row> read();\n  protected abstract void write(List<Row> rows);\n  private void validate(List<Row> rows) { /* same for all */ }\n}`},
 {t:`code`,use:true,cap:`How it is used`,code:`DataExporter csv = new CsvExporter();
csv.export();      // read() -> validate() -> write(): rows go to a CSV file

DataExporter json = new JsonExporter();
json.export();     // same order of steps, JSON output

// A service picks the exporter and always calls the same method:
@Service
class ExportService {
  void run(String format) {
    DataExporter e = format.equals("csv") ? new CsvExporter() : new JsonExporter();
    e.export();
  }
}`},
 {t:`p`,h:`<b>Where you see it:</b> Spring's <code>JdbcTemplate</code> and <code>TransactionTemplate</code> do the boring steps (open connection, close, handle errors) and call your code for the interesting part. The idea is called the <b>Hollywood principle</b>: "do not call us, we will call you". The framework calls your code.`},
 {t:`p`,h:`<h2>Chain of Responsibility: pass it along</h2>`},
 {t:`plain`,h:`<b>Chain of Responsibility</b> passes a request through a line of handlers. Each one either handles it, stops it, or passes it to the next.`},
 {t:`analogy`,h:`Escalating a problem. Support agent, then team lead, then manager. Each resolves it or passes it up. The customer does not need to know who will answer.`},
 {t:`diagram`,cap:`A request passes each check in order. Any filter can stop it early.`,d:{alt:`Request flows through AuthFilter, RateLimitFilter, ValidationFilter and then Controller, with rejection notes`,nodes:[
   {id:`a`,x:90,y:10,w:200,t:`AuthFilter`,m:[`valid token?`]},
   {id:`r`,x:90,y:90,w:200,t:`RateLimitFilter`,m:[`under limit?`]},
   {id:`v`,x:90,y:170,w:200,t:`ValidationFilter`,m:[`body valid?`]},
   {id:`c`,x:90,y:250,w:200,t:`Controller`,m:[`handles request`]},
   {id:`n1`,x:325,y:22,w:85,k:`note`,m:[`stop: 401`]},
   {id:`n2`,x:325,y:102,w:85,k:`note`,m:[`stop: 429`]},
   {id:`n3`,x:325,y:182,w:85,k:`note`,m:[`stop: 400`]}],
  edges:[{a:`a`,b:`r`,k:`arrow`,l:`next`},{a:`r`,b:`v`,k:`arrow`,l:`next`},{a:`v`,b:`c`,k:`arrow`,l:`next`},{a:`a`,b:`n1`,k:`uses`},{a:`r`,b:`n2`,k:`uses`},{a:`v`,b:`n3`,k:`uses`}]}},
 {t:`code`,cap:`A handler chain`,code:`abstract class Handler {\n  private Handler next;\n  Handler then(Handler n) { this.next = n; return n; }\n\n  final void handle(Request r) {\n    if (!check(r)) return;          // reject: stop the chain\n    if (next != null) next.handle(r);\n  }\n  protected abstract boolean check(Request r);\n}\n\nHandler chain = new AuthHandler();\nchain.then(new RateLimitHandler()).then(new ValidationHandler());\nchain.handle(request);`},
 {t:`code`,use:true,cap:`What one handler looks like`,code:`// One handler written out: each filter is a small class like this
class AuthHandler extends Handler {
  protected boolean check(Request r) {
    if (r.token() == null) {
      r.respond(401);       // reject here
      return false;         // stop the chain
    }
    return true;            // pass to the next handler
  }
}
// A request with no token gets 401, and RateLimit and Validation never run.
// A valid request passes Auth, RateLimit and Validation, then reaches the Controller.`},
 {t:`p`,h:`<b>Where you see it:</b> servlet filters, the Spring Security filter chain, and Spring MVC interceptors. Logging frameworks also use it to filter messages by level.`},
 {t:`mistake`,h:`Forgetting what happens when nobody handles the request. Decide: is it an error, or is passing through fine? Say it out loud in the interview.`},
 {t:`check`,q:`Which of these three fits: "a pipeline of validation steps where each step can reject"?`,a:`Chain of Responsibility. Each validator checks, and either rejects (stops) or passes to the next. A new rule is a new handler added to the chain.`}
]},

{id:`lesson-11`,track:`patterns`,trackName:`Design patterns`,title:`Also asked: Composite, Iterator, Flyweight and more`,min:14,
 promise:`The patterns that come up less often. Composite is on the main list, and the rest are short enough to learn in one sitting.`,
 blocks:[
 {t:`p`,h:`<h2>Composite: treat one and many the same</h2>`},
 {t:`plain`,h:`<b>Composite</b> lets you treat a single object and a group of objects through the same interface. It builds tree structures where leaves and branches look alike to the caller.`},
 {t:`analogy`,h:`Folders and files. Asking "how big is it?" works on a file, and also on a folder, which just adds up everything inside, including other folders.`},
 {t:`diagram`,cap:`A Folder is a FileItem and also holds many FileItems, so folders can nest.`,d:{alt:`FileItem interface implemented by File and Folder, and Folder holds many FileItems`,nodes:[
   {id:`i`,x:130,y:10,w:160,t:`FileItem`,s:`interface`,m:[`size()`],k:`iface`},
   {id:`f`,x:10,y:150,w:110,t:`File`,m:[`size()`]},
   {id:`d`,x:190,y:150,w:200,t:`Folder`,m:[`List<FileItem> children`,`size()`]},
   {id:`n`,x:40,y:255,w:340,k:`note`,m:[`a Folder holds 0..* FileItems, files or other folders`]}],
  edges:[{a:`f`,b:`i`,k:`implements`},{a:`d`,b:`i`,k:`implements`}]}},
 {t:`code`,cap:`Recursive size`,code:`interface FileItem { long size(); }\n\nclass File implements FileItem {\n  private final long bytes;\n  File(long bytes) { this.bytes = bytes; }\n  public long size() { return bytes; }\n}\n\nclass Folder implements FileItem {\n  private final List<FileItem> children = new ArrayList<>();\n  void add(FileItem f) { children.add(f); }\n  public long size() {\n    long total = 0;\n    for (FileItem c : children) total += c.size();   // works for files and folders\n    return total;\n  }\n}`},
 {t:`code`,use:true,cap:`How it is used`,code:`Folder root   = new Folder();
Folder photos = new Folder();

photos.add(new File(2_000_000));
photos.add(new File(3_000_000));
root.add(photos);                     // a folder inside a folder
root.add(new File(500_000));

System.out.println(root.size());      // 5500000
// The caller never checks "is this a file or a folder?"`},
 {t:`p`,h:`<b>Used in:</b> file systems, menus with submenus, organisation charts, and UI component trees.`},
 {t:`p`,h:`<h2>Quick cards for the rest</h2>`},
 {t:`cards`,items:[
   {h:`Iterator`,pic:`Walk a collection without knowing its insides`,b:`Java's <code>Iterable</code> and the for-each loop. Fail-fast iterators throw <code>ConcurrentModificationException</code> if the list changes while you walk it.`},
   {h:`Flyweight`,pic:`Share common data to save memory`,b:`Many objects share the same unchanging part. Java's String pool and the Integer cache (-128 to 127) are examples. Intrinsic state is shared. Extrinsic state is passed in.`},
   {h:`Mediator`,pic:`A hub so objects do not talk to each other`,b:`A chat room: users send messages to the room, and the room delivers them. This replaces many direct links with one central coordinator.`},
   {h:`Memento`,pic:`Save a snapshot to restore later`,b:`Editor undo by saving the state. The object that holds snapshots (the caretaker) never looks inside them.`},
   {h:`Visitor`,pic:`Add operations without changing classes`,b:`Used for walking trees such as syntax trees. Needs double dispatch. In modern Java, sealed types and pattern matching in <code>switch</code> often replace it.`},
   {h:`Null Object`,pic:`A do-nothing object instead of null`,b:`A <code>NoDiscount</code> object whose discount is zero means no null checks. <code>Optional</code> serves a similar goal.`},
   {h:`Object Pool`,pic:`Reuse expensive objects`,b:`Connection pools such as HikariCP, and thread pools. Borrow, use, return.`},
   {h:`Prototype`,pic:`Copy instead of build`,b:`Covered in lesson 7.`}]},
 {t:`remember`,h:`If asked about a pattern you do not remember, do not bluff. Say what problem you would expect it to solve, then reason from the problem. That earns more credit than a wrong recollection.`},
 {t:`check`,q:`Why does a connection pool exist?`,a:`Opening a database connection is slow and expensive. A pool keeps a set of open connections that threads borrow and return. It is the Object Pool pattern.`}
]},

{id:`lesson-12`,track:`patterns`,trackName:`Design patterns`,title:`The patterns hiding inside Spring and Java`,min:12,
 promise:`You have used most of these patterns for years without naming them. Naming them is a very common Java and Spring interview question.`,
 blocks:[
 {t:`plain`,h:`"Which design patterns does Spring use?" is a favourite question for experienced Java developers. A good answer gives <b>the pattern, the Spring feature, and what it does</b>, in one line each.`},
 {t:`p`,h:`<h2>How @Transactional actually works</h2>`},
 {t:`diagram`,cap:`The controller thinks it calls OrderService. It really calls a proxy that wraps the call in a transaction.`,d:{alt:`Controller calls a transaction proxy, which begins a transaction and delegates to OrderService`,nodes:[
   {id:`c`,x:150,y:10,w:120,t:`Controller`,k:`state`},
   {id:`p`,x:110,y:90,w:200,t:`TxProxy`,m:[`begin tx`,`commit / rollback`]},
   {id:`s`,x:110,y:210,w:200,t:`OrderService`,m:[`placeOrder()`]}],
  edges:[{a:`c`,b:`p`,k:`arrow`,l:`calls`},{a:`p`,b:`s`,k:`arrow`,l:`delegates`}]}},
 {t:`cards`,items:[
   {h:`Singleton (scope)`,b:`The default bean scope. One instance per application context, created by the container.`},
   {h:`Factory`,b:`<code>BeanFactory</code> and <code>ApplicationContext</code> create and hand out your beans.`},
   {h:`Dependency Injection and IoC`,b:`The container creates objects and passes in their dependencies, instead of classes creating them. This is Inversion of Control.`},
   {h:`Proxy`,b:`AOP: <code>@Transactional</code>, <code>@Cacheable</code>, <code>@Async</code>, method security. JDK dynamic proxies or CGLIB.`},
   {h:`Template Method`,b:`<code>JdbcTemplate</code>, <code>TransactionTemplate</code>, <code>RestTemplate</code>. Fixed steps, your callback for the variable part.`},
   {h:`Observer`,b:`<code>ApplicationEventPublisher</code> and <code>@EventListener</code>.`},
   {h:`Chain of Responsibility`,b:`Servlet filter chain, Spring Security filter chain, <code>HandlerInterceptor</code>.`},
   {h:`Adapter`,b:`<code>HandlerAdapter</code> in Spring MVC lets the dispatcher call different controller styles uniformly.`},
   {h:`Front Controller`,b:`<code>DispatcherServlet</code> receives every request and routes it.`},
   {h:`Strategy`,b:`Many injected implementations of one interface, such as <code>PasswordEncoder</code>. In Java: <code>Comparator</code>.`},
   {h:`Builder`,b:`<code>UriComponentsBuilder</code>, MockMvc request builders, Lombok <code>@Builder</code>.`},
   {h:`Decorator`,b:`<code>HttpServletRequestWrapper</code>, and Java I/O streams such as <code>BufferedReader</code>.`},
   {h:`Repository`,b:`Spring Data repositories give a collection-like interface to stored data.`}]},
 {t:`remember`,h:`A strong answer to "which patterns does Spring use?" names <b>Singleton scope, Factory (BeanFactory), Proxy (AOP and transactions), Template Method (JdbcTemplate), Observer (events) and Front Controller (DispatcherServlet)</b>, and says the one-line job of each.`},
 {t:`check`,q:`Why does <code>@Transactional</code> not work when a method calls another <code>@Transactional</code> method in the same class?`,a:`The transaction is added by a proxy that wraps the bean. A call from inside the class goes straight to <code>this</code> and never passes through the proxy, so no transaction starts. Move the method into another bean.`}
]},

{id:`lesson-13`,track:`patterns`,trackName:`Design patterns`,title:`Pattern questions with full answers`,min:40,
 promise:`The comparison and scenario questions that interviewers use to test whether you really understand patterns, with clear answers you can say in a minute.`,
 blocks:[
 {t:`plain`,h:`Try each question out loud first. A good answer has three parts: <b>what it is, how it differs from the similar one, and when you would choose it.</b>`},
 {t:`qbank`,items:[

 {n:`Strategy versus State`,tag:`Pattern`,where:`A very common comparison question in Java pattern lists.`,
  ask:`Both have a context holding an interface with several implementations. How do they differ?`,
  quality:`Who chooses and changes the behaviour.`,
  steps:[
   [`Strategy`,`The <b>client</b> picks the algorithm and plugs it in. The strategies usually do not know about each other. Example: choosing UPI or card.`],
   [`State`,`The <b>object itself</b> changes behaviour as it moves through stages. The states often know the next state. Example: an order going from placed to shipped.`],
   [`Quick test`,`Does the behaviour change because someone chose it, or because time and events moved the object along? Chosen means Strategy. Moved means State.`]],
  trade:`Strategy is simpler. State has more moving parts because each state must know its transitions.`,
  follow:`Can they be combined? (yes: a state can use strategies for part of its work.)`},

 {n:`Decorator versus Proxy`,tag:`Pattern`,where:`Appears in Java and Spring interview lists.`,
  ask:`Both wrap an object with the same interface. What is the difference?`,
  quality:`Intent, not structure.`,
  steps:[
   [`Decorator`,`Adds behaviour or features. The client often builds stacks of them. Example: milk and syrup on coffee.`],
   [`Proxy`,`Controls access to the object. Typically one proxy, often created by a framework. Examples: lazy loading, permission checks, caching, Spring's transaction proxy.`],
   [`When in doubt`,`Ask whether you are adding something or guarding something.`]],
  trade:`The boundary is blurry. Logging or timing wrappers are called both. Say which intent you mean.`,
  follow:`Which does Spring AOP use? (proxies. JDK dynamic proxy for interfaces, CGLIB for classes.)`},

 {n:`Adapter, Facade and Bridge`,tag:`Pattern`,where:`A frequent "structural patterns" comparison.`,
  ask:`How do you tell these three apart?`,
  quality:`The problem each one solves.`,
  steps:[
   [`Adapter`,`Converts one interface to another expected one. Fixes a mismatch after the fact.`],
   [`Facade`,`Hides many classes behind a simpler interface. Converts nothing.`],
   [`Bridge`,`Separates an abstraction from its implementation so each can vary. Planned in the design from the start.`]],
  trade:`An adapter wraps one thing. A facade wraps several. A bridge is a structure, not a wrapper.`,
  follow:`When does a facade become a problem? (when it grows into a god class. Split it by feature.)`},

 {n:`Factory Method versus Abstract Factory`,tag:`Pattern`,where:`Listed repeatedly in GoF question sets.`,
  ask:`What is the difference, and where does a simple factory fit?`,
  quality:`One product versus a family of products.`,
  steps:[
   [`Simple factory`,`One method with a decision (switch or map). Not an official GoF pattern.`],
   [`Factory method`,`A base class declares a creation method, and subclasses decide what to create.`],
   [`Abstract factory`,`An interface for creating a set of related objects that must match, such as an India or global payment family.`]],
  trade:`Abstract factory adds many classes. Use it only when matching families are really needed.`,
  follow:`Give a Java example. (<code>Calendar.getInstance()</code>, <code>List.of()</code>, or Spring's <code>BeanFactory</code>.)`},

 {n:`Observer versus publish-subscribe`,tag:`Pattern`,where:`Listed among advanced pattern questions.`,
  ask:`They sound the same. What is different?`,
  quality:`Whether something sits between sender and receiver.`,
  steps:[
   [`Observer`,`The subject knows its observers and calls them directly. Same process, immediate.`],
   [`Publish-subscribe`,`A broker (Kafka, a message queue) sits in the middle. Publishers and subscribers never know each other, and can be on different machines and run at different times.`],
   [`Consequences`,`Observer is simple and fast but tightly coupled in time. Pub-sub adds loose coupling and durability, and adds delay and complexity.`]],
  trade:`Use Observer inside one service. Use pub-sub between services.`,
  follow:`How does Spring events relate? (an in-process Observer, not pub-sub, unless you forward events to a broker.)`},

 {n:`Singleton: thread safety, criticism and clusters`,tag:`Pattern`,where:`Singleton thread safety appeared in an India LLD round, and the guides ask follow-ups on lazy initialization.`,
  ask:`How do you make a singleton thread-safe, and what is wrong with it?`,
  quality:`Know four ways and the criticisms.`,
  steps:[
   [`Ways`,`Eager initialization, holder class, enum, double-checked locking with a volatile field.`],
   [`Best answers`,`Enum or holder class: simple and safe.`],
   [`Criticism`,`Hidden global state, hard to test, and only one per JVM.`],
   [`In a cluster`,`Each server has its own. For one across servers, use a distributed lock or leader election with Redis or ZooKeeper.`]],
  trade:`Prefer passing a single shared instance through dependency injection. You get the one-instance benefit without the global.`,
  follow:`Can reflection or serialization break it? (yes for ordinary classes. An enum singleton is safe against both.)`},

 {n:`Builder versus telescoping constructors`,tag:`Pattern`,where:`Asked in beginner and intermediate lists.`,
  ask:`Why use a builder, and how does it help immutability?`,
  quality:`Readability and safe construction.`,
  steps:[
   [`The problem`,`Constructors with many parameters, many optional, are hard to read and easy to call in the wrong order.`],
   [`The fix`,`Named setter-like methods that return the builder, then <code>build()</code> creates the object.`],
   [`Immutability`,`The finished object has only final fields set by the private constructor, so it cannot change after creation. Validation lives in <code>build()</code>.`]],
  trade:`More code. For two or three fields, use a constructor or a <code>record</code>.`,
  follow:`Standard builder versus fluent builder? (fluent returns <code>this</code> from every method so calls chain.)`},

 {n:`Chain of Responsibility: versus if-else and versus Decorator`,tag:`Pattern`,where:`Listed in structural and behavioural comparison questions.`,
  ask:`Why not use if-else, and how is it different from Decorator?`,
  quality:`Flexibility and what each does with the request.`,
  steps:[
   [`Versus if-else`,`A chain can be rearranged, extended and configured without editing a central function. Each handler is separate and testable.`],
   [`Versus Decorator`,`A decorator always passes on to the inner object and adds to the result. A chain handler may <b>stop</b> the request, and often only one handler does the work.`],
   [`Unhandled requests`,`Decide up front: reject with an error, or let it pass through.`]],
  trade:`Order of handlers matters, and a long chain is harder to trace. Log which handler stopped a request.`,
  follow:`Where is it used? (servlet filters, Spring Security filters, interceptors.)`},

 {n:`Template Method versus Strategy`,tag:`Pattern`,where:`Appears with the Hollywood principle in behavioural question sets.`,
  ask:`Both let part of an algorithm vary. Which do you prefer?`,
  quality:`Inheritance versus composition.`,
  steps:[
   [`Template Method`,`Uses inheritance. The parent fixes the steps, subclasses override some. Behaviour is chosen at compile time by the subclass.`],
   [`Strategy`,`Uses composition. An object is given the behaviour, and it can change at run time.`],
   [`Hollywood principle`,`"Do not call us, we will call you." The framework or parent calls your code at the right moment.`]],
  trade:`Prefer Strategy when you need run-time choice or want to avoid deep inheritance. Template Method is fine when the skeleton is stable.`,
  follow:`Example in Spring? (<code>JdbcTemplate</code> uses callbacks, which is closer to Strategy inside a template.)`},

 {n:`Which pattern would you use? (scenario round)`,tag:`Pattern`,where:`The most common form of this question in LLD rounds. Mapping drawn from LLD guides.`,
  ask:`The interviewer gives a problem and asks which pattern fits. How do you answer?`,
  quality:`State the problem first, then the pattern.`,
  steps:[
   [`Payment methods`,`Strategy for each method, with a Factory or Spring map to choose.`],
   [`Notifications on an event`,`Observer, with a Factory to create channels.`],
   [`ATM, vending machine, order lifecycle`,`State, with a service layer for the operations.`],
   [`Coffee shop add-ons`,`Decorator.`],
   [`Logging framework`,`Chain of Responsibility for level filtering, Strategy for output destinations, Decorator for async wrapping, and Singleton for the logger registry.`],
   [`Parking lot, ride sharing`,`Strategy for pricing and matching, Observer for availability and trip updates.`],
   [`Elevator`,`Strategy for dispatch, State for each elevator's mode.`],
   [`Food delivery`,`Observer for order events and Chain of Responsibility for checks. State for the order lifecycle.`],
   [`Movie booking`,`Repository for data access and a Facade for the booking flow.`],
   [`Third-party SDK wrapper`,`Adapter.`]],
  trade:`Do not stack patterns just to show off. Choose one or two, explain why, and say what you are NOT using and why.`,
  follow:`What if the interviewer says you overused patterns? (agree, then simplify: "I would start with the plain version and add the pattern when the second variation appears".)`},

 {n:`Dependency injection, IoC and service locator`,tag:`Pattern`,where:`Common in Spring-focused rounds.`,
  ask:`Explain DI, IoC and the difference from a service locator.`,
  quality:`Who creates the dependencies.`,
  steps:[
   [`Inversion of Control`,`The big idea: the framework controls the flow and object creation, and your code is called.`],
   [`Dependency injection`,`One way to achieve IoC. A class declares what it needs (usually in its constructor) and the container passes it in.`],
   [`Service locator`,`The class asks a registry for what it needs. The dependency is hidden inside the code, which makes testing harder.`],
   [`Why constructor injection`,`Dependencies are explicit and final, and the class is easy to create in a test with fakes.`]],
  trade:`DI needs a container or manual wiring. It gives easier testing and looser coupling.`,
  follow:`Field injection versus constructor injection? (constructor is preferred: required dependencies are clear and fields can be final.)`},

 {n:`Repository versus DAO, and MVC versus MVP and MVVM`,tag:`Pattern`,where:`Listed under architectural patterns in the pattern question sets.`,
  ask:`How do you explain these?`,
  quality:`Keep each to one sentence.`,
  steps:[
   [`DAO`,`Wraps database access for one table or entity: save, find, delete. Close to the database.`],
   [`Repository`,`Presents data as a collection of domain objects, in the language of the business, and may hide several sources. Spring Data repositories are this.`],
   [`MVC`,`Model holds data and rules, View shows it, Controller handles input and connects them. Spring MVC follows this.`],
   [`MVP and MVVM`,`Variants that change how the view and logic connect. In MVP a presenter updates the view. In MVVM a view model exposes data the view binds to.`]],
  trade:`In practice DAO and Repository blur. The key idea is to keep data access away from business logic.`,
  follow:`Where does business logic live in Spring MVC? (the service layer, not the controller.)`},

 {n:`Resilience patterns for microservices`,tag:`Pattern`,where:`Raised in an advanced pattern question about communication and resilience.`,
  ask:`Which patterns keep services working when others fail?`,
  quality:`Name the pattern and what it protects.`,
  steps:[
   [`API Gateway`,`One entry point that handles routing, authentication and rate limits for many services.`],
   [`Circuit breaker`,`After many failures, stop calling the failing service for a while and fail fast, so it can recover and callers do not pile up. Resilience4j in Java.`],
   [`Retry with backoff`,`Try again after growing delays. Only for safe, repeatable calls.`],
   [`Fallback`,`Return a safe default or cached answer when the call fails.`],
   [`Bulkhead`,`Keep separate thread pools for different calls so one slow dependency cannot use up all threads.`]],
  trade:`Retries can multiply load on a struggling service, so combine them with a circuit breaker and limits.`,
  follow:`See the Microservices guide document for the full version.`},

 {n:`How do you avoid overusing patterns?`,tag:`Pattern`,where:`A judgement question for experienced candidates. Guides stress that reasoning matters more than vocabulary.`,
  ask:`How do you decide when a pattern is worth it?`,
  quality:`Show judgement, not enthusiasm.`,
  steps:[
   [`Start simple`,`Write the plain version first.`],
   [`Wait for the second case`,`Add a pattern when a real variation appears, or when you can name the next one.`],
   [`Count the cost`,`Each pattern adds classes and indirection. Is the reader better off?`],
   [`Explain the why`,`"I used Strategy because pricing changes often and I did not want to edit checkout each time."`]],
  trade:`Too few patterns gives rigid code. Too many gives code nobody can follow.`,
  follow:`Give an example where you chose not to use one. (any simple case where one class was enough.)`}
 ]},
