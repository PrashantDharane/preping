/* ---------- 1 ---------- */
{id:`lesson-1`,track:`conc`,trackName:`Concurrency and JVM`,title:`Why these two topics decide senior rounds`,min:8,
 promise:`Concurrency and JVM tuning are where "10 years of Java" gets tested. A map of what is asked, and the way to think about it.`,
 blocks:[
 {t:`plain`,h:`<b>Concurrency</b> is several things happening at once and sharing data. <b>The JVM</b> is the engine that runs your code, owns your memory and cleans up after you. Interviewers for experienced roles ask about both, because production problems (slow service, out of memory, stuck threads) come from exactly here.`},
 {t:`analogy`,h:`A kitchen at lunch rush. Concurrency is many cooks sharing one stove and one fridge: who goes when, and who must wait. The JVM is the kitchen itself: how big the counter is, and when the dishwasher runs. A small counter and a slow dishwasher stall every cook.`},
 {t:`p`,h:`<h2>What the guides say gets asked</h2>`},
 {t:`cards`,items:[
   {h:`Concurrency`,b:`synchronized vs volatile vs atomic, thread pools and their settings, deadlock, ExecutorService, CompletableFuture, producer-consumer, and virtual threads.`},
   {h:`JVM memory`,b:`Heap and stack, young and old generation, metaspace, what causes OutOfMemoryError.`},
   {h:`Garbage collection`,b:`How it decides what to free, G1 versus ZGC, tuning, finding memory leaks with heap dumps.`},
   {h:`Production scenarios`,b:`"The service is slow", "CPU is at 100 percent", "we got an OOM". What do you do, step by step.`}]},
 {t:`remember`,h:`Senior interviews are <b>diagnosis stories</b>. Every lesson here ends with what you would check first when it goes wrong. That is the habit to build.`},
 {t:`p`,h:`<h2>The plan</h2>`},
 {t:`cards`,items:[
   {h:`Lesson 2`,b:`Shared data: races, synchronized, volatile, atomics.`},
   {h:`Lesson 3`,b:`Thread pools, locks, deadlock, producer-consumer.`},
   {h:`Lesson 4`,b:`JVM memory layout, class loading, the JIT.`},
   {h:`Lesson 5`,b:`Garbage collectors and how to choose.`},
   {h:`Lesson 6`,b:`Three production incidents, diagnosed step by step.`},
   {h:`Lesson 7`,b:`Twelve questions with full answers.`}]},
 {t:`check`,q:`Which is more common in production incidents: a bug in your business logic, or a thread-pool or memory setting? Why does it matter for the interview?`,a:`Settings and resource limits cause a large share of real incidents: pools too small or unbounded, heap too small, no timeouts. Interviewers know this, so they probe your configuration knowledge and your diagnosis steps, not only your syntax.`}
]},

/* ---------- 2 ---------- */
{id:`lesson-2`,track:`conc`,trackName:`Concurrency and JVM`,title:`Shared data: races, synchronized, volatile and atomics`,min:16,
 promise:`The foundation. If you can explain why <code>count++</code> is unsafe and the three ways to fix it, you can answer most basic concurrency questions.`,
 blocks:[
 {t:`plain`,h:`A <b>race condition</b> happens when two threads touch the same data, at least one writes, and the result depends on timing. The famous case is <code>count++</code>. It looks like one step but is three: read, add one, write back.`},
 {t:`diagram`,cap:`Both threads read 5, both write 6. One increment is lost.`,d:{w:420,alt:`Two threads read the same counter value and both write back the same result`,nodes:[
   {id:`t1`,t:`Thread 1`,x:10,y:8,w:90,k:`state`},
   {id:`t2`,t:`Thread 2`,x:10,y:92,w:90,k:`state`},
   {id:`ct`,t:`counter`,x:170,y:46,w:80,m:[`value = 5`]},
   {id:`nn`,t:`result`,x:290,y:30,w:120,k:`note`,m:[`both read 5`,`both write 6`,`expected 7, got 6`]}],
  edges:[{a:`t1`,b:`ct`,l:`read 5`},{a:`t2`,b:`ct`,l:`read 5`},{a:`ct`,b:`nn`,k:`uses`}]}},
 {t:`p`,h:`<h2>Three tools, three different jobs</h2>`},
 {t:`cards`,items:[
   {h:`synchronized`,pic:`Mutual exclusion plus visibility`,b:`Only one thread at a time may enter. Also makes the changes visible to the next thread that takes the same lock.`,small:`Use for compound actions on shared state.`},
   {h:`volatile`,pic:`Visibility and ordering only`,b:`A write is seen by all threads immediately, and the compiler cannot reorder around it. But it does <b>not</b> make <code>count++</code> atomic.`,small:`Use for a flag read by many threads, like <code>running</code>.`},
   {h:`Atomic classes`,pic:`Lock-free, single variable`,b:`<code>AtomicInteger</code>, <code>AtomicReference</code>. Use hardware compare-and-swap (CAS): "set to 6 only if it is still 5".`,small:`Use for counters and simple state.`}]},
 {t:`code`,bad:true,cap:`Bad: looks fine, loses updates`,code:`class Counter {
    private int count = 0;
    void hit() { count++; }          // read, add, write: three steps, not atomic
    int get() { return count; }      // may not even see the latest value
}`},
 {t:`code`,good:true,cap:`Good: three correct versions`,code:`// 1. synchronized
synchronized void hit() { count++; }

// 2. atomic: simplest and fastest for one counter
private final AtomicInteger count = new AtomicInteger();
void hit() { count.incrementAndGet(); }

// 3. LongAdder: best when MANY threads update one counter (spreads the contention)
private final LongAdder count = new LongAdder();
void hit() { count.increment(); }`},
 {t:`code`,use:true,cap:`How it is used: a stop flag and a rate counter in a service`,code:`class Poller implements Runnable {
    private volatile boolean running = true;           // written by one thread, read by another
    private final LongAdder polled = new LongAdder();

    public void run() {
        while (running) { fetchBatch(); polled.increment(); }
    }
    public void stop() { running = false; }            // the loop sees this promptly
    public long polledSoFar() { return polled.sum(); } // exposed as a metric
}`},
 {t:`analogy`,h:`Two clerks update the same ledger. Both read "100", both add 1 in their heads, both write "101". One update is lost. That is a race condition: the three steps (read, add, write) are not one unbreakable step. <code>synchronized</code> is a rule that only one clerk may use the ledger at a time. An <code>AtomicInteger</code> is a ledger machine that adds 1 in a single unbreakable step.`},
 {t:`code`,cap:`Java: two threads, 2 million increments each`,code:`static int plain = 0;
static final AtomicInteger safe = new AtomicInteger();
static void d_race() throws Exception {
    Runnable job = () -> { for (int i = 0; i < 2_000_000; i++) { plain++; safe.incrementAndGet(); } };
    Thread t1 = new Thread(job), t2 = new Thread(job);
    t1.start(); t2.start(); t1.join(); t2.join();
    System.out.println("expected       : 4000000");
    System.out.println("plain int      : " + plain);
    System.out.println("AtomicInteger  : " + safe.get());
}`},
 {t:`code`,use:true,cap:`What it prints`,code:`expected       : 4000000
plain int      : 3041722
AtomicInteger  : 4000000
(your plain int will be a different number every run)`},
 {t:`plain`,h:`<code>plain++</code> looks like one step but it is read, add, write. Two threads interleave and some updates vanish. <code>AtomicInteger</code> never loses any.`},
 {t:`analogy`,h:`<code>volatile</code> is a notice board in the office. If one person changes a notice, everyone sees the new one at once. Without <code>volatile</code>, each person may be reading a private notebook copy that is out of date. But a notice board does not stop two people from editing at once. For that you need <code>synchronized</code> or an atomic class.`},
 {t:`p`,h:`<h2>The Java Memory Model in one idea: happens-before</h2>`},
 {t:`plain`,h:`Each thread may keep its own cached copy of variables. The memory model defines when one thread's write is guaranteed to be seen by another. That guarantee is called <b>happens-before</b>. Unlocking a monitor happens-before the next lock of it. A volatile write happens-before every later read of it. Starting a thread happens-before its first action.`},
 {t:`mistake`,h:`Saying "volatile makes it thread-safe". It does not give atomicity. Also: double-checked locking for a singleton only works if the field is <code>volatile</code>. Without it, another thread can see a half-built object.`},
 {t:`code`,cap:`Compare-and-swap, in plain words`,code:`// What incrementAndGet does internally
int old, next;
do {
    old  = value.get();       // read current
    next = old + 1;
} while (!value.compareAndSet(old, next));   // write only if nobody changed it; else retry`},
 {t:`check`,q:`Two threads each call <code>list.add(x)</code> on a shared <code>ArrayList</code>, and sometimes elements go missing or an exception appears. Name two fixes.`,a:`Use a thread-safe collection such as <code>CopyOnWriteArrayList</code> (many reads, few writes) or wrap with <code>Collections.synchronizedList</code>. Or better, avoid sharing: give each thread its own list and merge later. A plain ArrayList has no protection for its size and internal array.`}
]},

{id:`lesson-3`,track:`conc`,trackName:`Concurrency and JVM`,title:`Thread pools, locks, deadlock and producer-consumer`,min:18,
 promise:`How to run work on threads without creating chaos. The thread pool settings are asked almost every time.`,
 blocks:[
 {t:`plain`,h:`Creating a thread per task is expensive and unbounded. A <b>thread pool</b> keeps a fixed set of workers and a queue of tasks. You hand over work and the pool decides who runs it and when.`},
 {t:`analogy`,h:`A bank with 4 counters (core threads) and a waiting line (the queue). If the line is full, the manager opens extra counters (up to the maximum). If even that is not enough, the guard turns people away (the rejection policy).`},
 {t:`diagram`,cap:`The order matters: core threads first, then the queue, then extra threads, then rejection.`,d:{w:420,alt:`New task flows through core threads, queue, extra threads, then rejection`,nodes:[
   {id:`a`,t:`New task`,x:6,y:50,w:70,k:`state`},
   {id:`b`,t:`Core threads`,s:`free?`,x:96,y:34,w:90},
   {id:`c`,t:`Queue`,s:`has space?`,x:206,y:34,w:90},
   {id:`d`,t:`Extra threads`,s:`up to max?`,x:316,y:34,w:98},
   {id:`e`,t:`Rejected`,x:316,y:110,w:98,k:`note`,m:[`policy runs`]}],
  edges:[{a:`a`,b:`b`},{a:`b`,b:`c`,l:`no`},{a:`c`,b:`d`,l:`full`},{a:`d`,b:`e`,l:`full`}]}},
 {t:`code`,cap:`The pool you should create by hand`,code:`ThreadPoolExecutor pool = new ThreadPoolExecutor(
    8,                                   // corePoolSize: always kept
    16,                                  // maximumPoolSize: only used when the queue is full
    60, TimeUnit.SECONDS,                // idle extra threads die after this
    new ArrayBlockingQueue<>(200),       // BOUNDED queue: protects memory
    new ThreadFactoryBuilder().setNameFormat("orders-%d").build(),   // name threads (Guava)
    new ThreadPoolExecutor.CallerRunsPolicy());   // when full, the caller runs it: natural back-pressure`},
 {t:`code`,use:true,cap:`How it is used: parallel calls with a timeout`,code:`@Service
class DashboardService {
    private final ExecutorService pool = Executors.newFixedThreadPool(8);

    Dashboard load(long userId) throws Exception {
        Future<Profile> p = pool.submit(() -> profiles.get(userId));
        Future<List<Order>> o = pool.submit(() -> orders.recent(userId));
        return new Dashboard(p.get(2, TimeUnit.SECONDS), o.get(2, TimeUnit.SECONDS));
    }
    @PreDestroy void close() { pool.shutdown(); }   // always shut pools down
}`},
 {t:`cards`,items:[
   {h:`Executors.newFixedThreadPool`,b:`Uses an <b>unbounded</b> queue. Under load the queue grows until memory runs out. The maximum size is never used.`},
   {h:`Executors.newCachedThreadPool`,b:`Unbounded <b>threads</b>. A burst can create thousands and exhaust the machine.`},
   {h:`Rejection policies`,b:`<code>AbortPolicy</code> (default, throws), <code>CallerRunsPolicy</code>, <code>DiscardPolicy</code>, <code>DiscardOldestPolicy</code>.`}]},
 {t:`analogy`,h:`Look at the pool like a restaurant. There are 2 regular tables (core threads). When both are busy, new guests wait in a small waiting area (the queue, 2 seats). When the waiting area is also full, the manager opens 2 extra tables (up to the maximum of 4). When even those are busy and the waiting area is full, the next guest is turned away at the door (rejection). The output shows this happening step by step.`},
 {t:`code`,cap:`Java: a pool with 2 core threads, max 4, and a queue of 2`,code:`static void d_pool() throws Exception {
    CountDownLatch release = new CountDownLatch(1);
    ThreadPoolExecutor pool = new ThreadPoolExecutor(
            2, 4, 30, TimeUnit.SECONDS,                  // 2 core counters, up to 4 in total
            new ArrayBlockingQueue<>(2),                 // a waiting line of only 2
            new ThreadPoolExecutor.AbortPolicy());       // when everything is full: say no
    for (int task = 1; task <= 7; task++) {
        try {
            pool.execute(() -> { try { release.await(); } catch (InterruptedException ignored) { } });
            System.out.println("task " + task + " accepted   workers=" + pool.getPoolSize() + " waiting=" + pool.getQueue().size());
        } catch (RejectedExecutionException e) {
            System.out.println("task " + task + " REJECTED  workers=" + pool.getPoolSize() + " waiting=" + pool.getQueue().size());
        }
    }
    release.countDown();
    pool.shutdown();
}`},
 {t:`code`,use:true,cap:`What it prints`,code:`task 1 accepted   workers=1 waiting=0
task 2 accepted   workers=2 waiting=0
task 3 accepted   workers=2 waiting=1
task 4 accepted   workers=2 waiting=2
task 5 accepted   workers=3 waiting=2
task 6 accepted   workers=4 waiting=2
task 7 REJECTED  workers=4 waiting=2`},
 {t:`steps`,items:[[`Tasks 1 and 2.`,` They get the two core workers.`],[`Tasks 3 and 4.`,` Both core workers are busy, so they wait in the queue.`],[`Tasks 5 and 6.`,` The queue is full, so the pool starts extra workers, up to the maximum of 4.`],[`Task 7.`,` Everything is full, so the rejection policy runs. Here it throws an error.`]]},
 {t:`remember`,h:`<b>The surprise most people miss:</b> extra threads above the core size are created only after the <b>queue is full</b>. With an unbounded queue, the pool never grows past the core size at all.`},
 {t:`p`,h:`<h2>How big should the pool be?</h2>`},
 {t:`two`,a:{h:`CPU-bound work`,b:`Threads about equal to the number of cores, or cores plus one. More only adds switching cost.`},b:{h:`I/O-bound work`,b:`Threads = cores x (1 + wait time / compute time). If a task waits 90 ms and computes 10 ms, that is cores x 10. Then measure and adjust.`}},
 {t:`p`,h:`<h2>Locks beyond synchronized</h2>`},
 {t:`code`,cap:`ReentrantLock gives control that synchronized cannot`,code:`private final ReentrantLock lock = new ReentrantLock();

boolean transfer(Account a, Account b, long amt) throws InterruptedException {
    if (!lock.tryLock(1, TimeUnit.SECONDS)) return false;   // give up instead of waiting forever
    try {
        // ... move the money
        return true;
    } finally {
        lock.unlock();        // always in finally
    }
}
// Also available: ReadWriteLock (many readers, one writer) and StampedLock (optimistic reads)`},
 {t:`p`,h:`<h2>Deadlock: the classic</h2>`},
 {t:`plain`,h:`Thread A holds lock 1 and waits for lock 2. Thread B holds lock 2 and waits for lock 1. Nobody moves, forever. It needs four things together: mutual exclusion, hold-and-wait, no preemption and a circular wait. Break any one and it cannot happen.`},
 {t:`code`,bad:true,cap:`Bad: opposite lock order`,code:`void transfer(Account from, Account to, long amt) {
    synchronized (from) {
        synchronized (to) {          // another thread transferring to -> from locks them the other way
            from.debit(amt); to.credit(amt);
        }
    }
}`},
 {t:`code`,good:true,cap:`Good: a fixed order for every thread`,code:`void transfer(Account from, Account to, long amt) {
    Account first  = from.id() < to.id() ? from : to;     // always lock the lower id first
    Account second = first == from ? to : from;
    synchronized (first) { synchronized (second) {
        from.debit(amt); to.credit(amt);
    }}
}`},
 {t:`analogy`,h:`A deadlock is two people on a narrow lane, each in a car facing the other, and neither will reverse. Or two diners each holding one chopstick and waiting for the other's. Thread A holds lock 1 and wants lock 2. Thread B holds lock 2 and wants lock 1. Nobody moves, ever. The program does not crash, it just hangs, which is why it is hard to notice.`},
 {t:`code`,cap:`Java: create a deadlock, then detect it the way jstack does`,code:`static void d_deadlock() throws Exception {
    Object lock1 = new Object(), lock2 = new Object();
    Thread a = new Thread(() -> { synchronized (lock1) { pause(200); synchronized (lock2) { } } }, "thread-A");
    Thread b = new Thread(() -> { synchronized (lock2) { pause(200); synchronized (lock1) { } } }, "thread-B");
    a.setDaemon(true); b.setDaemon(true);                // so the JVM can still exit
    a.start(); b.start();
    Thread.sleep(800);

    long[] ids = ManagementFactory.getThreadMXBean().findDeadlockedThreads();   // what jstack also reports
    System.out.println("deadlocked threads found: " + (ids == null ? 0 : ids.length));
    if (ids != null) for (ThreadInfo info : ManagementFactory.getThreadMXBean().getThreadInfo(ids))
        System.out.println("  " + info.getThreadName() + " is " + info.getThreadState() + ", waiting for a lock held by " + info.getLockOwnerName());
}
static void pause(long ms) { try { Thread.sleep(ms); } catch (InterruptedException ignored) { } }`},
 {t:`code`,use:true,cap:`What it prints`,code:`deadlocked threads found: 2
  thread-A is BLOCKED, waiting for a lock held by thread-B
  thread-B is BLOCKED, waiting for a lock held by thread-A`},
 {t:`plain`,h:`The same detector is what <code>jstack</code> and thread-dump tools use. When a production service hangs with low CPU, take a thread dump and look for the line "Found one Java-level deadlock". The fix, as the lesson above shows, is to always take locks in the same order.`},
 {t:`p`,h:`<h2>Producer-consumer with a BlockingQueue</h2>`},
 {t:`code`,use:true,cap:`How it is used: orders in, workers out, no manual wait/notify`,code:`BlockingQueue<Order> queue = new ArrayBlockingQueue<>(100);   // bounded: producers slow down when full

// Producer (for example a web controller)
queue.put(order);              // blocks when full

// Consumer (a few worker threads)
while (true) {
    Order o = queue.take();    // blocks when empty
    process(o);
}`},
 {t:`mistake`,h:`Doing slow work or a database call while holding a lock, or swallowing <code>InterruptedException</code>. When you catch it, either rethrow it or call <code>Thread.currentThread().interrupt()</code> so the interruption is not lost.`},
 {t:`check`,q:`A pool has core 4, max 10 and a <code>LinkedBlockingQueue</code> with no capacity. Under heavy load only 4 threads ever run. Why?`,a:`With an unbounded queue the queue never reports "full", so the pool never creates threads beyond core. The extra threads only appear when the queue is full. Use a bounded queue, and choose a rejection policy for overflow.`}
]},

{id:`lesson-4`,track:`conc`,trackName:`Concurrency and JVM`,title:`JVM memory: heap, stack, metaspace and the JIT`,min:14,
 promise:`A picture of where everything lives. With it, every OutOfMemoryError message stops being a mystery.`,
 blocks:[
 {t:`plain`,h:`When your program runs, the JVM carves memory into areas. Objects live in the <b>heap</b>. Each thread has its own <b>stack</b> for method calls and local variables. Class definitions live in <b>metaspace</b>. Knowing which area is full tells you which fix to try.`},
 {t:`diagram`,cap:`New objects start in Eden. Survivors are copied between survivor spaces, and old survivors are promoted to the old generation.`,d:{w:420,alt:`JVM memory areas: heap with young and old generation, metaspace and thread stacks`,nodes:[
   {id:`h`,t:`Heap`,s:`-Xms / -Xmx`,x:6,y:6,w:230,m:[`Young: Eden + 2 survivors`,`  new objects, most die here`,`Old: long-lived objects`,`  promoted after a few GCs`]},
   {id:`m`,t:`Metaspace`,s:`native memory`,x:260,y:6,w:150,m:[`class metadata`,`grows as needed`]},
   {id:`s`,t:`Thread stacks`,s:`-Xss, one per thread`,x:6,y:128,w:230,m:[`frames: locals, call chain`,`StackOverflowError when too deep`]},
   {id:`d`,t:`Direct memory`,x:260,y:128,w:150,m:[`NIO buffers, Netty`,`outside the heap`]}],
  edges:[]}},
 {t:`cards`,items:[
   {h:`Heap`,b:`All objects and arrays. Shared by all threads. Managed by the garbage collector. Sized with <code>-Xms</code> (start) and <code>-Xmx</code> (max).`},
   {h:`Stack`,b:`One per thread. Holds method frames, local variables and references. Freed automatically when a method returns. Deep recursion causes <code>StackOverflowError</code>.`},
   {h:`Metaspace`,b:`Class metadata. It replaced PermGen in Java 8 and lives in native memory, so it grows by default. Cap with <code>-XX:MaxMetaspaceSize</code>.`},
   {h:`References`,b:`The variable holds a reference on the stack. The object it points to is on the heap. Objects are collected when no live reference reaches them.`}]},
 {t:`analogy`,h:`Think of a desk and a warehouse. The <b>stack</b> is your desk: small, tidy, and each task gets its own. You keep only what you are working on right now. The <b>heap</b> is the warehouse: large, shared by everyone, and it holds the actual goods (objects). On your desk you keep only a slip of paper with the shelf number. A <code>StackOverflowError</code> means your desk is full of slips because a method kept calling itself. An <code>OutOfMemoryError</code> usually means the warehouse is full.`},
 {t:`code`,cap:`Java: a full desk versus a full warehouse`,code:`static int depth = 0;
static void recurse() { depth++; recurse(); }
static void d_stack() {
    try { recurse(); }
    catch (StackOverflowError e) {
        System.out.println("the stack ran out after thousands of calls: " + (depth > 1000));
    }
    // The heap is a different area: a big list of objects fills the heap, not the stack.
    List<byte[]> pile = new ArrayList<>();
    pile.add(new byte[1024 * 1024]);
    System.out.println("1 MB object lives on the heap, list holds only its address: " + pile.size());
}`},
 {t:`code`,use:true,cap:`What it prints`,code:`the stack ran out after thousands of calls: true
1 MB object lives on the heap, list holds only its address: 1`},
 {t:`p`,h:`<h2>The OutOfMemoryError family: what each message means</h2>`},
 {t:`cards`,items:[
   {h:`Java heap space`,b:`The heap is full of live objects. Either a leak, or the heap is simply too small for the data.`},
   {h:`GC overhead limit exceeded`,b:`The JVM spends nearly all its time collecting and recovers almost nothing. Same family as above.`},
   {h:`Metaspace`,b:`Too many classes loaded, often from a classloader leak, or heavy dynamic proxies and redeploys.`},
   {h:`unable to create native thread`,b:`The OS refused another thread. Too many threads, or not enough native memory. Not a heap problem.`},
   {h:`Direct buffer memory`,b:`Off-heap buffers are exhausted. Seen with NIO and Netty.`}]},
 {t:`p`,h:`<h2>Class loading and the JIT, briefly</h2>`},
 {t:`steps`,items:[
   [`Load.`,` A class loader reads the <code>.class</code> file. Loaders form a parent chain (bootstrap, platform, application) and ask the parent first. That is <b>parent delegation</b>, and it stops you from replacing <code>java.lang.String</code>.`],
   [`Link.`,` Verify the bytecode, prepare static fields, resolve references.`],
   [`Initialise.`,` Run static initialisers, once, the first time the class is used.`],
   [`Interpret then compile.`,` The JVM first interprets bytecode. Hot methods are compiled to machine code by the <b>JIT</b> (C1 and C2 compilers). That is why Java is slow for the first seconds, and why benchmarks need a warm-up.`]]},
 {t:`code`,use:true,cap:`How it is used: the flags you will actually put in a container`,code:`# Dockerfile ENTRYPOINT for a Spring Boot service on Java 17
java -XX:MaxRAMPercentage=75 \\
     -XX:+UseG1GC \\
     -XX:+HeapDumpOnOutOfMemoryError \\
     -XX:HeapDumpPath=/dumps \\
     -Xlog:gc*:file=/logs/gc.log:time,uptime \\
     -jar app.jar
# MaxRAMPercentage: size the heap from the container limit instead of the host machine.
# HeapDumpOnOutOfMemoryError: leaves a file you can analyse after the crash.`},
 {t:`mistake`,h:`Setting <code>-Xmx</code> equal to the container memory limit. The JVM also needs room for metaspace, thread stacks, direct memory and the code cache. A heap at 100 percent of the limit gets the process killed by the container runtime. About 70 to 75 percent is a common start.`},
 {t:`check`,q:`Your service shows 2 GB heap free but throws "unable to create native thread". What is wrong?`,a:`This is not a heap shortage. The process could not get another OS thread, usually because far too many threads were created (an unbounded pool or a thread leak), or the container or OS thread limit was hit. Check the thread count, find who creates threads with a thread dump, and bound the pools.`}
]},

{id:`lesson-5`,track:`conc`,trackName:`Concurrency and JVM`,title:`Garbage collection: how it works and which collector to pick`,min:16,
 promise:`What the collector does, the vocabulary of pauses, and a clear way to choose between G1 and ZGC.`,
 blocks:[
 {t:`plain`,h:`The garbage collector finds objects that nothing can reach any more and frees their memory. It starts from <b>GC roots</b> (live thread stacks, static fields) and follows references. Anything it cannot reach is garbage. This is called <b>reachability</b>, and it is why circular references are not a problem in Java.`},
 {t:`analogy`,h:`Imagine a big party hall. Guests who are still talking to someone connected to the host stay. Anyone standing alone with no connection to the main group gets politely shown out and their seat is cleared.`},
 {t:`analogy`,h:`Garbage collection decides what to throw away by asking one question: "can anyone still reach this?". Imagine a contact list. Starting from yourself, you can reach friends, and friends of friends. A person nobody in the network can reach is not part of your world, and their memory can be freed. The starting points are called GC roots: running threads, static fields and local variables.`},
 {t:`code`,cap:`Java: a strong link keeps an object alive, a weak link does not`,code:`static void d_ref() {
    Object strong = new Object();
    WeakReference<Object> weak = new WeakReference<>(new Object());   // only a weak link to it
    WeakReference<Object> alsoWeak = new WeakReference<>(strong);     // this one is also held strongly
    System.gc();                                                      // a request, not a command
    System.out.println("object with only a weak link survived? " + (weak.get() != null));
    System.out.println("object with a strong link survived?    " + (alsoWeak.get() != null));
}`},
 {t:`code`,use:true,cap:`What it prints`,code:`object with only a weak link survived? false
object with a strong link survived?    true`},
 {t:`plain`,h:`A normal variable is a <b>strong</b> link, which keeps the object alive. A <code>WeakReference</code> is like a sticky note with a name on it: it points at the object but does not stop the collector from removing it. Caches sometimes use weak links so they never hold memory the app would otherwise free. <code>System.gc()</code> is only a request, so never rely on it in real code. It is used here only to make the idea visible.`},
 {t:`p`,h:`<h2>Why the heap has generations</h2>`},
 {t:`plain`,h:`Studies of programs show that <b>most objects die young</b>: request objects, temporary strings. So the heap is split. A <b>minor GC</b> cleans only the young generation. It is quick, because most of it is dead. Objects that survive several rounds move to the old generation, which is cleaned rarely by a <b>major</b> or <b>mixed</b> collection.`},
 {t:`p`,h:`<h2>The collectors</h2>`},
 {t:`cards`,items:[
   {h:`Serial`,pic:`Tiny and single-threaded`,b:`For very small heaps or single-core containers.`},
   {h:`Parallel`,pic:`Throughput first`,b:`Many threads collect while the app is paused. Default up to Java 8. Good for batch jobs where long pauses are fine.`},
   {h:`G1`,pic:`The default since Java 9`,b:`Heap is split into many regions. It collects the regions with the most garbage first and aims for a pause target (<code>-XX:MaxGCPauseMillis</code>, default 200 ms). A good all-round choice.`},
   {h:`ZGC`,pic:`Very short pauses`,b:`Does nearly all work concurrently with the app. Pauses stay under a few milliseconds even for huge heaps. Production-ready since 15, and generational in Java 21 (<code>-XX:+UseZGC -XX:+ZGenerational</code>).`},
   {h:`Shenandoah`,pic:`Another low-pause one`,b:`Similar goals to ZGC, available in OpenJDK builds.`}]},
 {t:`remember`,h:`The choice is a triangle: <b>throughput</b> (total work done), <b>latency</b> (pause length) and <b>footprint</b> (memory used). You cannot maximise all three. Batch jobs pick throughput. User-facing APIs pick latency.`},
 {t:`p`,h:`<h2>Choosing, in plain steps</h2>`},
 {t:`steps`,items:[
   [`Start with the default.`,` G1 on modern Java. Do not tune blindly.`],
   [`Measure first.`,` Turn on GC logs. Look at pause times, how often GC runs and how much is freed.`],
   [`If pauses hurt users.`,` Try ZGC. It trades a little throughput and memory for tiny pauses.`],
   [`If it is a batch job.`,` Parallel may finish sooner.`],
   [`If memory keeps rising.`,` That is a leak, not a tuning problem. Take a heap dump.`]]},
 {t:`code`,use:true,cap:`How it is used: reading a GC log line`,code:`[2.431s][info][gc] GC(12) Pause Young (Normal) (G1 Evacuation Pause) 612M->140M(1024M) 8.3ms

# 612M->140M   heap used before and after: 472 MB freed. Healthy.
# (1024M)      current heap capacity
# 8.3ms        stop-the-world pause. Fine for an API.

# Warning signs:
#  - "Pause Full" lines: a stop-the-world full collection. Investigate.
#  - heap AFTER collection climbs higher each time: leak.
#  - GC taking more than ~5-10 percent of the time: heap too small or too much allocation.`},
 {t:`p`,h:`<h2>Finding a memory leak</h2>`},
 {t:`steps`,items:[
   [`See the pattern.`,` Heap after each full GC keeps rising: a leak. A saw-tooth that returns to the same base: healthy.`],
   [`Take a heap dump.`,` <code>jcmd &lt;pid&gt; GC.heap_dump /tmp/heap.hprof</code>, or let <code>-XX:+HeapDumpOnOutOfMemoryError</code> do it.`],
   [`Open it in Eclipse MAT or VisualVM.`,` Look at the dominator tree: which objects hold the most memory, and what keeps them alive (path to GC roots).`],
   [`Find the owner.`,` Typically a static map, a cache without eviction, a listener never removed, or a ThreadLocal in a pool thread.`],
   [`Fix and verify.`,` Add a size limit or eviction, remove the reference, then watch the heap over time.`]]},
 {t:`code`,bad:true,cap:`A leak that looks harmless`,code:`class SessionRegistry {
    private static final Map<String, UserSession> ACTIVE = new HashMap<>();   // lives forever
    static void login(String id, UserSession s) { ACTIVE.put(id, s); }
    // no logout, no expiry: every login stays in memory
}
// Fix: a bounded cache with expiry, for example Caffeine
//   Cache<String, UserSession> c = Caffeine.newBuilder().maximumSize(10_000)
//                                          .expireAfterAccess(30, TimeUnit.MINUTES).build();`},
 {t:`mistake`,h:`Calling <code>System.gc()</code> to "fix" memory. It only requests a collection, usually a full and slow one, and it hides the real problem. Another mistake: believing Java cannot leak. It can, whenever something still holds a reference to data you no longer need.`},
 {t:`check`,q:`After each GC the heap used goes 300 MB, 380 MB, 460 MB, 540 MB. Is raising <code>-Xmx</code> a fix?`,a:`No, it only delays the crash. The live data is growing, which means something keeps references to objects that should be gone. Take a heap dump and find what holds them. Raise the heap only after you have confirmed the data is genuinely needed.`}
]},

{id:`lesson-6`,track:`conc`,trackName:`Concurrency and JVM`,title:`Three production incidents, diagnosed step by step`,min:15,
 promise:`Interviewers love "the service is slow, what do you do?". Here are three with a repeatable method. Each uses tools you can name.`,
 blocks:[
 {t:`remember`,h:`The method is always the same: <b>look before you change</b>. Check the symptom, take evidence (thread dump, heap dump, GC log, metrics), form a guess, test the guess, and only then change something. Interviewers are listening for this order.`},
 {t:`analogy`,h:`Diagnosing a production problem is like a doctor's visit. First, the symptoms ("the service is slow"). Then the vital signs (CPU, memory, thread count, GC pauses). Then the tests (a thread dump, a heap dump). Only then a diagnosis, and only then treatment. Beginners jump to treatment (restart the pod) and lose the evidence. Take the dumps <b>before</b> you restart anything.`},
 {t:`two`,a:{h:`Symptom`,b:`High CPU, low CPU but hanging, memory rising, slow after some hours.`},b:{h:`Test to run`,b:`A few thread dumps, a heap dump, the GC log, a look at the pool and connection metrics.`}},
 {t:`p`,h:`<h2>Incident 1: CPU stuck at 100 percent</h2>`},
 {t:`steps`,items:[
   [`Confirm.`,` Is it your Java process? <code>top -H -p &lt;pid&gt;</code> shows CPU per thread.`],
   [`Match the thread.`,` Convert the busiest thread id to hex (<code>printf "%x" 12345</code>).`],
   [`Thread dump.`,` <code>jstack &lt;pid&gt;</code> or <code>jcmd &lt;pid&gt; Thread.print</code>. Find the thread whose <code>nid</code> equals that hex. Read its stack.`],
   [`Common causes.`,` An infinite or very long loop, a regex with catastrophic backtracking, heavy JSON parsing in a hot path, or the GC itself eating CPU (check GC threads).`],
   [`Fix and prevent.`,` Fix the code, add limits and timeouts, and alert on CPU per pod.`]]},
 {t:`p`,h:`<h2>Incident 2: OutOfMemoryError in production</h2>`},
 {t:`steps`,items:[
   [`Read the message.`,` Heap space, metaspace, native thread and direct memory each point to a different area (lesson 4).`],
   [`Get the evidence.`,` The heap dump from <code>HeapDumpOnOutOfMemoryError</code>. If it was not enabled, enable it now.`],
   [`Analyse.`,` Open in Eclipse MAT. The leak suspects report and dominator tree show who holds the memory.`],
   [`Check recent changes.`,` A new cache, a query that now loads a million rows, a missing pagination.`],
   [`Fix.`,` Stream or page the data, bound caches, then retest under load. Raise memory only as a last step.`]]},
 {t:`p`,h:`<h2>Incident 3: the service hangs but CPU is low</h2>`},
 {t:`plain`,h:`Low CPU and no progress usually means threads are <b>waiting</b>: for a lock, a database connection, a downstream call with no timeout, or a full pool.`},
 {t:`steps`,items:[
   [`Take two or three thread dumps`,` about 10 seconds apart. One dump is a snapshot. Several show who is truly stuck.`],
   [`Look for deadlock.`,` <code>jstack</code> prints "Found one Java-level deadlock" and names the locks and threads.`],
   [`Look at the states.`,` Many threads <code>BLOCKED</code> on the same lock: contention. Many <code>WAITING</code> in <code>HikariPool.getConnection</code>: the database pool is exhausted. Many in a socket read: a downstream call without a timeout.`],
   [`Check the pools.`,` Tomcat threads, HikariCP active versus max, your own executors' queue sizes.`],
   [`Fix.`,` Add timeouts everywhere, fix lock order, size pools to match, and add circuit breakers.`]]},
 {t:`code`,use:true,cap:`How it is used: the commands in order`,code:`jps -l                                   # find the Java process id
top -H -p 4821                           # busiest threads
jstack 4821 > dump1.txt                  # thread dump (repeat a few times)
jcmd 4821 GC.heap_info                   # quick heap summary
jcmd 4821 GC.heap_dump /tmp/heap.hprof   # full heap dump (pauses the app briefly)
jcmd 4821 JFR.start duration=60s filename=/tmp/run.jfr   # Flight Recorder: low-overhead profile`},
 {t:`cards`,items:[
   {h:`In Kubernetes`,b:`Use <code>kubectl exec</code> into the pod to run jcmd. Make sure the image has a JDK or use an ephemeral debug container.`},
   {h:`Metrics to watch`,b:`Heap used, GC pause time, thread count, pool queue sizes, DB pool active connections, request latency percentiles (p95, p99).`}]},
 {t:`mistake`,h:`Restarting the service first and investigating later. A restart destroys the evidence. If you must restart to restore service, capture a thread dump and heap info first, or keep one pod out of rotation for study.`},
 {t:`check`,q:`Thread dumps show 190 of 200 Tomcat threads waiting inside <code>HikariPool.getConnection</code>. What do you suspect, and what do you check?`,a:`The database connection pool is exhausted. Check for connections held too long: slow queries, a transaction that wraps a remote call, or connections not returned. Look at Hikari metrics (active, pending), the slowest queries, and the transaction boundaries. Raising the pool size without fixing the cause usually just moves the pressure to the database.`}
]},

{id:`lesson-7`,track:`conc`,trackName:`Concurrency and JVM`,title:`Concurrency and JVM questions with full answers`,min:45,
 promise:`Twelve questions as they are asked. Try each aloud, then open the walk-through.`,
 blocks:[
 {t:`qbank`,items:[
 {n:`synchronized vs volatile vs Atomic`,tag:`Concurrency`,where:`The most repeated concurrency question in multithreading interview guides`,
  ask:`What is the difference between synchronized, volatile and atomic variables? When would you use each?`,
  quality:`Separate visibility from atomicity and say what each guarantees.`,
  steps:[[`volatile.`,` Visibility and ordering for one variable. No atomicity for compound actions.`],[`synchronized.`,` Mutual exclusion plus visibility. Good for multi-step updates, but threads block.`],[`Atomic classes.`,` Lock-free atomic updates of one variable using CAS. Best for counters and flags.`],[`Choose.`,` A shared stop flag: volatile. A counter: AtomicInteger or LongAdder. Updating two fields consistently: synchronized or a lock.`]],
  trade:`Locks are simple and general but can block and deadlock. CAS never blocks but retries under contention.`,
  follow:`What is happens-before? Why does double-checked locking need volatile? What is the ABA problem?`},
 {n:`How does a ThreadPoolExecutor work?`,tag:`Concurrency`,where:`Standard in service and product company rounds`,
  ask:`Explain core size, max size and queue. What happens when a task is submitted? How do you size a pool?`,
  quality:`The exact order (core, queue, max, reject) and why unbounded queues are dangerous.`,
  steps:[[`Order.`,` Fewer than core threads: start a new thread. Otherwise queue it. If the queue is full and threads are below max: start another. Else reject.`],[`Queue effect.`,` An unbounded queue means max is never used and memory can run out.`],[`Rejection.`,` Abort, caller-runs, discard, discard-oldest, or your own handler.`],[`Sizing.`,` CPU-bound: about the number of cores. I/O-bound: cores x (1 + wait/compute). Then load test.`],[`Shutdown.`,` <code>shutdown()</code> lets queued tasks finish. <code>shutdownNow()</code> interrupts.`]],
  trade:`Large pools increase context switching and downstream pressure. Small pools increase latency.`,
  follow:`Why is Executors.newFixedThreadPool discouraged? How do you monitor a pool? What does CallerRunsPolicy do for back-pressure?`},
 {n:`Deadlock: cause, detection, prevention`,tag:`Concurrency`,where:`A classic, often with a coding component`,
  ask:`What is a deadlock? Write one, then show how to prevent and detect it.`,
  quality:`Name the four conditions and a concrete prevention.`,
  steps:[[`Definition.`,` Threads wait on each other's locks in a cycle, forever.`],[`Four conditions.`,` Mutual exclusion, hold and wait, no preemption, circular wait.`],[`Prevent.`,` Acquire locks in a global order. Use <code>tryLock</code> with a timeout. Keep critical sections small. Avoid calling unknown code while holding a lock.`],[`Detect.`,` <code>jstack</code> or <code>jcmd Thread.print</code> reports Java-level deadlocks. <code>ThreadMXBean.findDeadlockedThreads()</code> from code.`]],
  code:{cap:`Detecting deadlocks from inside the app`,code:`ThreadMXBean bean = ManagementFactory.getThreadMXBean();
long[] ids = bean.findDeadlockedThreads();      // null if none
if (ids != null) {
    for (ThreadInfo info : bean.getThreadInfo(ids)) {
        log.error("Deadlocked: {} waiting for {} held by {}",
                  info.getThreadName(), info.getLockName(), info.getLockOwnerName());
    }
}`,use:`// Run it on a schedule (every minute) and raise an alert if it ever finds anything.
// Actuator's thread dump endpoint (/actuator/threaddump) gives the same evidence on demand.`},
  trade:`Lock ordering is cheap but needs discipline. Timeouts avoid hanging but you must handle the failure path.`,
  follow:`What is livelock? What is starvation? Can a database deadlock too? (yes, and the DB aborts one transaction)`},
 {n:`Why can't you always use parallelism? Amdahl and cost`,tag:`Concurrency`,where:`Appears in performance discussions for senior roles`,
  ask:`More threads should mean faster, right? Why not?`,
  quality:`Name the real limits and show you measure.`,
  steps:[[`Serial parts.`,` Amdahl's law: the part that cannot run in parallel caps the speed-up.`],[`Contention.`,` Threads fighting over locks or one database wait instead of working.`],[`Switching cost.`,` More threads than cores means the OS spends time swapping them.`],[`Shared resources.`,` The database or downstream service becomes the bottleneck.`],[`Measure.`,` Load test with different pool sizes and watch throughput and latency percentiles.`]],
  trade:`More parallelism raises throughput until a resource saturates, then latency climbs.`,
  follow:`How do you find the bottleneck? What is back-pressure?`},
 {n:`Producer-consumer implementation`,tag:`Machine coding`,where:`A frequent machine-coding task`,
  ask:`Implement producer-consumer. Then do it without BlockingQueue.`,
  quality:`Use BlockingQueue first, then show wait/notify correctly with a while loop.`,
  steps:[[`Easy way.`,` <code>ArrayBlockingQueue</code> with <code>put</code> and <code>take</code>. Bounded size gives back-pressure.`],[`Manual way.`,` A shared list guarded by a lock. Producers <code>wait()</code> while full, consumers <code>wait()</code> while empty, and each calls <code>notifyAll()</code> after a change.`],[`Always a while loop.`,` Re-check the condition after waking, because of spurious wakeups.`],[`Shutdown.`,` Use a poison pill or interrupt so consumers can stop.`]],
  code:{cap:`Manual version`,code:`class Buffer<T> {
    private final Queue<T> q = new ArrayDeque<>();
    private final int cap;
    Buffer(int cap) { this.cap = cap; }

    synchronized void put(T t) throws InterruptedException {
        while (q.size() == cap) wait();      // while, not if
        q.add(t);
        notifyAll();
    }
    synchronized T take() throws InterruptedException {
        while (q.isEmpty()) wait();
        T t = q.remove();
        notifyAll();
        return t;
    }
}`,use:`Buffer<String> b = new Buffer<>(5);
new Thread(() -> { for (int i = 0; i < 20; i++) b.put("job-" + i); }).start();   // producer
new Thread(() -> { while (true) System.out.println(b.take()); }).start();        // consumer`},
  trade:`Manual wait/notify teaches the mechanics but is error-prone. In real code use BlockingQueue or a framework.`,
  follow:`Why notifyAll rather than notify? Use two Conditions instead? What about multiple consumers?`},
 {n:`ConcurrentHashMap, CopyOnWriteArrayList and friends`,tag:`Concurrency`,where:`Paired with the collections questions`,
  ask:`Which thread-safe collection would you use for a cache, a listener list and a work queue?`,
  quality:`Match the data structure to the access pattern.`,
  steps:[[`Cache.`,` <code>ConcurrentHashMap</code>, or Caffeine for eviction and expiry.`],[`Listeners.`,` <code>CopyOnWriteArrayList</code>: reads far outnumber writes, and iteration never fails.`],[`Work queue.`,` <code>LinkedBlockingQueue</code> or <code>ArrayBlockingQueue</code>. <code>ConcurrentLinkedQueue</code> if you never need to block.`],[`Why not synchronizedList.`,` Iteration still needs a manual lock, and every call contends on one lock.`]],
  trade:`Copy-on-write costs memory and time on each write. Concurrent maps give weakly consistent views.`,
  follow:`What is a weakly consistent iterator? When would you use a ReadWriteLock?`},
 {n:`ThreadLocal: use and danger`,tag:`Concurrency`,where:`Appears with Spring request context and logging questions`,
  ask:`What is ThreadLocal? What can go wrong in a thread pool?`,
  quality:`Know the leak: pool threads live long.`,
  steps:[[`What.`,` Each thread has its own copy of a value. Used for the security context, MDC logging, transaction context.`],[`Pool risk.`,` Pool threads are reused. If you do not <code>remove()</code>, the next request sees the previous user's data, and large values stay in memory.`],[`Pattern.`,` Set in a filter, clear in a <code>finally</code>.`],[`Virtual threads.`,` Possible but with millions of threads the memory adds up. Consider scoped values in newer Java.`]],
  trade:`Convenient hidden context versus hidden coupling that fails when work moves to another thread.`,
  follow:`Why does @Async lose the security context? How does Spring propagate it?`},
 {n:`Explain JVM memory areas`,tag:`JVM`,where:`Near-universal in experienced Java rounds`,
  ask:`Describe the JVM memory areas. Where do objects, locals and classes live?`,
  quality:`Draw the layout, then link each area to its error.`,
  steps:[[`Heap.`,` Objects. Young (Eden and two survivors) and old generation.`],[`Stack.`,` Per thread: frames, locals, references. <code>StackOverflowError</code>.`],[`Metaspace.`,` Class metadata, native memory since Java 8, replaced PermGen.`],[`Others.`,` Code cache for JIT output, direct memory, and the program counter per thread.`],[`Errors.`,` Heap space, Metaspace, native thread, direct buffer: one per area.`]],
  trade:`A big heap lowers GC frequency but lengthens some pauses and takes memory from other uses.`,
  follow:`What is escape analysis? Where do static variables live? What is the string pool's location now? (heap)`},
 {n:`How does garbage collection work? G1 vs ZGC`,tag:`JVM`,where:`Asked for 5 plus years in nearly every JVM section`,
  ask:`How does the GC decide what to free? Compare G1 and ZGC. Which would you use for a payments API?`,
  quality:`Reachability, generations, then a reasoned choice using pause targets.`,
  steps:[[`Reachability.`,` Start at GC roots and mark everything reachable. The rest is garbage.`],[`Generations.`,` Most objects die young, so minor collections are cheap.`],[`G1.`,` Region-based, aims for a pause target, mixes young and old collection. The default.`],[`ZGC.`,` Mostly concurrent, pauses of a few milliseconds regardless of heap size, generational in Java 21.`],[`Payments API.`,` Start with G1. If p99 latency shows GC pauses, evaluate ZGC with a load test.`]],
  trade:`ZGC gives tiny pauses but uses more CPU and memory overhead. G1 is balanced and well understood.`,
  follow:`What is a stop-the-world pause? What is a concurrent mark? What are the GC roots?`},
 {n:`Diagnose a memory leak`,tag:`JVM`,where:`The top scenario question in senior Java rounds`,
  ask:`Memory in production climbs for two days and then crashes. How do you find the cause?`,
  quality:`A method, named tools, and a typical culprit.`,
  steps:[[`Confirm.`,` The heap after full GCs keeps rising.`],[`Capture.`,` A heap dump with <code>jcmd GC.heap_dump</code>, or enable dump on OOM.`],[`Analyse.`,` Eclipse MAT: leak suspects, dominator tree, path to GC roots.`],[`Typical causes.`,` Static collections, unbounded caches, unremoved listeners, ThreadLocal in pools, unclosed resources.`],[`Fix and verify.`,` Add eviction or remove the reference, and watch the heap over days.`]],
  trade:`A heap dump pauses the app and is large, so take it from one instance taken out of rotation.`,
  follow:`Difference between a leak and just a big working set? How do weak references help? What does a classloader leak look like?`},
 {n:`Heap, GC and flags for a container`,tag:`JVM`,where:`Common once Kubernetes appears in the profile`,
  ask:`Your Java pod has a 2 GB limit and keeps getting OOMKilled. What do you check?`,
  quality:`Know that the process is bigger than the heap.`,
  steps:[[`Difference.`,` OOMKilled means the container went over its limit. A Java OutOfMemoryError is thrown inside the JVM. They are different failures.`],[`Total memory.`,` Heap plus metaspace plus thread stacks plus direct buffers plus code cache.`],[`Set sizes.`,` Use <code>-XX:MaxRAMPercentage</code> around 70 to 75, not heap equal to the limit.`],[`Check threads and buffers.`,` Thread count x stack size, and Netty or NIO direct memory.`],[`Verify.`,` Use native memory tracking (<code>-XX:NativeMemoryTracking=summary</code>) and container metrics.`]],
  trade:`Leaving headroom wastes a little memory but avoids sudden kills.`,
  follow:`Does Java 8 respect container limits? (8u191 and later do) What is the effect of CPU limits on GC threads?`},
 {n:`What do virtual threads change for pools and locks?`,tag:`Java 21`,where:`The newest Java 21 concurrency question`,
  ask:`With virtual threads, do we still need thread pools, and what about synchronized?`,
  quality:`Do not pool them, but limit concurrency, and know about pinning.`,
  steps:[[`No pooling.`,` One virtual thread per task is the intended use.`],[`Still limit.`,` A semaphore protects a database or API from being flooded.`],[`Pinning.`,` In Java 21, blocking inside <code>synchronized</code> pins the carrier. Prefer <code>ReentrantLock</code> for long waits.`],[`Platform pools remain.`,` For CPU-bound work, a pool sized to cores still makes sense.`]],
  trade:`Simple blocking code scales, but CPU-bound work and heavy ThreadLocal use do not benefit.`,
  follow:`How do you detect pinning? (<code>-Djdk.tracePinnedThreads</code>) What is structured concurrency?`}
 ]},

var STAGES=[
 {l:'1 server',hurt:'Nothing yet.',fix:'One app server and one database is a perfectly good start. Spend your effort on a clean data model and the right indexes.',cost:'None, and that is the point. Every extra part is something to run and debug.'},
 {l:'Slow queries',hurt:'Pages slow down because the app and database share one machine, and some queries scan whole tables.',fix:'Add indexes. Move the database to its own machine. Use a bigger machine if needed.',cost:'A bigger machine has a ceiling, and one failure still takes everything down.'},
 {l:'Read-heavy',hurt:'The database is busy answering the same read questions again and again.',fix:'Add a cache for popular data. Add read replicas (copies for reading).',cost:'Data can be slightly stale. You now have to decide when to refresh the cache.'},
 {l:'One server is not enough',hurt:'One app server cannot take the traffic, and if it dies, the site is down.',fix:'Run several identical app servers behind a load balancer. Keep them stateless, so any server can handle any request.',cost:'You must move user sessions out of server memory, and handle deployments carefully.'},
 {l:'Slow work blocks users',hurt:'Sending emails or making reports makes users wait. Spikes of traffic can overwhelm the database.',fix:'Put slow work on a queue and let workers process it in the background.',cost:'Duplicates can happen, so workers must be safe to run twice. Users see "pending" for a while.'},
 {l:'Data too big',hurt:'One database cannot hold all the data or take all the writes.',fix:'Split the data across several databases by a key, such as user id. This is sharding.',cost:'Queries across shards are hard, and a popular key can overload one shard.'},
 {l:'Global users',hurt:'Users far from your servers get slow responses, and one data-center outage takes everyone down.',fix:'Serve static files from a CDN. Run in more than one region and route users to the nearest one.',cost:'Data in different regions can briefly disagree, and the bill grows a lot.'}
];

function el(tag,cls,html){var e=document.createElement(tag);if(cls)e.className=cls;if(html!=null)e.innerHTML=html;return e}

function fmt(n){
  if(n>=1e9)return (n/1e9).toFixed(1)+' B';
  if(n>=1e6)return (n/1e6).toFixed(1)+' M';
  if(n>=1e3)return (n/1e3).toFixed(1)+' K';
  return n<10?n.toFixed(1):String(Math.round(n));
}
function fmtBytes(n){var u=['B','KB','MB','GB','TB','PB'],i=0;while(n>=1000&&i<u.length-1){n/=1000;i++}return (n<10?n.toFixed(1):Math.round(n))+' '+u[i]}

function renderBlock(b,host){
  var n;
  switch(b.t){
  case 'p': host.appendChild(el('div','sec',b.h));break;
  case 'plain': n=el('div','box');n.appendChild(el('div','label','In plain words'));n.appendChild(el('p',null,b.h));host.appendChild(n);break;
  case 'analogy': n=el('div','box plain');n.appendChild(el('div','label','Picture it'));n.appendChild(el('p',null,b.h));host.appendChild(n);break;
  case 'mistake': n=el('div','box mistake');n.appendChild(el('div','label','Common mistake'));n.appendChild(el('p',null,b.h));host.appendChild(n);break;
  case 'remember': n=el('div','box remember');n.appendChild(el('div','label','Remember this'));n.appendChild(el('p',null,b.h));host.appendChild(n);break;
  case 'steps':
    n=el('ol','steps');
    b.items.forEach(function(s){var li=el('li',null,'<div><b>'+s[0]+'</b>'+s[1]+'</div>');n.appendChild(li)});
    host.appendChild(n);break;
  case 'two':
    n=el('div','two');
    [b.a,b.b].forEach(function(x){n.appendChild(el('div',null,'<div class="h">'+x.h+'</div><p>'+x.b+'</p>'))});
    host.appendChild(n);break;
  case 'cards':
    n=el('div','cards');
    b.items.forEach(function(c){
      n.appendChild(el('div','card','<h3>'+c.h+'</h3>'+(c.pic?'<div class="pic">'+c.pic+'</div>':'')+'<p>'+c.b+'</p>'+(c.small?'<p class="small">'+c.small+'</p>':'')));
    });
    host.appendChild(n);break;
  case 'code':
    n=el('div','sec');
    var cap=el('div','cap'+(b.bad?' bad':'')+(b.good?' good':''),b.cap||'');
    if(b.use)cap.className+=' use';
    var pre=document.createElement('pre');pre.textContent=b.code;if(b.use)pre.className='use';
    n.appendChild(cap);n.appendChild(pre);host.appendChild(n);break;
  case 'check':

    n.appendChild(el('div','label','Check yourself'));

    var ans=el('div','ans',b.a);ans.hidden=true;
    btn.addEventListener('click',function(){ans.hidden=!ans.hidden;btn.textContent=ans.hidden?'Think, then show the answer':'Hide the answer'});
    n.appendChild(btn);n.appendChild(ans);host.appendChild(n);break;
  case 'qbank': host.appendChild(buildQbank(b.items));break;

  case 'links':

function buildCalc(){
  var box=el('div','check');
  box.appendChild(el('div','label','Try it'));
  box.appendChild(el('p',null,'Change the numbers and watch what moves. Start with the example from above.'));
  box.appendChild(el('div','fields',
    '<div class="field"><label for="c-dau">Daily users (millions)</label><input id="c-dau" type="number" min="0" step="any" value="10"></div>'+
    '<div class="field"><label for="c-act">Actions per user per day</label><input id="c-act" type="number" min="0" step="any" value="20"></div>'+
    '<div class="field"><label for="c-rpw">Reads for every 1 write</label><input id="c-rpw" type="number" min="0" step="any" value="10"></div>'));
  var out=el('div','out');out.setAttribute('aria-live','polite');box.appendChild(out);
  var msg=el('div','box');box.appendChild(msg);
  function num(id){var v=parseFloat(box.querySelector(id).value);return isFinite(v)&&v>=0?v:0}
  function run(){
    var dau=num('#c-dau')*1e6,act=num('#c-act'),rpw=num('#c-rpw');
    var day=dau*act,avg=day/86400,pk=avg*3,w=pk/(rpw+1),r=pk-w;
    var data=day/(rpw+1)*1000*365;
    out.innerHTML=
      '<div><span>Requests per day</span><b>'+fmt(day)+'</b></div>'+
      '<div><span>Average per second</span><b>'+fmt(avg)+'</b></div>'+
      '<div><span>Busy-hour per second (x3)</span><b>'+fmt(pk)+'</b></div>'+
      '<div><span>Reads per second at peak</span><b>'+fmt(r)+'</b></div>'+
      '<div><span>Writes per second at peak</span><b>'+fmt(w)+'</b></div>'+
      '<div><span>New data per year (1 KB per write)</span><b>'+fmtBytes(data)+'</b></div>';
    var m;
    if(r<1000&&w<500)m='<b>What this means:</b> one well-tuned database can handle this. Keep it simple.';
    else if(r<10000)m='<b>What this means:</b> reads are the pressure. Add a cache and maybe read replicas.';
    else m='<b>What this means:</b> reads are very high. You need a cache layer, and likely a CDN for static files.';
    if(w>=5000)m+=' Writes are high too, so think about a queue and splitting the data.';
    msg.innerHTML='<p>'+m+'</p>';
  }
  box.addEventListener('input',run);run();
  return box;
}

function buildStages(){
  var wrap=el('div','sec'),sel=2;
  var row=el('div','row');wrap.appendChild(row);
  var panel=el('div','check');panel.setAttribute('aria-live','polite');wrap.appendChild(panel);
  function draw(){
    Array.prototype.forEach.call(row.children,function(b,i){b.setAttribute('aria-pressed',i===sel?'true':'false')});
    var s=STAGES[sel];
    panel.innerHTML='<div><div class="label">What hurts</div><p>'+s.hurt+'</p></div>'+
      '<div><div class="label">The fix</div><p>'+s.fix+'</p></div>'+
      '<div><div class="label">What the fix costs</div><p>'+s.cost+'</p></div>';
  }
  STAGES.forEach(function(s,i){
    var b=el('button','stage',s.l);b.type='button';
    b.addEventListener('click',function(){sel=i;draw()});row.appendChild(b);
  });
  draw();return wrap;
}

function buildDiagram(b){
  var spec=b.d,NS='http://www.w3.org/2000/svg';
  function s(tag,attrs,text){var e=document.createElementNS(NS,tag);for(var k in attrs)e.setAttribute(k,attrs[k]);if(text!=null)e.textContent=text;return e}
  var W=spec.w||420,byId={};
  spec.nodes.forEach(function(n){
    var hdr=n.k==='state'?34:(n.k==='note'?0:(n.s?38:28));
    var ml=n.m?n.m.length:0;
    if(n.k==='state')n.h=34;
    else if(n.k==='note')n.h=ml*14+14;
    else n.h=hdr+(ml?10+14*ml:0);
    n.hdr=hdr;byId[n.id]=n;
  });
  var H=0;spec.nodes.forEach(function(n){H=Math.max(H,n.y+n.h)});H+=14;
  var svg=s('svg',{viewBox:'0 0 '+W+' '+H,role:'img','aria-label':spec.alt||''});
  var defs=s('defs',{});
  function marker(id,w,h,rx,ry,child){
    var m=s('marker',{id:id,viewBox:'0 0 '+w+' '+h,refX:rx,refY:ry,markerWidth:w,markerHeight:h,markerUnits:'userSpaceOnUse',orient:'auto'});
    m.appendChild(child);defs.appendChild(m);
  }
  var uid='m'+Math.floor(Math.random()*1e6);
  marker(uid+'t',12,12,11,6,s('path',{d:'M1,1 L11,6 L1,11 z','class':'mk-tri'}));
  marker(uid+'o',12,12,11,6,s('path',{d:'M1,1 L11,6 L1,11','class':'mk-open'}));
  marker(uid+'f',12,12,11,6,s('path',{d:'M1,1 L11,6 L1,11 z','class':'mk-fill'}));
  marker(uid+'d',14,12,0,6,s('path',{d:'M1,6 L7,1 L13,6 L7,11 z','class':'mk-tri'}));
  svg.appendChild(defs);
  function clip(n,tx,ty){
    var cx=n.x+n.w/2,cy=n.y+n.h/2,dx=tx-cx,dy=ty-cy;
    if(dx===0&&dy===0)return [cx,cy];
    var t=Math.min(dx!==0?(n.w/2)/Math.abs(dx):1e9,dy!==0?(n.h/2)/Math.abs(dy):1e9);
    return [cx+dx*t,cy+dy*t];
  }
  spec.edges.forEach(function(e){
    var A=byId[e.a],B=byId[e.b];
    var ax=A.x+A.w/2,ay=A.y+A.h/2,bx=B.x+B.w/2,by=B.y+B.h/2;
    var dx=bx-ax,dy=by-ay,len=Math.sqrt(dx*dx+dy*dy)||1,o=e.o||0;
    var nx=-dy/len*o,ny=dx/len*o;
    var p1=clip(A,bx+nx,by+ny),p2=clip(B,ax+nx,ay+ny);
    p1=[p1[0]+nx,p1[1]+ny];p2=[p2[0]+nx,p2[1]+ny];
    var k=e.k||'arrow',dash=(k==='implements'||k==='uses');
    var line=s('line',{x1:p1[0],y1:p1[1],x2:p2[0],y2:p2[1],'class':'dg-e'+(dash?' dash':'')});
    if(k==='extends'||k==='implements')line.setAttribute('marker-end','url(#'+uid+'t)');
    else if(k==='uses')line.setAttribute('marker-end','url(#'+uid+'o)');
    else if(k==='has'){line.setAttribute('marker-start','url(#'+uid+'d)');line.setAttribute('marker-end','url(#'+uid+'o)')}
    else line.setAttribute('marker-end','url(#'+uid+'f)');
    svg.appendChild(line);
    if(e.l){
      var mx=(p1[0]+p2[0])/2,my=(p1[1]+p2[1])/2,lw=e.l.length*5.6+10;
      svg.appendChild(s('rect',{x:mx-lw/2,y:my-8,width:lw,height:15,rx:3,'class':'dg-lb'}));
      svg.appendChild(s('text',{x:mx,y:my+3.5,'class':'dg-l'},e.l));
    }
  });
  spec.nodes.forEach(function(n){
    var cls=n.k==='iface'?'dg-if':(n.k==='state'?'dg-st':(n.k==='note'?'dg-note':'dg-box'));
    svg.appendChild(s('rect',{x:n.x,y:n.y,width:n.w,height:n.h,rx:n.k==='state'?17:6,'class':cls}));
    if(n.k==='note'){
      (n.m||[]).forEach(function(l,i){svg.appendChild(s('text',{x:n.x+n.w/2,y:n.y+16+i*14,'class':'dg-n'},l))});
      return;
    }
    if(n.s)svg.appendChild(s('text',{x:n.x+n.w/2,y:n.y+15,'class':'dg-s'},'«'+n.s+'»'));
    svg.appendChild(s('text',{x:n.x+n.w/2,y:n.y+(n.k==='state'?22:(n.s?31:19)),'class':'dg-t'},n.t));
    if(n.m&&n.m.length){
      svg.appendChild(s('line',{x1:n.x,y1:n.y+n.hdr,x2:n.x+n.w,y2:n.y+n.hdr,'class':'dg-sep'}));
      n.m.forEach(function(l,i){svg.appendChild(s('text',{x:n.x+8,y:n.y+n.hdr+6+(i+1)*14-3,'class':'dg-m'},l))});
    }
  });
  var wrap=el('div','diagram');
  wrap.appendChild(svg);
  if(b.cap)wrap.appendChild(el('p','dcap',b.cap));
  return wrap;
}

function buildQbank(items){
  var wrap=el('div');
  items.forEach(function(q){
    var d=document.createElement('details');d.className='q';
    var s=document.createElement('summary');
    s.innerHTML='<span class="qleft"><span>'+q.n+'</span><span class="pill">'+q.tag+'</span></span>';
    d.appendChild(s);
    var b=el('div','qbody');
    b.appendChild(el('p','where','<b>Seen in:</b> '+q.where));
    b.appendChild(el('div','qsec','<div class="label">The question</div><p>'+q.ask+'</p>'));
    b.appendChild(el('div','qsec','<div class="label">What matters most</div><p>'+q.quality+'</p>'));
    var st=el('div','qsec','<div class="label">Walk through it</div>');
    var ol=el('ol','steps');
    q.steps.forEach(function(x){ol.appendChild(el('li',null,'<div><b>'+x[0]+'</b>'+x[1]+'</div>'))});
    st.appendChild(ol);b.appendChild(st);
    if(q.code){
      var c=el('div','qsec');
      c.appendChild(el('div','cap',q.code.cap));
      var pre=document.createElement('pre');pre.textContent=q.code.code;c.appendChild(pre);
      if(q.code.use){
        c.appendChild(el('div','cap use','How it is used'));
        var p2=document.createElement('pre');p2.className='use';p2.textContent=q.code.use;c.appendChild(p2);
      }
      b.appendChild(c);
    }
    b.appendChild(el('div','qsec','<div class="label">Trade-offs to say out loud</div><p>'+q.trade+'</p>'));
    b.appendChild(el('div','qsec','<div class="label">Follow-ups to expect</div><p>'+q.follow+'</p>'));
    d.appendChild(b);wrap.appendChild(d);
  });
  return wrap;
}

var P={lld:['Design a parking lot','Design an elevator system','Design Splitwise (shared expenses)','Design a library system','Design a vending machine','Design an LRU cache','Design a chess game','Design an ATM','Design a movie ticket booking system','Design a logging framework'],
 hld:['Design a URL shortener','Design a news feed','Design a chat application','Design a video streaming service','Design a ride-hailing app','Design a notification system','Design a web crawler','Design search autocomplete','Design a payment system','Design a ticket booking system']};
var timerState={remaining:1200,running:false,endAt:0,id:null};
function buildDrill(){
  var box=el('div','check'),kind='lld',cur='';
  box.appendChild(el('div','label','Today\'s drill'));
  var pill=el('span','pill','LLD');var pw=el('div');pw.appendChild(pill);box.appendChild(pw);
  var prompt=el('p',null,'');prompt.style.cssText='font:600 1.2rem/1.4 var(--font-display)';box.appendChild(prompt);
  var r1=el('div','row');
  var bl=el('button','reveal','New LLD prompt'),bh=el('button','reveal','New HLD prompt');bl.type=bh.type='button';
  r1.appendChild(bl);r1.appendChild(bh);box.appendChild(r1);
  var time=el('div','timer','20:00');box.appendChild(time);
  var phase=el('p',null,'Ready when you are.');box.appendChild(phase);
  var r2=el('div','row');
  var st=el('button','btn','Start'),rs=el('button','btn ghost','Reset');st.type=rs.type='button';
  r2.appendChild(st);r2.appendChild(rs);box.appendChild(r2);
  function pick(k){kind=k;var l=P[k],p=cur;while(p===cur)p=l[Math.floor(Math.random()*l.length)];cur=p;prompt.textContent=p;pill.textContent=k.toUpperCase()}
  function render(){
    var rem=timerState.remaining,m=Math.floor(rem/60),s=rem%60;
    time.textContent=(m<10?'0':'')+m+':'+(s<10?'0':'')+s;
    var el_=1200-rem,txt;
    if(rem<=0)txt='Time. Now write one line: what did I skip or hand-wave?';
    else if(!timerState.running&&el_===0)txt='Ready when you are. Talk out loud.';
    else if(el_<300)txt='Clarify: ask questions, pick three must-haves and one key quality.';
    else if(el_<900)txt=kind==='lld'?'Model: nouns, verbs, who owns what, what will change.':'Model: numbers, the two actions, smallest design, what breaks first.';
    else txt='Stress and trade: two users at once, a new requirement, then the template sentence.';
    phase.textContent=txt;
    st.textContent=timerState.running?'Pause':(rem<=0||rem===1200?'Start':'Resume');
  }
  function tick(){
    timerState.remaining=Math.max(0,Math.ceil((timerState.endAt-Date.now())/1000));
    if(timerState.remaining<=0){timerState.running=false;clearInterval(timerState.id);timerState.id=null}
    render();
  }
  st.addEventListener('click',function(){
    if(timerState.running){timerState.running=false;clearInterval(timerState.id);timerState.id=null;render();return}
    if(timerState.remaining<=0)timerState.remaining=1200;
    timerState.running=true;timerState.endAt=Date.now()+timerState.remaining*1000;
    timerState.id=setInterval(tick,500);render();
  });
  rs.addEventListener('click',function(){timerState.running=false;clearInterval(timerState.id);timerState.id=null;timerState.remaining=1200;render()});
  bl.addEventListener('click',function(){pick('lld');render()});
  bh.addEventListener('click',function(){pick('hld');render()});
  pick('lld');render();
  return box;
}

/* ================= PAGE ================= */
var cur=0;
function idx(){
  var h=(location.hash||'').replace('#','');
  for(var i=0;i<L.length;i++)if(L[i].id===h)return i;
  return 0;
}
function drawList(){
  var host=$('#list');host.innerHTML='';
  var last='';
  L.forEach(function(l,i){
    if(l.trackName!==last){last=l.trackName;host.appendChild(el('h3',null,l.trackName))}
    var a=document.createElement('a');a.href='#'+l.id;
    if(i===cur)a.setAttribute('aria-current','page');
    a.innerHTML='<span class="n">'+(i+1)+'</span><span>'+l.title+'</span><span class="'+(done[l.id]?'tick':'min')+'">'+(done[l.id]?'&#10003; done':l.min+' min')+'</span>';
    a.addEventListener('click',function(){closeList()});
    host.appendChild(a);
  });
}
function closeList(){$('#list').classList.remove('open');$('#menu-btn').setAttribute('aria-expanded','false')}
$('#menu-btn').addEventListener('click',function(){
  var o=$('#list').classList.toggle('open');this.setAttribute('aria-expanded',o?'true':'false');
});
function meter(){
  var n=0;L.forEach(function(l){if(done[l.id])n++});
  $('#meter').style.width=Math.round(n/L.length*100)+'%';
}
function draw(){
  cur=idx();
  var l=L[cur];
  document.body.setAttribute('data-track',l.track);
  $('#where').textContent='Lesson '+(cur+1)+' of '+L.length+' · '+l.trackName;
  var host=$('#lesson');host.innerHTML='';
  var head=el('div');
  head.appendChild(el('div','kicker',l.trackName+' · about '+l.min+' minutes'));
  head.appendChild(el('h1',null,l.title));
  head.appendChild(el('p','promise',l.promise));
  host.appendChild(head);
  l.blocks.forEach(function(b){renderBlock(b,host)});
  var dr=el('label','done-row');
  var cb=document.createElement('input');cb.type='checkbox';cb.checked=!!done[l.id];
  cb.addEventListener('change',function(){if(cb.checked)done[l.id]=1;else delete done[l.id];save();meter();drawList()});
  dr.appendChild(cb);dr.appendChild(el('span',null,'I finished this lesson'));
  host.appendChild(dr);
  var nav=el('div','nav');
  var pv=el('button','btn ghost','Previous');pv.type='button';pv.disabled=cur===0;
  var nx=el('button','btn',cur===L.length-1?'Back to lesson 1':'Next lesson');nx.type='button';
  pv.addEventListener('click',function(){if(cur>0)location.hash=L[cur-1].id});
  nx.addEventListener('click',function(){location.hash=L[cur===L.length-1?0:cur+1].id});
  nav.appendChild(pv);nav.appendChild(nx);host.appendChild(nav);
  meter();drawList();
}
window.addEventListener('hashchange',function(){draw();window.scrollTo(0,0)});
draw();
})();
