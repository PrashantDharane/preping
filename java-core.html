/* ---------- 1 ---------- */
{id:`lesson-1`,track:`jcore`,trackName:`Java core and versions`,title:`What gets asked in Java rounds, and the version map`,min:9,
 promise:`With ten years of experience, "what is polymorphism" is not the question. This is what is, and where each version fits.`,
 blocks:[
 {t:`plain`,h:`Java rounds for experienced developers test three things: <b>how well you know the language's gritty parts</b> (equals, hashing, immutability), <b>how well you know the collections internally</b>, and <b>whether you have kept up with the versions</b>. Prep guides for 2026 list Java 17 and 21 features, such as records, sealed classes, pattern matching and virtual threads, as regular questions now.`},
 {t:`analogy`,h:`Think of Java versions like a Pune city map from 2014 versus today. The old roads still work, which is why many companies still run Java 8. But the new flyovers (records, virtual threads) are what newer teams use, and an interviewer will ask if you have driven on them.`},
 {t:`p`,h:`<h2>The version map: what to remember</h2>`},
 {t:`cards`,items:[
   {h:`Java 8 (2014, LTS)`,pic:`The big one`,b:`Lambdas, streams, Optional, default methods, java.time, CompletableFuture.`,small:`Still the most common base in older enterprise code.`},
   {h:`Java 11 (2018, LTS)`,pic:`Quiet clean-up`,b:`HttpClient, new String methods, <code>var</code> in lambdas. Java 9 to 10 gave modules, <code>List.of</code>, <code>var</code>.`,small:`A common upgrade target from 8.`},
   {h:`Java 17 (2021, LTS)`,pic:`Modern language`,b:`Records, sealed classes, text blocks, switch expressions, pattern matching for instanceof.`,small:`Spring Boot 3 requires at least Java 17.`},
   {h:`Java 21 (2023, LTS)`,pic:`Concurrency leap`,b:`Virtual threads, pattern matching in switch, record patterns, sequenced collections.`,small:`The version interviewers now ask about most.`},
   {h:`Java 25 (2025, LTS)`,pic:`Latest LTS`,b:`The newest long-term release. Be able to say it exists and that LTS releases come every two years.`,small:`Worth a line, not a deep dive.`}]},
 {t:`remember`,h:`Interviewers rarely want a list of features. They ask <b>"what did you actually use, and what problem did it solve?"</b> For each version, keep one real example of how it improved code. Lessons 4 to 6 give you those.`},
 {t:`p`,h:`<h2>What is in this course</h2>`},
 {t:`cards`,items:[
   {h:`Lesson 2: Core language traps`,b:`equals and hashCode, strings, pass-by-value, exceptions, interface vs abstract class.`},
   {h:`Lesson 3: Collections inside`,b:`HashMap, ConcurrentHashMap, ArrayList, and how to build an LRU cache.`},
   {h:`Lesson 4: Java 8`,b:`Lambdas, streams, Optional, CompletableFuture, with the mistakes.`},
   {h:`Lesson 5: Java 9 to 17`,b:`var, records, text blocks, switch expressions, sealed classes.`},
   {h:`Lesson 6: Java 18 to 21 and beyond`,b:`Virtual threads, pattern matching, sequenced collections.`},
   {h:`Lesson 7: Questions with full answers`,b:`Thirteen questions worked end to end.`}]},
 {t:`check`,q:`Your team is on Java 8 and Spring Boot 2.7. A manager asks what you gain by moving to 17. Give three points.`,a:`Language: records and sealed types remove boilerplate, text blocks and switch expressions make code shorter. Runtime: better garbage collectors and general speed. Ecosystem: Spring Boot 3 and Jakarta EE need 17, and Java 8 free public updates have narrowed. Add a risk: javax to jakarta package renaming and removed internal APIs need testing.`}
]},

/* ---------- 2 ---------- */
{id:`lesson-2`,track:`jcore`,trackName:`Java core and versions`,title:`Core language traps that experienced developers still miss`,min:15,
 promise:`Small facts that decide whether your answer sounds like ten years of experience. Each one has a reason, so you can derive it instead of memorising.`,
 blocks:[
 {t:`p`,h:`<h2>1. equals() and hashCode(): the pair that must agree</h2>`},
 {t:`plain`,h:`If two objects are <code>equals</code>, they <b>must</b> return the same <code>hashCode</code>. The reverse is not required. Hash-based collections use the hash to pick a bucket and then <code>equals</code> to find the exact key. Break the rule and a <code>HashMap</code> cannot find what you stored.`},
 {t:`code`,bad:true,cap:`Bad: equals without hashCode`,code:`class Employee {
    final String id;
    Employee(String id) { this.id = id; }
    @Override public boolean equals(Object o) {
        return o instanceof Employee e && e.id.equals(id);
    }
    // no hashCode(): default one uses the memory address
}
Map<Employee,String> m = new HashMap<>();
m.put(new Employee("E1"), "Riya");
m.get(new Employee("E1"));   // null! different hash, so a different bucket`},
 {t:`code`,good:true,cap:`Good: both, and use the same fields`,code:`@Override public int hashCode() { return Objects.hash(id); }
// or simply make it a record: equals, hashCode and toString come free
record Employee(String id) {}`},
 {t:`mistake`,h:`Using a <b>mutable</b> field in <code>hashCode</code> for a key. Change the field after inserting and the object sits in the wrong bucket forever. Keys should be immutable, which is why <code>String</code> and <code>Integer</code> are good keys.`},
 {t:`analogy`,h:`Think of a post office. <code>hashCode()</code> is the pin code: it tells the sorter which box to look in. <code>equals()</code> is checking the name on the envelope. If your <code>hashCode</code> is missing, the sorter uses a random box each time, so a letter addressed to the same person is searched for in the wrong box and is never found, even though the name matches.`},
 {t:`code`,cap:`Java: the bug, run and seen`,code:`static class BadEmployee {
    final int id;
    BadEmployee(int id) { this.id = id; }
    @Override public boolean equals(Object o) { return o instanceof BadEmployee e && e.id == id; }
    // no hashCode: the default one depends on the memory address
}
static class GoodEmployee {
    final int id;
    GoodEmployee(int id) { this.id = id; }
    @Override public boolean equals(Object o) { return o instanceof GoodEmployee e && e.id == id; }
    @Override public int hashCode() { return Integer.hashCode(id); }
}
static void j_equals() {
    Set<BadEmployee> bad = new HashSet<>();
    bad.add(new BadEmployee(7));
    System.out.println("Bad : contains employee 7? " + bad.contains(new BadEmployee(7)));

    Set<GoodEmployee> good = new HashSet<>();
    good.add(new GoodEmployee(7));
    System.out.println("Good: contains employee 7? " + good.contains(new GoodEmployee(7)));
}`},
 {t:`code`,use:true,cap:`What it prints`,code:`Bad : contains employee 7? false
Good: contains employee 7? true`},
 {t:`remember`,h:`<b>The rule in one line.</b> Equal objects must give the same hash code. Use the same fields in both methods. Records and IDE-generated methods get this right for you.`},
 {t:`p`,h:`<h2>2. Strings: immutable, pooled, and compared with equals</h2>`},
 {t:`code`,cap:`The classic puzzle`,code:`String a = "hello";
String b = "hello";
String c = new String("hello");
System.out.println(a == b);        // true  - same literal from the string pool
System.out.println(a == c);        // false - new object on the heap
System.out.println(a.equals(c));   // true  - same characters
System.out.println(a == c.intern()); // true - intern() returns the pooled copy`},
 {t:`cards`,items:[
   {h:`Why immutable?`,b:`Safe to share between threads, safe as a HashMap key (the hash is cached), safe for class loading and security checks, and it lets the pool exist.`},
   {h:`String vs StringBuilder`,b:`Concatenation in a loop makes a new String each time. Use <code>StringBuilder</code>. <code>StringBuffer</code> is the old synchronized version, rarely needed.`},
   {h:`Passwords`,b:`Prefer <code>char[]</code>, which you can overwrite. A String stays in memory until garbage collected.`}]},
 {t:`analogy`,h:`Strings are like a printed wedding card. You cannot change the card once printed. If you want to change the name, you print a new card, and the old one stays as it was. Java also keeps a cupboard of ready-printed cards (the string pool) so that identical cards are shared instead of printed again.`},
 {t:`code`,cap:`Java: the classic string puzzle`,code:`static void j_string() {
    String a = "hello";
    String b = "hello";
    String c = new String("hello");
    System.out.println("a == b       : " + (a == b));            // same pooled object
    System.out.println("a == c       : " + (a == c));            // c is a separate object
    System.out.println("a.equals(c)  : " + a.equals(c));         // same letters
    System.out.println("a == c.intern(): " + (a == c.intern())); // intern gives the pooled one
    String s = "Java";
    s.concat(" 21");                                             // result thrown away
    System.out.println("after concat, s is still: " + s);        // strings never change
}`},
 {t:`code`,use:true,cap:`What it prints`,code:`a == b       : true
a == c       : false
a.equals(c)  : true
a == c.intern(): true
after concat, s is still: Java`},
 {t:`steps`,items:[[`Line 1.`,` Both literals "hello" point to the same card in the cupboard, so <code>==</code> is true.`],[`Line 2.`,` <code>new String("hello")</code> forces a brand-new card, so <code>==</code> is false.`],[`Line 3.`,` <code>equals</code> compares the letters, so it is true. This is what you should always use.`],[`Line 5.`,` <code>concat</code> made a new card and the result was thrown away. The original is unchanged.`]]},
 {t:`p`,h:`<h2>3. Java is always pass-by-value</h2>`},
 {t:`code`,cap:`Passing an object passes a copy of the reference`,code:`void change(Employee e, int n) {
    e = new Employee("E9");   // only the local copy of the reference now points elsewhere
    n = 99;                   // local copy
}
// The caller's variable still points to the old object, and the int is unchanged.
// But e.setName("x") would change the shared object, because both references reach it.`},
 {t:`analogy`,h:`Java is always pass-by-value, and here is a way to feel it. When you pass an object to a method, you do not hand over your house. You hand over a <b>photocopy of your house address</b>. The visitor can walk to your house and rearrange the furniture, and you will see the change. But if he tears up his photocopy and writes a different address, your house is still where it was.`},
 {t:`code`,cap:`Java: change the object versus change the copy of the address`,code:`static class Employee { String name; Employee(String n) { name = n; } }
static void change(Employee e, int n) {
    e.name = "Changed";            // follows the copy of the address to the real object: visible outside
    e = new Employee("New");       // moves only the local copy of the address: invisible outside
    n = 99;                        // changes a local copy of the number
}
static void j_passvalue() {
    Employee emp = new Employee("Original");
    int number = 1;
    change(emp, number);
    System.out.println("name   = " + emp.name);
    System.out.println("number = " + number);
}`},
 {t:`code`,use:true,cap:`What it prints`,code:`name   = Changed
number = 1`},
 {t:`plain`,h:`Line by line: <code>e.name = ...</code> follows the address to the real object, so the change is visible. <code>e = new Employee(...)</code> only changes the local copy of the address, so the caller never notices. <code>n = 99</code> changes a local copy of the number.`},
 {t:`p`,h:`<h2>4. final, finally and finalize</h2>`},
 {t:`cards`,items:[
   {h:`final`,b:`Variable cannot be reassigned, method cannot be overridden, class cannot be extended. A final reference can still point to a changing object.`},
   {h:`finally`,b:`A block that runs after try and catch, for clean-up. It even runs after return. Prefer try-with-resources for anything closeable.`},
   {h:`finalize()`,b:`A deprecated hook the garbage collector might call. Do not use it. Use <code>try-with-resources</code> or <code>Cleaner</code>.`}]},
 {t:`code`,cap:`try-with-resources closes things for you, even on error`,code:`try (var in = Files.newBufferedReader(path);
     var out = Files.newBufferedWriter(target)) {
    in.transferTo(out);
}   // out then in are closed automatically, in reverse order`},
 {t:`p`,h:`<h2>5. Exceptions</h2>`},
 {t:`two`,a:{h:`Checked`,b:`Subclasses of <code>Exception</code> but not <code>RuntimeException</code>. The compiler forces you to handle or declare them. For failures the caller can reasonably recover from.`},b:{h:`Unchecked`,b:`<code>RuntimeException</code> and <code>Error</code>. For bugs and unrecoverable situations. Spring rolls back transactions on these by default, not on checked ones.`}},
 {t:`p`,h:`<h2>6. Abstract class or interface?</h2>`},
 {t:`two`,a:{h:`Interface`,b:`A capability or contract. A class can implement many. Since Java 8 it can have <code>default</code> and <code>static</code> methods, and since 9 <code>private</code> ones. No instance state.`},b:{h:`Abstract class`,b:`A shared base with state and partial behaviour. A class extends only one. Use it when subclasses share fields and a skeleton, like Template Method.`}},
 {t:`mistake`,h:`Saying "an interface can't have any method bodies". It has been able to since Java 8. Also, when two interfaces give the same default method, the class <b>must</b> override it to resolve the clash.`},
 {t:`check`,q:`<code>Integer a = 127, b = 127; a == b</code> is true, but with 128 it is false. Why?`,a:`Autoboxing uses <code>Integer.valueOf</code>, which caches objects for -128 to 127. Inside that range both variables point to the same cached object. Outside it, each boxing creates a new object, so <code>==</code> compares different references. Always compare boxed numbers with <code>equals</code>.`}
]},

{id:`lesson-3`,track:`jcore`,trackName:`Java core and versions`,title:`Collections from the inside: HashMap and friends`,min:16,
 promise:`HashMap is the single most asked internals question. Here it is as a picture first, then the details people get wrong.`,
 blocks:[
 {t:`plain`,h:`A <code>HashMap</code> is an <b>array of buckets</b>. To store a key, Java turns the key into a number (the hash), uses that number to pick a bucket, and puts the entry there. To find it later, it repeats the same steps. That is why lookups are fast.`},
 {t:`analogy`,h:`A society's pigeonhole post boxes. The flat number tells you which box. If two letters belong to the same box, they sit one behind the other.`},
 {t:`diagram`,cap:`Two keys landed in bucket 1, so they form a chain. In Java 8 a long chain becomes a tree.`,d:{w:420,alt:`HashMap bucket array with a chain of two entries in bucket 1`,nodes:[
   {id:`tb`,t:`table (array of buckets)`,x:10,y:8,w:170,m:[`[0]  empty`,`[1]  entry A -> entry B`,`[2]  empty`,`[3]  entry C`,`[4]  empty`]},
   {id:`n1`,t:`How a key finds its bucket`,x:210,y:8,w:200,k:`note`,m:[`Finding the bucket:`,`1 hashCode() of the key`,`2 spread the bits`,`3 index = hash & (n - 1)`,`4 compare with equals()`]},
   {id:`n2`,t:`Treeify`,x:210,y:84,w:200,k:`note`,m:[`Treeify rule:`,`chain of 8+ and table 64+`,`becomes a red-black tree`,`lookup O(n) -> O(log n)`]}],
  edges:[]}},
 {t:`p`,h:`<h2>A HashMap you can build in your head</h2>`},
 {t:`plain`,h:`The best way to explain a HashMap in an interview is to build a very small one. Here the map has only four boxes, like four pigeonholes for flat letters. We store five flats, so at least two must share a box.`},
 {t:`code`,cap:`Java: a tiny hash map with four boxes (plain Java)`,code:`static class TinyMap {
    private final List<List<String[]>> buckets = new ArrayList<>();   // each bucket holds {key, value} pairs
    TinyMap(int size) { for (int i = 0; i < size; i++) buckets.add(new ArrayList<>()); }
    private int bucketFor(String key) { return Math.floorMod(key.hashCode(), buckets.size()); }
    void put(String key, String value) {
        List<String[]> bucket = buckets.get(bucketFor(key));
        for (String[] pair : bucket) if (pair[0].equals(key)) { pair[1] = value; return; }   // same key: replace
        bucket.add(new String[]{key, value});                                              // else add to the chain
    }
    String get(String key) {
        for (String[] pair : buckets.get(bucketFor(key))) if (pair[0].equals(key)) return pair[1];
        return null;
    }
    void print() {
        for (int i = 0; i < buckets.size(); i++) {
            StringBuilder sb = new StringBuilder("box " + i + ":");
            for (String[] p : buckets.get(i)) sb.append("  ").append(p[0]).append("=").append(p[1]);
            System.out.println(sb);
        }
    }
}
static void j_hashmap() {
    TinyMap flats = new TinyMap(4);                  // only 4 boxes, so some flats must share a box
    flats.put("A101", "Asha");
    flats.put("B202", "Ravi");
    flats.put("C303", "Meera");
    flats.put("D404", "Kiran");
    flats.put("E505", "Neha");
    flats.print();
    System.out.println("get B202 -> " + flats.get("B202"));
}`},
 {t:`code`,use:true,cap:`What it prints`,code:`box 0:  D404=Kiran
box 1:  A101=Asha  E505=Neha
box 2:  B202=Ravi
box 3:  C303=Meera
get B202 -> Ravi`},
 {t:`steps`,items:[[`Pick the box.`,` <code>hashCode</code> turns the key into a number. Dividing by the number of boxes and taking the remainder picks the box.`],[`Two flats in box 1.`,` A101 and E505 landed in the same box. This is a <b>collision</b>. They simply sit in a short list in that box.`],[`Finding a key.`,` Go straight to its box, then compare keys with <code>equals</code> inside the short list. That is why <code>equals</code> and <code>hashCode</code> must agree.`],[`What the real HashMap adds.`,` It grows the number of boxes when it gets crowded (at 75 percent full), and since Java 8 it turns a very long chain into a balanced tree.`]]},
 {t:`p`,h:`<h2>The facts to have ready</h2>`},
 {t:`cards`,items:[
   {h:`Default size and growth`,b:`Starts with 16 buckets. When entries exceed <b>capacity x 0.75</b> (the load factor), it doubles and re-distributes. Resizing is the costly moment.`},
   {h:`Collisions`,b:`Different keys, same bucket. Handled by chaining. Since Java 8 a chain of 8 or more in a table of at least 64 becomes a tree.`},
   {h:`Nulls`,b:`HashMap allows one null key and many null values. <code>Hashtable</code> and <code>ConcurrentHashMap</code> allow neither.`},
   {h:`Order`,b:`Not guaranteed. <code>LinkedHashMap</code> keeps insertion order. <code>TreeMap</code> keeps sorted order.`},
   {h:`Capacity tip`,b:`If you know you will store 1,000 entries, pass a capacity (about 1,334) to avoid repeated resizing.`}]},
 {t:`p`,h:`<h2>Not thread-safe, and what goes wrong</h2>`},
 {t:`plain`,h:`Two threads writing to a plain <code>HashMap</code> can lose updates, and a resize at the wrong moment can corrupt it. In old Java versions it could even loop forever. Reads during iteration throw <code>ConcurrentModificationException</code> (the "fail-fast" behaviour).`},
 {t:`two`,a:{h:`Hashtable and synchronizedMap`,b:`One lock for the whole map. Safe but every operation waits in the same line.`},b:{h:`ConcurrentHashMap`,b:`Finer locking. In Java 8 and later, empty buckets are filled using compare-and-swap, and otherwise only the first node of that one bucket is locked. Reads do not block.`}},
 {t:`code`,use:true,cap:`How it is used: counting safely across threads`,code:`ConcurrentHashMap<String, LongAdder> hits = new ConcurrentHashMap<>();

// Many request threads call this at once. No explicit lock needed.
void record(String page) {
    hits.computeIfAbsent(page, k -> new LongAdder()).increment();
}

// A plain map.get(x) + map.put(x, v+1) is NOT atomic. These are:
ConcurrentHashMap<String,Integer> m = new ConcurrentHashMap<>();
m.merge("home", 1, Integer::sum);   // atomic add`},
 {t:`p`,h:`<h2>ArrayList, LinkedList and the others</h2>`},
 {t:`cards`,items:[
   {h:`ArrayList`,b:`Array inside. Get by index is O(1). Adding at the end is O(1) on average, in the middle O(n). Grows by about half when full. Use it by default.`},
   {h:`LinkedList`,b:`Nodes with links. Fast insert at a known position, but finding the position is O(n), and it is hard on the CPU cache. In practice almost always slower than ArrayList.`},
   {h:`HashSet`,b:`A HashMap in disguise. The elements are the keys.`},
   {h:`PriorityQueue`,b:`A binary heap. Smallest (or by comparator) comes out first. Not sorted when iterated.`},
   {h:`CopyOnWriteArrayList`,b:`Every write copies the array. Great when reads are many and writes rare, such as a list of listeners.`}]},
 {t:`code`,use:true,cap:`How it is used: an LRU cache in a few lines (a very common machine-coding question)`,code:`class LruCache<K,V> extends LinkedHashMap<K,V> {
    private final int max;
    LruCache(int max) {
        super(16, 0.75f, true);          // true = order by access, not by insertion
        this.max = max;
    }
    @Override protected boolean removeEldestEntry(Map.Entry<K,V> eldest) {
        return size() > max;             // drop the least recently used one
    }
}

var cache = new LruCache<String,String>(2);
cache.put("a","1"); cache.put("b","2");
cache.get("a");            // a is now most recent
cache.put("c","3");        // evicts b
// cache now holds a and c`},
 {t:`mistake`,h:`Saying "HashMap lookup is O(1)" without the caveat. It is O(1) on average with a good hash function. With bad hashing it degrades, to O(n) in old versions and O(log n) since the tree change.`},
 {t:`check`,q:`You iterate a <code>List</code> and call <code>list.remove(item)</code> inside the loop and get <code>ConcurrentModificationException</code>. Two ways to fix?`,a:`Use an <code>Iterator</code> and call <code>iterator.remove()</code>, or use <code>list.removeIf(predicate)</code>, which is the cleaner way. A third: collect items to remove, then remove them after the loop. The exception happens because the list's modification counter changed behind the iterator's back.`}
]},

{id:`lesson-4`,track:`jcore`,trackName:`Java core and versions`,title:`Java 8: lambdas, streams, Optional and CompletableFuture`,min:16,
 promise:`Java 8 is still the base of most code you will meet, and it is asked in every round. Learn the idea behind each feature and the mistakes people make with it.`,
 blocks:[
 {t:`plain`,h:`Java 8 let you pass <b>behaviour</b> as a value. A <b>lambda</b> is a short anonymous function. A <b>functional interface</b> is an interface with exactly one abstract method, so a lambda can stand in for it. <b>Streams</b> let you describe a data pipeline instead of writing loops.`},
 {t:`cards`,items:[
   {h:`Predicate<T>`,pic:`T to boolean`,b:`A test. <code>x -> x &gt; 10</code>.`},
   {h:`Function<T,R>`,pic:`T to R`,b:`A transform. <code>s -> s.length()</code>.`},
   {h:`Consumer<T>`,pic:`T to nothing`,b:`Does something with a value. <code>System.out::println</code>.`},
   {h:`Supplier<T>`,pic:`nothing to T`,b:`Produces a value, lazily. <code>() -> new ArrayList&lt;&gt;()</code>.`}]},
 {t:`code`,cap:`Loop versus stream: the same job`,code:`record Order(String city, String status, double amount) {}

// Total amount of PAID orders per city, biggest first
Map<String, Double> byCity = orders.stream()
    .filter(o -> o.status().equals("PAID"))                 // keep matching
    .collect(Collectors.groupingBy(Order::city,             // group
             Collectors.summingDouble(Order::amount)));     // add up each group`},
 {t:`code`,use:true,cap:`How it is used: in a Spring service`,code:`@Service
class ReportService {
    private final OrderRepository repo;
    ReportService(OrderRepository repo) { this.repo = repo; }

    public Map<String, Double> paidTotalsByCity() {
        return repo.findAll().stream()
                   .filter(o -> o.status().equals("PAID"))
                   .collect(Collectors.groupingBy(Order::city,
                            Collectors.summingDouble(Order::amount)));
    }
}
// GET /reports/city-totals  ->  {"Pune": 182000.0, "Mumbai": 240500.0}`},
 {t:`analogy`,h:`A stream is a tiffin assembly line. Nothing moves until the last person at the end says "send me one". Then each box passes through washing, packing and sealing, one box at a time, not all the washing first. And if the customer only wanted two boxes, the line stops as soon as it has two. You will see exactly that in the output below.`},
 {t:`code`,cap:`Java: watch the line run (plain Java)`,code:`static void j_stream() {
    List<String> cities = List.of("Pune", "Mumbai", "Delhi", "Pune", "Chennai", "Pune");

    // A stream does nothing until a terminal operation runs, then each item goes through the whole line one by one.
    List<String> result = cities.stream()
            .peek(c -> System.out.println("  looking at " + c))
            .filter(c -> c.startsWith("P"))
            .map(String::toUpperCase)
            .limit(2)
            .collect(Collectors.toList());
    System.out.println("result = " + result);

    Map<String, Long> counts = cities.stream()
            .collect(Collectors.groupingBy(c -> c, TreeMap::new, Collectors.counting()));
    System.out.println("counts = " + counts);
}`},
 {t:`code`,use:true,cap:`What it prints`,code:`  looking at Pune
  looking at Mumbai
  looking at Delhi
  looking at Pune
result = [PUNE, PUNE]
counts = {Chennai=1, Delhi=1, Mumbai=1, Pune=3}`},
 {t:`steps`,items:[[`Nothing prints before <code>collect</code>.`,` The intermediate steps (<code>filter</code>, <code>map</code>) only describe the line. The terminal step starts it.`],[`Items go one by one.`,` "Pune" goes through filter, map and limit before "Mumbai" is even looked at.`],[`<code>limit(2)</code> stops early.`,` After two Pune results the line stops. The last three cities were never looked at.`],[`Group and count.`,` <code>groupingBy</code> is the stream way of "for each city, count the orders". It builds a map for you.`]]},
 {t:`p`,h:`<h2>How a stream really runs</h2>`},
 {t:`steps`,items:[
   [`Source.`,` A collection, array, or generator.`],
   [`Intermediate operations.`,` <code>filter</code>, <code>map</code>, <code>sorted</code>, <code>distinct</code>. They are <b>lazy</b>: nothing runs yet.`],
   [`Terminal operation.`,` <code>collect</code>, <code>forEach</code>, <code>count</code>, <code>reduce</code>. This starts the pipeline, element by element.`],
   [`Single use.`,` A stream cannot be reused after its terminal operation.`]]},
 {t:`two`,a:{h:`map`,b:`One input, one output. A list of orders to a list of amounts.`},b:{h:`flatMap`,b:`One input, many outputs, flattened. A list of orders each with many items, to one flat list of items.`}},
 {t:`p`,h:`<h2>Optional: a box that may be empty</h2>`},
 {t:`code`,cap:`Use it as a return type to say "might not be there"`,code:`Optional<User> find(String email);

String city = find(email)
        .map(User::address)
        .map(Address::city)
        .orElse("Unknown");           // no null checks, no NullPointerException

find(email).ifPresent(u -> audit.log(u));
User u = find(email).orElseThrow(() -> new NotFoundException(email));`},
 {t:`analogy`,h:`<code>Optional</code> is a tiffin box that may or may not have food. Instead of opening the lid and finding nothing (a <code>NullPointerException</code>), you ask the box politely: "give me what is inside, or this default if it is empty". The one thing to watch is <code>orElse</code> versus <code>orElseGet</code>, shown below.`},
 {t:`code`,cap:`Java: orElse always computes the default, orElseGet only when needed`,code:`static String expensiveDefault() {
    System.out.println("  (computing the default...)");
    return "guest";
}
static void j_optional() {
    Optional<String> name = Optional.of("Asha");
    System.out.println("orElse:");
    System.out.println(name.orElse(expensiveDefault()));        // default is built even though not needed
    System.out.println("orElseGet:");
    System.out.println(name.orElseGet(Demos::expensiveDefault)); // default is built only when empty
    System.out.println(Optional.empty().isPresent());
}`},
 {t:`code`,use:true,cap:`What it prints`,code:`orElse:
  (computing the default...)
Asha
orElseGet:
Asha
false`},
 {t:`mistake`,h:`Writing <code>orElse(callADatabase())</code>. The database call happens every time, even when the Optional has a value. Use <code>orElseGet(() -> callADatabase())</code> for anything slow.`},
 {t:`p`,h:`<h2>CompletableFuture: do slow things in parallel</h2>`},
 {t:`code`,use:true,cap:`How it is used: call two services at once instead of one after the other`,code:`ExecutorService pool = Executors.newFixedThreadPool(8);

CompletableFuture<User> user   = CompletableFuture.supplyAsync(() -> userClient.get(id), pool);
CompletableFuture<List<Order>> orders = CompletableFuture.supplyAsync(() -> orderClient.of(id), pool);

Profile profile = user.thenCombine(orders, Profile::new)   // when BOTH are done
                      .exceptionally(ex -> Profile.empty()) // fallback on failure
                      .orTimeout(2, TimeUnit.SECONDS)       // Java 9+
                      .join();
// Two 300 ms calls now take about 300 ms in total, not 600 ms.`},
 {t:`remember`,h:`Also from Java 8: <b>default methods</b> in interfaces, <b>method references</b> (<code>String::length</code>), the <b>java.time</b> API (<code>LocalDate</code>, <code>Instant</code>, immutable and thread-safe, unlike <code>Date</code> and <code>SimpleDateFormat</code>), and <b>Base64</b> in the standard library.`},
 {t:`mistake`,h:`Three common ones. (1) Using <code>parallelStream()</code> on small lists or inside a web request: it shares one common pool and can hurt more than help. (2) Changing outside state inside a stream, such as adding to a list from <code>forEach</code>: not safe in parallel. (3) Calling <code>Optional.get()</code> without checking, which just moves the NullPointerException.`},
 {t:`analogy`,h:`<code>CompletableFuture</code> is ordering food from two restaurants on two apps at the same time, instead of waiting for the first delivery before placing the second order. You place both orders, then wait until both have arrived and put the meal together. Total time is the slower delivery, not the sum of both.`},
 {t:`check`,q:`Why must local variables used inside a lambda be effectively final?`,a:`A lambda may run later or on another thread, and local variables live on the stack of the method that created it. Java copies the value into the lambda, so the variable must not change afterwards, or the copy and original would disagree. Fields are fine, because the lambda holds a reference to the object.`}
]},

/* ---------- 5 ---------- */
{id:`lesson-5`,track:`jcore`,trackName:`Java core and versions`,title:`Java 9 to 17: records, sealed classes, text blocks, switch`,min:15,
 promise:`The language got much shorter between 9 and 17. These are the features worth a real example in an interview.`,
 blocks:[
 {t:`p`,h:`<h2>Small things that you will use every day</h2>`},
 {t:`code`,cap:`Java 9 to 11`,code:`var names = List.of("Asha", "Ravi");           // 9: immutable list. 10: var infers the type
Map<String,Integer> m = Map.of("a", 1, "b", 2); // 9: immutable map
" ".isBlank();  "  hi ".strip();  "ab".repeat(3);   // 11 String additions
var client = HttpClient.newHttpClient();         // 11: modern HTTP client, replaces HttpURLConnection
String text = Files.readString(Path.of("a.txt")); // 11`},
 {t:`mistake`,h:`<code>List.of</code> and <code>Map.of</code> are <b>immutable</b>: <code>add</code> throws <code>UnsupportedOperationException</code>, and nulls are rejected. Use <code>new ArrayList&lt;&gt;(List.of(...))</code> when you need to change it. Also, <code>var</code> is not dynamic typing. The type is still fixed at compile time.`},
 {t:`analogy`,h:`A record is a pre-printed form. You decide the boxes once (name, amount, currency), and the printing press adds the fixed parts for free: a way to fill it in, a way to read each box, a way to compare two forms, and a way to print one. You do not hand-write them for every form.`},
 {t:`p`,h:`<h2>Records (Java 16): data holders with no boilerplate</h2>`},
 {t:`plain`,h:`A <b>record</b> is a class for carrying data. You list the fields once and the compiler writes the constructor, getters, <code>equals</code>, <code>hashCode</code> and <code>toString</code>. Fields are final, so it is immutable by design.`},
 {t:`code`,cap:`Before and after`,code:`// Before: about 30 lines of fields, constructor, getters, equals, hashCode, toString
// After:
public record Money(long paise, String currency) {
    public Money {                                   // compact constructor: validate here
        if (paise < 0) throw new IllegalArgumentException("negative");
    }
    public Money plus(Money o) { return new Money(paise + o.paise, currency); }
}`},
 {t:`code`,use:true,cap:`How it is used: as an API response and a map key`,code:`record OrderView(long id, String status, Money total) {}

@GetMapping("/orders/{id}")
public OrderView get(@PathVariable long id) {
    Order o = service.find(id);
    return new OrderView(o.getId(), o.getStatus().name(), new Money(o.getPaise(), "INR"));
}
// Jackson serialises it straight to {"id":7,"status":"PAID","total":{"paise":49900,"currency":"INR"}}

Map<Money,String> labels = new HashMap<>();   // safe key: immutable, equals/hashCode built in`},
 {t:`remember`,h:`A record is <b>not</b> a JPA entity. Hibernate needs a no-arg constructor and mutable fields. Use records for DTOs and responses, and keep classes for entities.`},
 {t:`code`,cap:`Java: a record doing real work (plain Java 21)`,code:`record Money(long paise, String currency) {
    Money {                                              // compact constructor: validation lives here
        if (paise < 0) throw new IllegalArgumentException("amount cannot be negative");
        currency = currency.toUpperCase();
    }
    Money plus(Money other) { return new Money(paise + other.paise, currency); }
}
static void j_record() {
    Money a = new Money(5000, "inr");
    Money b = new Money(5000, "INR");
    System.out.println(a);                                // toString written for you
    System.out.println("equal by value? " + a.equals(b)); // equals and hashCode written for you
    System.out.println("works as a map key? " + Map.of(a, "fee").get(b));
    System.out.println(a.plus(b));
    try { new Money(-1, "INR"); } catch (IllegalArgumentException e) { System.out.println("rejected: " + e.getMessage()); }
}`},
 {t:`code`,use:true,cap:`What it prints`,code:`Money[paise=5000, currency=INR]
equal by value? true
works as a map key? fee
Money[paise=10000, currency=INR]
rejected: amount cannot be negative`},
 {t:`plain`,h:`Three things to notice. The record prints itself nicely. Two records with the same values are equal and work as map keys. And the "compact constructor" is where you put validation, so an invalid <code>Money</code> can never exist.`},
 {t:`p`,h:`<h2>Switch expressions and pattern matching for instanceof</h2>`},
 {t:`code`,cap:`Java 14 and 16`,code:`// Switch as an expression: returns a value, no fall-through, no break
int days = switch (month) {
    case FEB -> 28;
    case APR, JUN, SEP, NOV -> 30;
    default -> 31;
};

// instanceof with a binding: no cast needed
if (obj instanceof String s && s.length() > 3) {
    System.out.println(s.toUpperCase());
}`},
 {t:`p`,h:`<h2>Text blocks (Java 15)</h2>`},
 {t:`code`,cap:`Multi-line strings without + and escape characters`,code:`String sql = """
    SELECT id, name
    FROM employees
    WHERE city = 'Pune'
    ORDER BY name
    """;`},
 {t:`p`,h:`<h2>Sealed classes (Java 17): a closed list of subtypes</h2>`},
 {t:`plain`,h:`A <b>sealed</b> type says exactly which classes may extend it. The compiler then knows the full list, so a switch over it needs no <code>default</code>, and adding a new subtype breaks every switch that forgot it. That is the point.`},
 {t:`code`,use:true,cap:`How it is used: a payment result that cannot have an unknown kind`,code:`sealed interface PaymentResult permits Success, Failed, Pending {}
record Success(String txnId) implements PaymentResult {}
record Failed(String reason)  implements PaymentResult {}
record Pending(String retryAfter) implements PaymentResult {}

String message(PaymentResult r) {
    return switch (r) {                       // Java 21 style; compiler checks all cases are covered
        case Success s -> "Paid, ref " + s.txnId();
        case Failed f  -> "Failed: " + f.reason();
        case Pending p -> "Try again after " + p.retryAfter();
    };
}`},
 {t:`cards`,items:[
   {h:`Also in 9 to 17`,b:`Modules (9), <code>Optional.ifPresentOrElse</code>, <code>Stream.toList()</code> (16), helpful NullPointerException messages (14), a new garbage collector line (ZGC and Shenandoah become production-ready), and strong encapsulation of JDK internals in 17.`}]},
 {t:`mistake`,h:`Calling a record "a shorter class" and stopping there. Say what it is for (immutable data), what it generates, what it cannot do (extend another class, have instance fields beyond the header, be a JPA entity), and when you would still use a normal class.`},
 {t:`analogy`,h:`A sealed type is a restaurant menu card with a fixed list of dishes. Because the list is closed, the waiter knows every possible order. If you add a new dish and forget to handle it, the compiler tells you, instead of the kitchen finding out at 9 pm.`},
 {t:`code`,cap:`Java: sealed type and a switch with no default (plain Java 21)`,code:`sealed interface Payment permits Card, Upi, Cash {}
record Card(String last4) implements Payment {}
record Upi(String handle) implements Payment {}
record Cash() implements Payment {}

static String describe(Payment p) {
    return switch (p) {                                  // no default needed: the compiler knows every case
        case Card c -> "Card ending " + c.last4();
        case Upi u  -> "UPI to " + u.handle();
        case Cash c -> "Cash on delivery";
    };
}
static void j_sealed() {
    for (Payment p : List.of(new Card("4242"), new Upi("asha@upi"), new Cash())) System.out.println(describe(p));
}`},
 {t:`code`,use:true,cap:`What it prints`,code:`Card ending 4242
UPI to asha@upi
Cash on delivery`},
 {t:`check`,q:`When would you choose a sealed interface over an enum?`,a:`An enum has a fixed set of <b>instances</b>, all of the same shape. A sealed interface has a fixed set of <b>types</b>, and each type can carry different data. Payment results are a good example: Success has a transaction id, Failed has a reason. An enum cannot hold different fields per constant cleanly.`}
]},

/* ---------- 6 ---------- */
{id:`lesson-6`,track:`jcore`,trackName:`Java core and versions`,title:`Java 18 to 21 and beyond: virtual threads and pattern matching`,min:14,
 promise:`Java 21 is the version interviewers are most curious about. Virtual threads are the headline. Learn what they fix, and what they do not.`,
 blocks:[
 {t:`plain`,h:`A normal Java thread (a <b>platform thread</b>) maps one to one onto an operating system thread. It is heavy: about a megabyte of stack, and you can run only thousands. A <b>virtual thread</b> is a light thread managed by the JVM. You can run <b>millions</b>. When one waits for I/O, the JVM parks it and uses the carrier thread for another.`},
 {t:`analogy`,h:`A restaurant with 10 waiters. In the old way, a waiter stands at your table until your food is ready. With virtual threads, the waiter takes your order, goes to serve others, and comes back when the kitchen calls. Ten waiters, thousands of tables.`},
 {t:`diagram`,cap:`Many cheap virtual threads share a few real threads. A blocked one steps aside.`,d:{w:420,alt:`Virtual threads mapped onto carrier platform threads`,nodes:[
   {id:`v`,t:`Virtual threads`,s:`millions, cheap`,x:6,y:20,w:126,m:[`one per request`,`blocking is fine`]},
   {id:`c`,t:`Carrier threads`,s:`few, = CPU cores`,x:205,y:20,w:130,m:[`ForkJoinPool`]},
   {id:`o`,t:`OS`,x:375,y:36,w:40}],
  edges:[{a:`v`,b:`c`,l:`run on`},{a:`c`,b:`o`}]}},
 {t:`code`,use:true,cap:`How it is used`,code:`// Plain Java 21
try (var executor = Executors.newVirtualThreadPerTaskExecutor()) {
    for (int i = 0; i < 10_000; i++) {
        executor.submit(() -> {
            Thread.sleep(Duration.ofSeconds(1));   // parks cheaply, does not hog an OS thread
            return callPaymentApi();
        });
    }
}   // 10,000 one-second waits finish in about 1 second

// Spring Boot 3.2 and later: one line in application.properties
// spring.threads.virtual.enabled=true     (Tomcat now serves each request on a virtual thread)`},
 {t:`analogy`,h:`Think of 10,000 delivery orders, where each order spends most of its time waiting for a restaurant to prepare the food. Hiring 10,000 full-time riders is silly and expensive. Virtual threads are like riders who put down your order while it is being cooked and pick up another one, then return when it is ready. The code you write looks like normal, simple, one-order-at-a-time code.`},
 {t:`code`,cap:`Java 21: ten thousand tasks, each waiting one second`,code:`static void j_virtual() throws Exception {
    AtomicInteger finished = new AtomicInteger();
    long start = System.nanoTime();
    try (var executor = Executors.newVirtualThreadPerTaskExecutor()) {
        for (int i = 0; i < 10_000; i++) {
            executor.submit(() -> {
                Thread.sleep(1000);                      // pretend this is a slow database call
                finished.incrementAndGet();
                return null;
            });
        }
    }                                                    // close() waits for every task
    long seconds = (System.nanoTime() - start) / 1_000_000_000;
    System.out.println("tasks finished: " + finished.get());
    System.out.println("took under 5 seconds? " + (seconds < 5));
}`},
 {t:`code`,use:true,cap:`What it prints`,code:`tasks finished: 10000
took under 5 seconds? true`},
 {t:`plain`,h:`Ten thousand ordinary threads would need a huge amount of memory and would likely fail. Virtual threads finish in a little over one second because while one waits, others use the same few real threads. Remember the rule: virtual threads help when your tasks <b>wait</b> (network, database). They do not make heavy calculation faster.`},
 {t:`p`,h:`<h2>Where they help, and where they do not</h2>`},
 {t:`two`,a:{h:`Helps`,b:`Code that mostly <b>waits</b>: web requests calling databases and other services. You keep simple blocking code and get high throughput. No need for reactive code in many cases.`},b:{h:`Does not help`,b:`CPU-heavy work. If every task burns CPU, you are limited by cores, not threads. Also not a way to make a single slow call faster.`}},
 {t:`cards`,items:[
   {h:`Do not pool them`,b:`They are cheap, so create one per task. Pooling defeats the idea. Limit concurrency with a <code>Semaphore</code> if a downstream system needs protection.`},
   {h:`Pinning`,b:`In Java 21, blocking inside a <code>synchronized</code> block can pin the virtual thread to its carrier and hurt scaling. Prefer <code>ReentrantLock</code> for long waits. This was improved in later releases.`},
   {h:`ThreadLocal`,b:`Still works but with millions of threads it costs memory. Be careful with large values.`}]},
 {t:`p`,h:`<h2>Other Java 21 language features</h2>`},
 {t:`code`,cap:`Pattern matching in switch, record patterns and sequenced collections`,code:`// Switch with type patterns and guards
String describe(Object o) {
    return switch (o) {
        case null           -> "nothing";
        case Integer i when i > 100 -> "big number";
        case Integer i      -> "number " + i;
        case String s       -> "text of length " + s.length();
        default             -> "something else";
    };
}

// Record pattern: take a record apart right in the pattern
record Point(int x, int y) {}
if (obj instanceof Point(int x, int y)) { System.out.println(x + y); }

// Sequenced collections: one API for first and last
List<String> list = new ArrayList<>(List.of("a", "b", "c"));
list.getFirst();   list.getLast();   list.reversed();`},
 {t:`remember`,h:`Beyond 21: Java 25 (September 2025) is the next LTS. It finalised features such as scoped values, and it carries performance work like compact object headers. If asked, say you track the six-monthly releases but upgrade on LTS, because that is how most companies plan support.`},
 {t:`mistake`,h:`Saying "virtual threads make Java reactive code obsolete" or "make everything faster". They make <b>blocking style scale</b>. They do not speed up one request, and they do not help CPU-bound code.`},
 {t:`check`,q:`Your Spring Boot service calls three slow downstream APIs per request and runs out of Tomcat threads under load. Name two options and the trade-off.`,a:`Option 1: enable virtual threads (Java 21, Boot 3.2). Simple, keeps blocking code, but watch pinning and protect downstream services with limits. Option 2: reactive stack with WebFlux. Highest control and efficiency, but a harder programming model and everything must be non-blocking. A smaller option: increase the pool and parallelise the three calls with CompletableFuture.`}
]},

{id:`lesson-7`,track:`jcore`,trackName:`Java core and versions`,title:`Java questions with full answers`,min:45,
 promise:`Thirteen questions in the form they are asked. Answer aloud first, then open the walk-through.`,
 blocks:[
 {t:`qbank`,items:[
 {n:`How does HashMap work internally?`,tag:`Collections`,where:`The most reported Java internals question, from service companies to product firms`,
  ask:`Explain how a HashMap stores and finds entries. What happens on a collision and on resize?`,
  quality:`Hash to index to equals, collision handling, load factor, and the Java 8 tree change.`,
  steps:[[`Structure.`,` An array of buckets. Each holds a linked list, or a red-black tree when long.`],[`put.`,` Compute <code>hashCode</code>, spread bits, index = hash &amp; (n-1). Empty bucket: place the node. Otherwise walk the chain using <code>equals</code>. A match replaces the value, else it appends.`],[`get.`,` Same steps to the bucket, then <code>equals</code> to find the key.`],[`Resize.`,` When size passes capacity x 0.75, the array doubles and entries move to new buckets.`],[`Treeify.`,` A chain of 8 or more in a table of 64 or more becomes a tree, so the worst case is O(log n).`]],
  trade:`Bigger load factor saves memory but means more collisions. Smaller wastes memory but is faster. Pre-size the map if you know the count.`,
  follow:`Why is capacity a power of two? What if hashCode returns a constant? What is the difference with ConcurrentHashMap?`},
 {n:`equals and hashCode contract`,tag:`Core`,where:`Asked often as a "what breaks" question`,
  ask:`What is the contract between equals and hashCode? What happens if you override only one?`,
  quality:`State the rule, then show the concrete failure in a HashMap or HashSet.`,
  steps:[[`Rule.`,` Equal objects must have equal hash codes. Equal hash codes do not imply equal objects.`],[`Only equals.`,` Equal objects hash to different buckets, so a HashSet holds duplicates and a get returns null.`],[`Only hashCode.`,` All objects collide into the same chain, and equal objects are not found as equal.`],[`Good practice.`,` Use the same fields in both. Use <code>Objects.hash</code>, a record, or IDE or Lombok generation.`]],
  trade:`Including more fields makes equality stricter and hashing slightly slower. Mutable fields are dangerous.`,
  follow:`How does Hibernate treat equals on entities? Should the id be part of it?`},
 {n:`HashMap vs ConcurrentHashMap vs Hashtable`,tag:`Collections`,where:`A standard pairing with concurrency questions`,
  ask:`When would you use each, and how does ConcurrentHashMap stay safe without locking the whole map?`,
  quality:`Name the locking difference and the atomic methods.`,
  steps:[[`HashMap.`,` Fastest, single thread only.`],[`Hashtable.`,` Legacy. Locks the whole object on each method.`],[`ConcurrentHashMap.`,` Reads are lock-free. Writes use compare-and-swap for an empty bucket, otherwise a lock on that bucket's first node. Java 7 used segment locks. Java 8 moved to this finer design.`],[`Atomic helpers.`,` Use <code>compute</code>, <code>merge</code>, <code>putIfAbsent</code> instead of get then put.`]],
  trade:`No null keys or values. Size and iteration are only weakly consistent while others write.`,
  follow:`Why no nulls? What is a weakly consistent iterator? When would you use a synchronized wrapper?`},
 {n:`Why are Strings immutable? String pool?`,tag:`Core`,where:`Almost always asked in the first ten minutes`,
  ask:`Why is String immutable? What is the string pool and what does intern do?`,
  quality:`Give reasons beyond "security", and show the == puzzle.`,
  steps:[[`Reasons.`,` Thread safety for free. Cached hash code makes it a good key. Safe for class names, file paths and network parameters. Enables the pool.`],[`Pool.`,` Literals are shared from a pool inside the heap, so identical literals are one object.`],[`new String and intern.`,` <code>new String("a")</code> makes a separate object. <code>intern()</code> returns the pooled one.`],[`Concatenation.`,` Each <code>+</code> in a loop creates objects. Use StringBuilder.`]],
  trade:`Immutability means more garbage, but the JVM handles short-lived objects well.`,
  follow:`Is StringBuilder thread-safe? What changed about the string pool location in Java 7 and 8?`},
 {n:`Abstract class vs interface after Java 8`,tag:`OOP`,where:`A permanent favourite, now with default methods added`,
  ask:`With default methods, why do we still need abstract classes? What about the diamond problem?`,
  quality:`Show you know what each is for, and the clash rule.`,
  steps:[[`Interfaces.`,` Capabilities. A class may implement many. No instance state.`],[`Abstract classes.`,` Shared state and partial implementation. Single inheritance.`],[`Default methods.`,` Added so interfaces could evolve, such as <code>List.sort</code>, without breaking implementers.`],[`Clash.`,` If a class inherits two defaults with the same signature, it must override and can call one with <code>A.super.m()</code>.`]],
  trade:`Choose an interface for the contract and an abstract class only when you need shared fields or a template.`,
  follow:`Can an interface have a constructor? A private method? What is a functional interface?`},
 {n:`Explain streams and lazy evaluation`,tag:`Java 8`,where:`Present in nearly every Java 8 plus round`,
  ask:`How do streams work? What is the difference between intermediate and terminal operations? Is parallelStream always faster?`,
  quality:`Lazy pipelines, single use, and honest views on parallel streams.`,
  steps:[[`Pipeline.`,` Source, intermediate operations, one terminal operation.`],[`Lazy.`,` Nothing runs until the terminal operation. Elements flow one by one through all steps, so <code>findFirst</code> can stop early.`],[`Single use.`,` Reusing a consumed stream throws <code>IllegalStateException</code>.`],[`Parallel.`,` Splits work over the common ForkJoinPool. Helps for large, CPU-bound, independent work. Hurts for small data, ordered work, blocking I/O, or shared mutable state.`]],
  code:{cap:`Top 3 highest paid per department`,code:`Map<String, List<String>> top3 = employees.stream()
    .collect(Collectors.groupingBy(Employee::dept,
        Collectors.collectingAndThen(
            Collectors.toList(),
            list -> list.stream()
                .sorted(Comparator.comparingDouble(Employee::salary).reversed())
                .limit(3).map(Employee::name).toList())));`,use:`// Typical use in a report endpoint
GET /departments/top-earners  ->  {"Engineering":["Asha","Ravi","Meera"], "Sales":[...]}`},
  trade:`Streams are readable for transformations. A plain loop is clearer for complex control flow, and it is easier to debug.`,
  follow:`map vs flatMap? What does Collectors.toMap do on duplicate keys (it throws unless you give a merge function)? Why avoid side effects?`},
 {n:`Optional: how and how not to use it`,tag:`Java 8`,where:`Follow-up to streams`,
  ask:`When should you use Optional? What are anti-patterns?`,
  quality:`Return type only, with the exceptions listed.`,
  steps:[[`Use.`,` As a method return type where "no result" is normal.`],[`Chain.`,` <code>map</code>, <code>flatMap</code>, <code>orElse</code>, <code>orElseGet</code>, <code>orElseThrow</code>.`],[`Do not.`,` Use as a field, a method parameter, or in a collection. Do not call <code>get()</code> blindly. Do not wrap a collection: return an empty one instead.`],[`orElse vs orElseGet.`,` <code>orElse(x)</code> always evaluates x. <code>orElseGet(() -> x)</code> only when empty. Use the second for expensive defaults.`]],
  trade:`Adds an allocation and some noise, in exchange for an API that cannot be forgotten.`,
  follow:`Is Optional serializable? How does Spring Data use it?`},
 {n:`CompletableFuture vs Future`,tag:`Java 8`,where:`Tied to microservice aggregation questions`,
  ask:`Why is CompletableFuture better than Future? How do you combine several calls and handle failure?`,
  quality:`Non-blocking chaining, combination, error handling and the thread pool you choose.`,
  steps:[[`Future.`,` Only <code>get()</code>, which blocks. No chaining, no callbacks.`],[`CompletableFuture.`,` <code>thenApply</code>, <code>thenCompose</code>, <code>thenCombine</code>, <code>allOf</code>, <code>anyOf</code>.`],[`Failure.`,` <code>exceptionally</code>, <code>handle</code>, <code>whenComplete</code>. Exceptions are wrapped in <code>CompletionException</code>.`],[`Pool.`,` Pass your own executor. The default is the common pool, which is shared and sized for CPU work.`]],
  trade:`Powerful but callback-heavy. With virtual threads, simple blocking code plus structured concurrency can be easier to read.`,
  follow:`thenApply vs thenCompose? What does join do versus get? How do you set a timeout?`},
 {n:`What are records, and what are their limits?`,tag:`Java 17`,where:`Opening question on modern Java`,
  ask:`What is a record? When would you not use one?`,
  quality:`Generated members, immutability, and the limits.`,
  steps:[[`What.`,` A transparent carrier of immutable data. The compiler generates constructor, accessors, equals, hashCode, toString.`],[`Customise.`,` Compact constructor for validation, extra methods and static factories.`],[`Limits.`,` Cannot extend a class, fields are final, cannot declare extra instance fields. Not suited to JPA entities, which need mutability and a no-arg constructor.`],[`Use.`,` DTOs, API responses, map keys, value objects such as Money.`]],
  trade:`Less code and safer sharing, but no inheritance and no lazy or mutable state.`,
  follow:`Can a record implement an interface? Can it be serialised by Jackson? (yes to both)`},
 {n:`Sealed classes and pattern matching`,tag:`Java 17-21`,where:`Rising in 2026 round write-ups`,
  ask:`What problem do sealed types solve? How do they combine with switch?`,
  quality:`Closed hierarchy plus exhaustive checking.`,
  steps:[[`Problem.`,` An open interface can have unknown implementations, so a switch needs a default that hides mistakes.`],[`Sealed.`,` <code>permits</code> lists the allowed subtypes, which must be final, sealed or non-sealed.`],[`Switch.`,` The compiler checks that every subtype is handled. Add a new subtype and the code fails to compile until handled.`],[`Style.`,` Often paired with records, giving "algebraic data types".`]],
  trade:`Less open for extension by outsiders. Choose it for domain results and states, not for plug-in points.`,
  follow:`Sealed vs enum? Where does the permitted list have to live (same module or package)?`},
 {n:`Virtual threads: what, why, limits`,tag:`Java 21`,where:`The most asked Java 21 question`,
  ask:`What are virtual threads? Do they replace thread pools or reactive programming?`,
  quality:`Mechanism, the right use case, and honest limits.`,
  steps:[[`What.`,` JVM-managed lightweight threads that run on a few carrier threads and park during blocking I/O.`],[`Why.`,` Simple blocking code scales to very many concurrent requests.`],[`Do not pool.`,` Create one per task and limit with semaphores where needed.`],[`Limits.`,` No gain for CPU-bound work. Pinning in <code>synchronized</code> blocks in 21. Heavy <code>ThreadLocal</code> use costs memory.`]],
  trade:`Reactive gives backpressure and fine control but is complex. Virtual threads give simplicity but no built-in backpressure.`,
  follow:`How do you enable them in Spring Boot? How do you limit calls to a fragile database? What is structured concurrency?`},
 {n:`Checked vs unchecked exceptions, and design`,tag:`Core`,where:`Common in design discussions`,
  ask:`Which do you prefer for business errors? How does Spring treat them for transactions?`,
  quality:`A reasoned stance and the Spring rollback rule.`,
  steps:[[`Definitions.`,` Checked must be declared or caught. Unchecked need not be.`],[`Stance.`,` Most modern code uses unchecked for business and technical errors, with a central handler, because checked exceptions pollute signatures.`],[`Spring.`,` <code>@Transactional</code> rolls back for unchecked exceptions by default, and not for checked unless you set <code>rollbackFor</code>.`],[`API layer.`,` Map exceptions to status codes in one <code>@ControllerAdvice</code>.`]],
  code:{cap:`One place that turns exceptions into responses`,code:`@RestControllerAdvice
class ApiErrors {
    @ExceptionHandler(NotFoundException.class)
    ResponseEntity<Map<String,String>> notFound(NotFoundException e) {
        return ResponseEntity.status(404).body(Map.of("error", e.getMessage()));
    }
}`,use:`// Any controller or service can now just: throw new NotFoundException("order 7");
// The client gets HTTP 404 with {"error":"order 7"}`},
  trade:`Checked exceptions force handling but spread through every signature. Unchecked are lighter but easier to forget.`,
  follow:`What does try-with-resources do with suppressed exceptions? What happens if finally throws?`},
 {n:`Migrating a service from Java 8 to 17`,tag:`Experience`,where:`A favourite for 8 to 10 year experience candidates`,
  ask:`How would you upgrade a large Spring service from Java 8 to 17? What breaks?`,
  quality:`A staged plan with known pitfalls. This shows seniority.`,
  steps:[[`Inventory.`,` List dependencies and plugins. Run the build on 17 to see failures.`],[`Go in steps.`,` Often 8 to 11 first, then 11 to 17, running tests at each step.`],[`Known breaks.`,` Removed modules (JAXB, javax.annotation), strong encapsulation of JDK internals (illegal reflective access fails in 17), old bytecode libraries (ASM, Lombok, Mockito versions).`],[`Spring.`,` Boot 2.7 runs on 17. Boot 3 needs 17 and renames <code>javax.*</code> to <code>jakarta.*</code>.`],[`Rollout.`,` Run on 17 in a test environment, compare performance and GC logs, then canary release.`]],
  trade:`Staying on 8 costs support and talent. Upgrading costs testing effort, mostly on dependencies.`,
  follow:`How do you find uses of internal APIs? (<code>jdeps</code>) What changes in GC defaults?`}
 ]},

var STAGES=[
 {l:'1 server',hurt:'Nothing yet.',fix:'One app server and one database is a perfectly good start. Spend your effort on a clean data model and the right indexes.',cost:'None, and that is the point. Every extra part is something to run and debug.'},
 {l:'Slow queries',hurt:'Pages slow down because the app and database share one machine, and some queries scan whole tables.',fix:'Add indexes. Move the database to its own machine. Use a bigger machine if needed.',cost:'A bigger machine has a ceiling, and one failure still takes everything down.'},
 {l:'Read-heavy',hurt:'The database is busy answering the same read questions again and again.',fix:'Add a cache for popular data. Add read replicas (copies for reading).',cost:'Data can be slightly stale. You now have to decide when to refresh the cache.'},
 {l:'One server is not enough',hurt:'One app server cannot take the traffic, and if it dies, the site is down.',fix:'Run several identical app servers behind a load balancer. Keep them stateless, so any server can handle any request.',cost:'You must move user sessions out of server memory, and handle deployments carefully.'},
 {l:'Slow work blocks users',hurt:'Sending emails or making reports makes users wait. Spikes of traffic can overwhelm the database.',fix:'Put slow work on a queue and let workers process it in the background.',cost:'Duplicates can happen, so workers must be safe to run twice. Users see "pending" for a while.'},
 {l:'Data too big',hurt:'One database cannot hold all the data or take all the writes.',fix:'Split the data across several databases by a key, such as user id. This is sharding.',cost:'Queries across shards are hard, and a popular key can overload one shard.'},
 {l:'Global users',hurt:'Users far from your servers get slow responses, and one data-center outage takes everyone down.',fix:'Serve static files from a CDN. Run in more than one region and route users to the nearest one.',cost:'Data in different regions can briefly disagree, and the bill grows a lot.'}
];

function el(tag,cls,html){var e=document.createElement(tag);if(cls)e.className=cls;if(html!=null)e.innerHTML=html;return e}

function fmt(n){
  if(n>=1e9)return (n/1e9).toFixed(1)+' B';
  if(n>=1e6)return (n/1e6).toFixed(1)+' M';
  if(n>=1e3)return (n/1e3).toFixed(1)+' K';
  return n<10?n.toFixed(1):String(Math.round(n));
}
function fmtBytes(n){var u=['B','KB','MB','GB','TB','PB'],i=0;while(n>=1000&&i<u.length-1){n/=1000;i++}return (n<10?n.toFixed(1):Math.round(n))+' '+u[i]}

    n=el('div','cards');
    b.items.forEach(function(c){
      n.appendChild(el('div','card','<h3>'+c.h+'</h3>'+(c.pic?'<div class="pic">'+c.pic+'</div>':'')+'<p>'+c.b+'</p>'+(c.small?'<p class="small">'+c.small+'</p>':'')));
    });
    host.appendChild(n);break;
  case 'code':
    n=el('div','sec');
    var cap=el('div','cap'+(b.bad?' bad':'')+(b.good?' good':''),b.cap||'');
    if(b.use)cap.className+=' use';
    var pre=document.createElement('pre');pre.textContent=b.code;if(b.use)pre.className='use';
    n.appendChild(cap);n.appendChild(pre);host.appendChild(n);break;
  case 'check':
    n=el('div','check');
    n.appendChild(el('div','label','Check yourself'));
    n.appendChild(el('p','q',b.q));
    var btn=el('button','reveal','Think, then show the answer');btn.type='button';
    var ans=el('div','ans',b.a);ans.hidden=true;
    btn.addEventListener('click',function(){ans.hidden=!ans.hidden;btn.textContent=ans.hidden?'Think, then show the answer':'Hide the answer'});
    n.appendChild(btn);n.appendChild(ans);host.appendChild(n);break;
  case 'qbank': host.appendChild(buildQbank(b.items));break;
  case 'diagram': host.appendChild(buildDiagram(b));break;
  case 'links':
    n=el('div','links');
    b.items.forEach(function(x){var a=document.createElement('a');a.href=x[1];a.target='_blank';a.rel='noopener noreferrer';a.textContent=x[0];n.appendChild(a)});
    host.appendChild(n);break;
  case 'calc': host.appendChild(buildCalc());break;
  case 'stages': host.appendChild(buildStages());break;
  case 'drill': host.appendChild(buildDrill());break;
  }
}

function buildCalc(){
  var box=el('div','check');
  box.appendChild(el('div','label','Try it'));
  box.appendChild(el('p',null,'Change the numbers and watch what moves. Start with the example from above.'));
  box.appendChild(el('div','fields',
    '<div class="field"><label for="c-dau">Daily users (millions)</label><input id="c-dau" type="number" min="0" step="any" value="10"></div>'+
    '<div class="field"><label for="c-act">Actions per user per day</label><input id="c-act" type="number" min="0" step="any" value="20"></div>'+
    '<div class="field"><label for="c-rpw">Reads for every 1 write</label><input id="c-rpw" type="number" min="0" step="any" value="10"></div>'));
  var out=el('div','out');out.setAttribute('aria-live','polite');box.appendChild(out);
  var msg=el('div','box');box.appendChild(msg);
  function num(id){var v=parseFloat(box.querySelector(id).value);return isFinite(v)&&v>=0?v:0}
  function run(){
    var dau=num('#c-dau')*1e6,act=num('#c-act'),rpw=num('#c-rpw');
    var day=dau*act,avg=day/86400,pk=avg*3,w=pk/(rpw+1),r=pk-w;
    var data=day/(rpw+1)*1000*365;
    out.innerHTML=
      '<div><span>Requests per day</span><b>'+fmt(day)+'</b></div>'+
      '<div><span>Average per second</span><b>'+fmt(avg)+'</b></div>'+
      '<div><span>Busy-hour per second (x3)</span><b>'+fmt(pk)+'</b></div>'+
      '<div><span>Reads per second at peak</span><b>'+fmt(r)+'</b></div>'+
      '<div><span>Writes per second at peak</span><b>'+fmt(w)+'</b></div>'+
      '<div><span>New data per year (1 KB per write)</span><b>'+fmtBytes(data)+'</b></div>';
    var m;
    if(r<1000&&w<500)m='<b>What this means:</b> one well-tuned database can handle this. Keep it simple.';
    else if(r<10000)m='<b>What this means:</b> reads are the pressure. Add a cache and maybe read replicas.';
    else m='<b>What this means:</b> reads are very high. You need a cache layer, and likely a CDN for static files.';
    if(w>=5000)m+=' Writes are high too, so think about a queue and splitting the data.';
    msg.innerHTML='<p>'+m+'</p>';
  }
  box.addEventListener('input',run);run();
  return box;
}

function buildStages(){
  var wrap=el('div','sec'),sel=2;
  var row=el('div','row');wrap.appendChild(row);
  var panel=el('div','check');panel.setAttribute('aria-live','polite');wrap.appendChild(panel);
  function draw(){
    Array.prototype.forEach.call(row.children,function(b,i){b.setAttribute('aria-pressed',i===sel?'true':'false')});
    var s=STAGES[sel];
    panel.innerHTML='<div><div class="label">What hurts</div><p>'+s.hurt+'</p></div>'+
      '<div><div class="label">The fix</div><p>'+s.fix+'</p></div>'+

    b.addEventListener('click',function(){sel=i;draw()});row.appendChild(b);

function buildDiagram(b){
  var spec=b.d,NS='http://www.w3.org/2000/svg';
  function s(tag,attrs,text){var e=document.createElementNS(NS,tag);for(var k in attrs)e.setAttribute(k,attrs[k]);if(text!=null)e.textContent=text;return e}
  var W=spec.w||420,byId={};
  spec.nodes.forEach(function(n){
    var hdr=n.k==='state'?34:(n.k==='note'?0:(n.s?38:28));
    var ml=n.m?n.m.length:0;
    if(n.k==='state')n.h=34;
    else if(n.k==='note')n.h=ml*14+14;
    else n.h=hdr+(ml?10+14*ml:0);
    n.hdr=hdr;byId[n.id]=n;
  });
  var H=0;spec.nodes.forEach(function(n){H=Math.max(H,n.y+n.h)});H+=14;
  var svg=s('svg',{viewBox:'0 0 '+W+' '+H,role:'img','aria-label':spec.alt||''});
  var defs=s('defs',{});
  function marker(id,w,h,rx,ry,child){
    var m=s('marker',{id:id,viewBox:'0 0 '+w+' '+h,refX:rx,refY:ry,markerWidth:w,markerHeight:h,markerUnits:'userSpaceOnUse',orient:'auto'});
    m.appendChild(child);defs.appendChild(m);
  }
  var uid='m'+Math.floor(Math.random()*1e6);
  marker(uid+'t',12,12,11,6,s('path',{d:'M1,1 L11,6 L1,11 z','class':'mk-tri'}));
  marker(uid+'o',12,12,11,6,s('path',{d:'M1,1 L11,6 L1,11','class':'mk-open'}));
  marker(uid+'f',12,12,11,6,s('path',{d:'M1,1 L11,6 L1,11 z','class':'mk-fill'}));
  marker(uid+'d',14,12,0,6,s('path',{d:'M1,6 L7,1 L13,6 L7,11 z','class':'mk-tri'}));
  svg.appendChild(defs);
  function clip(n,tx,ty){
    var cx=n.x+n.w/2,cy=n.y+n.h/2,dx=tx-cx,dy=ty-cy;
    if(dx===0&&dy===0)return [cx,cy];
    var t=Math.min(dx!==0?(n.w/2)/Math.abs(dx):1e9,dy!==0?(n.h/2)/Math.abs(dy):1e9);
    return [cx+dx*t,cy+dy*t];
  }
  spec.edges.forEach(function(e){
    var A=byId[e.a],B=byId[e.b];
    var ax=A.x+A.w/2,ay=A.y+A.h/2,bx=B.x+B.w/2,by=B.y+B.h/2;
    var dx=bx-ax,dy=by-ay,len=Math.sqrt(dx*dx+dy*dy)||1,o=e.o||0;
    var nx=-dy/len*o,ny=dx/len*o;
    var p1=clip(A,bx+nx,by+ny),p2=clip(B,ax+nx,ay+ny);
    p1=[p1[0]+nx,p1[1]+ny];p2=[p2[0]+nx,p2[1]+ny];
    var k=e.k||'arrow',dash=(k==='implements'||k==='uses');
    var line=s('line',{x1:p1[0],y1:p1[1],x2:p2[0],y2:p2[1],'class':'dg-e'+(dash?' dash':'')});
    if(k==='extends'||k==='implements')line.setAttribute('marker-end','url(#'+uid+'t)');
    else if(k==='uses')line.setAttribute('marker-end','url(#'+uid+'o)');
    else if(k==='has'){line.setAttribute('marker-start','url(#'+uid+'d)');line.setAttribute('marker-end','url(#'+uid+'o)')}
    else line.setAttribute('marker-end','url(#'+uid+'f)');
    svg.appendChild(line);
    if(e.l){
      var mx=(p1[0]+p2[0])/2,my=(p1[1]+p2[1])/2,lw=e.l.length*5.6+10;
      svg.appendChild(s('rect',{x:mx-lw/2,y:my-8,width:lw,height:15,rx:3,'class':'dg-lb'}));
      svg.appendChild(s('text',{x:mx,y:my+3.5,'class':'dg-l'},e.l));
    }
  });
  spec.nodes.forEach(function(n){
    var cls=n.k==='iface'?'dg-if':(n.k==='state'?'dg-st':(n.k==='note'?'dg-note':'dg-box'));
    svg.appendChild(s('rect',{x:n.x,y:n.y,width:n.w,height:n.h,rx:n.k==='state'?17:6,'class':cls}));
    if(n.k==='note'){
      (n.m||[]).forEach(function(l,i){svg.appendChild(s('text',{x:n.x+n.w/2,y:n.y+16+i*14,'class':'dg-n'},l))});
      return;
    }
    if(n.s)svg.appendChild(s('text',{x:n.x+n.w/2,y:n.y+15,'class':'dg-s'},'«'+n.s+'»'));
    svg.appendChild(s('text',{x:n.x+n.w/2,y:n.y+(n.k==='state'?22:(n.s?31:19)),'class':'dg-t'},n.t));
    if(n.m&&n.m.length){
      svg.appendChild(s('line',{x1:n.x,y1:n.y+n.hdr,x2:n.x+n.w,y2:n.y+n.hdr,'class':'dg-sep'}));
      n.m.forEach(function(l,i){svg.appendChild(s('text',{x:n.x+8,y:n.y+n.hdr+6+(i+1)*14-3,'class':'dg-m'},l))});
    }
  });
  var wrap=el('div','diagram');
  wrap.appendChild(svg);
  if(b.cap)wrap.appendChild(el('p','dcap',b.cap));
  return wrap;
}

function buildQbank(items){
  var wrap=el('div');
  items.forEach(function(q){
    var d=document.createElement('details');d.className='q';
    var s=document.createElement('summary');
    s.innerHTML='<span class="qleft"><span>'+q.n+'</span><span class="pill">'+q.tag+'</span></span>';
    d.appendChild(s);
    var b=el('div','qbody');
    b.appendChild(el('p','where','<b>Seen in:</b> '+q.where));
    b.appendChild(el('div','qsec','<div class="label">The question</div><p>'+q.ask+'</p>'));
    b.appendChild(el('div','qsec','<div class="label">What matters most</div><p>'+q.quality+'</p>'));
    var st=el('div','qsec','<div class="label">Walk through it</div>');
    var ol=el('ol','steps');
    q.steps.forEach(function(x){ol.appendChild(el('li',null,'<div><b>'+x[0]+'</b>'+x[1]+'</div>'))});
    st.appendChild(ol);b.appendChild(st);
    if(q.code){
      var c=el('div','qsec');
      c.appendChild(el('div','cap',q.code.cap));
      var pre=document.createElement('pre');pre.textContent=q.code.code;c.appendChild(pre);
      if(q.code.use){
        c.appendChild(el('div','cap use','How it is used'));
        var p2=document.createElement('pre');p2.className='use';p2.textContent=q.code.use;c.appendChild(p2);
      }
      b.appendChild(c);
    }
    b.appendChild(el('div','qsec','<div class="label">Trade-offs to say out loud</div><p>'+q.trade+'</p>'));
    b.appendChild(el('div','qsec','<div class="label">Follow-ups to expect</div><p>'+q.follow+'</p>'));
    d.appendChild(b);wrap.appendChild(d);
  });
  return wrap;
}

var P={lld:['Design a parking lot','Design an elevator system','Design Splitwise (shared expenses)','Design a library system','Design a vending machine','Design an LRU cache','Design a chess game','Design an ATM','Design a movie ticket booking system','Design a logging framework'],
 hld:['Design a URL shortener','Design a news feed','Design a chat application','Design a video streaming service','Design a ride-hailing app','Design a notification system','Design a web crawler','Design search autocomplete','Design a payment system','Design a ticket booking system']};
var timerState={remaining:1200,running:false,endAt:0,id:null};
function buildDrill(){
  var box=el('div','check'),kind='lld',cur='';
  box.appendChild(el('div','label','Today\'s drill'));
  var pill=el('span','pill','LLD');var pw=el('div');pw.appendChild(pill);box.appendChild(pw);
  var prompt=el('p',null,'');prompt.style.cssText='font:600 1.2rem/1.4 var(--font-display)';box.appendChild(prompt);
  var r1=el('div','row');
  var bl=el('button','reveal','New LLD prompt'),bh=el('button','reveal','New HLD prompt');bl.type=bh.type='button';
  r1.appendChild(bl);r1.appendChild(bh);box.appendChild(r1);
  var time=el('div','timer','20:00');box.appendChild(time);
  var phase=el('p',null,'Ready when you are.');box.appendChild(phase);
  var r2=el('div','row');
  var st=el('button','btn','Start'),rs=el('button','btn ghost','Reset');st.type=rs.type='button';
  r2.appendChild(st);r2.appendChild(rs);box.appendChild(r2);
  function pick(k){kind=k;var l=P[k],p=cur;while(p===cur)p=l[Math.floor(Math.random()*l.length)];cur=p;prompt.textContent=p;pill.textContent=k.toUpperCase()}
  function render(){
    var rem=timerState.remaining,m=Math.floor(rem/60),s=rem%60;
    time.textContent=(m<10?'0':'')+m+':'+(s<10?'0':'')+s;
    var el_=1200-rem,txt;
    if(rem<=0)txt='Time. Now write one line: what did I skip or hand-wave?';
    else if(!timerState.running&&el_===0)txt='Ready when you are. Talk out loud.';
    else if(el_<300)txt='Clarify: ask questions, pick three must-haves and one key quality.';
    else if(el_<900)txt=kind==='lld'?'Model: nouns, verbs, who owns what, what will change.':'Model: numbers, the two actions, smallest design, what breaks first.';
    else txt='Stress and trade: two users at once, a new requirement, then the template sentence.';
    phase.textContent=txt;
    st.textContent=timerState.running?'Pause':(rem<=0||rem===1200?'Start':'Resume');
  }
  function tick(){
    timerState.remaining=Math.max(0,Math.ceil((timerState.endAt-Date.now())/1000));
    if(timerState.remaining<=0){timerState.running=false;clearInterval(timerState.id);timerState.id=null}
    render();
  }
  st.addEventListener('click',function(){
    if(timerState.running){timerState.running=false;clearInterval(timerState.id);timerState.id=null;render();return}
    if(timerState.remaining<=0)timerState.remaining=1200;
    timerState.running=true;timerState.endAt=Date.now()+timerState.remaining*1000;
    timerState.id=setInterval(tick,500);render();
  });
  rs.addEventListener('click',function(){timerState.running=false;clearInterval(timerState.id);timerState.id=null;timerState.remaining=1200;render()});
  bl.addEventListener('click',function(){pick('lld');render()});
  bh.addEventListener('click',function(){pick('hld');render()});
  pick('lld');render();
  return box;
}

/* ================= PAGE ================= */
var cur=0;
function idx(){
  var h=(location.hash||'').replace('#','');
  for(var i=0;i<L.length;i++)if(L[i].id===h)return i;
  return 0;
}
function drawList(){
  var host=$('#list');host.innerHTML='';
  var last='';
  L.forEach(function(l,i){
    if(l.trackName!==last){last=l.trackName;host.appendChild(el('h3',null,l.trackName))}
    var a=document.createElement('a');a.href='#'+l.id;
    if(i===cur)a.setAttribute('aria-current','page');
    a.innerHTML='<span class="n">'+(i+1)+'</span><span>'+l.title+'</span><span class="'+(done[l.id]?'tick':'min')+'">'+(done[l.id]?'&#10003; done':l.min+' min')+'</span>';
    a.addEventListener('click',function(){closeList()});
    host.appendChild(a);
  });
}
function closeList(){$('#list').classList.remove('open');$('#menu-btn').setAttribute('aria-expanded','false')}
$('#menu-btn').addEventListener('click',function(){
  var o=$('#list').classList.toggle('open');this.setAttribute('aria-expanded',o?'true':'false');
});
function meter(){
  var n=0;L.forEach(function(l){if(done[l.id])n++});
  $('#meter').style.width=Math.round(n/L.length*100)+'%';
}
function draw(){
  cur=idx();
  var l=L[cur];
  document.body.setAttribute('data-track',l.track);
  $('#where').textContent='Lesson '+(cur+1)+' of '+L.length+' · '+l.trackName;
  var host=$('#lesson');host.innerHTML='';
  var head=el('div');
  head.appendChild(el('div','kicker',l.trackName+' · about '+l.min+' minutes'));
  head.appendChild(el('h1',null,l.title));
  head.appendChild(el('p','promise',l.promise));
  host.appendChild(head);
  l.blocks.forEach(function(b){renderBlock(b,host)});
  var dr=el('label','done-row');
  var cb=document.createElement('input');cb.type='checkbox';cb.checked=!!done[l.id];
  cb.addEventListener('change',function(){if(cb.checked)done[l.id]=1;else delete done[l.id];save();meter();drawList()});
  dr.appendChild(cb);dr.appendChild(el('span',null,'I finished this lesson'));
  host.appendChild(dr);
  var nav=el('div','nav');
  var pv=el('button','btn ghost','Previous');pv.type='button';pv.disabled=cur===0;
  var nx=el('button','btn',cur===L.length-1?'Back to lesson 1':'Next lesson');nx.type='button';
  pv.addEventListener('click',function(){if(cur>0)location.hash=L[cur-1].id});
  nx.addEventListener('click',function(){location.hash=L[cur===L.length-1?0:cur+1].id});
  nav.appendChild(pv);nav.appendChild(nx);host.appendChild(nav);
  meter();drawList();
}
window.addEventListener('hashchange',function(){draw();window.scrollTo(0,0)});
draw();
})();
