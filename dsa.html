var L=[
/* ---------- 1 ---------- */
{id:`lesson-1`,track:`dsa`,trackName:`DSA and coding rounds`,title:`How coding rounds really run, and how you will beat them`,min:12,
 promise:`You said DSA is where you feel least sure. So this course is built for that: one pattern at a time, every problem walked through in plain steps, and Java code that has been compiled and run.`,
 blocks:[
 {t:`plain`,h:`A coding round at a product company is usually <b>one or two problems in 45 to 60 minutes</b>, written in Java in a shared editor while you talk. The problems are mostly medium level, sometimes with one hard. The interviewer scores <b>how you think</b>, not only whether the code runs.`},
 {t:`analogy`,h:`Think of cooking, not memorising recipes. A cook who knows five basic methods (fry, boil, roast, steam, bake) can make hundreds of dishes. DSA is the same. A handful of <b>patterns</b> (hashing, two pointers, binary search, BFS, DP) cover most questions. You learn the method once and recognise it in new clothes.`},
 {t:`p`,h:`<h2>What candidates report from the companies you named</h2><p>These come from individual interview write-ups on LeetCode Discuss, Glassdoor and Naukri Code360. Questions change from round to round. Use them to learn the <b>flavour</b> of each company, not as a leaked list.</p>`},
 {t:`cards`,items:[
   {h:`Swiggy`,pic:`DSA, then design, then bar-raiser`,b:`Online assessment of 2 to 3 problems (arrays, hash maps, sliding window). Then a DSA round, often with an LLD part. Reported problems: Koko Eating Bananas, RandomizedSet, Trie, intervals and arrays, a BST question, a medium string-subsequence problem and a hard graph problem on shortest path with at most K hops.`,small:`SDE-2 reports describe two DSA rounds plus a bar-raiser.`},
   {h:`Zomato`,pic:`Standard sheet-style problems`,b:`Placement reports say the DSA questions resemble the well-known SDE sheets. Reported: Insert Delete GetRandom, Unique Paths II, graph questions, plus a text-editor design and CS fundamentals.`,small:`Mostly medium LeetCode level.`},
   {h:`CRED`,pic:`DSA and puzzles, then machine coding`,b:`A 90-minute DSA and puzzles round (medium to hard): pair with sum K, LRU Cache (even thread-safe or with changing capacity), arrays, strings, hashing, trees, graphs and DP. N-Queens was reported for a fresher. Then a 2.5-hour machine coding round.`,small:`CRED weighs machine coding about as much as DSA.`},
   {h:`Flipkart`,pic:`Machine coding plus DSA`,b:`SDE-2 reports: a machine coding round, a 45-minute DSA round with two mediums (DP and tree), a design round and a hiring manager round. An online assessment of two problems in two hours.`},
   {h:`Razorpay`,pic:`One medium plus design`,b:`Online assessment of 2 to 3 problems. At SDE-2, one medium DSA problem and one high-level design problem. Reported: find the missing number. Interviewers like practical follow-ups such as "what if the input is 100 times larger?"`},
   {h:`PhonePe`,pic:`Four rounds`,b:`SDE-2 report: machine coding or LLD, then DSA with two problems, then HLD, then hiring manager.`}]},
 {t:`remember`,h:`Across all of them the same families repeat: <b>arrays and hashing, two pointers and sliding window, binary search (including on the answer), intervals and heaps, linked lists and stacks, trees and tries, graphs, DP</b>, and a few <b>design-style problems</b> (LRU cache, RandomizedSet). That list is the table of contents of this course.`},
 {t:`p`,h:`<h2>You do not need 800 problems</h2>`},
 {t:`plain`,h:`Recent pattern-first guides say most people who clear product-company rounds solved <b>about 150 to 300 problems, but solved them by pattern</b>, and warn that grinding hundreds of random problems is the usual mistake. This course gives you 42 problems, each one chosen as the clearest example of a pattern, with its follow-ups listed. Do those properly and you will recognise most of what you meet.`},
 {t:`p`,h:`<h2>The talk track: what to do with any problem</h2>`},
 {t:`steps`,items:[
   [`1. Restate it and ask.`,` Say the problem in your own words. Ask about input size, negatives, duplicates, sorted or not, and what to return when there is no answer.`],
   [`2. Try a tiny example by hand.`,` Pick 5 numbers and solve it the slow way. The pattern often shows itself here.`],
   [`3. Say the brute force and its cost.`,` "Two loops, O(n squared)." This is never wasted time. It proves you understand the problem and gives you a safe answer.`],
   [`4. Name the pattern and improve.`,` "I keep asking have I seen this number before, so a hash map."`],
   [`5. Code it, talking.`,` Small functions, clear names. Say what each block is for.`],
   [`6. Dry-run and state the complexity.`,` Walk your example through the code. Test an empty input and a single item. Then say time and space.`]]},
 {t:`two`,a:{h:`What lifts your score`,b:`Clarifying questions. A correct brute force first. Naming the pattern. Clean code. Testing your own code. Honest complexity.`},b:{h:`What lowers it`,b:`Silence for five minutes. Jumping straight into code. Memorised code you cannot explain. Never testing. Arguing with hints.`}},
 {t:`mistake`,h:`Going quiet when stuck. Interviewers cannot give hints to a silent person. Saying "I am stuck on the second step, my thought is X" lets them nudge you, and it is judged as normal good behaviour, not weakness.`},
 {t:`check`,q:`You get a problem you have never seen. What are your first three minutes?`,a:`Restate the problem and ask about sizes, duplicates, negatives and edge cases. Work a small example by hand. State the brute force and its complexity. Only then look for the pattern. You are never expected to see the optimal answer in the first minute.`}
]},

/* ---------- 2 ---------- */
{id:`lesson-2`,track:`dsa`,trackName:`DSA and coding rounds`,title:`Toolbox: Big-O in plain words and the Java you need`,min:14,
 promise:`How to judge whether an approach is fast enough before you code it, and the handful of Java classes and traps that cost people marks.`,
 blocks:[
 {t:`plain`,h:`<b>Big-O</b> describes how the work grows when the input grows. Ignore constants. Ask: "if n becomes 10 times bigger, how many times slower does this get?"`},
 {t:`cards`,items:[
   {h:`O(1)`,b:`Does not grow. A hash map lookup, an array index.`},
   {h:`O(log n)`,b:`Grows very slowly. Halving each step: binary search. A million items take about 20 steps.`},
   {h:`O(n)`,b:`Grows in step. One pass over the data.`},
   {h:`O(n log n)`,b:`Sorting. Fine for 100,000 items.`},
   {h:`O(n squared)`,b:`Two nested loops. Fine for about 5,000 items. 100,000 items is 10 billion steps, too slow.`},
   {h:`O(2 to the n), O(n!)`,b:`Trying every subset or order. Only for about 20 items or fewer. Backtracking lives here.`}]},
 {t:`remember`,h:`<b>Use the input size to guess the intended approach.</b> About 20 items or fewer: trying everything is fine. Up to about 1,000 to 5,000: O(n squared) may pass. Up to 100,000 or more: aim for O(n log n) or O(n). Up to a billion: a formula or O(log n).`},
 {t:`p`,h:`<h2>The Java collections you will use all the time</h2>`},
 {t:`code`,use:true,cap:`How it is used: the one-page toolbox (compiled and run)`,code:`static void toolbox() {
    int[] a = {5, 2, 9};
    Arrays.sort(a);                                        // sorts in place: [2, 5, 9]
    int[][] pairs = {{3, 1}, {1, 2}};
    Arrays.sort(pairs, (x, y) -> Integer.compare(x[0], y[0]));   // sort rows by first value

    Map<String, Integer> count = new HashMap<>();
    count.merge("a", 1, Integer::sum);                     // add 1, or start at 1
    int c = count.getOrDefault("b", 0);                    // 0 when missing
    Map<String, List<Integer>> groups = new HashMap<>();
    groups.computeIfAbsent("k", k -> new ArrayList<>()).add(7);

    Set<Integer> seen = new HashSet<>();
    boolean fresh = seen.add(4);                           // false if it was already there

    Deque<Integer> stack = new ArrayDeque<>();             // use as a stack
    stack.push(1); int top = stack.peek(); stack.pop();
    Queue<Integer> queue = new ArrayDeque<>();             // use as a queue
    queue.add(1); int head = queue.peek(); queue.poll();

    PriorityQueue<Integer> minHeap = new PriorityQueue<>();                       // smallest on top
    PriorityQueue<Integer> maxHeap = new PriorityQueue<>(Comparator.reverseOrder());  // largest on top

    StringBuilder sb = new StringBuilder();
    sb.append('x').append("yz");
    String s = sb.reverse().toString();
    char[] letters = s.toCharArray();
    int idx = letters[0] - 'a';                            // letter to 0..25
}`},
 {t:`code`,cap:`The small helper classes that later lessons use`,code:`static class ListNode {
    int val; ListNode next;
    ListNode(int val) { this.val = val; }
}
static class TreeNode {
    int val; TreeNode left, right;
    TreeNode(int val) { this.val = val; }
}`},
 {t:`p`,h:`<h2>Traps that lose points</h2>`},
 {t:`cards`,items:[
   {h:`Integer overflow`,b:`<code>(lo + hi) / 2</code> can overflow. Write <code>lo + (hi - lo) / 2</code>. Sums and products may need <code>long</code>.`},
   {h:`Comparing boxed numbers`,b:`<code>Integer a == Integer b</code> is only reliable from -128 to 127. Use <code>equals</code>.`},
   {h:`Comparator by subtraction`,b:`<code>(a, b) -> a - b</code> can overflow. Use <code>Integer.compare(a, b)</code>.`},
   {h:`remove on a List of Integer`,b:`<code>list.remove(1)</code> removes the item at <b>index</b> 1. To remove the <b>value</b> 1 write <code>list.remove(Integer.valueOf(1))</code>.`},
   {h:`Stack class`,b:`Do not use <code>java.util.Stack</code>. Use <code>ArrayDeque</code> as stack and as queue. It is faster and the recommended choice.`},
   {h:`String += in a loop`,b:`Creates a new String each time, so O(n squared). Use <code>StringBuilder</code>.`},
   {h:`Mutating while iterating`,b:`Removing from a list inside a for-each throws <code>ConcurrentModificationException</code>. Use an iterator or <code>removeIf</code>.`},
   {h:`Returning references`,b:`When saving a path in backtracking, add a <b>copy</b>: <code>new ArrayList<>(path)</code>, not <code>path</code> itself.`}]},
 {t:`mistake`,h:`Starting to code before you know the complexity you are aiming for. Two minutes of "n is up to 100,000, so I need about n log n" saves ten minutes of rewriting.`},
 {t:`check`,q:`The input has up to 200,000 numbers. Your first idea is two nested loops. Is it acceptable, and what should you look for?`,a:`Two nested loops is about 40 billion steps, too slow. Look for a one-pass idea with a hash map, a sort followed by two pointers, a sliding window, or a heap. Those give O(n) or O(n log n).`}
]},

{id:`lesson-3`,track:`dsa`,trackName:`DSA and coding rounds`,title:`Arrays and hashing: "have I seen this before?"`,min:30,
 promise:`The most common first problem in any coding round. One idea, a hash map as a memory, solves a surprising number of problems.`,
 blocks:[
 {t:`plain`,h:`A <b>hash map</b> lets you ask "have I seen this?" in O(1) instead of scanning the array again. Whenever your slow solution has an inner loop that searches for something, ask whether a map can remember it for you.`},
 {t:`analogy`,h:`A notebook by the door. As each guest arrives you note their name. When someone new arrives you glance at the notebook instead of asking every person in the room again.`},
 {t:`steps`,items:[
   [`Spot it.`,` "Find a pair", "count how many", "first repeated", "group by something", "does X exist".`],
   [`Decide what to store.`,` The value, its index, a count, or a running total (a prefix sum).`],
   [`Look up before you store.`,` For pair problems, check for the partner first, then add the current item. This handles duplicates correctly.`]]},
 {t:`remember`,h:`<b>Prefix sum idea:</b> if you keep a running total, the sum of any stretch of the array is a subtraction of two running totals. That turns "sum of subarray equals K" into a map lookup.`},
 {t:`qbank`,items:[
 {n:`Two Sum`,tag:`Hashing`,where:`CRED's DSA round is reported to include "find a pair whose sum is K". It is also the most common warm-up problem in every company's list.`,
  ask:`Given an array of integers and a target, return the indexes of the two numbers that add up to the target. Exactly one answer exists.`,
  quality:`The inner loop only asks "does the partner exist?". That is the signal for a hash map.`,
  steps:[[`Brute force.`,` Two loops over every pair. O(n squared).`],[`Better, but loses indexes.`,` Sort and use two pointers. O(n log n). Sorting scrambles the original positions.`],[`Best.`,` One pass. For each number x, look up <code>target - x</code> in a map of value to index. If present, you are done. Otherwise store x.`],[`Edge cases.`,` Duplicates (2 + 2 = 4 works because you look up before you store), negatives, no answer.`]],
  code:{cap:`Java`,code:`static int[] twoSum(int[] nums, int target) {
    Map<Integer, Integer> seen = new HashMap<>();          // value -> index
    for (int i = 0; i < nums.length; i++) {
        Integer j = seen.get(target - nums[i]);            // have I already seen the partner?
        if (j != null) return new int[]{j, i};
        seen.put(nums[i], i);
    }
    return new int[]{-1, -1};
}`,use:`nums = [2, 7, 11, 15], target = 9
i=0: x=2, need 7. Map is empty, so store {2:0}
i=1: x=7, need 2. Found at index 0 -> return [0, 1]`},
  trade:`O(n) time and O(n) space. The sorted two-pointer version uses O(1) extra space but O(n log n) time and cannot return the original indexes without extra work.`,
  follow:`Return all pairs? Count pairs? Input already sorted (two pointers)? Data arrives as a stream (keep the map)? Three numbers (the next lesson)?`},
 {n:`Missing Number`,tag:`Arrays`,where:`Razorpay: a candidate was asked to find the missing number in a sequence.`,
  ask:`An array holds n distinct numbers taken from 0 to n. Exactly one number in that range is missing. Find it.`,
  quality:`Knowing a free formula beats building a data structure. Say the O(1) space version.`,
  steps:[[`Simple.`,` Put everything in a set, then test 0 to n. O(n) time, O(n) space.`],[`Formula.`,` The numbers 0 to n add up to n(n+1)/2. Subtract the actual sum. What is left is the missing number.`],[`Overflow.`,` n(n+1)/2 can exceed an int, so compute it in <code>long</code>.`],[`XOR alternative.`,` XOR all indexes and all values. Equal numbers cancel, leaving the missing one. No overflow at all.`]],
  code:{cap:`Java`,code:`static int missingNumber(int[] nums) {                     // numbers 0..n, one is missing
    int n = nums.length;
    long expected = (long) n * (n + 1) / 2, actual = 0;
    for (int x : nums) actual += x;
    return (int) (expected - actual);
}`,use:`nums = [3, 0, 1], so n = 3
expected = 3 * 4 / 2 = 6
actual   = 3 + 0 + 1 = 4
missing  = 6 - 4 = 2`},
  trade:`O(n) time, O(1) space. The sum can be large, so use long or XOR.`,
  follow:`Two numbers missing? (sum and sum of squares, or XOR then split on a set bit.) Array is sorted? (binary search on index equals value.) Numbers may repeat? (a different problem: find duplicates.)`},
 {n:`Subarray Sum Equals K`,tag:`Prefix sum`,where:`Pattern guides list it as the standard prefix-sum plus hash-map problem, and as the answer when sliding window fails because of negative numbers.`,
  ask:`Given an integer array (it may contain negatives) and k, count the continuous subarrays whose sum equals k.`,
  quality:`Seeing that a subarray sum is a difference of two prefix sums.`,
  steps:[[`Brute force.`,` Every start, extend the end with a running sum. O(n squared).`],[`Key idea.`,` If prefix[j] minus prefix[i] equals k, then prefix[i] equals prefix[j] minus k.`],[`So.`,` Walk the array keeping a running prefix. Ask the map how many earlier prefixes equal <code>prefix - k</code>. Add that to the answer. Then record the current prefix.`],[`Seed the map.`,` Put <code>{0: 1}</code> first. That represents the empty prefix and lets subarrays starting at index 0 count.`],[`Why not sliding window?`,` With negative numbers, growing the window can lower the sum, so the shrink logic breaks.`]],
  code:{cap:`Java`,code:`static int subarraySum(int[] nums, int k) {
    Map<Integer, Integer> count = new HashMap<>();         // prefix sum -> how many times seen
    count.put(0, 1);                                       // the empty prefix
    int prefix = 0, answer = 0;
    for (int x : nums) {
        prefix += x;
        answer += count.getOrDefault(prefix - k, 0);       // earlier prefixes that leave exactly k
        count.merge(prefix, 1, Integer::sum);
    }
    return answer;
}`,use:`nums = [1, 2, 3], k = 3
start: map {0:1}, prefix 0
x=1: prefix 1, need -2 -> none. map {0:1, 1:1}
x=2: prefix 3, need 0 -> found 1. answer 1. map {0:1, 1:1, 3:1}
x=3: prefix 6, need 3 -> found 1. answer 2.
The two subarrays are [1, 2] and [3].`},
  trade:`O(n) time and O(n) space. A running count in a map is the price for handling negatives.`,
  follow:`Longest subarray with sum k (store the first index of each prefix). Count subarrays whose sum is divisible by k (store prefix modulo k). The same idea on a 2D grid.`},
 {n:`Longest Consecutive Sequence`,tag:`Hashing`,where:`A fixture of the SDE-sheet style lists that candidates say Zomato's questions resemble.`,
  ask:`Given an unsorted array, find the length of the longest run of consecutive numbers (like 4, 5, 6, 7). Do it in O(n).`,
  quality:`Counting only from the <b>start</b> of each run.`,
  steps:[[`Sorting.`,` Sort and scan. O(n log n). Works, but the question asks for O(n).`],[`Set.`,` Put all numbers in a hash set for O(1) lookups.`],[`Only start at a run's beginning.`,` If <code>x - 1</code> is in the set, x is in the middle of a run, so skip it.`],[`Count forward.`,` From a start, count <code>x+1, x+2, ...</code> while present.`],[`Why O(n).`,` Each number is walked over once, as part of exactly one run.`]],
  code:{cap:`Java`,code:`static int longestConsecutive(int[] nums) {
    Set<Integer> set = new HashSet<>();
    for (int x : nums) set.add(x);
    int best = 0;
    for (int x : set) {
        if (set.contains(x - 1)) continue;                 // not the start of a run, skip
        int len = 1;
        while (set.contains(x + len)) len++;
        best = Math.max(best, len);
    }
    return best;
}`,use:`nums = [100, 4, 200, 1, 3, 2]
100: 99 not in set -> a start. 101 absent. length 1
4:   3 is in set -> skip, not a start
200: a start, length 1
1:   0 not in set -> a start. 2, 3, 4 all present. length 4
answer = 4`},
  trade:`O(n) time, O(n) space. Without the "only start at a beginning" check it becomes O(n squared).`,
  follow:`Return the sequence itself? Union-find as an alternative? What if numbers arrive as a stream?`},
 {n:`Group Anagrams`,tag:`Hashing`,where:`A standard hashing and strings question, common in assessment rounds.`,
  ask:`Given a list of words, group the words that are anagrams of each other.`,
  quality:`Choosing a <b>canonical key</b> so that all anagrams produce the same key.`,
  steps:[[`Idea.`,` Anagrams have the same letters. Sort the letters of each word to get a key. "eat" and "tea" both become "aet".`],[`Map.`,` Key to the list of original words.`],[`Faster key.`,` Instead of sorting, count the 26 letters and use the counts as the key. O(k) per word.`],[`Result.`,` The map's values are the groups.`]],
  code:{cap:`Java`,code:`static List<List<String>> groupAnagrams(String[] words) {
    Map<String, List<String>> groups = new HashMap<>();
    for (String w : words) {
        char[] letters = w.toCharArray();
        Arrays.sort(letters);                              // "eat" and "tea" both become "aet"
        groups.computeIfAbsent(new String(letters), k -> new ArrayList<>()).add(w);
    }
    return new ArrayList<>(groups.values());
}`,use:`words = ["eat", "tea", "tan", "ate", "nat", "bat"]
eat -> aet   tea -> aet   tan -> ant   ate -> aet   nat -> ant   bat -> abt
groups: aet:[eat, tea, ate]   ant:[tan, nat]   abt:[bat]`},
  trade:`With sorting each word costs O(k log k), so O(n k log k) overall. With letter counts it is O(n k).`,
  follow:`Valid Anagram (compare two count arrays). Find all anagrams of a pattern inside a string (sliding window, next lesson). Unicode input (use a map for the counts).`}
 ]},
 {t:`mistake`,h:`Storing the current element <b>before</b> looking for its partner. With the array [3] and target 6 you would pair 3 with itself. Always look up first, then store.`},
 {t:`check`,q:`You are asked for the first repeated number in an array. Which structure, and what is the time and space?`,a:`A hash set. Walk the array and return the first number that is already in the set, otherwise add it. O(n) time and O(n) space.`}
]},

{id:`lesson-4`,track:`dsa`,trackName:`DSA and coding rounds`,title:`Two pointers and sliding window`,min:28,
 promise:`Two small ideas that turn many O(n squared) problems into O(n). Learn to see them in the words of a problem.`,
 blocks:[
 {t:`plain`,h:`<b>Two pointers</b>: use two positions that move through the data, usually one from each end, so that every step rules something out. <b>Sliding window</b>: keep a stretch of the array, grow it on the right, shrink it on the left, and update an answer as you go.`},
 {t:`analogy`,h:`A caterpillar on a branch. The head reaches forward, the tail follows when the body is too long. The caterpillar never goes back to re-measure the whole branch.`},
 {t:`diagram`,cap:`A window over [2, 3, 1, 2, 4, 3]. Add the number that enters, drop the number that leaves. Never recompute the whole sum.`,d:{w:420,alt:`Six cells with the middle three highlighted as the sliding window`,nodes:[
   {id:`c0`,t:`2`,x:10,y:8,w:50},
   {id:`c1`,t:`3`,x:76,y:8,w:50,k:`state`},
   {id:`c2`,t:`1`,x:142,y:8,w:50,k:`state`},
   {id:`c3`,t:`2`,x:208,y:8,w:50,k:`state`},
   {id:`c4`,t:`4`,x:274,y:8,w:50},
   {id:`c5`,t:`3`,x:340,y:8,w:50},
   {id:`nn`,t:`window`,x:76,y:70,w:182,k:`note`,m:[`left = 1, right = 3`,`sum = 3 + 1 + 2 = 6`]}],
  edges:[]}},
 {t:`two`,a:{h:`Use two pointers when`,b:`The data is sorted (or you can sort it) and you look for a pair or triple, or you work from both ends: a palindrome, a container, removing duplicates.`},b:{h:`Use a sliding window when`,b:`The question says "longest", "shortest" or "at most K" about a <b>contiguous</b> stretch of an array or string.`}},
 {t:`code`,cap:`The sliding window skeleton`,code:`int left = 0;
for (int right = 0; right < n; right++) {
    // 1. add item[right] to the window's state (sum, counts, a set)
    while (/* window is no longer valid */) {
        // 2. remove item[left] from the state
        left++;
    }
    // 3. the window [left, right] is valid here: update the answer
}`},
 {t:`qbank`,items:[
 {n:`Container With Most Water`,tag:`Two pointers`,where:`A standard two-pointer problem named in pattern lists for product-company rounds.`,
  ask:`Given heights of vertical lines, pick two lines that, with the x-axis, hold the most water. Return that amount.`,
  quality:`Explaining why you move the <b>shorter</b> wall.`,
  steps:[[`Brute force.`,` Every pair. O(n squared).`],[`Start wide.`,` Put pointers at both ends. This is the widest container.`],[`Area.`,` width times the shorter of the two walls.`],[`Move the shorter wall.`,` The area is limited by it. Moving the taller wall can only make the width smaller without raising the limit, so it can never help.`],[`Repeat.`,` Track the best area until the pointers meet.`]],
  code:{cap:`Java`,code:`static int maxArea(int[] height) {
    int l = 0, r = height.length - 1, best = 0;
    while (l < r) {
        best = Math.max(best, Math.min(height[l], height[r]) * (r - l));
        if (height[l] < height[r]) l++; else r--;          // move the shorter wall, only that can help
    }
    return best;
}`,use:`heights = [1, 8, 6, 2, 5, 4, 8, 3, 7]
l=0 (1), r=8 (7): area 1 * 8 = 8. Left is shorter, move l.
l=1 (8), r=8 (7): area 7 * 7 = 49. Right is shorter, move r.
Every later pair has a smaller width and cannot beat 49.
answer = 49`},
  trade:`O(n) time, O(1) space.`,
  follow:`Trapping Rain Water (two pointers with a running maximum on each side). What if some heights are zero? Prove the greedy move.`},
 {n:`3Sum`,tag:`Two pointers`,where:`One of the most widely listed array problems. It is the usual next step after Two Sum.`,
  ask:`Find all unique triplets in an array that add up to zero.`,
  quality:`Sort first, fix one number, then two pointers for the other two. Handling duplicates correctly is the real test.`,
  steps:[[`Brute force.`,` Three loops. O(n cubed).`],[`Sort.`,` Sorting makes two pointers possible and puts duplicates next to each other.`],[`Fix the first number.`,` Then find a pair summing to its negative using left and right pointers.`],[`Sum too small or too large.`,` Too small: move left up. Too large: move right down. Zero: record it.`],[`Skip duplicates.`,` Skip a repeated first number. After recording a triplet, skip repeated values on both pointers.`]],
  code:{cap:`Java`,code:`static List<List<Integer>> threeSum(int[] a) {
    Arrays.sort(a);
    List<List<Integer>> out = new ArrayList<>();
    for (int i = 0; i < a.length - 2; i++) {
        if (i > 0 && a[i] == a[i - 1]) continue;           // same first number again: skip
        int l = i + 1, r = a.length - 1;
        while (l < r) {
            int sum = a[i] + a[l] + a[r];
            if (sum == 0) {
                out.add(List.of(a[i], a[l], a[r]));
                l++; r--;
                while (l < r && a[l] == a[l - 1]) l++;     // skip duplicates on both sides
                while (l < r && a[r] == a[r + 1]) r--;
            } else if (sum < 0) l++;
            else r--;
        }
    }
    return out;
}`,use:`sorted = [-4, -1, -1, 0, 1, 2]
i=0 (-4): no pair reaches +4. Nothing.
i=1 (-1): l=2 (-1), r=5 (2): sum 0 -> record [-1, -1, 2]
          l=3 (0),  r=4 (1): sum 0 -> record [-1, 0, 1]
i=2 (-1): same as the previous first number, skip.
result = [[-1, -1, 2], [-1, 0, 1]]`},
  trade:`O(n squared) time because each fixed number costs one O(n) sweep. Sorting is O(n log n), which does not matter next to it.`,
  follow:`3Sum Closest. 4Sum (the k-sum generalisation). Can you do it without sorting? (A hash set per fixed number, with care for duplicates.)`},
 {n:`Longest Substring Without Repeating Characters`,tag:`Sliding window`,where:`Swiggy's online assessment is reported to test sliding window and hash maps. This is the standard example of the pattern.`,
  ask:`Find the length of the longest substring of a string that has no repeated character.`,
  quality:`Keeping the window valid, and the <code>lastSeen &gt;= left</code> check.`,
  steps:[[`Brute force.`,` Check every substring. O(n squared) or worse.`],[`Window.`,` Keep <code>[left, right]</code> with no duplicates.`],[`Remember the last index of each character.`,` When a character repeats inside the window, jump <code>left</code> to just after its earlier copy.`],[`The trap.`,` The earlier copy may be <b>outside</b> the window already (in "abba"). Only move <code>left</code> if the last index is at least <code>left</code>.`],[`Track the best length.`,` <code>right - left + 1</code> at each step.`]],
  code:{cap:`Java`,code:`static int lengthOfLongestSubstring(String s) {
    Map<Character, Integer> lastSeen = new HashMap<>();
    int left = 0, best = 0;
    for (int right = 0; right < s.length(); right++) {
        char c = s.charAt(right);
        if (lastSeen.containsKey(c) && lastSeen.get(c) >= left)
            left = lastSeen.get(c) + 1;                    // jump past the earlier copy
        lastSeen.put(c, right);
        best = Math.max(best, right - left + 1);
    }
    return best;
}`,use:`s = "abcabcbb"
right=0 a: window "a"      len 1
right=1 b: window "ab"     len 2
right=2 c: window "abc"    len 3
right=3 a: a was at 0, left=1 -> window "bca"  len 3
right=4 b: b was at 1, left=2 -> window "cab"  len 3
right=5 c: left=3.  right=6 b: b was at 4, left=5 -> "cb" len 2
right=7 b: b was at 6, left=7 -> "b" len 1
answer = 3`},
  trade:`O(n) time. Space is O(size of the character set).`,
  follow:`At most K distinct characters. Longest repeating character replacement. Return the substring, not the length. Minimum window substring (the hard version).`},
 {n:`Minimum Size Subarray Sum`,tag:`Sliding window`,where:`A standard "shortest window" problem listed in sliding window guides.`,
  ask:`Given an array of <b>positive</b> numbers and a target, find the length of the shortest contiguous subarray whose sum is at least the target. Return 0 if none.`,
  quality:`Noticing that positive numbers make the window logic safe.`,
  steps:[[`Brute force.`,` Every start and end. O(n squared).`],[`Grow.`,` Move <code>right</code> and add to the sum.`],[`Shrink.`,` While the sum is at least the target, record the length, then drop <code>left</code>. Shrink as far as it stays valid.`],[`Why it works.`,` All numbers are positive, so a longer window never has a smaller sum, and each element enters and leaves once.`],[`If negatives are allowed.`,` This fails. Use prefix sums with a monotonic deque.`]],
  code:{cap:`Java`,code:`static int minSubArrayLen(int target, int[] nums) {        // all numbers positive
    int left = 0, sum = 0, best = Integer.MAX_VALUE;
    for (int right = 0; right < nums.length; right++) {
        sum += nums[right];                                // grow the window
        while (sum >= target) {
            best = Math.min(best, right - left + 1);
            sum -= nums[left++];                           // shrink while it is still valid
        }
    }
    return best == Integer.MAX_VALUE ? 0 : best;
}`,use:`target = 7, nums = [2, 3, 1, 2, 4, 3]
sum grows 2, 5, 6 ... still below 7
right=3: sum 8 >= 7 -> length 4. Drop the 2: sum 6, left=1
right=4: sum 10 -> length 4. Drop 3: sum 7 -> length 3. Drop 1: sum 6, left=3
right=5: sum 9 -> length 3. Drop 2: sum 7 -> length 2. Drop 4: sum 3, left=5
answer = 2   (the subarray [4, 3])`},
  trade:`O(n) time, O(1) space.`,
  follow:`Negative numbers allowed. Count subarrays with sum less than K. Longest subarray with sum at most K.`}
 ]},
 {t:`mistake`,h:`Using a sliding window on a problem with negative numbers or with "exactly K". Shrinking only makes sense if shrinking moves the answer in a known direction. When it does not, think prefix sums and a hash map instead.`},
 {t:`check`,q:`Find the longest subarray of 0s and 1s with equal numbers of each. Sliding window or something else?`,a:`Something else. Equal counts do not move in one direction as the window grows. Treat 0 as -1 and the problem becomes "longest subarray with sum 0", solved with a prefix sum and a hash map of first-seen indexes.`}
]},

{id:`lesson-5`,track:`dsa`,trackName:`DSA and coding rounds`,title:`Binary search: on arrays, and on the answer itself`,min:30,
 promise:`Binary search is not only for sorted arrays. It is the tool for any question of the form "find the smallest value that works".`,
 blocks:[
 {t:`plain`,h:`Binary search throws away <b>half</b> of the possibilities each step. It works whenever the choices split into a "no" part followed by a "yes" part, with nothing mixed. You are looking for the boundary.`},
 {t:`analogy`,h:`Guessing a number between 1 and 100 where the friend only says "higher" or "lower". Seven guesses are enough, because every guess halves what is left.`},
 {t:`diagram`,cap:`Looking for the first index whose value is at least 8. Each step discards one side.`,d:{w:420,alt:`Sorted array with lo, mid and hi markers`,nodes:[
   {id:`a0`,t:`5`,x:10,y:8,w:48},
   {id:`a1`,t:`7`,x:70,y:8,w:48},
   {id:`a2`,t:`7`,x:130,y:8,w:48},
   {id:`a3`,t:`8`,x:190,y:8,w:48,k:`state`},
   {id:`a4`,t:`8`,x:250,y:8,w:48,k:`state`},
   {id:`a5`,t:`10`,x:310,y:8,w:48,k:`state`},
   {id:`nn`,t:`reading it`,x:10,y:70,w:348,k:`note`,m:[`values below 8 are the "no" part, the rest are "yes"`,`answer = index 3, the first "yes"`]}],
  edges:[]}},
 {t:`steps`,items:[
   [`1. Define the yes/no question.`,` "Is a[mid] at least the target?" or "can I finish with speed mid?"`],
   [`2. Check it is monotonic.`,` Once the answer turns yes it stays yes. If not, binary search does not apply.`],
   [`3. Keep a range [lo, hi].`,` The answer is always inside it.`],
   [`4. Test the middle.`,` Yes: the answer is mid or earlier, so <code>hi = mid</code>. No: <code>lo = mid + 1</code>.`],
   [`5. Stop when lo equals hi.`,` That is the boundary.`]]},
 {t:`remember`,h:`<b>Binary search on the answer.</b> When the problem asks for the smallest or largest value of something (a speed, a capacity, a day count), you can often <i>test</i> a value much more easily than you can <i>find</i> it. Write <code>feasible(x)</code>, then binary search over x. This is how Koko Eating Bananas and book allocation work.`},
 {t:`qbank`,items:[
 {n:`First and Last Position in a Sorted Array (lower bound)`,tag:`Binary search`,where:`The template question. Nearly every binary-search variation is this with a different yes/no test.`,
  ask:`Given a sorted array and a target, find its first and last index. Return [-1, -1] if absent. Use O(log n).`,
  quality:`One clean <code>lowerBound</code> function reused twice.`,
  steps:[[`Brute force.`,` Scan. O(n).`],[`Lower bound.`,` The first index whose value is at least the target.`],[`First position.`,` <code>lowerBound(target)</code>, then check it really holds the target.`],[`Last position.`,` <code>lowerBound(target + 1) - 1</code>, the spot just before the first larger value.`],[`Loop form.`,` Use <code>lo &lt; hi</code> with <code>hi</code> one past the end, and <code>mid = lo + (hi - lo) / 2</code>.`]],
  code:{cap:`Java`,code:`static int lowerBound(int[] a, int target) {               // first index with a[i] >= target
    int lo = 0, hi = a.length;                             // hi is one past the end
    while (lo < hi) {
        int mid = lo + (hi - lo) / 2;                      // never (lo + hi) / 2: it can overflow
        if (a[mid] < target) lo = mid + 1; else hi = mid;
    }
    return lo;
}
static int[] searchRange(int[] a, int target) {
    int first = lowerBound(a, target);
    if (first == a.length || a[first] != target) return new int[]{-1, -1};
    int last = lowerBound(a, target + 1) - 1;              // first position past the last copy
    return new int[]{first, last};
}`,use:`a = [5, 7, 7, 8, 8, 10], target = 8
lowerBound(8): lo=0 hi=6 -> mid 3 (8 >= 8) hi=3 -> mid 1 (7 < 8) lo=2 -> mid 2 (7 < 8) lo=3 -> 3
lowerBound(9): lo=0 hi=6 -> mid 3 (8 < 9) lo=4 -> mid 5 (10 >= 9) hi=5 -> mid 4 (8 < 9) lo=5 -> 5
first = 3, last = 5 - 1 = 4  -> [3, 4]`},
  trade:`O(log n) time, O(1) space.`,
  follow:`How many times does the target appear (last - first + 1)? Where would it be inserted? What if target + 1 overflows (target is Integer.MAX_VALUE)?`},
 {n:`Search in Rotated Sorted Array`,tag:`Binary search`,where:`A very common medium problem in assessments and onsite rounds.`,
  ask:`A sorted array was rotated at an unknown point, like [4, 5, 6, 7, 0, 1, 2]. Find a target's index in O(log n).`,
  quality:`Seeing that <b>one half is always sorted</b>.`,
  steps:[[`Idea.`,` At any mid, at least one of the two halves is in normal sorted order.`],[`Which half?`,` If <code>a[lo] &lt;= a[mid]</code> the left half is sorted. Otherwise the right half is.`],[`Is the target inside the sorted half?`,` Compare it with that half's two ends. If yes, search there. If not, search the other half.`],[`Stop.`,` When mid holds the target, or the range is empty.`]],
  code:{cap:`Java`,code:`static int searchRotated(int[] a, int target) {
    int lo = 0, hi = a.length - 1;
    while (lo <= hi) {
        int mid = lo + (hi - lo) / 2;
        if (a[mid] == target) return mid;
        if (a[lo] <= a[mid]) {                             // left half is sorted
            if (a[lo] <= target && target < a[mid]) hi = mid - 1; else lo = mid + 1;
        } else {                                           // right half is sorted
            if (a[mid] < target && target <= a[hi]) lo = mid + 1; else hi = mid - 1;
        }
    }
    return -1;
}`,use:`a = [4, 5, 6, 7, 0, 1, 2], target = 0
lo=0 hi=6 mid=3 (7): left half [4..7] is sorted, 0 is not in it -> lo=4
lo=4 hi=6 mid=5 (1): left half [0..1] is sorted, 0 is in it -> hi=4
lo=4 hi=4 mid=4 (0): found -> index 4`},
  trade:`O(log n). With duplicates the worst case becomes O(n), because you cannot tell which half is sorted.`,
  follow:`Find the minimum in a rotated array. Find the rotation count. Handle duplicates.`},
 {n:`Koko Eating Bananas`,tag:`Binary search on answer`,where:`Reported as a problem in a Swiggy online assessment (a Naukri Code360 candidate write-up, December 2024).`,
  ask:`There are piles of bananas and h hours. Each hour Koko picks one pile and eats up to k bananas from it. Find the smallest k that lets her finish in h hours.`,
  quality:`Spotting that you can <b>test</b> a speed easily, and that faster is never worse.`,
  steps:[[`Brute force.`,` Try k = 1, 2, 3 and so on. Far too slow when piles are huge.`],[`Range.`,` The slowest sensible speed is 1. The fastest you would ever need is the largest pile (one hour per pile).`],[`Feasible(k).`,` Hours needed is the sum of <code>ceil(pile / k)</code>. Feasible if at most h.`],[`Monotonic.`,` If speed k works, any faster speed works too.`],[`Search.`,` Find the smallest feasible k. Compute hours in <code>long</code> to avoid overflow.`]],
  code:{cap:`Java`,code:`static int minEatingSpeed(int[] piles, int h) {
    int lo = 1, hi = 0;
    for (int p : piles) hi = Math.max(hi, p);              // eating the biggest pile in 1 hour always works
    while (lo < hi) {
        int mid = lo + (hi - lo) / 2;
        if (hoursNeeded(piles, mid) <= h) hi = mid;        // fast enough: try slower
        else lo = mid + 1;                                 // too slow: need faster
    }
    return lo;
}
static long hoursNeeded(int[] piles, int speed) {
    long hours = 0;
    for (int p : piles) hours += (p + speed - 1) / speed;  // ceiling of p / speed
    return hours;
}`,use:`piles = [3, 6, 7, 11], h = 8
lo=1 hi=11: mid 6 -> hours 1+1+2+2 = 6 <= 8, so try slower: hi=6
lo=1 hi=6:  mid 3 -> hours 1+2+3+4 = 10 > 8, too slow: lo=4
lo=4 hi=6:  mid 5 -> hours 1+2+2+3 = 8 <= 8: hi=5
lo=4 hi=5:  mid 4 -> hours 1+2+2+3 = 8 <= 8: hi=4
answer = 4`},
  trade:`O(n log M) where M is the largest pile. Each test is O(n), and there are about log M tests.`,
  follow:`Capacity to ship packages within D days (the same pattern). What if h is smaller than the number of piles? (Impossible.) Aggressive cows (maximise the minimum distance, which flips the direction).`},
 {n:`Split Array Largest Sum (Allocate Books)`,tag:`Binary search on answer`,where:`Reported by an SDE-2 candidate who interviewed at several product companies, as "distribute books so the maximum pages a student reads is minimised". Also known as painter's partition.`,
  ask:`Split an array into k contiguous parts so that the largest part sum is as small as possible. Return that smallest largest sum.`,
  quality:`Turning "minimise the maximum" into a yes/no test: can it be done with a limit of L?`,
  steps:[[`Range.`,` The answer is at least the largest single item, and at most the total of all items.`],[`Feasible(L).`,` Walk the array, packing items into a part until adding the next would exceed L, then start a new part. Count the parts.`],[`Monotonic.`,` If a limit L works with at most k parts, any larger limit works too.`],[`Search.`,` Find the smallest L with parts at most k.`]],
  code:{cap:`Java`,code:`static int splitArray(int[] nums, int k) {                 // same as "allocate books" / "painter's partition"
    int lo = 0, hi = 0;
    for (int x : nums) { lo = Math.max(lo, x); hi += x; }  // answer lies between the biggest item and the total
    while (lo < hi) {
        int mid = lo + (hi - lo) / 2;
        if (partsNeeded(nums, mid) <= k) hi = mid; else lo = mid + 1;
    }
    return lo;
}
static int partsNeeded(int[] nums, int limit) {
    int parts = 1, current = 0;
    for (int x : nums) {
        if (current + x > limit) { parts++; current = 0; } // start a new part
        current += x;
    }
    return parts;
}`,use:`nums = [7, 2, 5, 10, 8], k = 2   (range 10 to 32)
mid=21: [7,2,5] then 10 would make 24 > 21 -> new part [10, 8] = 18. 2 parts, ok -> hi=21
mid=15: [7,2,5], [10], [8]  -> 3 parts, too many -> lo=16
mid=18: [7,2,5], [10, 8]    -> 2 parts, ok -> hi=18
mid=17: [7,2,5], [10], [8]  -> 3 parts, too many -> lo=18
answer = 18   ([7, 2, 5] and [10, 8])`},
  trade:`O(n log(sum)) time, O(1) space.`,
  follow:`Painter's partition and minimum days to ship are the same problem. Minimise the maximum distance. Why does greedy packing give the right count for a given limit?`}
 ]},
 {t:`mistake`,h:`Writing the loop condition and the pointer updates from memory and getting an infinite loop. Pick <b>one</b> form and learn it: <code>lo &lt; hi</code>, <code>hi = mid</code> or <code>lo = mid + 1</code>, <code>mid = lo + (hi - lo) / 2</code>. Then every variation is only a different yes/no test.`},
 {t:`check`,q:`You must find the smallest day on which a package pile can be shipped within D days given a ship capacity C. Which parameter would you binary search, and what is the test?`,a:`Binary search the capacity C. For a given C, simulate loading packages in order and count how many days are needed. If days is at most D, C is feasible. Capacity ranges from the heaviest package to the total weight, and larger capacity is never worse.`}
]},

{id:`lesson-6`,track:`dsa`,trackName:`DSA and coding rounds`,title:`Intervals, sorting and heaps`,min:30,
 promise:`Two ideas that appear in scheduling problems: sort first so the order helps you, and use a heap when you keep needing "the smallest (or largest) right now".`,
 blocks:[
 {t:`plain`,h:`<b>Intervals</b> are pairs like (start, end). Almost every interval problem becomes easy after <b>sorting by start time</b>, because overlaps then sit next to each other. A <b>heap</b> (<code>PriorityQueue</code>) always hands you the smallest item in O(log n). Use it for "the next meeting to end", "the k-th largest", "the smallest head among k lists".`},
 {t:`analogy`,h:`A hospital waiting room that always calls the most urgent patient next, not the one who arrived first. Patients can keep arriving, and the next call is still instant. That is a heap.`},
 {t:`cards`,items:[
   {h:`Sort by start, then sweep`,b:`Merge overlapping intervals, insert an interval, find gaps.`},
   {h:`Sort by end`,b:`"Choose the most non-overlapping intervals" is solved greedily by earliest end.`},
   {h:`Min-heap of end times`,b:`How many rooms or machines are needed at the same time.`},
   {h:`Heap of size k`,b:`The k largest or smallest, in O(n log k). Use a min-heap for the k largest.`}]},
 {t:`qbank`,items:[
 {n:`Merge Intervals`,tag:`Intervals`,where:`Swiggy: a BarRaiser-style round is reported with two mediums from intervals, arrays and Java basics.`,
  ask:`Given a list of intervals, merge all overlapping ones and return the result.`,
  quality:`Sort by start, then compare each interval with the <b>last merged</b> one.`,
  steps:[[`Brute force.`,` Compare every pair repeatedly. O(n squared) or worse.`],[`Sort by start.`,` Overlapping intervals are now adjacent.`],[`Sweep.`,` If the current start is after the last merged end, there is a gap: start a new group. Otherwise stretch the last group's end to the larger end.`],[`Clarify.`,` Do touching intervals like [1,2] and [2,3] merge? In this code they do, because only a strict gap starts a new group.`],[`Comparator.`,` Use <code>Integer.compare</code>, not subtraction.`]],
  code:{cap:`Java`,code:`static int[][] merge(int[][] intervals) {
    Arrays.sort(intervals, (a, b) -> Integer.compare(a[0], b[0]));   // by start; never a[0] - b[0]
    List<int[]> out = new ArrayList<>();
    for (int[] cur : intervals) {
        if (out.isEmpty() || out.get(out.size() - 1)[1] < cur[0]) {
            out.add(cur);                                            // gap: a new group starts
        } else {
            int[] last = out.get(out.size() - 1);
            last[1] = Math.max(last[1], cur[1]);                     // overlap: stretch the group
        }
    }
    return out.toArray(new int[0][]);
}`,use:`intervals = [[1,3], [2,6], [8,10], [15,18]]
[1,3]  -> group [1,3]
[2,6]  -> start 2 is not after end 3: stretch -> [1,6]
[8,10] -> start 8 is after end 6: new group
[15,18]-> start 15 is after 10: new group
result = [[1,6], [8,10], [15,18]]`},
  trade:`O(n log n) for the sort, then one pass. O(n) extra space for the output.`,
  follow:`Insert Interval into a sorted list. Minimum intervals to remove so none overlap (sort by end). Can a person attend all meetings? Employee free time.`},
 {n:`Meeting Rooms II (minimum rooms)`,tag:`Heap`,where:`The standard scheduling question that follows Merge Intervals in guides.`,
  ask:`Given meeting time intervals, find the minimum number of rooms needed so that no two meetings in a room overlap.`,
  quality:`A min-heap of end times, to see whether the earliest-finishing room is free.`,
  steps:[[`Sort by start.`,` Process meetings in the order they begin.`],[`Heap.`,` Keep the end times of rooms currently in use. The smallest is on top.`],[`New meeting.`,` If the earliest end is at or before this start, that room is free: remove it. Then add this meeting's end.`],[`Answer.`,` The heap size at the end is the number of rooms ever used at once.`],[`Alternative.`,` Sort starts and ends separately and sweep two pointers.`]],
  code:{cap:`Java`,code:`static int minMeetingRooms(int[][] meetings) {
    Arrays.sort(meetings, (a, b) -> Integer.compare(a[0], b[0]));
    PriorityQueue<Integer> ends = new PriorityQueue<>();             // end times of rooms in use, earliest on top
    for (int[] m : meetings) {
        if (!ends.isEmpty() && ends.peek() <= m[0]) ends.poll();     // that room is free: reuse it
        ends.add(m[1]);
    }
    return ends.size();                                              // rooms ever needed at once
}`,use:`meetings = [[0,30], [5,10], [15,20]]
(0,30):  heap [30]
(5,10):  earliest end 30 > 5, no free room. heap [10, 30]
(15,20): earliest end 10 <= 15, reuse that room. heap [20, 30]
rooms = 2`},
  trade:`O(n log n) time, O(n) space.`,
  follow:`Print which meeting goes to which room. Can one person attend all meetings (just sort and check)? Two-pointer sweep without a heap.`},
 {n:`Kth Largest Element`,tag:`Heap`,where:`A staple heap question in assessment and onsite lists.`,
  ask:`Find the k-th largest element in an unsorted array.`,
  quality:`A <b>min</b>-heap of size k, and why the minimum is the answer.`,
  steps:[[`Sort.`,` Sort and index. O(n log n). Simple and acceptable to mention.`],[`Heap of size k.`,` Keep the k largest numbers seen so far in a min-heap.`],[`Why min-heap.`,` Its top is the smallest of those k, which is exactly the k-th largest overall. When the size passes k, remove the top.`],[`Quickselect.`,` Average O(n), worst O(n squared). Name it if asked for the best average time.`]],
  code:{cap:`Java`,code:`static int findKthLargest(int[] nums, int k) {
    PriorityQueue<Integer> heap = new PriorityQueue<>();             // min-heap holding the k largest so far
    for (int x : nums) {
        heap.add(x);
        if (heap.size() > k) heap.poll();                            // drop the smallest of them
    }
    return heap.peek();                                              // k-th largest overall
}`,use:`nums = [3, 2, 1, 5, 6, 4], k = 2
add 3 -> [3]        add 2 -> [2, 3]
add 1 -> [1, 2, 3], too big, remove 1 -> [2, 3]
add 5 -> remove 2 -> [3, 5]
add 6 -> remove 3 -> [5, 6]
add 4 -> remove 4 -> [5, 6]
top = 5   (the 2nd largest)`},
  trade:`O(n log k) time and O(k) space. Better than sorting when k is small, and it works on a stream.`,
  follow:`The k-th largest in a data stream. Median of a stream (two heaps). Quickselect in detail.`},
 {n:`Top K Frequent Elements`,tag:`Heap, hashing`,where:`Listed with the heap problems in almost every pattern guide.`,
  ask:`Given an array, return the k most frequent elements.`,
  quality:`Count first, then pick the top k by count. Know the bucket trick.`,
  steps:[[`Count.`,` A map from number to frequency.`],[`Heap.`,` A min-heap of size k over (number, count). O(n log k).`],[`Bucket sort, O(n).`,` A frequency can be at most n, so make buckets indexed by frequency, drop each number into its bucket, then read from the highest bucket down.`],[`Ties.`,` Ask how to break ties.`]],
  code:{cap:`Java`,code:`static int[] topKFrequent(int[] nums, int k) {
    Map<Integer, Integer> freq = new HashMap<>();
    for (int x : nums) freq.merge(x, 1, Integer::sum);
    List<List<Integer>> buckets = new ArrayList<>();                 // buckets.get(f) = numbers seen f times
    for (int i = 0; i <= nums.length; i++) buckets.add(new ArrayList<>());
    for (Map.Entry<Integer, Integer> e : freq.entrySet()) buckets.get(e.getValue()).add(e.getKey());
    int[] out = new int[k];
    int idx = 0;
    for (int f = nums.length; f >= 1 && idx < k; f--)
        for (int x : buckets.get(f)) if (idx < k) out[idx++] = x;
    return out;
}`,use:`nums = [1, 1, 1, 2, 2, 3], k = 2
counts: 1 -> 3, 2 -> 2, 3 -> 1
buckets: [3] = {1}, [2] = {2}, [1] = {3}
read from the top: 1, then 2   -> [1, 2]`},
  trade:`O(n) with buckets. O(n log k) with a heap, which is also fine and often shorter to write.`,
  follow:`Top K frequent words (sort ties alphabetically). A stream of numbers. Sort characters by frequency.`},
 {n:`Merge K Sorted Lists`,tag:`Heap`,where:`A standard heap question on the usual hard-medium lists.`,
  ask:`Merge k sorted linked lists into one sorted list.`,
  quality:`A min-heap holding the current head of each list.`,
  steps:[[`Naive.`,` Merge lists one after another. O(k times N). Slow when k is large.`],[`Heap.`,` Put the first node of every list in a min-heap.`],[`Loop.`,` Remove the smallest node, append it to the output, and push that node's next node.`],[`Result.`,` Every node enters and leaves the heap once, and the heap holds at most k nodes.`],[`Alternative.`,` Divide and conquer: merge lists in pairs. Same O(N log k).`]],
  code:{cap:`Java (uses ListNode from lesson 2)`,code:`static ListNode mergeKLists(ListNode[] lists) {
    PriorityQueue<ListNode> heap = new PriorityQueue<>((a, b) -> Integer.compare(a.val, b.val));
    for (ListNode head : lists) if (head != null) heap.add(head);
    ListNode dummy = new ListNode(0), tail = dummy;
    while (!heap.isEmpty()) {
        ListNode smallest = heap.poll();                             // smallest front among all lists
        tail.next = smallest;
        tail = smallest;
        if (smallest.next != null) heap.add(smallest.next);          // its list offers the next candidate
    }
    return dummy.next;
}`,use:`lists: 1->4->5,  1->3->4,  2->6
heap holds the heads: 1, 1, 2
take 1 (list A), push 4. take 1 (list B), push 3. take 2 (list C), push 6.
take 3, push 4. take 4, take 4, push 5 ... then 5, 6
result: 1,1,2,3,4,4,5,6`},
  trade:`O(N log k) time where N is the total number of nodes. O(k) extra space.`,
  follow:`Merge two sorted lists (the building block). Merge k sorted arrays. The k-th smallest in k sorted lists.`}
 ]},
 {t:`mistake`,h:`Sorting intervals with <code>(a, b) -> a[0] - b[0]</code>. It overflows for large values. Another slip: using a <b>max</b>-heap for "k largest". The k largest are kept in a <b>min</b>-heap so you can throw out the smallest.`},
 {t:`check`,q:`You need the 10 cheapest products among a stream of a million prices, using little memory. Which structure?`,a:`A max-heap of size 10. Keep the 10 cheapest seen so far. The top is the most expensive of them. If a new price is cheaper than the top, replace the top. Memory stays at 10 items and each update is O(log 10).`}
]},

{id:`lesson-7`,track:`dsa`,trackName:`DSA and coding rounds`,title:`Linked lists and stacks`,min:26,
 promise:`Pointer problems feel scary until you draw them. Here you learn the three moves that solve most of them, and the stack idea behind "next greater" questions.`,
 blocks:[
 {t:`plain`,h:`A <b>linked list</b> is a chain of nodes, each knowing only the next one. You cannot jump to the middle. So the tricks are about walking carefully: reverse the arrows, use a slow and a fast walker, or add a dummy node at the front. A <b>stack</b> is last-in, first-out, perfect when the most recent unfinished thing is the one you must deal with first.`},
 {t:`analogy`,h:`A linked list is a treasure hunt: each clue tells you where the next clue is. A stack is a pile of plates: you only touch the top one.`},
 {t:`cards`,items:[
   {h:`Reverse`,b:`Flip each arrow while walking. Needs three variables: prev, cur, next.`},
   {h:`Slow and fast pointers`,b:`Fast moves two steps, slow moves one. When fast reaches the end, slow is at the middle. If there is a loop, fast catches slow.`},
   {h:`Dummy head`,b:`A fake first node so you never write special code for "the list is empty" or "remove the first node".`},
   {h:`Monotonic stack`,b:`Keep a stack in sorted order. Each new item pops everything it beats. Used for "next greater element" questions.`}]},
 {t:`remember`,h:`<b>Draw boxes and arrows on paper or in the editor comments.</b> Pointer bugs come from doing steps in the wrong order. The classic rule: save <code>next</code> <i>before</i> you overwrite it.`},
 {t:`qbank`,items:[
 {n:`Reverse a Linked List`,tag:`Linked list`,where:`The most common linked-list warm-up in every company's list. Also a building block inside harder problems.`,
  ask:`Reverse a singly linked list and return the new head.`,
  quality:`Doing the four steps in the right order, then saying the loop out loud.`,
  steps:[[`Idea.`,` Walk the list. At each node, point its arrow backwards to the node before it.`],[`Three variables.`,` <code>prev</code> starts as null. <code>cur</code> starts at the head.`],[`Each step.`,` Save <code>cur.next</code>. Point <code>cur.next</code> to <code>prev</code>. Move <code>prev</code> and <code>cur</code> forward.`],[`Finish.`,` When <code>cur</code> becomes null, <code>prev</code> is the old last node, which is the new head.`],[`Recursive version.`,` Reverse the rest, then make the next node point back at this one. Mention it, but the loop is safer.`]],
  code:{cap:`Java`,code:`static ListNode reverseList(ListNode head) {
    ListNode prev = null, cur = head;
    while (cur != null) {
        ListNode next = cur.next;      // 1. remember the rest
        cur.next = prev;               // 2. flip the arrow
        prev = cur;                    // 3. step forward
        cur = next;
    }
    return prev;                       // prev ends on the old last node: the new head
}`,use:`1 -> 2 -> 3 -> null
start: prev=null, cur=1
step 1: save 2, make 1 point to null,  prev=1, cur=2
step 2: save 3, make 2 point to 1,     prev=2, cur=3
step 3: save null, make 3 point to 2,  prev=3, cur=null
return 3 -> 2 -> 1 -> null`},
  trade:`O(n) time, O(1) space for the loop. The recursive version uses O(n) stack space.`,
  follow:`Reverse only between positions m and n. Reverse in groups of k. Check whether a list is a palindrome (find the middle, reverse the second half, compare).`},
 {n:`Linked List Cycle and where it starts`,tag:`Fast and slow`,where:`A standard linked-list question in assessment and onsite lists.`,
  ask:`Detect whether a linked list has a loop. If it does, return the node where the loop begins.`,
  quality:`Using O(1) space instead of a visited set, and explaining the second phase.`,
  steps:[[`Easy way.`,` Put visited nodes in a hash set. O(n) space.`],[`Fast and slow.`,` Slow moves 1 step, fast moves 2. If there is no loop, fast reaches the end. If there is a loop, fast eventually laps slow and they meet inside it.`],[`Finding the start.`,` When they meet, put a new pointer at the head. Move it and slow one step at a time. They meet exactly at the loop start.`],[`Why.`,` The distance from the head to the loop start equals the distance from the meeting point onward to the loop start (modulo the loop length). You can say this as a known result and show an example.`]],
  code:{cap:`Java`,code:`static ListNode detectCycle(ListNode head) {                         // returns the node where the loop starts
    ListNode slow = head, fast = head;
    while (fast != null && fast.next != null) {
        slow = slow.next;
        fast = fast.next.next;
        if (slow == fast) {                                          // met inside the loop
            ListNode p = head;
            while (p != slow) { p = p.next; slow = slow.next; }      // equal steps: they meet at the loop start
            return p;
        }
    }
    return null;                                                     // fast reached the end: no loop
}`,use:`list 3 -> 2 -> 0 -> -4, and -4 points back to 2
slow: 3, 2, 0     fast: 3, 0, 2     (they meet at 2 after a few steps)
put p at the head (3). Move p and slow together:
p=3, slow=2  ->  p=2, slow=0  ... they meet at node 2, the loop start`},
  trade:`O(n) time, O(1) space.`,
  follow:`Find the length of the loop. Find the middle node. Remove the loop. Detect a duplicate in an array using the same idea.`},
 {n:`Valid Parentheses`,tag:`Stack`,where:`A very common first stack question. Interviewers like follow-ups on it.`,
  ask:`Given a string of brackets ()[]{}, say whether it is valid: every opening bracket is closed by the right type, in the right order.`,
  quality:`A stack of open brackets, and handling both leftover opens and a close with nothing open.`,
  steps:[[`Idea.`,` The most recent unclosed opening bracket must be the next one closed. That is last-in, first-out.`],[`Opening bracket.`,` Push it.`],[`Closing bracket.`,` The stack must not be empty, and the popped bracket must be the matching type.`],[`End.`,` The stack must be empty. Leftovers mean something was never closed.`]],
  code:{cap:`Java`,code:`static boolean isValid(String s) {
    Deque<Character> stack = new ArrayDeque<>();
    for (char c : s.toCharArray()) {
        if (c == '(' || c == '[' || c == '{') {
            stack.push(c);
        } else {
            if (stack.isEmpty()) return false;
            char open = stack.pop();
            if ((c == ')' && open != '(') || (c == ']' && open != '[') || (c == '}' && open != '{'))
                return false;
        }
    }
    return stack.isEmpty();                                          // leftovers mean unclosed brackets
}`,use:`"{[]}"
{  push        stack: {
[  push        stack: { [
]  pop [ ok   stack: {
}  pop { ok   stack empty -> valid

"(]"  : ] arrives, popped ( does not match -> false`},
  trade:`O(n) time, O(n) space.`,
  follow:`Minimum brackets to add to make it valid. Longest valid parentheses (stack of indexes, or DP). Generate all valid combinations of n pairs (backtracking).`},
 {n:`Daily Temperatures (next greater element)`,tag:`Monotonic stack`,where:`The template for the "next greater" family listed in stack guides.`,
  ask:`For each day, find how many days you must wait for a warmer temperature. If never, put 0.`,
  quality:`Keeping <b>indexes</b> of days that are still waiting, in decreasing temperature order.`,
  steps:[[`Brute force.`,` For each day look right until a warmer one. O(n squared).`],[`Idea.`,` Keep a stack of days still waiting for something warmer.`],[`Each new day.`,` While the new temperature is warmer than the day on top, pop that day and record the wait (new index minus popped index).`],[`Then push the new day.`,` It is waiting too.`],[`Why O(n).`,` Each day is pushed once and popped once.`]],
  code:{cap:`Java`,code:`static int[] dailyTemperatures(int[] temps) {
    int[] answer = new int[temps.length];
    Deque<Integer> waiting = new ArrayDeque<>();                     // indexes of days still waiting for a warmer day
    for (int i = 0; i < temps.length; i++) {
        while (!waiting.isEmpty() && temps[waiting.peek()] < temps[i]) {
            int day = waiting.pop();
            answer[day] = i - day;                                   // today is the warmer day they waited for
        }
        waiting.push(i);
    }
    return answer;                                                   // days never resolved stay 0
}`,use:`temps = [73, 74, 75, 71, 69, 72, 76, 73]
day0 (73): push
day1 (74): warmer than 73 -> day0 waits 1. push
day2 (75): warmer than 74 -> day1 waits 1. push
day3 (71), day4 (69): push (colder, they wait)
day5 (72): beats 69 and 71 -> days 4 and 3 wait 1 and 2. push
day6 (76): beats 72 and 75 -> days 5 and 2 wait 1 and 4. push
day7 (73): push. Never resolved days stay 0.
answer = [1, 1, 4, 2, 1, 1, 0, 0]`},
  trade:`O(n) time, O(n) space.`,
  follow:`Next greater element in a circular array. Largest rectangle in a histogram (monotonic stack again). Stock span.`},
 {n:`Sliding Window Maximum`,tag:`Monotonic deque`,where:`Reported as a harder sliding-window question in product-company rounds. A good one to know the idea of.`,
  ask:`For every window of size k in an array, return the maximum.`,
  quality:`A deque of indexes whose values decrease from front to back.`,
  steps:[[`Brute force.`,` Scan each window. O(n times k).`],[`Idea.`,` Keep candidate indexes in a deque so the front is always the current maximum.`],[`New item arrives.`,` Remove from the back every index whose value is not bigger than the new one. They can never be a maximum while the new item is in the window.`],[`Old item leaves.`,` If the front index has slid out of the window, remove it.`],[`Answer.`,` After the first k items, the front of the deque is the window maximum.`]],
  code:{cap:`Java`,code:`static int[] maxSlidingWindow(int[] nums, int k) {
    int[] out = new int[nums.length - k + 1];
    Deque<Integer> dq = new ArrayDeque<>();                          // indexes; their values are decreasing
    for (int i = 0; i < nums.length; i++) {
        if (!dq.isEmpty() && dq.peekFirst() <= i - k) dq.pollFirst();             // left the window
        while (!dq.isEmpty() && nums[dq.peekLast()] <= nums[i]) dq.pollLast();    // smaller ones can never be the max
        dq.addLast(i);
        if (i >= k - 1) out[i - k + 1] = nums[dq.peekFirst()];                    // front is the window maximum
    }
    return out;
}`,use:`nums = [1, 3, -1, -3, 5, 3, 6, 7], k = 3
add 1:  dq [1]
add 3:  drops 1 -> dq [3]
add -1: dq [3, -1]          window full -> max 3
add -3: dq [3, -1, -3]      max 3
add 5:  drops -3, -1, 3 -> dq [5]    max 5
add 3:  dq [5, 3]           max 5
add 6:  drops 3, 5 -> dq [6]  max 6
add 7:  drops 6 -> dq [7]     max 7
answer = [3, 3, 5, 5, 6, 7]`},
  trade:`O(n) time (each index enters and leaves once), O(k) space.`,
  follow:`Use a heap instead (O(n log n), simpler to explain). Minimum in each window. First negative number in each window.`}
 ]},
 {t:`mistake`,h:`Overwriting <code>cur.next</code> before saving it, which loses the rest of the list. Also forgetting that a list of zero or one node is valid input. Say "empty and single node" out loud and check them.`},
 {t:`check`,q:`How do you find the middle of a linked list in one pass without knowing its length?`,a:`Slow and fast pointers. Move slow by one and fast by two. When fast reaches the end (null or the last node), slow is at the middle.`}
]},

    if (node == null) return 0;          // 1. the base case: nothing here
    int left  = solve(node.left);        // 2. trust the left subtree
    int right = solve(node.right);       // 3. trust the right subtree
    return combine(left, right, node);   // 4. build this node's answer

 {t:`qbank`,items:[
 {n:`Binary Tree Level Order Traversal`,tag:`BFS`,where:`A standard tree question. Its pattern (queue plus level size) is reused in many graph problems.`,
  ask:`Return the values of a binary tree level by level, as a list of lists.`,
  quality:`Taking <code>queue.size()</code> at the start of each level.`,
  steps:[[`Queue.`,` Put the root in a queue.`],[`Each round is one level.`,` Read the queue size now. That is how many nodes are on this level.`],[`Process exactly that many.`,` Remove each, record its value, add its children.`],[`Repeat until the queue is empty.`,``]],
  code:{cap:`Java (TreeNode is in lesson 2)`,code:`static List<List<Integer>> levelOrder(TreeNode root) {
    List<List<Integer>> out = new ArrayList<>();
    if (root == null) return out;
    Queue<TreeNode> queue = new ArrayDeque<>();
    queue.add(root);
    while (!queue.isEmpty()) {
        int size = queue.size();                                     // everything queued now is one level
        List<Integer> level = new ArrayList<>();
        for (int i = 0; i < size; i++) {
            TreeNode n = queue.poll();
            level.add(n.val);
            if (n.left != null) queue.add(n.left);
            if (n.right != null) queue.add(n.right);
        }
        out.add(level);
    }
    return out;
}`,use:`tree:      3
          / \\
         9  20
           /  \\
          15   7
queue [3]            -> level [3]
queue [9, 20]        -> level [9, 20]
queue [15, 7]        -> level [15, 7]
result [[3], [9, 20], [15, 7]]`},
  trade:`O(n) time. Space O(w) where w is the widest level.`,
  follow:`Zigzag order. Right-side view. Average of each level. Minimum depth.`},
 {n:`Diameter of a Binary Tree`,tag:`DFS`,where:`Reported in product-company tree rounds as the example of "answer bends at a node".`,
  ask:`Find the length of the longest path between any two nodes (it need not pass through the root).`,
  quality:`Seeing that a function can <b>return one thing</b> (height) while <b>recording another</b> (best path).`,
  steps:[[`Idea.`,` The longest path that bends at a node is (height of left) plus (height of right).`],[`Walk the tree once.`,` At each node compute both heights, update a global best with their sum.`],[`What to return upward.`,` Only one side can continue to the parent, so return <code>1 + max(left, right)</code>.`],[`Units.`,` A null child has height 0 and a leaf has height 1. Left height plus right height then equals the number of edges on the path.`]],
  code:{cap:`Java`,code:`static int diameterOfBinaryTree(TreeNode root) {
    int[] best = new int[1];
    height(root, best);
    return best[0];
}
static int height(TreeNode n, int[] best) {
    if (n == null) return 0;
    int l = height(n.left, best), r = height(n.right, best);
    best[0] = Math.max(best[0], l + r);                              // longest path that bends at this node
    return 1 + Math.max(l, r);                                       // report only one side upward
}`,use:`tree:    1
        / \\
       2   3
      / \\
     4   5
node 4 and 5: height 1, best 0
node 2: left 1 + right 1 = 2 -> best 2, returns 2
node 3: height 1
node 1: left 2 + right 1 = 3 -> best 3
answer = 3   (path 4 - 2 - 1 - 3)`},
  trade:`O(n) time. O(h) stack space, where h is the tree height.`,
  follow:`Maximum path sum (same idea with values, ignoring negatives). Longest univalue path. Height-balanced check.`},
 {n:`Validate a Binary Search Tree`,tag:`BST`,where:`A very common BST question, known for one classic wrong answer.`,
  ask:`Check whether a binary tree is a valid BST.`,
  quality:`Passing <b>bounds</b> down. Checking only the direct children is wrong.`,
  steps:[[`The trap.`,` Checking that left &lt; node &lt; right at each node misses the case where a deeper node breaks an ancestor's rule.`],[`Bounds.`,` Every node must be strictly between a low and a high bound. The root has no bounds.`],[`Going left.`,` The node's value becomes the new high bound.`],[`Going right.`,` The node's value becomes the new low bound.`],[`Use long bounds.`,` So a node holding Integer.MIN_VALUE or MAX_VALUE does not break the check.`],[`Alternative.`,` An in-order walk of a BST is strictly increasing. Check that.`]],
  code:{cap:`Java`,code:`static boolean isValidBST(TreeNode root) {
    return isValidBST(root, Long.MIN_VALUE, Long.MAX_VALUE);
}
static boolean isValidBST(TreeNode n, long lo, long hi) {            // every value must stay strictly inside (lo, hi)
    if (n == null) return true;
    if (n.val <= lo || n.val >= hi) return false;
    return isValidBST(n.left, lo, n.val) && isValidBST(n.right, n.val, hi);
}`,use:`tree:   5
       / \\
      1   4        4 is right of 5 but smaller: bad
         / \\
        3   6
5: bounds (-inf, +inf) ok
1: bounds (-inf, 5) ok
4: bounds (5, +inf) -> 4 <= 5 -> false`},
  trade:`O(n) time, O(h) space.`,
  follow:`Kth smallest in a BST (in-order walk). Insert and delete in a BST. Lowest common ancestor in a BST (walk down using the bounds). Recover a BST with two swapped nodes.`},
 {n:`Lowest Common Ancestor`,tag:`DFS`,where:`A frequently listed tree problem in onsite rounds.`,
  ask:`Given a binary tree and two nodes p and q, find their lowest common ancestor.`,
  quality:`The "if both sides found something, I am the answer" rule.`,
  steps:[[`Base.`,` If the node is null, or is p, or is q, return it.`],[`Ask both sides.`,` Search the left and right subtrees.`],[`If both return something.`,` p is on one side and q on the other, so this node is the lowest common ancestor.`],[`Otherwise.`,` Return whichever side found something (or null).`]],
  code:{cap:`Java`,code:`static TreeNode lowestCommonAncestor(TreeNode root, TreeNode p, TreeNode q) {
    if (root == null || root == p || root == q) return root;
    TreeNode left = lowestCommonAncestor(root.left, p, q);
    TreeNode right = lowestCommonAncestor(root.right, p, q);
    if (left != null && right != null) return root;                  // p and q are on different sides: this is the meeting point
    return left != null ? left : right;                              // both are on one side
}`,use:`tree:     3
        /   \\
       5     1        p = 5, q = 1
      / \\   / \\
     6   2 0   8
root 3: left search returns 5, right search returns 1 -> both found -> answer 3
for p = 5, q = 2: the left search stops at 5 itself -> answer 5 (a node can be its own ancestor)`},
  trade:`O(n) time, O(h) space.`,
  follow:`In a BST (no full search needed). With parent pointers. When p or q may not exist in the tree.`},
 {n:`Implement a Trie (prefix tree)`,tag:`Trie`,where:`Swiggy is reported to ask a Trie problem. It also underlies autocomplete and search-suggestion design questions.`,
  ask:`Implement insert, search and startsWith for lowercase words.`,
  quality:`Each node has 26 children and an "end of word" flag.`,
  steps:[[`Structure.`,` A node holds an array of 26 child nodes and a boolean.`],[`Insert.`,` Walk the letters, creating missing nodes, and set the flag on the last one.`],[`Search.`,` Walk the letters. Succeed only if every node exists and the final one has the flag.`],[`startsWith.`,` The same walk, but it only needs every node to exist.`],[`Why not a set of words?`,` A trie answers "which words start with this" quickly and shares common prefixes, which saves space.`]],
  code:{cap:`Java`,code:`static class Trie {
    private final Trie[] next = new Trie[26];
    private boolean isEndOfWord;

    void insert(String word) {
        Trie node = this;
        for (char c : word.toCharArray()) {
            if (node.next[c - 'a'] == null) node.next[c - 'a'] = new Trie();
            node = node.next[c - 'a'];
        }
        node.isEndOfWord = true;                                     // "app" and "apple" share nodes; only this flag differs
    }
    boolean search(String word) {
        Trie node = find(word);
        return node != null && node.isEndOfWord;
    }
    boolean startsWith(String prefix) { return find(prefix) != null; }

    private Trie find(String s) {
        Trie node = this;
        for (char c : s.toCharArray()) {
            node = node.next[c - 'a'];
            if (node == null) return null;
        }
        return node;
    }
}`,use:`insert "apple": nodes a - p - p - l - e, flag set on e
search "app"      -> nodes exist but p has no flag -> false
startsWith "app"  -> nodes exist -> true
insert "app": the same nodes, now flag the second p
search "app"      -> true`},
  trade:`Insert and search are O(length of the word). Space can be large: up to 26 slots per node. A HashMap of children saves space for sparse data.`,
  follow:`Autocomplete: return the top 3 suggestions (store counts, or run DFS from the prefix node). Word search on a grid with a trie. Replace words with their roots.`}
 ]},
 {t:`mistake`,h:`Forgetting the null base case, or confusing <b>height</b> (what a function returns) with <b>answer</b> (what it records). When a tree problem confuses you, write down in one sentence what your function returns for a node, then trust it.`},
 {t:`check`,q:`Why is "for each node, left child is smaller and right child is bigger" not enough to validate a BST?`,a:`Because the rule must hold for the whole subtree. A node deep in the left subtree can be bigger than the root and still pass its own parent's check. You need to pass down a (low, high) range, or check that an in-order walk is strictly increasing.`}
]},

 {t:`qbank`,items:[
 {n:`Number of Islands`,tag:`DFS on a grid`,where:`A standard grid question reported across product-company assessments. Zomato's graph questions are said to be of this type.`,
  ask:`A grid of '1' (land) and '0' (water). Count the islands. An island is land connected up, down, left or right.`,
  quality:`Marking visited cells so each island is counted once.`,
  steps:[[`Scan every cell.`,` When you find land you have not visited, you found a new island.`],[`Flood it.`,` Run DFS from there, turning every connected land cell into water so it is never counted again.`],[`Count.`,` One increment per flood.`],[`Edge cases.`,` Empty grid, all water, a single cell. Also ask whether you may change the input. If not, use a visited array.`]],
  code:{cap:`Java`,code:`static int numIslands(char[][] grid) {
    int count = 0;
    for (int r = 0; r < grid.length; r++)
        for (int c = 0; c < grid[0].length; c++)
            if (grid[r][c] == '1') { count++; sink(grid, r, c); }    // a new island: flood it so it is counted once
    return count;
}
static void sink(char[][] g, int r, int c) {
    if (r < 0 || c < 0 || r >= g.length || c >= g[0].length || g[r][c] != '1') return;
    g[r][c] = '0';                                                   // mark visited
    sink(g, r + 1, c); sink(g, r - 1, c); sink(g, r, c + 1); sink(g, r, c - 1);
}`,use:`11000
11000
00100
00011
scan: (0,0) is land -> island 1, flood the 2x2 block
(2,2) is land -> island 2
(3,3) is land -> island 3, flood (3,3) and (3,4)
answer = 3`},
