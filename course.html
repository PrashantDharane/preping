p{margin:0}

button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* top bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line);padding:10px 0;display:flex;align-items:center;gap:12px}
.bar .where{flex:1;min-width:0;font:500 .85rem var(--font-mono);color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.menu-btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 14px;cursor:pointer;font-weight:600;font-size:.92rem}
.homelink{color:var(--accent);text-decoration:none;font-weight:600;font-size:.92rem;padding:8px 4px}
.meter{height:4px;background:var(--surface-2)}
.meter i{display:block;height:100%;width:0;background:var(--accent);transition:width .25s}

/* lesson list */
.list{display:none;padding:16px 0 8px}
.list.open{display:block}
.list h3{font:600 .75rem var(--font-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:16px 0 6px}
.list a{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 12px;border-radius:10px;text-decoration:none;color:var(--fg);font-size:.98rem}
.list a:hover{background:var(--surface-2)}
.list a[aria-current="page"]{background:var(--surface);border:1px solid var(--line)}
.list .n{font:500 .8rem var(--font-mono);color:var(--muted)}
.list .tick{font-size:.85rem;color:var(--good)}
.list .min{font:400 .75rem var(--font-mono);color:var(--muted)}

/* lesson */
.lesson{padding-top:36px;display:flex;flex-direction:column;gap:28px}
.kicker{font:600 .78rem var(--font-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--accent)}
.lesson h1{font-size:clamp(1.9rem,5vw,2.5rem);font-weight:700;letter-spacing:-.02em;margin-top:8px}
.promise{color:var(--muted);font-size:1.08rem;margin-top:10px}
.sec{display:flex;flex-direction:column;gap:12px;min-width:0}
.label{font:600 .75rem var(--font-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--accent)}
.sec h2{font-size:1.3rem;font-weight:600}
.sec p+p{margin-top:2px}
b,strong{font-weight:600}
.box{border-radius:14px;padding:18px 20px;display:flex;flex-direction:column;gap:8px;background:var(--accent-soft)}
.box.plain{background:var(--surface);border:1px solid var(--line)}
.box.mistake{background:var(--bad-soft)}
.box.mistake .label{color:var(--bad)}
.box.remember{background:var(--warn-soft)}
.box.remember .label{color:var(--warn)}
ol.steps{list-style:none;margin:0;padding:0;counter-reset:s;display:flex;flex-direction:column;gap:14px}
ol.steps li{counter-increment:s;display:grid;grid-template-columns:34px minmax(0,1fr);gap:14px}
ol.steps li::before{content:counter(s);width:30px;height:30px;border-radius:50%;background:var(--accent);color:var(--on-accent);font:600 .85rem var(--font-mono);display:grid;place-items:center;margin-top:2px}
ol.steps b{display:block}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:620px){.two{grid-template-columns:1fr}}
.two>div{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:14px 16px;min-width:0}
.two .h{font:600 .75rem var(--font-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--accent);margin-bottom:6px}
.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media(max-width:620px){.cards{grid-template-columns:1fr}}
.card{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:6px;min-width:0}
.card h3{font-size:1.05rem}
.card .pic{color:var(--accent);font-weight:600;font-size:.95rem}
.card .small{color:var(--muted);font-size:.93rem}
pre{margin:0;background:var(--code-bg);border:1px solid var(--line);border-radius:10px;padding:14px 16px;overflow-x:auto;font:400 .84rem/1.6 var(--font-mono);tab-size:2}
.cap{font:500 .75rem var(--font-mono);color:var(--muted);margin-bottom:-4px}
.cap.bad{color:var(--bad)} .cap.good{color:var(--good)}
.cap.use{color:var(--accent);font-weight:600}
pre.use{border-left:3px solid var(--accent)}
.check{border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:18px 20px;display:flex;flex-direction:column;gap:12px}

.ans{background:var(--good-soft);border-radius:10px;padding:12px 14px}
.ans[hidden]{display:none}
.nav{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:8px}
.btn{border:1px solid var(--accent);background:var(--accent);color:var(--on-accent);border-radius:12px;padding:12px 20px;font-weight:600;cursor:pointer}
.btn.ghost{background:transparent;color:var(--accent)}
.btn:disabled{opacity:.4;cursor:default}
.done-row{display:flex;align-items:center;gap:10px}
.done-row input{width:20px;height:20px;accent-color:var(--accent)}

/* calculator + timer */
.fields{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
@media(max-width:620px){.fields{grid-template-columns:1fr}}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field label{font-size:.85rem;color:var(--muted)}
.field input{width:100%;padding:10px 12px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--fg);font:500 1rem var(--font-mono)}
.out{display:flex;flex-direction:column}
.out div{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid var(--line)}
.out span{color:var(--muted);font-size:.95rem}

.timer{font:500 clamp(2.6rem,9vw,3.6rem)/1 var(--font-mono);font-variant-numeric:tabular-nums}
.pill{display:inline-block;font:500 .75rem var(--font-mono);letter-spacing:.1em;text-transform:uppercase;padding:3px 10px;border-radius:99px;background:var(--accent-soft);color:var(--accent)}
.row{display:flex;gap:10px;flex-wrap:wrap}
.stage{padding:8px 14px;border-radius:99px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font:500 .85rem var(--font-mono)}
.stage[aria-pressed="true"]{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}

code{font:500 .86em var(--font-mono);background:var(--code-bg);padding:1px 5px;border-radius:4px;overflow-wrap:anywhere}
pre code{padding:0;background:none}

/* diagrams */
.diagram{border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:14px 12px 10px;display:flex;flex-direction:column;gap:8px}
.diagram svg{display:block;width:100%;max-width:560px;height:auto;margin:0 auto}
.diagram .dcap{font-size:.88rem;color:var(--muted);text-align:center}
.dg-box{fill:var(--surface-2);stroke:var(--muted);stroke-width:1.2}
.dg-if{fill:var(--accent-soft);stroke:var(--accent);stroke-width:1.4}
.dg-st{fill:var(--accent-soft);stroke:var(--accent);stroke-width:1.4}
.dg-note{fill:none;stroke:var(--muted);stroke-width:1.1;stroke-dasharray:4 3}
.dg-sep{stroke:var(--muted);stroke-width:1;opacity:.6}
.dg-t{font:600 12.5px var(--font-display);fill:var(--fg);text-anchor:middle}
.dg-s{font:italic 400 10px var(--font-mono);fill:var(--muted);text-anchor:middle}
.dg-m{font:400 10.5px var(--font-mono);fill:var(--fg)}
.dg-n{font:400 10.5px var(--font-mono);fill:var(--muted);text-anchor:middle}
.dg-e{stroke:var(--muted);stroke-width:1.4;fill:none}
.dg-e.dash{stroke-dasharray:5 4}
.dg-lb{fill:var(--surface)}
.dg-l{font:500 10.5px var(--font-body);fill:var(--fg);text-anchor:middle}
.mk-tri{fill:var(--surface);stroke:var(--muted);stroke-width:1.2}
.mk-open{fill:none;stroke:var(--muted);stroke-width:1.4}
.mk-fill{fill:var(--muted);stroke:none}
/* question bank */
details.q{border:1px solid var(--line);background:var(--surface);border-radius:14px}
details.q+details.q{margin-top:10px}
details.q>summary{cursor:pointer;list-style:none;padding:16px 18px;display:flex;align-items:center;justify-content:space-between;gap:12px;font:600 1.05rem/1.3 var(--font-display)}
details.q>summary::-webkit-details-marker{display:none}
details.q>summary::after{content:"+";font:500 1.3rem var(--font-mono);color:var(--accent);flex:none}
details.q[open]>summary::after{content:"\2212"}
details.q[open]>summary{border-bottom:1px solid var(--line)}
.qleft{display:flex;align-items:center;gap:10px;min-width:0;flex-wrap:wrap}
.qbody{padding:18px;display:flex;flex-direction:column;gap:18px;min-width:0}
.qbody .where{font-size:.9rem;color:var(--muted)}
.qsec{display:flex;flex-direction:column;gap:6px;min-width:0}
.qlist{margin:0;padding-left:20px}
.qlist li+li{margin-top:6px}
.links{display:flex;flex-direction:column;gap:8px}
.links a{color:var(--accent);word-break:break-word}

<script>
(function(){
'use strict';
var $=function(s,r){return (r||document).querySelector(s)};
var KEY='design-course-v1';
var done={};
try{done=JSON.parse(localStorage.getItem(KEY)||'{}')||{}}catch(e){done={}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(done))}catch(e){}}

/* ================= CONTENT ================= */
/* block types: p, plain, analogy, steps, two, cards, code, mistake, check, remember, calc, drill, stages */
var L=[

/* ---------- 1 ---------- */
{id:'lesson-1',track:'start',trackName:'Start here',title:'What "design" actually means',min:6,
 promise:'Before any technique, get the picture straight. After this lesson, you will know what an interviewer is really asking when they say LLD or HLD.',
 blocks:[
 {t:'plain',h:'<b>Design</b> means deciding, before you build, <b>where things go and who is responsible for what</b>. The goal is a system that is easy to build, easy to change later, and does not fall over when many people use it.'},
 {t:'analogy',h:'Think of a restaurant.<br><br><b>LLD (low-level design)</b> is the inside of one kitchen. Which station cooks what? Who talks to whom? Where does the order slip go? If the chef also washes dishes and takes payment, the kitchen is a mess.<br><br><b>HLD (high-level design)</b> is the restaurant business. How many branches? How do orders reach the kitchens? What happens on Saturday night when ten times more people show up? What if one branch burns down?'},
 {t:'two',a:{h:'LLD asks',b:'Which <b>classes</b> do I need? What does each one know and do? How do they talk to each other? How do I add a new feature without breaking old ones?'},b:{h:'HLD asks',b:'Which <b>servers, databases and services</b> do I need? How much traffic is coming? What breaks first when traffic grows? How do I stay up if one part dies?'}},
 {t:'p',h:'<h2>What the interviewer is really checking</h2><p>Not whether you remember the "right" answer. There usually is not one. They are checking three things:</p>'},
 {t:'steps',items:[
   ['Can you think in an organized way?','You ask questions first, break the problem down, and move step by step instead of panicking.'],
   ['Can you explain your choices?','"I chose X because of Y" is worth far more than a perfect diagram with no reasons.'],
   ['Do you know what it costs?','Every choice gives something up. Naming the cost is what makes you sound senior.']]},
 {t:'check',q:'You are asked: "How would the order system of a food delivery app handle one million orders on a Friday night?" Is that LLD or HLD?',a:'HLD. It is about traffic, servers and databases. If the question were "which classes would you create for Order, Restaurant and DeliveryPartner?", that would be LLD.'},
 {t:'remember',h:'LLD is about <b>code structure</b>. HLD is about <b>system structure</b>. Both are really about the same skill: making good decisions and explaining them.'}
]},

/* ---------- 2 ---------- */
{id:'lesson-2',track:'start',trackName:'Start here',title:'The four-question habit',min:9,
 promise:'One simple habit you can use on any design problem, small or huge. You will practice it on a simple to-do app.',
 blocks:[
 {t:'plain',h:'Most people fail design interviews because they start drawing boxes straight away. Strong engineers pause and run <b>four questions</b>, in order. Memorize this order: <b>Clarify, Model, Stress, Trade.</b>'},
 {t:'p',h:'<h2>Worked example: "Design a to-do app"</h2><p>Here is what the four questions look like in a real answer.</p>'},
 {t:'steps',items:[
   ['Clarify: what exactly are we building?','You say: "Is this for one person or shared between teams? Do we need reminders? Web only, or mobile too? Roughly how many users?" You get answers, then you write down three things the system must do. For example: add a task, mark it done, list my tasks.'],
   ['Model: what are the things, and who owns what?','The things are <b>User</b>, <b>Task</b> and <b>TaskList</b>. A Task knows its own title and whether it is done. A TaskList holds many Tasks. A User owns many TaskLists.'],
   ['Stress: what breaks?','Ask "what if" out loud. What if two people edit the same task at once? What if a user has 50,000 tasks? What if the server restarts while saving? You do not need to solve all of it, but you must notice it.'],
   ['Trade: what did I give up?','"I will keep everything in one SQL database. It is simple and safe. The cost is that if we reach millions of users, I will need to split it. I would only do that when the numbers force me to."']]},
 {t:'mistake',h:'Jumping to the diagram. If you draw boxes before you ask questions, you are guessing what the problem is. A wrong guess costs you the whole interview, because everything after it is built on it.'},
 {t:'p',h:'<h2>Sentences that make you sound organized</h2>'},
 {t:'cards',items:[
   {h:'To clarify',b:'"Before I design, can I confirm the scope?"'},
   {h:'To assume',b:'"I will assume X. Tell me if that is wrong."'},
   {h:'To decide',b:'"I am choosing A over B because..."'},
   {h:'To finish',b:'"This works well for ..., it costs ..., and I would revisit it if ..."'}]},
 {t:'check',q:'Name the four questions in order, and say in one line what the fourth one does.',a:'Clarify, Model, Stress, Trade. The fourth one names what your design gives up, and when you would choose differently.'},
 {t:'remember',h:'Clarify first, even for a small problem. Ten seconds of questions can save ten minutes of wrong design.'}
]},

/* ---------- 3 ---------- */
{id:'lesson-3',track:'lld',trackName:'LLD',title:'Find the things in the problem',min:10,
 promise:'The first LLD skill: turn a paragraph of requirements into a clean list of classes. There is a simple trick for it.',
 blocks:[
 {t:'plain',h:'Read the problem statement and <b>underline the nouns</b>. Those are your candidate classes. Underline the <b>verbs</b>. Those are your candidate methods.'},
 {t:'p',h:'<h2>Example: a library</h2><p><i>"A member can borrow a book for 14 days. If the book is returned late, the member pays a fine."</i></p>'},
 {t:'steps',items:[
   ['Underline the nouns','<b>member, book, days, fine</b>. Also hidden ones: the act of borrowing is a thing that has a start date and an end date. Call it <b>Loan</b>.'],
   ['Ask: one or many?','The library owns <i>one title</i> but <i>many physical copies</i> of it. If two members want the same title, they borrow different copies. So split it: <b>Book</b> (the title) and <b>BookCopy</b> (one physical copy).'],
   ['Underline the verbs','borrow, return, calculate fine. These become methods.'],
   ['Check each noun earns its place','"days" is just a number, not a class. "fine" is a calculation that depends on a Loan, so it is a method for now.']]},
 {t:'code',cap:'The first sketch (just the shape, no logic yet)',code:'class Member   { String id; String name; }\nclass Book     { String isbn; String title; }\nclass BookCopy { String copyId; Book book; boolean borrowed; }\nclass Loan     { Member member; BookCopy copy;\n                 LocalDate borrowedOn; LocalDate dueOn; }'},
 {t:`code`,use:true,cap:`How it is used`,code:`// (Assume simple constructors, as in any Java class)
Member asha  = new Member("M1", "Asha");
Book   dune  = new Book("978-0441013593", "Dune");
BookCopy c1  = new BookCopy("C1", dune);     // one title...
BookCopy c2  = new BookCopy("C2", dune);     // ...many physical copies

// A loan links a member to ONE physical copy
Loan loan = new Loan(asha, c1, LocalDate.now(), LocalDate.now().plusDays(14));
c1.borrowed = true;

System.out.println(c2.borrowed);             // false: the other copy is still on the shelf
System.out.println(loan.member.name);        // Asha`},
 {t:'mistake',h:'Making one giant class, often called <code>LibraryManager</code>, that does everything: borrowing, fines, searching, printing. It becomes impossible to change. The next lesson shows how to avoid it.'},
 {t:'check',q:'A cinema app: "A user books seats for a show in a screen." Which nouns would you consider as classes?',a:'User, Show, Screen, Seat, and Booking (the hidden one, like Loan above). "Seat" has many instances per Screen, so each seat is its own object. A Booking links a User to a Show and its Seats.'},
 {t:'remember',h:'Nouns become classes. Verbs become methods. Always hunt for the <b>hidden noun</b> that connects two others (Loan, Booking, Order).'}
]},

/* ---------- 4 ---------- */
{id:'lesson-4',track:'lld',trackName:'LLD',title:'Give every class one job',min:10,
 promise:'The single most useful LLD rule, with before and after code. This is what "Single Responsibility" really means.',
 blocks:[
 {t:'plain',h:'Put each piece of logic <b>in the class that already has the data it needs</b>. If a rule needs a due date, it belongs next to the due date.'},
 {t:'analogy',h:'In a kitchen, the cashier should not decide how long to boil the pasta. Each person handles what they have the information for.'},
 {t:'p',h:'<h2>Before and after</h2><p>Here the fine is calculated by the wrong class. Notice how <code>Library</code> has to reach inside <code>Loan</code> to get what it needs.</p>'},
 {t:'code',bad:true,cap:'Hard to maintain: Library knows too much',code:'class Library {\n  double calculateFine(Loan loan) {\n    long late = ChronoUnit.DAYS.between(\n        loan.dueOn, LocalDate.now());\n    return late > 0 ? late * 5 : 0;\n  }\n}'},
 {t:'code',good:true,cap:'Better: Loan owns its own fine rule',code:'class Loan {\n  LocalDate dueOn;\n\n  double fine(LocalDate today) {\n    long late = ChronoUnit.DAYS.between(dueOn, today);\n    return late > 0 ? late * 5 : 0;\n  }\n}'},
 {t:`code`,use:true,cap:`How it is used`,code:`Loan loan = new Loan(LocalDate.of(2026, 11, 1));        // due on 1 Nov
double fine = loan.fine(LocalDate.of(2026, 11, 4));     // returned 3 days late
System.out.println(fine);                               // 15.0  (3 days x 5)

// In a Spring service the call site stays tiny:
@Service
class ReturnService {
  double returnBook(Loan loan) {
    double fine = loan.fine(LocalDate.now());   // Loan owns its own rule
    // ... mark the copy available, save the loan ...
    return fine;
  }
}`},
 {t:'p',h:'Now the rule lives next to <code>dueOn</code>. If the fine rule changes, you edit one class and nothing else moves.'},
 {t:'p',h:'<h2>A quick test you can run on any class</h2><p>Try to describe the class in one sentence <b>without the word "and"</b>.</p>'},
 {t:'two',a:{h:'Passes',b:'"A Loan tracks one borrowing and knows when it is due."'},b:{h:'Fails',b:'"A LibraryManager handles borrowing <b>and</b> fines <b>and</b> search <b>and</b> email reminders." Split it.'}},
 {t:'check',q:'Where should the method <code>isAvailable()</code> live: Library, Book or BookCopy?',a:'BookCopy. A physical copy is the one that is either on the shelf or out on loan. The Book (the title) has many copies, so "available" has no single answer there. Put the question where the data is.'},
 {t:'remember',h:'Ask: <b>"Who has the information to decide this?"</b> That class owns the rule.'}
]},

/* ---------- 5 ---------- */
{id:'lesson-5',track:'lld',trackName:'LLD',title:'Separate what changes from what stays',min:11,
 promise:'How to design so that new requirements mean "add a class", not "edit everything". This is the idea behind Strategy and most other patterns.',
 blocks:[
 {t:'plain',h:'Find the part that <b>will change often</b>. Put it behind a simple <b>plug shape</b> (an interface). The rest of the code only knows the plug shape, never the specific thing plugged in.'},
 {t:'analogy',h:'A phone charger socket. Your phone does not care whether the power comes from a laptop, a wall or a power bank. It only knows the socket shape. You can change the source without touching the phone.'},
 {t:'p',h:'<h2>Example: fine rules keep changing</h2><p>The library first charged 5 rupees per day. Next month, students get a discount. Then there is a holiday with no fines. This is a rule that changes.</p>'},
 {t:'code',bad:true,cap:'Every new rule means editing this method',code:'double fine(Loan loan, Member m) {\n  if (m.type == STUDENT)   return days * 2;\n  else if (m.type == SENIOR) return days * 1;\n  else if (isHoliday())    return 0;\n  else                     return days * 5;\n}'},
 {t:'code',good:true,cap:'Each rule is its own small class',code:'interface FineRule {\n  double fine(long daysLate);\n}\n\nclass StandardFine implements FineRule {\n  public double fine(long d) { return d * 5; }\n}\nclass StudentFine implements FineRule {\n  public double fine(long d) { return d * 2; }\n}\n\nclass Loan {\n  private final FineRule rule;      // plugged in from outside\n  Loan(FineRule rule) { this.rule = rule; }\n  double fine(long late) { return rule.fine(late); }\n}'},
 {t:`code`,use:true,cap:`How it is used`,code:`Loan standard = new Loan(new StandardFine());
Loan student  = new Loan(new StudentFine());

System.out.println(standard.fine(4));   // 20.0  (4 x 5)
System.out.println(student.fine(4));    // 8.0   (4 x 2)

// In a service, the rule is chosen from the member and handed in:
@Service
class LoanService {
  Loan open(Member m) {
    FineRule rule = m.isStudent() ? new StudentFine() : new StandardFine();
    return new Loan(rule);   // Loan never asks "what kind of member is this?"
  }
}`},
 {t:'p',h:'A new rule is now <b>one new class</b>. <code>Loan</code> does not change at all. This is called the <b>Strategy pattern</b>, but you do not need the name. You need the habit of asking "what will change?"'},
 {t:'mistake',h:'Adding an interface for things that never change. Spot sizes in a parking lot or the number of days in a week will not change. Only add a plug where you can <b>name the next variation</b>.'},
 {t:'check',q:'An app sends alerts by email today. The boss says "we will add SMS and WhatsApp soon". What do you do?',a:'Create a <code>Notifier</code> interface with a <code>send(message)</code> method. Make <code>EmailNotifier</code> the first implementation. SMS and WhatsApp become new classes later. You named the next variation, so the interface earns its place.'},
 {t:'remember',h:'<b>If you can name the next variation, add a plug. If you cannot, keep it simple.</b>'}
]},

/* ---------- 6 ---------- */
{id:'lesson-6',track:'lld',trackName:'LLD',title:'"Is a" or "has a"?',min:9,
 promise:'The inheritance trap, and the simple rule that avoids it in nearly every case.',
 blocks:[
 {t:'plain',h:'<b>Inheritance</b> says "is a" (a Dog <i>is an</i> Animal). <b>Composition</b> says "has a" (a Car <i>has an</i> Engine). Default to "has a". It is more flexible and breaks less.'},
 {t:'p',h:'<h2>When inheritance goes wrong</h2><p>Birds fly, so <code>Bird</code> has <code>fly()</code>. Then someone adds <code>Penguin extends Bird</code>:</p>'},
 {t:'code',bad:true,cap:'The subclass breaks the promise of the parent',code:'class Bird { void fly() { /* flap wings */ } }\n\nclass Penguin extends Bird {\n  void fly() {\n    throw new UnsupportedOperationException();\n  }\n}\n// Any code that calls bird.fly() can now crash.'},
 {t:`code`,use:true,cap:`How it is used (and where it breaks)`,code:`List<Bird> birds = List.of(new Bird(), new Penguin());
for (Bird b : birds) {
  b.fly();      // fine for Bird... boom on Penguin: UnsupportedOperationException
}`},
 {t:'plain',h:'The rule behind this (called Liskov Substitution) in plain words: <b>if code works with the parent, it must also work with any child, with no surprises.</b> A child that disables a parent method is a warning sign.'},
 {t:'code',good:true,cap:'Better: describe abilities as separate pieces',code:'interface Flyable { void fly(); }\n\nclass Sparrow implements Flyable { /* ... */ }\nclass Penguin { /* no fly() at all */ }'},
 {t:`code`,use:true,cap:`How it is used`,code:`List<Flyable> flyers = List.of(new Sparrow(), new Sparrow());
for (Flyable f : flyers) {
  f.fly();      // safe: everything in this list can fly
}

Penguin p = new Penguin();
// flyers.add(p);   // compile error: Penguin is not Flyable.
//                     The mistake is caught before the program even runs.`},
 {t:'two',a:{h:'Use inheritance when',b:'The child can replace the parent <b>everywhere</b>, and you are modeling a true "is a" relationship.'},b:{h:'Use composition when',b:'You want to reuse behavior, mix abilities, or swap parts later. This is most of the time.'}},
 {t:'check',q:'You want a <code>Stack</code> class. Should it extend <code>ArrayList</code> to reuse code?',a:'No. A Stack is not an ArrayList, because an ArrayList lets you insert in the middle, which breaks the stack idea. Make Stack <i>have</i> an ArrayList inside and expose only push, pop and peek.'},
 {t:'remember',h:'<b>Child must be usable anywhere the parent is. If not, use "has a".</b>'}
]},

/* ---------- 7 ---------- */
{id:'lesson-7',track:'lld',trackName:'LLD',title:'Walk a story through your design',min:12,
 promise:'How to test your own design before anyone else does, including the two-users-at-once problem that interviewers love.',
 blocks:[
 {t:'plain',h:'Once you have classes, <b>run a real scenario through them</b>, one method call at a time. Every place you hand-wave ("then it somehow finds the book") is a missing piece in your design.'},
 {t:'p',h:'<h2>Scenario: a member borrows a book</h2>'},
 {t:'steps',items:[
   ['Write the story as calls','member asks the library to borrow a copy. The library checks the member is allowed. The copy is marked as borrowed. A Loan is created.'],
   ['Name who does each step','<code>Library.borrow(memberId, copyId)</code> coordinates. <code>Member.canBorrow()</code> checks the limit. <code>BookCopy.markBorrowed()</code> changes its own state. Then a <code>Loan</code> is created.'],
   ['Look for gaps','Where does the library find the copy by id? It needs a lookup, so add a <code>Map&lt;String, BookCopy&gt;</code>. Gap found early, fixed cheaply.']]},
 {t:'code',cap:'The method after the walk-through',code:'Loan borrow(String memberId, String copyId) {\n  Member m = members.get(memberId);\n  BookCopy c = copies.get(copyId);\n  if (!m.canBorrow())\n    throw new IllegalStateException("limit reached");\n  c.markBorrowed();               // may fail if taken\n  return new Loan(m, c, LocalDate.now().plusDays(14));\n}'},
 {t:`code`,use:true,cap:`How it is used`,code:`Library library = new Library(members, copies);      // maps loaded from the database

try {
  Loan loan = library.borrow("M1", "C1");
  System.out.println("Due on " + loan.dueOn());       // Due on <today + 14 days>
} catch (IllegalStateException e) {
  System.out.println(e.getMessage());                 // "limit reached"
}

// A typical controller on top of it:
@PostMapping("/borrow")
ResponseEntity<?> borrow(@RequestParam String memberId, @RequestParam String copyId) {
  try {
    return ResponseEntity.ok(library.borrow(memberId, copyId));
  } catch (IllegalStateException e) {
    return ResponseEntity.status(409).body(e.getMessage());   // conflict
  }
}`},
 {t:'p',h:'<h2>Now run it with two people at once</h2><p>Two members try to borrow the <b>last copy</b> at the same moment. Both check "is it available?" and both see <i>yes</i>. Both then mark it borrowed. Now two people think they have the same book.</p>'},
 {t:'code',good:true,cap:'Fix: make "check and take" one atomic step',code:'class BookCopy {\n  private boolean borrowed;\n\n  synchronized boolean tryBorrow() {\n    if (borrowed) return false;   // someone else won\n    borrowed = true;\n    return true;\n  }\n}\n// In a database, the same idea is one conditional update:\n// UPDATE copy SET borrowed = true\n//  WHERE id = ? AND borrowed = false;\n// If 0 rows changed, someone else got it first.'},
 {t:`code`,use:true,cap:`How it is used`,code:`// Two members try to borrow the LAST copy at the same moment
BookCopy copy = new BookCopy("C1");
ExecutorService pool = Executors.newFixedThreadPool(2);

Callable<Boolean> attempt = copy::tryBorrow;
Future<Boolean> a = pool.submit(attempt);
Future<Boolean> b = pool.submit(attempt);

System.out.println(a.get() + " / " + b.get());   // (inside a method that throws Exception)
// Always exactly one true and one false. Never "true / true".
pool.shutdown();`},
 {t:'mistake',h:'Checking and then updating as two separate steps. The tiny gap between them is exactly where the second user sneaks in. Always make claim-the-resource <b>one</b> step.'},
 {t:'check',q:'In an interview you finish the class design. What do you do next?',a:'Pick one real scenario and trace it call by call. Then say "now let me check two users doing this at once" and show the atomic fix. This one habit often decides the round.'},
 {t:'remember',h:'<b>Walk a story, then walk it twice at the same time.</b>'}
]},

/* ---------- 8 ---------- */
{id:'lesson-8',track:'hld',trackName:'HLD',title:'Numbers first: a calculator in your head',min:12,
 promise:'Why you do arithmetic before drawing any boxes, and a simple five-step method you can do on paper in two minutes.',
 blocks:[
 {t:'plain',h:'Numbers tell you <b>how hard the problem is</b>. A system with 100 requests per second and one with 100,000 need completely different designs. If you skip the numbers, you add complicated parts out of habit.'},
 {t:'steps',items:[
   ['Users to requests per day','Daily users x actions per user. Example: 10 million users x 20 actions = 200 million requests per day.'],
   ['Per day to per second','Divide by about 100,000 (a day has 86,400 seconds, so 100,000 is close enough for mental math). 200 million / 100,000 = about 2,000 per second.'],
   ['Add the busy-hour factor','Traffic is not flat. Multiply by 2 or 3 for the peak. About 6,000 per second at peak.'],
   ['Split reads and writes','Most apps read far more than they write. If it is 10 reads per write, peak reads are about 5,500 per second and peak writes about 550.'],
   ['Estimate storage','Writes per day x size of each. If each write is 1 KB and you do about 20 million a day, that is 20 GB a day, about 7 TB a year.']]},
 {t:'plain',h:'<b>How to read the result:</b> one well-tuned database handles a few thousand simple reads per second. 5,500 reads per second is at the edge, so you would add a <b>cache</b>. 550 writes per second is fine for one database. You just learned where the pressure is, with no guessing.'},
 {t:'calc'},
 {t:'mistake',h:'Doing exact arithmetic. Interviewers want round numbers and clear reasoning, not 2,314.8. Say "about 2,000" and move on.'},
 {t:'check',q:'A service has 1 million daily users, each doing 10 actions. About how many requests per second on average?',a:'1 million x 10 = 10 million a day. Divide by about 100,000 = roughly 100 per second. That is tiny. One server and one database are plenty, and saying so is a strong answer.'},
 {t:'remember',h:'<b>Daily total, divide by 100,000, multiply by 3 for peak.</b> Then decide.'}
]},

/* ---------- 9 ---------- */
{id:'lesson-9',track:'hld',trackName:'HLD',title:'Start with one box, grow only when it hurts',min:13,
 promise:'The most important HLD idea: you do not start with a giant architecture. You start small and add one part each time something breaks.',
 blocks:[
 {t:'analogy',h:'A tea stall grows. At first, one person makes tea and takes the money. When the line gets long, you hire a helper. When the shop is busy all day, you open a second counter. Eventually you build a mall. You never open a mall on day one. <b>You grow in response to a real problem.</b>'},
 {t:'plain',h:'Pick a stage below. Each one shows what hurts, what the fix is, and what the fix costs.'},
 {t:'stages'},
 {t:'mistake',h:'Starting with Kafka, sharding and multi-region on day one. Interviewers read this as memorizing buzzwords. Start small and say "this holds until about X, then I would add Y". That is what real engineers do.'},
 {t:'check',q:'Your app has 5,000 users and one database. Someone suggests sharding it. What do you say?',a:'Not yet. At that size, indexes and a bigger machine are cheaper and safer. Sharding adds big complexity (cross-shard queries, hot keys) and only pays off when one machine cannot hold the writes or data.'},
 {t:'remember',h:'<b>"What breaks first?"</b> is the question that decides which part to add next.'}
]},

/* ---------- 10 ---------- */
{id:'lesson-10',track:'hld',trackName:'HLD',title:'The building blocks, in everyday words',min:11,
 promise:'Six parts that appear in almost every design, each explained with a comparison you will remember.',
 blocks:[
 {t:'plain',h:'You do not need to memorize products. You need to know <b>what problem each block solves</b> and <b>what it costs</b>.'},
 {t:'cards',items:[
   {h:'Cache',pic:'A notebook on your desk',b:'Instead of walking to the archive room every time, you write frequent answers on a notebook beside you. Fast, but the notebook can be out of date.',small:'Use when: the same data is read again and again. Cost: stale data and the work of refreshing it.'},
   {h:'Load balancer',pic:'The reception desk',b:'It looks at which counters are free and sends each visitor to one of them, so no one counter gets overloaded.',small:'Use when: you have more than one app server. Cost: it must itself be kept alive.'},
   {h:'Queue',pic:'Token at a bank',b:'You take a token and wait. The work is done soon, but you do not stand at the counter blocking the line.',small:'Use when: work is slow or can wait, such as emails and reports. Cost: duplicates and delays.'},
   {h:'Read replica',pic:'A photocopy of the register',b:'The original is for writing. Copies are for reading, so many people can read at once.',small:'Use when: many more reads than writes. Cost: copies lag slightly behind.'},
   {h:'Sharding',pic:'Splitting the register A to M and N to Z',b:'When one register is too big, you split the data so each machine holds a part.',small:'Use when: one database cannot hold the data or writes. Cost: queries across parts get hard.'},
   {h:'CDN',pic:'Local branches with copies',b:'Instead of everyone fetching from the head office, nearby branches keep copies of images and videos.',small:'Use when: many users in different places load the same static files. Cost: stale copies.'}]},
 {t:'check',q:'Your site sends a welcome email when someone signs up, and the sign-up page feels slow. Which block helps?',a:'A queue. The sign-up request saves the user and drops "send email" onto a queue, then finishes immediately. A worker sends the email later. The user does not wait, and a failed email can be retried.'},
 {t:'remember',h:'<b>Never name a block without naming the problem it fixes.</b> "We need a cache because the same profile is read thousands of times" is a good sentence.'}
]},

/* ---------- 11 ---------- */
{id:'lesson-11',track:'hld',trackName:'HLD',title:'How to talk about trade-offs',min:10,
 promise:'The skill that separates mid-level from senior answers, with a template sentence you can reuse.',
 blocks:[
 {t:'plain',h:'A trade-off means <b>you cannot have everything</b>. Faster usually costs freshness. Safer usually costs speed. Interviewers ask "why this and not that?" to see if you know what you are giving up.'},
 {t:'analogy',h:'<b>The template:</b><br>"I chose <b>A</b> because the thing that matters most here is <b>__</b>. The cost is <b>__</b>. If <b>__</b> changes, I would switch to <b>B</b>."'},
 {t:'p',h:'<h2>Three examples you can reuse</h2>'},
 {t:'two',a:{h:'Fresh or fast? (caching)',b:'Cache the data and reads are quick, but users may see a value that is a few seconds old. Fine for a like count. Not fine for an account balance, so read that from the database directly.'},b:{h:'Wait or move on? (async)',b:'Doing slow work in the background keeps users fast, but the result is not instant and you must handle retries and duplicates. Show "pending" until it finishes.'}},
 {t:'two',a:{h:'SQL or NoSQL?',b:'SQL when data has relationships and you need transactions (orders, payments). NoSQL when you mostly look things up by one key at huge volume (sessions, activity feeds).'},b:{h:'Strong or eventual consistency?',b:'Strong: everyone sees the same latest data, but some requests wait. Eventual: always fast, but briefly different views. Money needs strong. Likes can be eventual.'}},
 {t:'mistake',h:'Saying "it depends" and stopping. "It depends on whether stale data is acceptable. For a feed, yes, so I would cache. For a bank balance, no." is the full answer.'},
 {t:'check',q:'Fill in the template for: "Why did you cache product pages?"',a:'"I cached product pages because the thing that matters most here is read speed, since the same pages are viewed thousands of times. The cost is that a price change may show up a minute late. If prices must update instantly, I would invalidate the cache on every price change instead."'},
 {t:'remember',h:'<b>Choice, reason, cost, and when you would change your mind.</b>'}
]},

/* ---------- 12 ---------- */
{id:'lesson-12',track:'practice',trackName:'Practice',title:'A full design, talked through',min:16,
 promise:'The whole method on one problem, written the way you would say it out loud. Read it twice, then try it yourself on a new prompt.',
 blocks:[
 {t:'plain',h:'<b>Problem: design a URL shortener</b> (like bit.ly). You give it a long link, it returns a short one. Opening the short link sends you to the long one.'},
 {t:'steps',items:[
   ['Clarify','"Is it public? Do links expire? Do we need analytics? How many links per month?" Suppose the answer is 100 million new links a month, public, no analytics for now. <b>The key quality: opening a link must be instant and always work.</b>'],
   ['Numbers','100 million per month is about 40 writes per second. If each link is opened about 10 times, that is about 400 reads per second, with a peak around 1,200. This is small. One database can hold it. The hard parts are <b>making unique short codes</b> and <b>keeping redirects fast</b>.'],
   ['The two actions (API)','<code>POST /links</code> with a long URL, returns a short code. <code>GET /{code}</code> returns a redirect. Both are simple lookups by a key (the code), so a key-value shape fits well.'],
   ['Smallest design that works','One app server and one table: code, long URL, created date. Say out loud: "this already works at launch".'],
   ['Deep dive 1: making the code','Use a counter that gives the next number, then convert the number to letters and digits (base 62). 7 characters gives about 3.5 trillion combinations. The cost: a single counter is a bottleneck, so hand out blocks of numbers to each server.'],
   ['Stress: what breaks first?','At ten times traffic, redirect reads hit the database hardest. Add a cache keyed by code. Links almost never change, so a long cache time is safe. Then add a second app server behind a load balancer so one failure does not take the site down.'],
   ['Trade-offs','"I accept that an edited or deleted link may keep redirecting for a few minutes because of the cache, in exchange for very fast redirects. If instant deletion matters, I would clear the cache entry when a link is deleted."']]},
 {t:'plain',h:'Notice the shape: <b>questions, numbers, simplest design, break it, fix it, say the cost.</b> That is the four-question habit at HLD size.'},
 {t:'check',q:'Without looking: what was the hard part in the URL shortener, and what made the redirects fast?',a:'The hard part was generating unique short codes (counter plus base 62, with blocks of numbers per server). Redirects stayed fast because of a cache keyed by the code, with a database behind it.'},
 {t:'remember',h:'Re-read this lesson later and cover the right side. Try to produce each step from memory.'}
]},

/* ---------- 13 ---------- */
{id:'lesson-13',track:'practice',trackName:'Practice',title:'Your daily 20-minute drill',min:20,
 promise:'A small routine you can repeat every day. Short and regular beats long and rare, especially with ADHD.',
 blocks:[
 {t:'plain',h:'You do not need hours. One 20-minute drill a day, said <b>out loud</b>, builds the habit faster than reading ten articles.'},
 {t:'steps',items:[
   ['Pick a prompt','Press a button below. Do an LLD prompt on one day and an HLD prompt on the next.'],
   ['Minutes 0 to 5: Clarify','Ask questions out loud, even to an empty room. Decide three things the system must do and one quality that matters most.'],
   ['Minutes 5 to 15: Model','LLD: nouns, verbs, who owns what, what will change. HLD: numbers, the two actions, the smallest design, then what breaks first.'],
   ['Minutes 15 to 20: Stress and trade','Run two users at once. Add a new requirement. Say the template: "I chose A because ..., the cost is ..., I would switch if ...".'],
   ['Two-minute review','Write one line: what did I skip or hand-wave? That line is tomorrow\'s focus.']]},
 {t:'drill'},
 {t:'p',h:'<h2>If you only have 5 minutes</h2><p>Open any earlier lesson and answer its "Check yourself" question out loud without scrolling. Then open the answer and compare.</p>'},
 {t:'remember',h:'A drill you actually do beats a perfect plan you skip. <b>Do the smallest version on bad days.</b>'}
]},

/* ---------- 14 ---------- */
{id:`lesson-14`,track:`bank`,trackName:`Question bank`,title:`What gets asked in India, and how rounds run`,min:10,
 promise:`I searched interview-prep sites, candidate write-ups and company guides. This lesson shows what keeps coming up, and the next three lessons give a full answer to each question.`,
 blocks:[
 {t:`plain`,h:`<b>An honest note first.</b> I could not find reliable, public question lists for Pune alone. What I found are patterns for India as a whole (Amazon, Flipkart, Walmart, fintechs like Razorpay and PhonePe, and others). Pune has many product-company engineering centres, banks and fintech teams, and IT services firms, so my reading is that the Java, SQL and microservices questions here matter a lot for you. That last part is my judgement and not from a source. Treat all lists as "likely", never "guaranteed".`},
 {t:`p`,h:`<h2>The questions that come up again and again</h2><p>This order comes from how many of eleven public prep lists mention each question. The source itself warns that this measures how much prep sites agree a question matters, not exact interview frequency.</p>`},
 {t:`steps`,items:[
   [`URL shortener`,`On almost every list, and in India guides for Amazon, Flipkart, Google and CRED. You already studied it in lesson 12.`],
   [`Chat app`,`Real-time messages, ordering and delivery status. Listed for Amazon, Google, Flipkart, CRED and Razorpay.`],
   [`News feed`,`Fan-out on write or on read. Listed for Flipkart, Google, Amazon and CRED.`],
   [`Video streaming`,`Upload, transcoding and a CDN.`],
   [`Ride sharing (cab booking)`,`Location tracking and matching. Listed with Ola, Uber, Flipkart, Amazon and Razorpay.`],
   [`Search and autocomplete`,`Typeahead, and e-commerce search for Amazon, Flipkart and Meesho.`],
   [`Rate limiter`,`Listed for Amazon, Google, Razorpay and CRED.`],
   [`Notification system`,`Listed for Flipkart, Amazon, CRED and Razorpay.`],
   [`Payment system`,`Listed for Razorpay, PhonePe, Paytm, Flipkart and Amazon. Idempotency and double payment are the heart of it.`],
   [`Ticket booking`,`Seats under contention. Came up in an India SDE-2 write-up, including how to stop double booking.`],
   [`Food delivery`,`Listed with Swiggy, Zomato, Flipkart and Amazon.`],
   [`Flash sale inventory`,`Listed in Flipkart's backend guide, and a similar "inventory service under high concurrency" question appeared in a 7-year-experience Walmart write-up.`],
   [`Distributed cache, web crawler, file sync, job scheduler, unique ID generator`,`Common on the global lists. Shorter answers are in lesson 15.`]]},
 {t:`p`,h:`<h2>What the rounds look like</h2>`},
 {t:`cards`,items:[
   {h:`Flipkart (guide)`,b:`Technical screening, then machine coding (judged on code quality and modularity), then system design, then behavioural. Machine-coding topics include conference room booking, concurrent slot booking, in-memory CRUD with concurrency and a thread-safe Singleton.`},
   {h:`Walmart, 7 years (write-up)`,b:`Three elimination rounds: DSA, then LLD with Java questions on Singleton and thread safety plus a ranking system, then a 20-minute HLD on an inventory service under high concurrency. The first approach did not satisfy the interviewer, so the candidate switched and explained trade-offs.`},
   {h:`PayPay SDE-2 (write-up)`,b:`Online coding test, then database fundamentals (ACID, CAP, isolation levels, indexing, idempotency, locking), then payment and booking design, then a Ticketmaster-style LLD and HLD with search and Elasticsearch sync.`},
   {h:`India guide, by experience`,b:`With 2 or more years of experience, HLD matters most. LLD is more common for fewer years. A full system design round usually runs around 45 minutes.`}]},
 {t:`p`,h:`<h2>Eight ideas sit behind almost every answer</h2><p>You do not need 30 memorized designs. Most of them reuse these.</p>`},
 {t:`cards`,items:[
   {h:`1. Fan-out`,b:`One event reaches many people: feeds, notifications, group chat. Choose push or pull, or mix.`},
   {h:`2. Geo index`,b:`Find things near a point using cells (geohash, H3): cabs, food, nearby places.`},
   {h:`3. Idempotency`,b:`Doing the same request twice has the effect of once. Payments, bookings, retries.`},
   {h:`4. Atomic claim`,b:`One step that checks and takes: seats, stock, drivers, jobs.`},
   {h:`5. Cache`,b:`Remember popular answers close by. Search results, profiles, redirects.`},
   {h:`6. Queue`,b:`Let slow or spiky work wait. Emails, orders, video processing.`},
   {h:`7. Hashing and partitioning`,b:`Split data or load across machines by a key. Caches, chat, storage.`},
   {h:`8. State machine`,b:`A thing moves through fixed stages: order, trip, booking, payment.`}]},
 {t:`remember`,h:`When you meet an unfamiliar question, ask which of the eight ideas it needs. That turns an unknown problem into a familiar one.`},

/* ---------- 15 ---------- */
{id:`lesson-15`,track:`bank`,trackName:`Question bank`,title:`HLD questions with full answers`,min:45,
 promise:`Eighteen common system design questions. Open one at a time. Each follows the same shape: the question, what matters most, a step-by-step answer, the trade-offs to say out loud, and likely follow-ups.`,
 blocks:[
 {t:`plain`,h:`Read the question, then <b>try to answer it out loud for two minutes before opening it</b>. Do one or two a day, not all at once. Numbers are rounded on purpose, the way you would say them in the room.`},
 {t:`qbank`,items:[

 {n:`URL shortener`,tag:`HLD`,where:`On nearly every list. Full walkthrough is in lesson 12.`,
  ask:`Turn a long link into a short one, and redirect when the short link is opened.`,
  quality:`Redirects must be instant and always work. Reads far outnumber writes.`,
  steps:[
   [`Clarify and count`,`100 million new links a month is about 40 writes a second, and about 400 redirects a second at 10 opens per link. Small. One database holds it.`],
   [`Make the code`,`Use a counter, convert the number to base 62 (a to z, A to Z, 0 to 9). 7 characters give about 3.5 trillion codes. Give each server a block of numbers so there is no single counter bottleneck.`],
   [`Redirect fast`,`Look up the code in a cache first, then the database. Links rarely change, so a long cache time is safe.`],
   [`Redirect type`,`301 means "moved permanently" and browsers cache it, so you lose click counts. 302 is temporary and every click comes to you. Choose 302 if you want analytics.`]],
  trade:`Counter gives short, unique codes but is guessable. A random code is hard to guess but needs a collision check. A cache gives speed, and a deleted link may redirect for a few minutes longer.`,
  follow:`Custom aliases? (check the alias is free, with a unique constraint.) Expiry? (store an expiry date and check on read.) Click analytics? (send each click to a queue, count in the background.)`},

 {n:`Chat app (WhatsApp style)`,tag:`HLD`,where:`Listed for Amazon, Google, Flipkart, CRED and Razorpay in India guides.`,
  ask:`Users send messages one to one and in groups. Messages arrive fast, in order, and show sent, delivered and read.`,
  quality:`Low delay, no lost messages, and order inside each conversation.`,
  steps:[
   [`Clarify and count`,`Say 50 million daily users sending 40 messages each. That is 2 billion messages a day, about 20,000 a second, and about 60,000 at peak. Text is small, roughly 200 GB a day, so storage grows fast and must be split.`],
   [`Keep a live connection`,`Each phone holds an open two-way connection (a WebSocket) to a chat server. A load balancer spreads the connections. A fast store, such as Redis, records which server each user is on.`],
   [`Send flow`,`Sender's server saves the message, looks up the recipient's server, and pushes it down their connection. When the recipient app confirms, mark it "delivered". If they are offline, keep it stored, send a push notification, and deliver when they reconnect.`],
   [`Order and duplicates`,`Split storage by conversation id, and give every message a running number inside its conversation. The phone creates the message id, so a retried send is recognized and not stored twice.`],
   [`Groups`,`Store a group message once, then deliver a copy to each member's server through a queue.`],
   [`Reconnect`,`The phone tells the server the last message number it has. The server sends everything after that.`]],
  trade:`Live connections give instant delivery but cost memory on servers. "Save first, then push" never loses a message but is slightly slower than "push first". End-to-end encryption protects privacy but stops the server searching message text.`,
  follow:`How do you show "online"? (heartbeat every few seconds, expire after 30 seconds of silence, and only tell the people who need to know.) How do you handle a 100,000-member group? (deliver in batches through a queue, and do not hold every member's connection on one server.)`},

 {n:`News feed (Instagram, Facebook)`,tag:`HLD`,where:`Listed for Flipkart, Google, Amazon and CRED in India guides.`,
  ask:`Show each user a feed of recent posts from the people they follow.`,
  quality:`Opening the feed must be fast. Reads vastly outnumber posts.`,
  steps:[
   [`Clarify and count`,`100 million daily users open the feed 10 times each. That is about 10,000 reads a second, around 30,000 at peak. Only about 5 million posts a day, which is about 50 a second. So reads outnumber writes about 200 to 1.`],
   [`Precompute the feed`,`Because reads are so many, prepare each user's feed ahead of time. Keep a list of post ids per user in a cache, say the latest 500.`],
   [`Fan-out on write`,`When someone posts, push the post id into every follower's feed list. Opening the feed is then one fast lookup. The cost is one write per follower.`],
   [`The celebrity problem`,`A user with 10 million followers would cause 10 million writes for one post. So do not push for celebrities. At read time, fetch the recent posts of the celebrities a user follows and merge them in. This mixed approach is called hybrid fan-out.`],
   [`Ranking and media`,`Start with newest first, then add a simple score such as likes and closeness. Serve images and video from a CDN, not from the app servers.`]],
  trade:`Push makes reads fast but makes writes expensive and can waste work on inactive users. Pull is cheap to write but slow to read. Hybrid gives both, at the price of more code.`,
  follow:`What threshold makes someone a celebrity? (a number such as 100,000 followers, and you say it is tunable.) What if a user unfollows? (remove their posts on the next feed build or filter at read time.)`},

 {n:`Rate limiter`,tag:`HLD`,where:`Listed for Amazon, Google, Razorpay and CRED in India guides. The class version is in lesson 16.`,
  ask:`Allow each user only N requests per minute, and reject the rest.`,
  quality:`Must be fast, must be correct across many servers, and must not become the thing that breaks.`,
  steps:[
   [`Where it lives`,`At the API gateway, before requests reach your services. Identify the caller by user id, API key or IP address.`],
   [`Pick an algorithm`,`<b>Fixed window:</b> count requests in each minute. Simple, but a burst at the edge of two windows can double the limit. <b>Sliding window:</b> count the last 60 seconds. More accurate, more memory. <b>Token bucket:</b> a bucket refills at a steady rate and each request takes one token. Allows short bursts. Most common answer.`],
   [`Share the counter`,`With many gateway servers, keep the counters in one place such as Redis. Do the check-and-update as one atomic step, for example a small Lua script, so two servers cannot both pass.`],
   [`Respond properly`,`Return HTTP 429 (Too Many Requests) with a Retry-After header.`],
   [`If the limiter store dies`,`Decide in advance. "Fail open" lets traffic through and risks overload. "Fail closed" blocks everyone. For most public APIs, fail open and raise an alert.`]],
  trade:`Token bucket is flexible but needs more state per user. Central Redis is accurate but adds a network call to every request. Local counters are faster but each server limits only its own share.`,
  follow:`Different limits per plan? (store limits per customer, read from config.) How do you avoid the key never expiring? (set the expiry in the same atomic step.)`},

 {n:`Notification system`,tag:`HLD`,where:`Listed for Flipkart, Amazon, CRED and Razorpay. Flipkart's guide also lists delivery notifications.`,
  ask:`Send push, SMS and email notifications to millions of users reliably.`,
  quality:`Do not lose important ones, do not send duplicates, and do not let a promotion delay an OTP.`,
  steps:[
   [`Accept events`,`Other services send an event such as "order shipped". The notification service checks the user's preferences, picks a template and decides the channels.`],
   [`Queue per channel and priority`,`Put messages on separate queues for push, SMS and email, and keep an urgent queue for OTPs and payment alerts. Slow promotions then never block urgent messages.`],
   [`Workers call providers`,`Workers read the queue and call the external provider (a push service, an SMS gateway, an email service). In India, SMS also follows rules such as TRAI's template registration, so a template service is a natural part.`],
   [`Retries and duplicates`,`If a provider call fails, retry with growing delays, then move the message to a dead-letter queue to inspect. Give each notification an id so a retry never sends it twice.`],
   [`Protect providers`,`Limit how fast you call each provider, and use a circuit breaker so a failing provider does not slow everything.`]],
  trade:`Retries improve delivery but can cause duplicates, so you need the id check. A queue adds a small delay, which is fine for everything except the most urgent messages, so those get their own fast lane.`,
  follow:`How do you send to 10 million users for a sale? (split into batches on the queue and spread them over time.) How do you respect "do not disturb"? (check preferences and local time before sending.)`},

 {n:`Cab booking (Ola, Uber)`,tag:`HLD`,where:`Listed with Ola, Uber, Flipkart, Amazon and Razorpay in India guides.`,
  ask:`Riders request a cab, the system finds a nearby driver, and both see live location.`,
  quality:`Fast matching using fresh locations, and never giving one driver to two riders.`,
  steps:[
   [`Clarify and count`,`500,000 drivers online, each sending location every 4 seconds, is about 125,000 writes a second. That is too much for a normal database, so keep live locations in memory.`],
   [`Index the map`,`Cut the map into cells (geohash or H3). Store each driver under their current cell. To find nearby drivers, look in the rider's cell and the cells around it.`],
   [`Match`,`Take the closest few drivers. Offer the trip to one driver at a time with a short timeout, or offer to several and take the first to accept. Claim the driver with an atomic step so two riders cannot get the same one.`],
   [`Trip as a state machine`,`REQUESTED, then MATCHED, ARRIVED, STARTED, ENDED, PAID. Only certain moves are allowed, which prevents impossible states.`],
   [`Live updates`,`Send the driver's position to the rider over a WebSocket. Calculate the fare when the trip ends and charge through the payment service.`],
   [`Surge pricing`,`Compare riders and drivers in each cell. When demand is much higher, raise the price for that cell.`]],
  trade:`In-memory locations are fast but lost if the node dies, which is acceptable because drivers send a new location seconds later. Matching on slightly old locations is a fair price for speed.`,
  follow:`What if the driver loses signal mid-trip? (the app buffers locations and the server keeps the last known one.) How do you compute ETA? (road graph with live traffic, or a simple distance estimate first.)`},

 {n:`Food delivery (Swiggy, Zomato)`,tag:`HLD`,where:`Listed with Swiggy, Zomato, Flipkart and Amazon in India guides.`,
  ask:`Customers order from restaurants, restaurants prepare, delivery partners carry it.`,
  quality:`Three groups must stay in step, and lunch and dinner spikes must not break it.`,
  steps:[
   [`Split into services`,`Catalogue and search, cart, order, payment, dispatch (rider assignment), tracking and notifications. Each can scale on its own.`],
   [`Search and menus`,`Read-heavy, so cache menus and use a search index that also filters by location and whether the restaurant is open.`],
   [`Order as a state machine`,`PLACED, PAID, ACCEPTED, PREPARING, READY, PICKED UP, DELIVERED, or CANCELLED. Every service reacts to these changes through events.`],
   [`Order flow with failures`,`Reserve the order, take payment, ask the restaurant to accept, assign a rider. If the restaurant rejects, refund. Each step has an undo step. This pattern is called a saga.`],
   [`Dispatch`,`Choose a rider using distance and also how long the food needs. Sending a rider too early wastes their time.`],
   [`Peak hours`,`Put order events on a queue, add servers automatically, and use a cache for menus.`]],
  trade:`A saga gives safety across services without one big transaction, but you must design each undo step. Assigning riders early gives faster pick-up but more waiting.`,
  follow:`How do you keep the cart consistent with restaurant prices? (re-check price at checkout and show a message if it changed.)`},

 {n:`Payment system`,tag:`HLD`,where:`Listed for Razorpay, PhonePe, Paytm, Flipkart and Amazon. "How to prevent double payment" appeared in an India SDE-2 write-up.`,
  ask:`Take payments safely. A customer must never be charged twice, and money must never go missing.`,
  quality:`Correctness over speed. Every retry must be safe.`,
  steps:[
   [`Idempotency key`,`The client creates a unique key for each payment attempt and sends it with the request. The server stores the key with a unique constraint. If the same key arrives again, return the saved result and do not charge again.`],
   [`Payment as a state machine`,`CREATED, PENDING, SUCCESS, FAILED. Money only moves on the allowed transitions.`],
   [`When the bank times out`,`You do not know if the charge happened. Mark it PENDING. Never charge again blindly. Wait for the bank's callback, or ask the bank for the status, and update.`],
   [`Ledger`,`Record every money movement as two entries, a debit and a credit that add to zero (double-entry). Never edit entries. Add a correcting entry instead. Store amounts as whole paise, not decimals.`],
   [`Reconciliation`,`Each day, compare your records to the bank's file. Investigate any difference.`]],
  trade:`Idempotency adds a lookup to each request but removes the worst failure. Asynchronous confirmation is slower for the user but safe. You cannot get "exactly once" for free, so you aim for "at least once, made safe by idempotency".`,
  follow:`Same request from two devices at once? (the unique key makes one win; the other gets the same result.) How do you keep money in sync between your database and the bank? (reconciliation and an audit trail.)`,
  code:{cap:`The core of idempotency in SQL`,code:`CREATE TABLE payments (\n  idempotency_key VARCHAR(64) PRIMARY KEY,\n  amount_paise    BIGINT NOT NULL,\n  status          VARCHAR(16) NOT NULL,\n  created_at      TIMESTAMP NOT NULL\n);\n\n-- First request inserts. A repeat hits the primary key,\n-- so you catch the error and return the stored row.\nINSERT INTO payments VALUES (?, ?, 'PENDING', now());`,use:`try {
  jdbc.update("INSERT INTO payments VALUES (?, ?, 'PENDING', now())", key, amountPaise);
  // First time we see this key: go on and call the bank
} catch (DuplicateKeyException e) {
  // Same key again (a retry): do NOT charge. Return what we saved.
  return jdbc.queryForObject(
      "SELECT status FROM payments WHERE idempotency_key = ?", String.class, key);
}`}},

 {n:`Ticket booking (BookMyShow style)`,tag:`HLD`,where:`A Ticketmaster-style LLD and HLD with concurrent booking came up in an India SDE-2 write-up. Same idea as Flipkart's concurrent slot booking.`,
  ask:`Many people try to book the same seats at the same time. No seat may be sold twice.`,
  quality:`Correct seat inventory. Search can be a little stale, booking cannot.`,
  steps:[
   [`Flow`,`Search shows, then pick seats, then HOLD the seats for a few minutes, then pay, then CONFIRM. If payment fails or the time runs out, release the seats.`],
   [`The hold is an atomic claim`,`Do check-and-hold as one database statement (see the SQL below). If it changed one row, you got the seat. If it changed zero rows, someone else did.`],
   [`Expire holds`,`Store hold_until. Treat a seat with an expired hold as available, and clean up with a background job.`],
   [`Data model and indexes`,`Show, Seat, ShowSeat (one row per show and seat, with status). Make (show_id, seat_id) the primary key so lookups for a show are fast.`],
   [`Search`,`Use a search index (for example Elasticsearch) for movies and theatres. Update it from database changes through events. It is allowed to be a few seconds behind.`],
   [`Big releases`,`When a hugely popular show opens, put users in a virtual waiting room and let them in at a steady rate.`]],
  trade:`A database conditional update is simple and safe. A Redis lock is faster under heavy load but you must still confirm in the database. Letting search lag keeps it fast, and booking always checks the real data.`,
  follow:`Which tables need indexes? How does search stay in sync? What if the payment succeeds after the hold expired? (refund automatically or re-check seat before confirm.)`,
  code:{cap:`Atomic hold`,code:`UPDATE show_seat\n   SET status = 'HELD', held_by = ?, hold_until = now() + interval '10 minutes'\n WHERE show_id = ? AND seat_id = ?\n   AND (status = 'AVAILABLE' OR hold_until < now());\n-- rows updated = 1 -> you hold the seat\n-- rows updated = 0 -> someone else got it`,use:`int rows = jdbc.update(HOLD_SQL, userId, showId, seatId);   // the UPDATE above

if (rows == 1) {
  // seat is ours for 10 minutes: show the payment page
} else {
  // someone else got it first: ask the user to pick another seat
}
// For several seats, run all the updates in ONE transaction
// and roll back if any of them returns 0.`}},

 {n:`Flash sale inventory`,tag:`HLD`,where:`Flipkart's backend guide lists flash sale inventory updates. A similar high-concurrency inventory service appeared in a Walmart write-up.`,
  ask:`A million users rush to buy 10,000 units. Never sell more than you have, and keep the site up.`,
  quality:`No overselling. Survive a sudden spike.`,
  steps:[
   [`Why the plain way fails`,`If every request reads stock, subtracts one and writes it back, many requests read the same number and oversell. Locking one database row fixes correctness but becomes a queue all users wait in.`],
   [`Take stock atomically`,`Keep the available count in Redis and use one atomic decrement. If the result is below zero, reject. This handles very high request rates.`],
   [`Then create the order calmly`,`For each successful decrement, put an order on a queue. Workers write to the database at a speed it can take. The database is the source of truth.`],
   [`Reserve with expiry`,`Treat a successful claim as a reservation for a few minutes. If payment does not happen, add the stock back.`],
   [`Protect the system`,`Rate limit, use a waiting room, serve the product page from a cache or CDN, and warm up capacity before the sale.`],
   [`Reconcile`,`After the sale, compare Redis counts with database orders and fix any difference.`]],
  trade:`Redis is fast but the count can drift from the database, so you reconcile. A queue protects the database but orders are confirmed a moment later. A waiting room is fair but some users wait.`,
  follow:`What if Redis restarts mid-sale? (rebuild the count from the database and pause the sale for a moment.) How do you stop bots? (rate limits, captcha, per-user purchase limits.)`},

 {n:`Search and autocomplete`,tag:`HLD`,where:`Typeahead is on global lists. E-commerce search is listed for Amazon, Flipkart and Meesho. Syncing Elasticsearch with the database was asked in an India write-up.`,
  ask:`Suggest queries as the user types, and search a large product catalogue quickly.`,
  quality:`Typeahead must answer in a fraction of a second. Search results must be relevant and not too stale.`,
  steps:[
   [`Typeahead idea`,`For every prefix, such as "pun", keep the best few completions ready. A trie (a tree of letters) stores this, and each node holds its top suggestions.`],
   [`Keep it fresh`,`Do not update on every keystroke. Collect query logs, count popular queries every hour or so in a background job, rebuild the lists, and publish them to a cache.`],
   [`Make it cheap on the client`,`Wait a short moment after typing stops before asking (debounce), and cache answers in the app.`],
   [`Product search`,`Use a search engine (Elasticsearch or similar) built on an inverted index, which maps each word to the products containing it. Add filters for price, brand and location.`],
   [`Sync from the database`,`Your database stays the source of truth. Send change events (through a queue or change data capture) to update the search index.`],
   [`Ranking`,`Start with text match, then add popularity, ratings and stock availability.`]],
  trade:`A search index is eventually consistent with the database, which is fine for search but not for checking stock at purchase time. Precomputed suggestions are fast but slow to reflect new trends.`,
  follow:`What if the index falls behind? (monitor lag, and re-index from the database if needed.) How do you handle spelling mistakes? (fuzzy matching or a "did you mean" step.)`},

 {n:`Video streaming (YouTube, Hotstar style)`,tag:`HLD`,where:`On the global lists. Live sports spikes make it a natural India topic.`,
  ask:`Let people upload and watch videos smoothly on any network.`,
  quality:`Smooth playback everywhere, and handling a huge sudden audience for live events.`,
  steps:[
   [`Upload`,`Upload in chunks so a failure resumes instead of restarting. Store the original in object storage.`],
   [`Transcode`,`A background pipeline converts the video into several qualities (for example 240p to 1080p) and cuts each into small segments of a few seconds.`],
   [`Adaptive playback`,`The player downloads segment by segment and switches quality as the network changes. Protocols such as HLS do this.`],
   [`Where things live`,`Video files in object storage, titles and metadata in a database, popular segments in a CDN close to viewers.`],
   [`Live events`,`Segments are created continuously and pushed to the CDN. Add capacity before the event, because audience can jump within minutes.`]],
  trade:`More qualities give a better experience but cost more storage and processing. Pre-warming the CDN costs money but protects against start-of-match spikes.`,
  follow:`How do you recommend videos? (separate system, see recommendation design.) How do you cut cost? (keep rarely watched videos in cheaper storage.)`},

 {n:`Distributed cache`,tag:`HLD`,where:`Listed for Amazon India. "What if Redis memory is full?" appeared in an India write-up.`,
  ask:`Design a cache shared by many servers that holds a lot of data and stays fast.`,
  quality:`Speed, even spread of data, and survive a node failure.`,
  steps:[
   [`Spread keys with consistent hashing`,`Place cache nodes on a ring. A key goes to the next node clockwise. When you add or remove a node, only a small share of keys move, not all of them. Virtual nodes keep the spread even.`],
   [`Evict`,`When memory is full, remove the least recently used items (LRU), and give items a time to live.`],
   [`Survive failures`,`Keep a replica of each partition. If a node dies, a replica takes over. A cache miss just goes to the database, so the cache can be lost without losing data.`],
   [`Hot keys`,`One very popular key can overload its node. Copy it to several nodes, or keep a tiny local cache in each app server.`],
   [`Stampede`,`When a popular item expires, thousands of requests hit the database together. Let only one request rebuild it while others wait, and add random time to expiries.`],
   [`If memory runs out`,`Set a maximum memory and an eviction policy, give every key an expiry, find giant keys, and add nodes. Do not cache everything.`]],
  trade:`Longer expiry gives more hits but staler data. Replicas add safety but cost memory.`,
  follow:`Write-through or cache-aside? (cache-aside is simpler. Write-through keeps data fresher but slows writes.) How do you invalidate? (delete on update, plus a short expiry as a safety net.)`},

 {n:`Job scheduler`,tag:`HLD`,where:`On global lists. Directly useful for Spring developers.`,
  ask:`Run jobs at a given time or on a repeat, reliably, across many servers.`,
  quality:`Every job runs, and not twice at once.`,
  steps:[
   [`Store jobs`,`A table with job id, next run time, status and payload.`],
   [`Find due jobs`,`Many workers poll for jobs where the run time has passed. Each claims a job safely. In SQL, <code>SELECT ... FOR UPDATE SKIP LOCKED</code> lets each worker take a different row without waiting.`],
   [`Run and report`,`Mark the job RUNNING with a timeout. On success set the next run time. If a worker dies, the timeout expires and another worker picks it up.`],
   [`Be safe to repeat`,`Because a job may run twice after a crash, write jobs so a second run does no harm (idempotent).`],
   [`Failures`,`Retry with growing delays, then move to a dead-letter list.`]],
  trade:`A database-based scheduler is simple and good to moderate scale. At very large scale you split jobs by partition across many nodes.`,
  follow:`What if the server was down when a job was due? (decide a policy: run late, or skip.) Spring tools to mention: Quartz, and ShedLock to make sure only one node runs a scheduled method.`},

 {n:`Leaderboard (fantasy sports, games)`,tag:`HLD`,where:`On global lists and a natural fit for India's fantasy and gaming apps.`,
  ask:`Show top players and each player's rank in real time for millions of players.`,
  quality:`Fast updates and rank lookups.`,
  steps:[
   [`Use a sorted set`,`Redis sorted sets keep members ordered by score. Add or update a score, get the top 100, or get one player's rank, each in logarithmic time.`],
   [`Split by contest`,`One sorted set per contest or per game keeps each set manageable and spreads load.`],
   [`Persist`,`Write final scores to a database. Take snapshots so the board can be rebuilt after a restart.`],
   [`Ties`,`Break ties with a second value such as earlier submission time, packed into the score.`],
   [`Huge boards`,`Keep the top N exact. For everyone else, give an approximate rank, for example "top 5%".`]],
  trade:`Exact rank for everyone costs more memory and effort. Approximate ranks are cheaper and usually good enough.`,
  follow:`What if one contest has 10 million players? (shard by score range, and approximate the tail.)`},

 {n:`Unique ID generator`,tag:`HLD`,where:`On global lists. Shows up inside many other answers.`,
  ask:`Generate unique ids across many servers, roughly in time order, without a central bottleneck.`,
  quality:`No duplicates, fast, and no single point of failure.`,
  steps:[
   [`Why not auto-increment`,`One database counter is simple but becomes a bottleneck and a single point of failure.`],
   [`Snowflake-style id`,`Pack a 64-bit number: about 41 bits of time in milliseconds, 10 bits for the machine id, 12 bits for a counter within the same millisecond. Each machine makes ids alone, and ids sort roughly by time.`],
   [`Clock problems`,`If a machine clock moves backwards, you could repeat ids. Refuse to generate until the clock catches up, or use the last timestamp.`],
   [`Alternatives`,`UUIDs need no coordination but are long and do not sort by time.`]],
  trade:`Snowflake ids are compact and sortable but depend on clocks and machine ids. UUIDs are simpler but bigger and less friendly to indexes.`,
  follow:`How many ids per second per machine? (12 bits means 4,096 per millisecond.)`},

 {n:`File sync and web crawler`,tag:`HLD`,where:`Both are on the global lists. Shorter answers are enough.`,
  ask:`(a) Sync files across a user's devices, like Dropbox. (b) Crawl the web, like a search engine.`,
  quality:`File sync: send only what changed. Crawler: be polite and never repeat work.`,
  steps:[
   [`File sync: chunk it`,`Split files into blocks, hash each block, and upload only blocks the server does not have. A small edit uploads one block, not the whole file.`],
   [`File sync: metadata`,`A database keeps file names, folders, versions and which blocks make up each file. Block data lives in object storage.`],
   [`File sync: conflicts`,`If two devices edit the same file, keep both versions and tell the user. Do not silently overwrite.`],
   [`Crawler: frontier`,`A queue of URLs to visit. Workers take a URL, fetch the page, extract links and add new ones.`],
   [`Crawler: polite and unique`,`Respect robots.txt, limit requests per website, and keep a record (for example a Bloom filter) of URLs already seen so you never crawl a page twice.`]],
  trade:`Smaller blocks save bandwidth but add more metadata. A fast crawl risks overloading websites, so politeness limits speed on purpose.`,
  follow:`How do you detect duplicate pages? (hash page content.) How do you re-crawl? (more often for pages that change often.)`},

 {n:`Data consistency across microservices`,tag:`HLD`,where:`Listed in Flipkart's backend guide, and a favourite for Java and Spring candidates.`,
  ask:`An order touches the order, payment and inventory services, each with its own database. How do you keep the data consistent?`,
  quality:`A real database transaction cannot span services, so you design for partial failure.`,
  steps:[
   [`Accept the limit`,`There is no single transaction across services. Each service commits its own part.`],
   [`Use a saga`,`A series of local steps. If one fails, run an undo step for the earlier ones, for example release stock or refund. Either services react to each other's events (choreography) or one coordinator drives the steps (orchestration).`],
   [`Publish events reliably (outbox)`,`Save your data change and the event to publish in the same local transaction, in an outbox table. A separate process reads the table and publishes. This prevents "saved but never announced".`],
   [`Handle duplicates`,`Messages can arrive twice, so every consumer must be idempotent. Keep a table of processed message ids.`]],
  trade:`Sagas give availability and independence but the system is only <i>eventually</i> consistent. You must design every undo step and show users states like "processing".`,
  follow:`Choreography or orchestration? (choreography is simpler for few services. Orchestration is easier to follow and debug as steps grow.) See the Microservices guide document for the full version.`}
 ]}
]},
