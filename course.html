{id:`lesson-16`,track:`bank`,trackName:`Question bank`,title:`LLD questions with full answers`,min:40,
 promise:`Ten common low-level design problems with the classes, the key pattern and Java code for the part interviewers care about. Use the thinking steps from lessons 3 to 7 on each one.`,
 blocks:[
 {t:`plain`,h:`For every LLD problem, run the same routine: <b>clarify, find nouns and verbs, give each rule an owner, mark what will change, then trace a scenario and run it with two users at once.</b> The entries below show the result of that routine.`},
 {t:`qbank`,items:[

 {n:`Parking lot`,tag:`LLD`,where:`Listed for Flipkart, Amazon, Microsoft and Razorpay in India guides.`,
  ask:`Cars, bikes and trucks park in a multi-floor lot. Give out tickets and calculate the fee when they leave.`,
  quality:`Pricing will change, and two cars must not get the same spot.`,
  steps:[
   [`Clarify`,`Vehicle types? Spot sizes? Hourly pricing? Multiple entrances? Assume three types and hourly fees, with entry and exit gates.`],
   [`Classes`,`ParkingLot, Floor, Spot (with a size), Vehicle (with a type), Ticket (entry time and spot), FeeStrategy.`],
   [`Owners`,`A Spot knows whether it fits a vehicle and whether it is taken. A Floor finds a spot. The lot coordinates. A FeeStrategy calculates the fee.`],
   [`What will change`,`Pricing. Put it behind a FeeStrategy interface (hourly, flat, weekend rates). Spot sizes rarely change, so no interface needed.`],
   [`Concurrency`,`Claiming a spot must be one atomic step so two cars cannot take the same one.`]],
  trade:`A strategy for pricing makes new fee rules a new class, at the cost of one extra interface. For choosing which spot, start with "nearest free" and add a strategy only if asked.`,
  follow:`Add EV charging spots? (new spot type and a matching rule, nothing else changes.) Add reservations? (spots get a RESERVED state with an expiry.)`,
  code:{cap:`The key flow`,code:`class ParkingLot {\n  private final List<Floor> floors;\n  private final FeeStrategy fee;\n\n  Ticket park(Vehicle v) {\n    for (Floor f : floors) {\n      Optional<Spot> s = f.claimSpot(v);      // atomic inside\n      if (s.isPresent())\n        return new Ticket(v, s.get(), Instant.now());\n    }\n    throw new NoSpaceException();\n  }\n\n  double exit(Ticket t) {\n    t.spot().release();\n    return fee.calculate(t.entryTime(), Instant.now(), t.vehicleType());\n  }\n}\n\nclass Spot {\n  private boolean taken;\n  synchronized boolean tryOccupy() {\n    if (taken) return false;\n    taken = true;\n    return true;\n  }\n  synchronized void release() { taken = false; }\n}`,use:`ParkingLot lot = new ParkingLot(floors, new HourlyFee());

Ticket t = lot.park(new Car("MH12AB1234"));     // gives a spot and an entry time
System.out.println(t.spot().id());              // e.g. F1-S07

// ... three hours later ...
double fee = lot.exit(t);                       // frees the spot, calculates the fee
System.out.println(fee);                        // e.g. 150.0  (3 hours x 50 per hour)

// Controller on top of it (one lot per site):
@PostMapping("/entry")
Ticket entry(@RequestBody VehicleDto v) { return lot.park(v.toVehicle()); }

@PostMapping("/exit")
double exit(@RequestBody TicketDto t) { return lot.exit(tickets.find(t.id())); }`}},

 {n:`Elevator system`,tag:`LLD`,where:`Listed as a classic LLD, for example for Microsoft in an India guide.`,
  ask:`Design the control of several elevators in a building.`,
  quality:`Choose which elevator answers a call, and move efficiently.`,
  steps:[
   [`Classes`,`Elevator (current floor, direction, state, stops to visit), ElevatorController (receives requests, picks an elevator), Request (floor and direction), Door and Display if asked.`],
   [`States`,`IDLE, MOVING_UP, MOVING_DOWN, DOOR_OPEN. The behaviour depends on state, so model it explicitly.`],
   [`Dispatch`,`The controller scores each elevator. Best case: one already moving toward the caller in the same direction. Next: an idle one that is nearest. Put the scoring behind a strategy so it can change.`],
   [`Movement`,`An elevator keeps going in one direction, stopping at requested floors, then reverses. This is the same idea as the SCAN disk algorithm.`],
   [`Concurrency`,`Requests arrive anytime, so keep each elevator's stop list in a thread-safe structure and process requests from a queue.`]],
  trade:`A simple nearest-elevator rule is easy to explain but can send the wrong one. A direction-aware rule is better and slightly more code.`,
  follow:`Add a priority or fire mode? (a new strategy or a state that overrides normal dispatch.) Add weight limits? (a check before accepting a stop.)`,
  code:{cap:`Dispatch scoring as a plug`,code:`interface DispatchStrategy {\n  Elevator choose(List<Elevator> all, Request r);\n}\n\nclass NearestDirectionAware implements DispatchStrategy {\n  public Elevator choose(List<Elevator> all, Request r) {\n    Elevator best = null; int bestCost = Integer.MAX_VALUE;\n    for (Elevator e : all) {\n      int cost = Math.abs(e.currentFloor() - r.floor());\n      if (!e.isIdle() && !e.isHeadingToward(r)) cost += 100; // penalty\n      if (cost < bestCost) { bestCost = cost; best = e; }\n    }\n    return best;\n  }\n}`,use:`List<Elevator> elevators = List.of(new Elevator("A"), new Elevator("B"));
ElevatorController controller =
    new ElevatorController(elevators, new NearestDirectionAware());

controller.request(new Request(7, Direction.UP));    // someone on floor 7 presses UP
// The controller asks the strategy which lift is best (say A)
// and adds floor 7 to A's list of stops.

// Swap the rule without touching the controller:
// new ElevatorController(elevators, new LowestWaitTimeStrategy());`}},

 {n:`Vending machine and ATM`,tag:`LLD`,where:`Listed as classic State-pattern problems.`,
  ask:`A machine that takes money, lets you pick an item, and dispenses it.`,
  quality:`Behaviour depends on what stage it is in, and illegal actions must be blocked.`,
  steps:[
   [`Spot the stages`,`IDLE, HAS_MONEY, DISPENSING, OUT_OF_SERVICE. Pressing "select" in IDLE must fail. In HAS_MONEY it must work.`],
   [`State pattern`,`Make each stage a class with the same methods: insertCoin, selectItem, dispense. Each class decides what each action does and which stage comes next. This replaces long if-chains on a status field.`],
   [`Other classes`,`Inventory (item codes and counts), Item (price), and the machine itself, which holds the current state.`],
   [`ATM version`,`Same idea with states like NO_CARD, CARD_INSERTED, PIN_VERIFIED, then operations such as withdraw. Cash dispensing and balance check sit in a service class.`]],
  trade:`State classes make each rule easy to find and change, but there are more small classes. For only two or three states, an enum with a switch can be fine.`,
  follow:`What if the item sells out between selection and dispense? (re-check in the dispense step and refund.) How do you add a new payment method? (a payment strategy.)`,
  code:{cap:`One state, the others follow the same shape`,code:`interface State {\n  void insertCoin(VendingMachine m, int amount);\n  void selectItem(VendingMachine m, String code);\n  void dispense(VendingMachine m);\n}\n\nclass IdleState implements State {\n  public void insertCoin(VendingMachine m, int amount) {\n    m.addMoney(amount);\n    m.setState(new HasMoneyState());\n  }\n  public void selectItem(VendingMachine m, String code) {\n    throw new IllegalStateException("Insert money first");\n  }\n  public void dispense(VendingMachine m) {\n    throw new IllegalStateException("Nothing selected");\n  }\n}`,use:`VendingMachine vm = new VendingMachine();   // starts in IdleState

vm.insertCoin(20);       // IdleState: adds money, moves to HasMoneyState
vm.selectItem("A1");     // HasMoneyState: reserves the item, moves on

// Calling selectItem on a fresh machine instead:
// new VendingMachine().selectItem("A1");   // IllegalStateException: Insert money first`}},

 {n:`Splitwise (shared expenses)`,tag:`LLD`,where:`A frequent LLD in India interviews.`,
  ask:`Friends add shared expenses and the app shows who owes whom.`,
  quality:`Correct money maths, flexible ways to split, and a simple way to settle.`,
  steps:[
   [`Classes`,`User, Expense (payer, total, participants), Split strategy, Group, Balance sheet.`],
   [`Split types`,`Equal, exact amounts, and percentages. This is a strategy: each type turns a total into a share per person.`],
   [`Track net balances`,`For each expense, the payer is owed the total, and each participant owes their share. Keep one net number per user (positive means they are owed, negative means they owe).`],
   [`Money as integers`,`Store paise, not decimals, and decide who gets the extra paisa when the amount does not divide evenly.`],
   [`Simplify debts`,`Put users with positive balances on one side and negative on the other. Repeatedly match the biggest creditor with the biggest debtor. This reduces the number of payments.`]],
  trade:`Storing net balances is compact and quick to settle but loses the history of who owes whom per expense, so keep the expense list too.`,
  follow:`Add a new split type? (a new strategy class.) How do you handle a deleted expense? (reverse its effect on the balances.)`,
  code:{cap:`Updating net balances`,code:`interface SplitStrategy {\n  Map<String, Long> shares(long totalPaise, List<String> users);\n}\n\nvoid addExpense(String payer, long total, SplitStrategy s,\n                List<String> users, Map<String, Long> net) {\n  net.merge(payer, total, Long::sum);          // payer is owed the total\n  s.shares(total, users).forEach((user, share) ->\n      net.merge(user, -share, Long::sum));     // each owes their share\n}`,use:`Map<String, Long> net = new HashMap<>();
List<String> friends = List.of("Asha", "Ravi", "Meera");

// Asha pays Rs 900 for dinner, split equally
addExpense("Asha", 90_000, new EqualSplit(), friends, net);

System.out.println(net);
// {Asha=60000, Ravi=-30000, Meera=-30000}   (order may differ)
// Asha is owed Rs 600. Ravi and Meera each owe Rs 300.`}},

 {n:`LRU cache`,tag:`LLD`,where:`A classic coding-style design question, often a machine-coding round.`,
  ask:`A fixed-size cache. When full, remove the least recently used item. Both get and put must be O(1).`,
  quality:`Constant time operations and clean pointer handling.`,
  steps:[
   [`Two structures together`,`A hash map for instant lookup by key, and a doubly linked list that keeps items ordered from most to least recently used.`],
   [`On get`,`Find the node in the map, move it to the front of the list, return the value.`],
   [`On put`,`If the key exists, update and move to front. Otherwise, if full, remove the node at the back (and its map entry), then add the new node at the front.`],
   [`Thread safety`,`Make the methods synchronized, or use a lock. Mention that for higher throughput you could split the cache into segments.`],
   [`Java shortcut`,`<code>LinkedHashMap</code> with access order and <code>removeEldestEntry</code> gives LRU in a few lines. Mention it, but be ready to write the manual version.`]],
  trade:`A hash map plus linked list uses extra memory per entry but gives O(1). A single lock is simple but limits concurrency.`,
  follow:`Add expiry (TTL)? (store an expiry time per node and check on get.) Make it generic? (use type parameters, as in the code below.)`,
  code:{cap:`Manual version with sentinel nodes`,code:`class LRUCache<K, V> {\n  static class Node<K, V> { K k; V v; Node<K, V> prev, next; }\n\n  private final int cap;\n  private final Map<K, Node<K, V>> map = new HashMap<>();\n  private final Node<K, V> head = new Node<>(), tail = new Node<>();\n\n  LRUCache(int cap) {\n    this.cap = cap;\n    head.next = tail; tail.prev = head;\n  }\n\n  synchronized V get(K k) {\n    Node<K, V> n = map.get(k);\n    if (n == null) return null;\n    unlink(n); addFront(n);            // now most recent\n    return n.v;\n  }\n\n  synchronized void put(K k, V v) {\n    Node<K, V> n = map.get(k);\n    if (n != null) { n.v = v; unlink(n); addFront(n); return; }\n    if (map.size() == cap) {           // evict least recent\n      Node<K, V> lru = tail.prev;\n      unlink(lru); map.remove(lru.k);\n    }\n    n = new Node<>(); n.k = k; n.v = v;\n    map.put(k, n); addFront(n);\n  }\n\n  private void unlink(Node<K, V> n) {\n    n.prev.next = n.next; n.next.prev = n.prev;\n  }\n  private void addFront(Node<K, V> n) {\n    n.next = head.next; n.prev = head;\n    head.next.prev = n; head.next = n;\n  }\n}`,use:`LRUCache<String, String> cache = new LRUCache<>(2);

cache.put("a", "1");
cache.put("b", "2");
cache.get("a");             // "a" becomes the most recent
cache.put("c", "3");        // full: evicts "b", the least recently used

System.out.println(cache.get("b"));    // null
System.out.println(cache.get("a"));    // 1
System.out.println(cache.get("c"));    // 3`}},

 {n:`Rate limiter (class version)`,tag:`LLD`,where:`Listed for Amazon, Google, Razorpay and CRED. This is the in-code version of the HLD question.`,
  ask:`Write a thread-safe class that allows N calls per second per user.`,
  quality:`Correct under many threads, and no memory leak for inactive users.`,
  steps:[
   [`Token bucket`,`Each user has a bucket with a capacity and a refill rate. A call needs one token. Tokens are added over time, up to the capacity.`],
   [`Refill lazily`,`Do not run a timer. When a call arrives, work out how many tokens to add since the last call.`],
   [`Per-user buckets`,`Keep them in a <code>ConcurrentHashMap</code> and create on first use with <code>computeIfAbsent</code>.`],
   [`Thread safety`,`Make the check and update on one bucket synchronized, so two threads cannot both take the last token.`],
   [`Cleanup`,`Remove buckets that have been idle for a long time, or the map grows forever.`]],
  trade:`Token bucket allows bursts. A sliding window is stricter but stores more data.`,
  follow:`Different limits per user plan? (inject the limit when creating the bucket.) Distributed? (move the state to Redis with an atomic script.)`,
  code:{cap:`Token bucket`,code:`class TokenBucket {\n  private final long capacity;\n  private final double refillPerSec;\n  private double tokens;\n  private long lastNanos;\n\n  TokenBucket(long capacity, double refillPerSec) {\n    this.capacity = capacity;\n    this.refillPerSec = refillPerSec;\n    this.tokens = capacity;\n    this.lastNanos = System.nanoTime();\n  }\n\n  synchronized boolean tryAcquire() {\n    long now = System.nanoTime();\n    tokens = Math.min(capacity,\n        tokens + (now - lastNanos) / 1e9 * refillPerSec);\n    lastNanos = now;\n    if (tokens >= 1) { tokens -= 1; return true; }\n    return false;\n  }\n}\n\nclass RateLimiter {\n  private final Map<String, TokenBucket> buckets = new ConcurrentHashMap<>();\n  boolean allow(String userId) {\n    return buckets\n        .computeIfAbsent(userId, id -> new TokenBucket(10, 5))\n        .tryAcquire();\n  }\n}`,use:`RateLimiter limiter = new RateLimiter();    // 10 tokens, refills 5 per second, per user

for (int i = 0; i < 12; i++) {
  System.out.println(limiter.allow("user-42"));   // first 10 print true, then false
}

// Inside a Spring filter:
@Component
class RateLimitFilter extends OncePerRequestFilter {
  private final RateLimiter limiter = new RateLimiter();

  protected void doFilterInternal(HttpServletRequest req, HttpServletResponse res,
                                  FilterChain chain) throws IOException, ServletException {
    if (!limiter.allow(req.getHeader("X-User-Id"))) {
      res.setStatus(429);          // Too Many Requests
      return;
    }
    chain.doFilter(req, res);
  }
}`}},

 {n:`Logging framework`,tag:`LLD`,where:`Listed as a classic LLD on 2026 lists.`,
  ask:`A logging library with levels and several destinations.`,
  quality:`Easy to add a destination, cheap to skip low levels, and safe from many threads.`,
  steps:[
   [`Levels`,`DEBUG, INFO, WARN, ERROR as an enum. A logger has a minimum level and ignores anything below it.`],
   [`Destinations (appenders)`,`An Appender interface with implementations for console, file and others. Adding a destination is a new class. This is the Strategy idea again.`],
   [`Formatting`,`Keep formatting separate from writing, so format and destination can change independently.`],
   [`Singleton or factory`,`Provide loggers by name from one registry. Avoid making the logger itself a hidden global that is hard to test.`],
   [`Performance`,`For slow destinations such as files, put messages on a queue and let a background thread write them (asynchronous logging).`]],
  trade:`Asynchronous logging keeps the app fast but can lose the last messages if the app crashes. Synchronous is safe but slows the caller.`,
  follow:`Add log rotation? (a file appender that rolls over by size or date.) Filter by package? (a chain of filters before the appenders.)`,
  code:{cap:`The core shape`,code:`enum Level { DEBUG, INFO, WARN, ERROR }\n\ninterface Appender { void append(Level level, String message); }\n\nclass ConsoleAppender implements Appender {\n  public void append(Level l, String m) { System.out.println(l + " " + m); }\n}\n\nclass Logger {\n  private final Level min;\n  private final List<Appender> appenders;\n\n  Logger(Level min, List<Appender> appenders) {\n    this.min = min; this.appenders = appenders;\n  }\n\n  void log(Level level, String msg) {\n    if (level.ordinal() < min.ordinal()) return;   // skip cheaply\n    for (Appender a : appenders) a.append(level, msg);\n  }\n}`,use:`Logger log = new Logger(Level.INFO, List.of(new ConsoleAppender()));

log.log(Level.DEBUG, "cache miss");       // ignored: below INFO
log.log(Level.INFO,  "order placed");     // prints: INFO order placed
log.log(Level.ERROR, "payment failed");   // prints: ERROR payment failed

// Adding a file destination later changes only the wiring:
// new Logger(Level.INFO, List.of(new ConsoleAppender(), new FileAppender("app.log")))`}},

 {n:`Meeting room and slot booking`,tag:`LLD`,where:`Flipkart's guide lists conference room booking, resource booking without conflicts and concurrent slot booking.`,
  ask:`Book rooms for time ranges. Two bookings for the same room must never overlap.`,
  quality:`Correct overlap check and safe under many threads.`,
  steps:[
   [`Classes`,`Room, Booking (start and end), BookingService, and optionally Employee.`],
   [`Overlap rule`,`Two ranges overlap when <b>A.start &lt; B.end and B.start &lt; A.end</b>. Memorize this one line. Touching ranges (one ends when the next starts) do not overlap.`],
   [`Find a free room`,`For a requested time, loop through rooms and book the first with no overlap. Add filters for capacity.`],
   [`Concurrency`,`Lock per room, not one global lock, so bookings for different rooms do not wait on each other. The check and the add must be inside the same lock.`],
   [`Faster checks`,`Keep each room's bookings sorted (a TreeMap by start time) so you check only the neighbours.`]],
  trade:`One global lock is simple but slow. A lock per room scales better. In a database, a unique or exclusion constraint on room and time range is the safest guard.`,
  follow:`Recurring bookings? (expand into separate bookings or store a rule and generate on demand.) Cancel? (remove and free the range.)`,
  code:{cap:`Atomic check and book`,code:`class Room {\n  private final List<Booking> bookings = new ArrayList<>();\n\n  synchronized boolean book(Instant start, Instant end) {\n    for (Booking b : bookings) {\n      if (start.isBefore(b.end()) && b.start().isBefore(end))\n        return false;                    // overlaps\n    }\n    bookings.add(new Booking(start, end));\n    return true;\n  }\n}`,use:`Room room = new Room();
Instant nine   = Instant.parse("2026-11-20T09:00:00Z");
Instant ten    = Instant.parse("2026-11-20T10:00:00Z");
Instant eleven = Instant.parse("2026-11-20T11:00:00Z");

System.out.println(room.book(nine, ten));       // true
System.out.println(room.book(ten, eleven));     // true: touching, not overlapping
System.out.println(room.book(nine.plusSeconds(1800), ten.plusSeconds(1800)));
                                                // false: 9:30-10:30 overlaps 9:00-10:00`}},

 {n:`Thread-safe Singleton and in-memory store`,tag:`LLD`,where:`Thread-safe Singleton and in-memory CRUD with concurrency are in Flipkart's list, and Singleton with thread safety came up in a Walmart write-up.`,
  ask:`(a) Write a Singleton that is safe with many threads. (b) Build an in-memory key-value store that many threads use.`,
  quality:`Know exactly why each approach is safe.`,
  steps:[
   [`Singleton: the simple safe ways`,`An <b>enum</b> singleton is safe and handles serialization. A <b>holder class</b> loads the instance only when first used, and the JVM guarantees safe class loading.`],
   [`Singleton: double-checked locking`,`If asked, show it, and explain why the field must be <code>volatile</code>: without it, another thread may see a half-built object.`],
   [`In-memory store`,`Use <code>ConcurrentHashMap</code>. Single operations are safe. For "check then update", use atomic methods such as <code>putIfAbsent</code>, <code>compute</code> and <code>merge</code> and not separate get and put calls.`],
   [`Bigger operations`,`If several keys must change together, you need a lock around them, or you restructure so each operation touches one key.`],
   [`Singleton warning`,`Say that a singleton is hidden global state and makes tests harder. Prefer passing one shared instance in (dependency injection), as Spring does with its default singleton scope.`]],
  trade:`Enum and holder are simplest. Double-checked locking is more code for no real gain in most cases. ConcurrentHashMap gives great read speed, but compound operations need care.`,
  follow:`Why does get-then-put break? (two threads both see "missing" and both put.) How can reflection break a singleton? (enum prevents it.)`,
  code:{cap:`Holder singleton and an atomic counter update`,code:`class Config {\n  private Config() {}\n  private static class Holder {\n    static final Config INSTANCE = new Config();\n  }\n  static Config getInstance() { return Holder.INSTANCE; }\n}\n\n// Safe: one atomic step\nConcurrentHashMap<String, Integer> counts = new ConcurrentHashMap<>();\ncounts.merge("clicks", 1, Integer::sum);\n\n// Unsafe: two steps, another thread can slip in between\n// Integer c = counts.get("clicks");\n// counts.put("clicks", c == null ? 1 : c + 1);`,use:`Config a = Config.getInstance();
Config b = Config.getInstance();
System.out.println(a == b);                     // true

// Many threads counting clicks safely
ExecutorService pool = Executors.newFixedThreadPool(8);
for (int i = 0; i < 1000; i++) {
  pool.submit(() -> counts.merge("clicks", 1, Integer::sum));
}
pool.shutdown();
pool.awaitTermination(5, TimeUnit.SECONDS);     // in a method that throws InterruptedException

System.out.println(counts.get("clicks"));       // always 1000
// With the unsafe get-then-put version, you could see less than 1000.`}},

 {n:`Movie ticket booking (class design)`,tag:`LLD`,where:`A Ticketmaster-style LLD (entities, schema, APIs) came up in an India SDE-2 write-up. The scale side is in lesson 15.`,
  ask:`Design the entities, tables and APIs for booking movie tickets.`,
  quality:`Clear model, and the atomic seat claim.`,
  steps:[
   [`Entities`,`Movie, Theatre, Screen, Seat, Show (a movie on a screen at a time), ShowSeat (a seat for one show, with status), Booking, Payment, User.`],
   [`Key insight`,`A seat is a physical thing. A ShowSeat is that seat on one show, and it holds the status (AVAILABLE, HELD, BOOKED). Keeping these apart is the "hidden noun" idea from lesson 3.`],
   [`APIs`,`GET /shows?movie=&city=, GET /shows/{id}/seats, POST /shows/{id}/hold (seat ids), POST /bookings (hold id, payment), DELETE /bookings/{id}.`],
   [`Pricing`,`Behind a pricing strategy: weekday, weekend, seat class, offers.`],
   [`Seat claim`,`Use the atomic hold statement from the HLD version. Add a booking state machine: HELD, CONFIRMED, CANCELLED, EXPIRED.`]],
  trade:`Storing one row per show and seat is simple and exact but creates many rows. That is fine at this scale and makes locking easy.`,
  follow:`Which indexes? (primary key on show and seat, plus an index on hold_until for the cleanup job.) Refunds on cancel? (a refund step in the booking state machine.)`}
 ]}
]},

{id:`lesson-17`,track:`bank`,trackName:`Question bank`,title:`Java, SQL and concurrency questions`,min:35,
 promise:`Many India interviews open with fundamentals before the design round. These are the ones that keep appearing, answered in plain words with a line of code where it helps.`,
 blocks:[
 {t:`plain`,h:`A reported SDE-2 round asked about ACID, CAP, isolation levels, indexing, idempotency, locking and PUT versus PATCH, and then moved to design. With 10 years of Spring and SQL, these answers should come easily, so <b>practice saying them in two or three sentences</b>.`},
 {t:`qbank`,items:[

 {n:`ACID in plain words`,tag:`Concept`,where:`Database fundamentals round.`,
  ask:`What does ACID mean?`,
  quality:`Use a money transfer as your example.`,
  steps:[
   [`Atomicity`,`All or nothing. If you move 500 rupees, both the debit and the credit happen, or neither does.`],
   [`Consistency`,`The rules of the data always hold after a transaction: balances are not negative, foreign keys point to real rows.`],
   [`Isolation`,`Transactions running at the same time do not see each other's half-finished work.`],
   [`Durability`,`Once committed, the data survives a crash. Databases do this by writing a log to disk first.`]],
  trade:`Stronger guarantees cost speed and coordination. That is why some systems relax them.`,
  follow:`Which one is most about concurrency? (isolation.) What does a database use for durability? (a write-ahead log.)`},

 {n:`Isolation levels`,tag:`Concept`,where:`Database fundamentals round.`,
  ask:`Explain the transaction isolation levels and the problems they prevent.`,
  quality:`Explain the problems first, then the levels.`,
  steps:[
   [`The three problems`,`<b>Dirty read:</b> you see another transaction's uncommitted change. <b>Non-repeatable read:</b> you read the same row twice and get different values because someone committed in between. <b>Phantom read:</b> you run the same query twice and new rows appear.`],
   [`Read uncommitted`,`Allows all three. Rarely used.`],
   [`Read committed`,`No dirty reads. Non-repeatable reads and phantoms are possible. This is the default in PostgreSQL and Oracle.`],
   [`Repeatable read`,`The same row reads the same value inside a transaction. By the standard, phantoms are still possible, though MySQL InnoDB largely prevents them with gap locks. This is InnoDB's default.`],
   [`Serializable`,`Behaves as if transactions ran one after another. Safest and slowest.`]],
  trade:`Higher isolation means fewer surprises but more waiting, more locks or more retries.`,
  follow:`Which level would you use for a bank transfer? (at least repeatable read plus explicit locking on the rows, or serializable with retries.) How do you set it in Spring? (<code>@Transactional(isolation = Isolation.REPEATABLE_READ)</code>.)`},

 {n:`CAP theorem`,tag:`Concept`,where:`Database and distributed systems round.`,
  ask:`What is the CAP theorem?`,
  quality:`Say it as a choice made only during a network failure.`,
  steps:[
   [`The three letters`,`<b>Consistency:</b> every read sees the latest write. <b>Availability:</b> every request gets a response. <b>Partition tolerance:</b> the system keeps working even if the network splits.`],
   [`The real meaning`,`Networks do fail, so you must tolerate partitions. When a split happens, you choose: refuse some requests to stay consistent (CP), or answer with possibly old data to stay available (AP).`],
   [`Examples`,`A bank balance leans CP: better to wait than show a wrong number. A like count leans AP: slightly old is fine.`]],
  trade:`When there is no split, you can have both. The trade-off only appears during failure.`,
  follow:`Is your SQL database CP or AP? (a single primary is consistent, but it is unavailable when it fails, unless you add failover.)`},

 {n:`Idempotency and how to build it in Spring`,tag:`Concept`,where:`Asked in the reported SDE-2 round for payments and multi-device actions.`,
  ask:`What is idempotency, and how do you make a payment API idempotent?`,
  quality:`A retried request must have the same effect as one request.`,
  steps:[
   [`Definition`,`Doing it once or ten times gives the same result. GET, PUT and DELETE are meant to be idempotent. POST is not by default.`],
   [`Why it matters`,`Networks time out, and clients retry. Without protection, a retry charges twice.`],
   [`The pattern`,`The client sends a unique Idempotency-Key header. The server saves the key with a unique constraint, together with the result. A repeated key returns the saved result.`],
   [`Same request from two devices`,`Use the same key for the same action, or a natural unique key such as (user, show, seat). The unique constraint lets one win.`]],
  trade:`A key table adds a small write to each request and needs cleanup after some days. It removes the worst class of bug.`,
  follow:`What if the request is still running when the retry arrives? (store status IN_PROGRESS and return 409 or wait.) How long do you keep keys? (long enough to cover client retries, such as 24 hours.)`,
  code:{cap:`A minimal Spring sketch`,code:`@PostMapping("/payments")\nResponseEntity<Payment> pay(@RequestHeader("Idempotency-Key") String key,\n                            @RequestBody PayRequest req) {\n  try {\n    return ResponseEntity.ok(service.createPayment(key, req));\n  } catch (DataIntegrityViolationException dup) {   // key already used\n    return ResponseEntity.ok(service.findByKey(key)); // return saved result\n  }\n}`,use:`// Client call:
// curl -X POST http://localhost:8080/payments \\
//      -H "Idempotency-Key: 7f3c-9a21" \\
//      -H "Content-Type: application/json" \\
//      -d '{"amountPaise": 49900}'
//
// The first call creates the payment.
// Send the exact same curl again (for example after a timeout) and you get
// the SAME payment back, with no second charge.`}},

 {n:`PUT, PATCH and POST`,tag:`Concept`,where:`Asked in the reported SDE-2 round.`,
  ask:`What is the difference between PUT, PATCH and POST?`,
  quality:`Replace versus change part versus create.`,
  steps:[
   [`POST`,`Create something, or trigger an action. Not idempotent by default. Two posts can create two items.`],
   [`PUT`,`Replace the whole resource at a known address. Sending it twice leaves the same final state, so it is idempotent.`],
   [`PATCH`,`Change only some fields. It may or may not be idempotent. "Set status to SHIPPED" is. "Add 10 to the balance" is not.`]],
  trade:`PUT is simple but requires sending the full object. PATCH saves bandwidth but needs care about what the change means.`,
  follow:`Which would you use to update a user's email? (PATCH, or PUT if replacing the profile.)`},

 {n:`Optimistic and pessimistic locking`,tag:`Concept`,where:`Asked in the reported SDE-2 round. Also the base of every booking question.`,
  ask:`What is the difference, and when would you use each?`,
  quality:`Match the choice to how often conflicts happen.`,
  steps:[
   [`Pessimistic`,`Lock the row when you read it, so nobody else can change it until you finish. Safe, but others wait, and you risk deadlocks. In SQL: <code>SELECT ... FOR UPDATE</code>. In JPA: <code>@Lock(LockModeType.PESSIMISTIC_WRITE)</code>.`],
   [`Optimistic`,`Do not lock. Keep a version number on the row. When saving, update only if the version is unchanged. If it changed, someone else won, and you retry. In JPA, add <code>@Version</code>.`],
   [`When to use which`,`Conflicts are rare and reads are common: optimistic. Conflicts are frequent on the same rows, such as a hot inventory item: pessimistic, or an atomic conditional update.`]],
  trade:`Optimistic gives more throughput when conflicts are rare but wastes work when they are common. Pessimistic is predictable but blocks.`,
  follow:`What exception does JPA throw when the version differs? (<code>OptimisticLockException</code>.) How do you handle it? (retry a few times, then fail clearly.)`,
  code:{cap:`Optimistic locking in the database`,code:`UPDATE account\n   SET balance = balance - 500, version = version + 1\n WHERE id = ? AND version = ?;\n-- 0 rows updated means someone else changed it first. Retry.`,use:`@Transactional
void withdraw(Long id, long amount) {
  Account a = repo.findById(id).orElseThrow();
  a.setBalance(a.getBalance() - amount);
  repo.save(a);       // JPA adds "WHERE version = ?" for you (field marked @Version)
}

// The caller retries when someone else changed the row first
for (int attempt = 0; attempt < 3; attempt++) {
  try {
    service.withdraw(id, 500);
    break;
  } catch (ObjectOptimisticLockingFailureException e) {
    // reload and try again
  }
}`}},

 {n:`Index trade-offs`,tag:`Concept`,where:`Asked in the reported SDE-2 round.`,
  ask:`What do indexes cost, and how do you choose them?`,
  quality:`Indexes speed reads and slow writes.`,
  steps:[
   [`What they do`,`An index is a sorted structure (usually a B-tree) that lets the database find rows without scanning the whole table.`],
   [`What they cost`,`Every insert, update and delete must also update each index, and indexes use disk and memory.`],
   [`How to choose`,`Index columns used in WHERE, JOIN and ORDER BY on large tables, based on real queries. Check with EXPLAIN.`],
   [`Composite indexes`,`Order matters. An index on (city, age) helps queries on city, or city and age, but not on age alone (the leftmost prefix rule).`],
   [`When an index does not help`,`Very low-variety columns (for example a yes/no flag), tiny tables, or queries that wrap the column in a function.`]],
  trade:`More indexes make reads faster and writes slower. On a write-heavy table, keep the number small.`,
  follow:`What is a covering index? (it holds every column the query needs, so the table is not touched.) Which indexes for seat booking? (primary key on show and seat, and one on hold expiry.)`},

 {n:`SQL or NoSQL, and horizontal scaling`,tag:`Concept`,where:`Asked in the reported SDE-2 round.`,
  ask:`Why is NoSQL said to scale horizontally better than SQL?`,
  quality:`Joins and transactions are what make splitting data hard.`,
  steps:[
   [`Why SQL is hard to split`,`Relationships, joins and multi-row transactions need data on one machine to be fast. Spreading rows across machines makes these slow and complex.`],
   [`Why many NoSQL stores split easily`,`They store data in self-contained records looked up by a key, so records can live on any machine. They give up joins and multi-record transactions to do that.`],
   [`Reality check`,`SQL can scale too: read replicas, partitioning, and sharding. Some modern databases offer distributed SQL.`],
   [`How to answer a choice`,`Relationships and transactions: SQL. Huge key-based volume and flexible shape: NoSQL.`]],
  trade:`SQL gives strong guarantees and flexible queries at the cost of harder scaling. NoSQL scales easily but pushes consistency and joins into your code.`,
  follow:`Which would you pick for orders? (SQL.) For user activity events? (a NoSQL or log store.)`},

 {n:`Cache problems: stale data, stampede, full memory`,tag:`Concept`,where:`Redis memory full was asked in the reported SDE-2 round.`,
  ask:`What can go wrong with a cache, and how do you handle it?`,
  quality:`Name the problem, then the fix.`,
  steps:[
   [`Stale data`,`The cache holds an old value. Delete the cache entry when data changes, and set a short expiry as a safety net.`],
   [`Cache stampede`,`A popular key expires and many requests hit the database together. Let one request rebuild it while the others wait, and add random time to expiries.`],
   [`Cache penetration`,`Requests for keys that do not exist always miss. Cache the "not found" result briefly, or use a Bloom filter.`],
   [`Memory full`,`Set a maximum memory with an eviction policy such as allkeys-lru, give keys an expiry, look for giant keys, and add nodes. Never treat the cache as the only copy.`]],
  trade:`Short expiry means fresher data and more database load. Longer expiry means the opposite.`,
  follow:`What eviction policy would you use? (allkeys-lru for general caching.)`},

 {n:`Message delivery guarantees`,tag:`Concept`,where:`Comes up with queues, Kafka and notifications.`,
  ask:`What is the difference between at-most-once, at-least-once and exactly-once?`,
  quality:`Exactly-once is built from at-least-once plus idempotency.`,
  steps:[
   [`At-most-once`,`Send and forget. Never duplicated, but can be lost.`],
   [`At-least-once`,`Retry until acknowledged. Never lost, but can be duplicated.`],
   [`Exactly-once`,`In practice you get "effectively once": at-least-once delivery, plus a consumer that detects and ignores duplicates by message id.`]],
  trade:`At-least-once with idempotent consumers is the common, practical choice.`,
  follow:`How does a consumer detect duplicates? (keep a table of processed message ids with a unique constraint.)`},

 {n:`Pagination: offset or cursor`,tag:`Concept`,where:`A common API design follow-up.`,
  ask:`How would you paginate a large list?`,
  quality:`Offset is simple. Cursor stays fast and stable.`,
  steps:[
   [`Offset`,`<code>LIMIT 20 OFFSET 40000</code> makes the database skip 40,000 rows each time, so deep pages are slow. New rows also shift pages and cause repeats or gaps.`],
   [`Cursor (keyset)`,`Remember the last item you returned, and ask for items after it: <code>WHERE id &gt; ? ORDER BY id LIMIT 20</code>. It uses the index, stays fast, and does not shift.`],
   [`API shape`,`Return a "next cursor" value with each page.`]],
  trade:`Cursor pagination cannot jump to page 50 directly. For feeds and infinite scroll, that is fine.`,
  follow:`What if you sort by a column that is not unique? (add the id as a tie-breaker in the cursor.)`}
 ]},
 {t:`remember`,h:`Practice these in two or three sentences each. Interviewers want a clear, short, correct answer first, and more detail only if they ask.`}
]},

/* ---------- 18 ---------- */
{id:`lesson-18`,track:`patterns`,trackName:`Design patterns`,title:`What patterns are, and which ones get asked`,min:10,
 promise:`A map of the whole topic first, so you know where each pattern fits and which ones deserve your time.`,
 blocks:[
 {t:`plain`,h:`A <b>design pattern</b> is a named, proven answer to a problem that keeps coming up. It is not code to copy. It is a shared vocabulary, so you can say "use Strategy here" and everyone knows the shape of the solution.`},
 {t:`analogy`,h:`Cooks do not describe a dish step by step every time. They say "tadka" or "dum biryani", and everyone knows the method. Patterns are those names for software.`},
 {t:`p`,h:`<h2>The three families</h2>`},
 {t:`cards`,items:[
   {h:`Creational`,pic:`How objects get made`,b:`Singleton, Factory Method, Abstract Factory, Builder, Prototype.`,small:`Use when creating objects is messy, repeated or needs control.`},
   {h:`Structural`,pic:`How objects fit together`,b:`Adapter, Decorator, Proxy, Facade, Composite, Bridge, Flyweight.`,small:`Use when you are wrapping, combining or simplifying existing pieces.`},
   {h:`Behavioural`,pic:`How objects talk and share work`,b:`Strategy, Observer, State, Command, Chain of Responsibility, Template Method, Iterator and more.`,small:`Use when behaviour changes, or when objects must react to each other.`}]},
 {t:`p`,h:`<h2>What the research says gets asked</h2><p>Prep guides list the same twelve patterns as the most frequently asked in LLD interviews: <b>Singleton, Factory Method, Builder, Adapter, Decorator, Composite, Facade, Strategy, Observer, State, Chain of Responsibility and Command.</b> One guide says Strategy, Observer, State and Factory are the most tied to common machine-coding problems like payments, notifications and ATMs. For Java and Spring roles, interviewers also ask where Spring uses patterns (Proxy, Template Method, Singleton scope) and compare similar pairs such as Strategy versus State.</p>`},
 {t:`remember`,h:`A guide on frequently asked patterns says it plainly: <b>interviewers evaluate your reasoning more than your vocabulary.</b> Explain why a pattern fits and what it costs. Naming it is the smallest part.`},
 {t:`p`,h:`<h2>Problem to pattern: the quick map</h2><p>This is the most useful table in the whole topic. Start from the problem you feel.</p>`},
 {t:`cards`,items:[
   {h:`"I have a long if-else choosing an algorithm"`,b:`<b>Strategy.</b> Lesson 19.`},
   {h:`"When X changes, many things must react"`,b:`<b>Observer.</b> Lesson 20.`},
   {h:`"Behaviour depends on what stage it is in"`,b:`<b>State.</b> Lesson 21.`},
   {h:`"Callers should not know which class gets created"`,b:`<b>Factory.</b> Lesson 22.`},
   {h:`"There must be exactly one of these"`,b:`<b>Singleton.</b> Lesson 23.`},
   {h:`"This object has many optional fields"`,b:`<b>Builder.</b> Lesson 24.`},
   {h:`"I need to add features by stacking them"`,b:`<b>Decorator.</b> Lesson 25.`},
   {h:`"I need to control access to an object"`,b:`<b>Proxy.</b> Lesson 25.`},
   {h:`"This old API has the wrong shape"`,b:`<b>Adapter.</b> Lesson 26.`},
   {h:`"Calling five subsystems is confusing"`,b:`<b>Facade.</b> Lesson 26.`},
   {h:`"I need undo, queues or logs of actions"`,b:`<b>Command.</b> Lesson 27.`},
   {h:`"A request passes through several checks"`,b:`<b>Chain of Responsibility.</b> Lesson 27.`}]},
 {t:`mistake`,h:`Using a pattern because it sounds impressive. A pattern adds classes. If the problem does not hurt yet, the simple code is the better answer. Lesson 5 had the rule: add a plug only where you can name the next variation.`},
 {t:`check`,q:`Your code has <code>if (type.equals("UPI")) ... else if (type.equals("CARD")) ...</code> and a new payment type arrives every month. Which family and which pattern?`,a:`Behavioural, and Strategy. Each payment type becomes its own class behind one interface, so a new type is a new class with no edit to the existing code.`}
]},

/* ---------- 19 ---------- */
{id:`lesson-19`,track:`patterns`,trackName:`Design patterns`,title:`Strategy: swap the behaviour`,min:12,
 promise:`The most asked pattern. You met the idea in lesson 5. Here it gets a full treatment with a diagram, a payment example and the Spring version.`,
 blocks:[
 {t:`plain`,h:`<b>Strategy</b> puts each way of doing something in its own class behind one interface. The caller holds the interface and can swap the behaviour, even while the program runs.`},
 {t:`analogy`,h:`Google Maps asks "how are you travelling?". Car, bike and walking are three strategies for the same job: find a route. The app does not change when you pick another one.`},
 {t:`diagram`,cap:`Loan only knows the FineRule plug. The concrete rules are swappable.`,d:{alt:`Class diagram: Loan uses the FineRule interface, implemented by StandardFine and StudentFine`,nodes:[
   {id:`l`,x:10,y:20,w:150,t:`Loan`,m:[`FineRule rule`,`fine(daysLate)`]},
   {id:`i`,x:240,y:10,w:170,t:`FineRule`,s:`interface`,m:[`fine(daysLate)`],k:`iface`},
   {id:`a`,x:185,y:140,w:110,t:`StandardFine`,m:[`fine(daysLate)`]},
   {id:`b`,x:305,y:140,w:105,t:`StudentFine`,m:[`fine(daysLate)`]}],
  edges:[{a:`l`,b:`i`,k:`has`,l:`uses`},{a:`a`,b:`i`,k:`implements`},{a:`b`,b:`i`,k:`implements`}]}},
 {t:`p`,h:`<h2>Example: choosing how to pay</h2>`},
 {t:`code`,cap:`Each payment method is a strategy`,code:`interface PaymentStrategy {\n  PaymentResult pay(long amountPaise);\n}\n\nclass UpiPayment implements PaymentStrategy {\n  public PaymentResult pay(long amt) { /* call UPI gateway */ return ok(); }\n}\nclass CardPayment implements PaymentStrategy {\n  public PaymentResult pay(long amt) { /* call card gateway */ return ok(); }\n}\n\nclass Checkout {\n  PaymentResult checkout(PaymentStrategy method, long amt) {\n    return method.pay(amt);        // no if-else on type\n  }\n}`},
 {t:`code`,use:true,cap:`How it is used`,code:`Checkout checkout = new Checkout();

checkout.checkout(new UpiPayment(), 49_900);    // pays Rs 499.00 by UPI
checkout.checkout(new CardPayment(), 49_900);   // same call, different behaviour

// A new wallet option next month? Write WalletPayment implements PaymentStrategy.
// Checkout does not change at all.`},
 {t:`p`,h:`<h2>Picking the strategy at runtime</h2><p>Keep the strategies in a map keyed by name, so the choice is data, not code. In Spring this is very natural: inject all implementations at once.</p>`},
 {t:`code`,cap:`Spring injects every implementation into a map`,code:`@Service\nclass PaymentService {\n  private final Map<String, PaymentStrategy> strategies;\n\n  // key = bean name, e.g. "upiPayment", "cardPayment"\n  PaymentService(Map<String, PaymentStrategy> strategies) {\n    this.strategies = strategies;\n  }\n\n  PaymentResult pay(String method, long amt) {\n    PaymentStrategy s = strategies.get(method);\n    if (s == null) throw new IllegalArgumentException(method);\n    return s.pay(amt);\n  }\n}`},
 {t:`code`,use:true,cap:`How it is used`,code:`@RestController
class PaymentController {
  private final PaymentService payments;
  PaymentController(PaymentService payments) { this.payments = payments; }

  // POST /pay?method=upiPayment&amount=49900
  @PostMapping("/pay")
  PaymentResult pay(@RequestParam String method, @RequestParam long amount) {
    return payments.pay(method, amount);   // the request parameter picks the strategy
  }
}
// Mark UpiPayment and CardPayment with @Component. Spring finds them and
// fills the map: {"upiPayment" -> ..., "cardPayment" -> ...}`},
 {t:`p`,h:`<h2>Java already has it</h2><p>A <code>Comparator</code> is a strategy for ordering. With a lambda, a strategy needs no class at all: <code>list.sort((a, b) -> a.price - b.price)</code>.</p>`},
 {t:`mistake`,h:`Creating a strategy for something that never varies, or putting so little in each strategy that they only differ by one number. In that case, one class with a parameter is enough (lesson 5, <code>FlatRateFine(perDay)</code>).`},
 {t:`check`,q:`Where does Strategy show up in these LLD problems: parking lot, ride sharing, chess?`,a:`Parking lot: the fee calculation (hourly, flat, weekend). Ride sharing: pricing and driver matching. Chess: how each piece moves, one strategy per piece type.`},
 {t:`remember`,h:`<b>One interface, many interchangeable algorithms, chosen by the caller.</b> If you hear "it depends on the type", think Strategy first.`}
]},

/* ---------- 20 ---------- */
{id:`lesson-20`,track:`patterns`,trackName:`Design patterns`,title:`Observer: tell everyone who cares`,min:12,
 promise:`How one change can notify many listeners without the source knowing who they are. Includes the Spring way and the classic leak.`,
 blocks:[
 {t:`plain`,h:`<b>Observer</b> lets a subject keep a list of listeners (observers) and tell them all when something changes. The subject does not know or care what each listener does.`},
 {t:`analogy`,h:`A WhatsApp group. When someone posts, everyone in the group gets it. The sender does not phone each member. Members can join and leave at any time.`},
 {t:`diagram`,cap:`PriceFeed is the subject. Chart and Alert are observers. New observers need no change to PriceFeed.`,d:{alt:`Class diagram: Subject notifies Observer interface, PriceFeed extends Subject, Chart and Alert implement Observer`,nodes:[
   {id:`s`,x:10,y:10,w:150,t:`Subject`,m:[`attach(observer)`,`detach(observer)`,`notifyAll()`]},
   {id:`o`,x:240,y:10,w:170,t:`Observer`,s:`interface`,m:[`update(event)`],k:`iface`},
   {id:`p`,x:10,y:150,w:150,t:`PriceFeed`,m:[`setPrice(p)`]},
   {id:`c`,x:190,y:150,w:105,t:`Chart`,m:[`update(event)`]},
   {id:`x`,x:305,y:150,w:105,t:`Alert`,m:[`update(event)`]}],
  edges:[{a:`s`,b:`o`,k:`has`,l:`notifies`},{a:`p`,b:`s`,k:`extends`},{a:`c`,b:`o`,k:`implements`},{a:`x`,b:`o`,k:`implements`}]}},
 {t:`p`,h:`<h2>The code</h2>`},
 {t:`code`,cap:`A plain Java version`,code:`interface OrderListener { void onOrderPlaced(Order o); }\n\nclass OrderService {\n  private final List<OrderListener> listeners = new CopyOnWriteArrayList<>();\n\n  void subscribe(OrderListener l) { listeners.add(l); }\n  void unsubscribe(OrderListener l) { listeners.remove(l); }\n\n  void placeOrder(Order o) {\n    save(o);\n    for (OrderListener l : listeners) {\n      try { l.onOrderPlaced(o); }\n      catch (Exception e) { /* one bad listener must not stop others */ }\n    }\n  }\n}\n\n// Email, SMS and analytics each implement OrderListener.`},
 {t:`code`,use:true,cap:`How it is used`,code:`OrderService orders = new OrderService();

orders.subscribe(o -> System.out.println("Email sent for " + o.id()));
orders.subscribe(o -> System.out.println("SMS sent for " + o.id()));
orders.subscribe(o -> analytics.track("order_placed", o.id()));

orders.placeOrder(new Order("ORD-101"));
// Email sent for ORD-101
// SMS sent for ORD-101
// (analytics event recorded)
// OrderService never learned what any listener does.`},
 {t:`p`,h:`<h2>The Spring version</h2><p>Spring has this built in. You publish an event, and any bean with a listener method receives it.</p>`},
 {t:`code`,cap:`Spring events`,code:`record OrderPlaced(Order order) {}\n\n@Service\nclass OrderService {\n  private final ApplicationEventPublisher events;\n  OrderService(ApplicationEventPublisher events) { this.events = events; }\n\n  void placeOrder(Order o) {\n    save(o);\n    events.publishEvent(new OrderPlaced(o));\n  }\n}\n\n@Component\nclass EmailListener {\n  @EventListener\n  void on(OrderPlaced e) { /* send email */ }\n}`},
 {t:`code`,use:true,cap:`How it is used`,code:`@RestController
class OrderController {
  private final OrderService orders;
  OrderController(OrderService orders) { this.orders = orders; }

  @PostMapping("/orders")
  String place(@RequestBody Order order) {
    orders.placeOrder(order);      // saves, then publishes OrderPlaced
    return "placed";
  }
}
// Want a new reaction later? Write another @Component with an @EventListener
// method for OrderPlaced. OrderService and the controller are not touched.`},
 {t:`p`,h:`<h2>Things to say out loud</h2>`},
 {t:`steps`,items:[
   [`Push or pull`,`Push sends the data inside the event. Pull sends a small signal and the observer asks for what it needs. Push is simpler. Pull suits big or varied data.`],
   [`Failure isolation`,`One failing observer must not stop the others, so catch errors per observer.`],
   [`Memory leak (the lapsed listener)`,`If an observer subscribes and never unsubscribes, the subject keeps it alive forever. Always provide unsubscribe, or use weak references.`],
   [`Threads`,`Use a thread-safe list such as <code>CopyOnWriteArrayList</code>, or listeners added during notification can break the loop.`],
   [`Sync or async`,`By default the caller waits for all observers. For slow listeners, use an executor or a queue.`]]},
 {t:`two`,a:{h:`Observer`,b:`The subject holds the observers directly. In one process, simple and immediate.`},b:{h:`Publish-subscribe`,b:`A broker such as Kafka sits between sender and receivers. They never know each other, and can run in different services and at different times.`}},
 {t:`mistake`,h:`Hidden chains. Observer A changes something that triggers observer B, which triggers C. Debugging becomes a hunt. Keep reactions simple, and log events.`},
 {t:`check`,q:`Which LLD problems use Observer?`,a:`Notifications (an order event reaches email, SMS and push), stock or price updates (chart, alerts, portfolio), ride sharing (rider and driver both react to trip state), and parking lot availability boards.`},
 {t:`remember`,h:`<b>One change, many reactions, and the source does not know who is listening.</b>`}
]},

/* ---------- 21 ---------- */
{id:`lesson-21`,track:`patterns`,trackName:`Design patterns`,title:`State: behaviour that follows the stage`,min:12,
 promise:`How to replace a pile of status checks with small classes. Two diagrams: the classes, and the stage map.`,
 blocks:[
 {t:`plain`,h:`<b>State</b> makes each stage of an object's life its own class. The object hands its work to its current state, and the state decides what happens and what the next stage is.`},
 {t:`analogy`,h:`A traffic light. Red, green and amber each know what comes next. Nobody writes "if colour is red and timer is zero then...". Each colour handles it.`},
 {t:`p`,h:`<h2>The stage map</h2><p>Draw this first. It is the real design. Each arrow is an allowed move, and any move not drawn is illegal.</p>`},
 {t:`diagram`,cap:`Vending machine stages. Pressing "select" in Idle is not on the map, so it is rejected.`,d:{alt:`State diagram: Idle to HasMoney on insert coin, HasMoney to Dispensing on select item, Dispensing back to Idle when item given`,nodes:[
   {id:`i`,x:20,y:20,w:100,t:`Idle`,k:`state`},
   {id:`h`,x:250,y:20,w:130,t:`HasMoney`,k:`state`},
   {id:`d`,x:135,y:130,w:120,t:`Dispensing`,k:`state`}],
  edges:[{a:`i`,b:`h`,k:`arrow`,l:`insert coin`},{a:`h`,b:`d`,k:`arrow`,l:`select item`},{a:`d`,b:`i`,k:`arrow`,l:`item given`}]}},
 {t:`p`,h:`<h2>The classes</h2>`},
 {t:`diagram`,cap:`The machine holds a State. Each stage is a class that implements it.`,d:{alt:`Class diagram: VendingMachine holds a State interface, implemented by IdleState and HasMoneyState`,nodes:[
   {id:`m`,x:10,y:10,w:170,t:`VendingMachine`,m:[`State state`,`insertCoin()`,`selectItem()`,`setState(s)`]},
   {id:`s`,x:250,y:10,w:160,t:`State`,s:`interface`,m:[`insertCoin()`,`selectItem()`,`dispense()`],k:`iface`},
   {id:`a`,x:170,y:160,w:110,t:`IdleState`,m:[`insertCoin()`,`selectItem()`]},
   {id:`b`,x:290,y:160,w:120,t:`HasMoneyState`,m:[`insertCoin()`,`selectItem()`]}],
  edges:[{a:`m`,b:`s`,k:`has`,l:`holds`},{a:`a`,b:`s`,k:`implements`},{a:`b`,b:`s`,k:`implements`}]}},
 {t:`code`,cap:`Two states in code`,code:`class VendingMachine {\n  private State state = new IdleState();\n  void setState(State s) { this.state = s; }\n  void insertCoin(int amt) { state.insertCoin(this, amt); }\n  void selectItem(String code) { state.selectItem(this, code); }\n}\n\nclass IdleState implements State {\n  public void insertCoin(VendingMachine m, int amt) {\n    m.addMoney(amt);\n    m.setState(new HasMoneyState());      // move to next stage\n  }\n  public void selectItem(VendingMachine m, String code) {\n    throw new IllegalStateException("Insert money first");\n  }\n}\n\nclass HasMoneyState implements State {\n  public void insertCoin(VendingMachine m, int amt) { m.addMoney(amt); }\n  public void selectItem(VendingMachine m, String code) {\n    m.reserve(code);\n    m.setState(new DispensingState());\n  }\n}`},
 {t:`code`,cap:`The missing pieces the demo needs`,code:`interface State {\n  void insertCoin(VendingMachine m, int amt);\n  void selectItem(VendingMachine m, String code);\n}\n\nclass DispensingState implements State {\n  public void insertCoin(VendingMachine m, int amt) {\n    throw new IllegalStateException("Please wait, dispensing");\n  }\n  public void selectItem(VendingMachine m, String code) {\n    throw new IllegalStateException("Already dispensing");\n  }\n}\n\n// Extra methods inside VendingMachine\nvoid addMoney(int amt) { balance += amt; }\nvoid reserve(String code) { selected = code; }\nvoid dispense() {\n  System.out.println("Dispensed " + selected + ", balance " + balance);\n  balance = 0; selected = null;\n  setState(new IdleState());            // back to the start\n}`},
 {t:`code`,use:true,cap:`How it is used`,code:`VendingMachine vm = new VendingMachine();        // starts in IdleState

try {
  vm.selectItem("A1");                           // Idle: not allowed
} catch (IllegalStateException e) {
  System.out.println(e.getMessage());            // Insert money first
}

vm.insertCoin(20);        // Idle -> HasMoney
vm.insertCoin(10);        // stays HasMoney, balance 30
vm.selectItem("A1");      // HasMoney -> Dispensing
vm.dispense();            // prints: Dispensed A1, balance 30  (then back to Idle)
vm.insertCoin(10);        // works again

// Wrapped in a service (one machine object per physical machine):
@Service
class VendingService {
  private final VendingMachine machine = new VendingMachine();

  synchronized String buy(int coin, String code) {   // one customer at a time
    machine.insertCoin(coin);
    machine.selectItem(code);
    machine.dispense();
    return "ok";
  }
}`},
 {t:`two`,a:{h:`Use classes when`,b:`There are many stages, each with different rules, or the stages will grow. Order lifecycle, ATM, ticket, payment.`},b:{h:`Use an enum when`,b:`There are two or three stages with simple rules. An enum with a switch is shorter and clear enough.`}},
 {t:`p`,h:`<h2>State versus Strategy</h2><p>They look identical in a diagram. The difference is who changes the plug. In <b>Strategy</b>, the caller picks the behaviour from outside. In <b>State</b>, the object changes its own behaviour as it moves through stages.</p>`},
 {t:`mistake`,h:`Keeping a <code>status</code> string and checking it in every method. Rules get scattered, and one forgotten check allows an illegal move. State classes put each rule in one place.`},
 {t:`check`,q:`An order can be PLACED, PAID, SHIPPED, DELIVERED or CANCELLED. A customer tries to cancel a DELIVERED order. How does State handle it?`,a:`DeliveredState implements <code>cancel()</code> by rejecting it. There is no arrow from Delivered to Cancelled on the stage map. No if-chain anywhere has to remember this rule.`},
 {t:`remember`,h:`<b>Draw the stage map first.</b> Each stage becomes a class, each arrow becomes a state change inside a method.`}
]},

{id:`lesson-22`,track:`patterns`,trackName:`Design patterns`,title:`Factory: hide which class gets created`,min:14,
 promise:`Three related patterns, from simplest to most advanced, so you can answer "Factory Method versus Abstract Factory" with confidence.`,
 blocks:[
 {t:`plain`,h:`A <b>factory</b> is the one place that decides which class to create. Callers ask for what they need and get an object that follows an interface, without ever writing <code>new</code> on a concrete class.`},
 {t:`analogy`,h:`You order "a cab" in an app. You do not choose the driver or the car. The app creates the right ride for you.`},
 {t:`p`,h:`<h2>1. Simple factory</h2><p>A class or method with a decision inside it. Not an official GoF pattern, but the one you will write most often.</p>`},
 {t:`diagram`,cap:`Callers ask the factory. They only know the Notifier interface.`,d:{alt:`Class diagram: NotifierFactory creates Notifier, implemented by Email, Sms and WhatsApp`,nodes:[
   {id:`f`,x:10,y:20,w:160,t:`NotifierFactory`,m:[`create(type)`]},
   {id:`n`,x:250,y:10,w:160,t:`Notifier`,s:`interface`,m:[`send(message)`],k:`iface`},
   {id:`e`,x:10,y:150,w:120,t:`Email`,m:[`send(message)`]},
   {id:`s`,x:150,y:150,w:120,t:`Sms`,m:[`send(message)`]},
   {id:`w`,x:290,y:150,w:120,t:`WhatsApp`,m:[`send(message)`]}],
  edges:[{a:`f`,b:`n`,k:`arrow`,l:`returns`},{a:`e`,b:`n`,k:`implements`},{a:`s`,b:`n`,k:`implements`},{a:`w`,b:`n`,k:`implements`}]}},
 {t:`code`,cap:`A registry map avoids a giant switch`,code:`class NotifierFactory {\n  private final Map<String, Supplier<Notifier>> registry = Map.of(\n      "EMAIL",    EmailNotifier::new,\n      "SMS",      SmsNotifier::new,\n      "WHATSAPP", WhatsAppNotifier::new);\n\n  Notifier create(String type) {\n    Supplier<Notifier> s = registry.get(type);\n    if (s == null) throw new IllegalArgumentException(type);\n    return s.get();\n  }\n}`},
 {t:`code`,use:true,cap:`How it is used`,code:`NotifierFactory factory = new NotifierFactory();

Notifier n = factory.create("SMS");      // the caller never writes "new SmsNotifier()"
n.send("Your order has shipped");

// In a service, the channel usually comes from the user's settings:
@Service
class AlertService {
  private final NotifierFactory factory;
  AlertService(NotifierFactory factory) { this.factory = factory; }

  void alert(User u, String msg) {
    factory.create(u.preferredChannel()).send(msg);    // "EMAIL", "SMS", ...
  }
}`},
 {t:`p`,h:`<h2>2. Factory method</h2><p>A parent class defines the steps and leaves "which object to create" to a subclass method.</p>`},
 {t:`code`,cap:`Subclass decides the product`,code:`abstract class ReportJob {\n  void run() {\n    Exporter e = createExporter();    // the factory method\n    e.write(buildData());\n  }\n  protected abstract Exporter createExporter();\n}\n\nclass SalesReport extends ReportJob {\n  protected Exporter createExporter() { return new CsvExporter(); }\n}\nclass AuditReport extends ReportJob {\n  protected Exporter createExporter() { return new PdfExporter(); }\n}`},
 {t:`code`,use:true,cap:`How it is used`,code:`ReportJob sales = new SalesReport();
sales.run();       // builds the data, writes a CSV file

ReportJob audit = new AuditReport();
audit.run();       // same steps, writes a PDF instead

// A scheduler only knows ReportJob:
List<ReportJob> nightly = List.of(new SalesReport(), new AuditReport());
nightly.forEach(ReportJob::run);`},
 {t:`p`,h:`<h2>3. Abstract factory</h2><p>A factory that makes a <b>matching family</b> of objects. Use it when the pieces must belong together, such as India payment pieces versus global ones.</p>`},
 {t:`diagram`,cap:`Each factory creates a matching set. You never mix a UPI payment with a USD refund.`,d:{alt:`Class diagram: GatewayFactory interface implemented by IndiaFactory and GlobalFactory, each creating its own payment and refund classes`,nodes:[
   {id:`g`,x:90,y:10,w:240,t:`GatewayFactory`,s:`interface`,m:[`createPayment()`,`createRefund()`],k:`iface`},
   {id:`i`,x:10,y:130,w:190,t:`IndiaFactory`,m:[`createPayment()`,`createRefund()`]},
   {id:`o`,x:220,y:130,w:190,t:`GlobalFactory`,m:[`createPayment()`,`createRefund()`]},
   {id:`p1`,x:10,y:260,w:95,t:`UpiPayment`,m:[`pay()`]},
   {id:`r1`,x:112,y:260,w:90,t:`InrRefund`,m:[`refund()`]},
   {id:`p2`,x:220,y:260,w:100,t:`CardPayment`,m:[`pay()`]},
   {id:`r2`,x:328,y:260,w:82,t:`UsdRefund`,m:[`refund()`]}],
  edges:[{a:`i`,b:`g`,k:`implements`},{a:`o`,b:`g`,k:`implements`},{a:`i`,b:`p1`,k:`uses`},{a:`i`,b:`r1`,k:`uses`},{a:`o`,b:`p2`,k:`uses`},{a:`o`,b:`r2`,k:`uses`}]}},
 {t:`cards`,items:[
   {h:`Simple factory`,b:`One method with a decision. Most common. Easy to explain.`},
   {h:`Factory method`,b:`A subclass decides what to create. Used inside frameworks and base classes.`},
   {h:`Abstract factory`,b:`A factory of factories for matching families. Rare, and mostly asked as a comparison.`},
   {h:`In Java and Spring`,b:`<code>Calendar.getInstance()</code> and <code>List.of()</code> are static factories. Spring's <code>BeanFactory</code> and <code>ApplicationContext</code> create your beans.`}]},
 {t:`mistake`,h:`A factory with a long switch that must be edited for every new type. Use a registry map, or let Spring inject all implementations, so a new type needs no edit to the factory.`},
 {t:`check`,q:`Interviewer: "Factory Method versus Abstract Factory?" Give the one-line answer.`,a:`Factory Method creates <b>one</b> product and lets a subclass choose which. Abstract Factory creates a <b>family</b> of related products so they always match.`},
 {t:`remember`,h:`<b>Callers ask for what they need, and the factory decides which class.</b>`}
]},

{id:`lesson-23`,track:`patterns`,trackName:`Design patterns`,title:`Singleton: exactly one`,min:12,
 promise:`The easiest pattern to explain and the one with the most follow-up questions: thread safety, serialization, testing and clusters.`,
 blocks:[
 {t:`plain`,h:`<b>Singleton</b> guarantees one instance of a class and gives everyone a way to reach it. It suits things that must be shared and single: configuration, a connection pool, a logger.`},
 {t:`diagram`,cap:`Every caller gets the same object. The constructor is private so nobody can create another.`,d:{alt:`Three services all call getInstance on one Config class`,nodes:[
   {id:`a`,x:10,y:10,w:110,t:`ServiceA`,k:`state`},
   {id:`b`,x:155,y:10,w:110,t:`ServiceB`,k:`state`},
   {id:`c`,x:300,y:10,w:110,t:`ServiceC`,k:`state`},
   {id:`g`,x:60,y:120,w:300,t:`Config`,m:[`- static Config INSTANCE`,`- Config()   // private`,`+ static getInstance()`]}],
  edges:[{a:`a`,b:`g`,k:`arrow`},{a:`b`,b:`g`,k:`arrow`,l:`getInstance()`},{a:`c`,b:`g`,k:`arrow`}]}},
 {t:`p`,h:`<h2>Four ways to write it</h2>`},
 {t:`steps`,items:[
   [`Eager`,`Create it when the class loads: <code>private static final Config INSTANCE = new Config();</code>. Simple and thread-safe. The drawback is it is created even if never used.`],
   [`Holder class (lazy, recommended)`,`A private inner class holds the instance. It loads only on first use, and the JVM guarantees safe class loading. No locks needed.`],
   [`Enum`,`<code>enum Config { INSTANCE; }</code>. Safe against threads, reflection and serialization. Often called the best Java answer.`],
   [`Double-checked locking`,`Check, lock, check again. The field must be <code>volatile</code>, or another thread may see a half-built object. More code, so use only if asked.`]]},
 {t:`code`,cap:`Holder and double-checked locking`,code:`// Holder: lazy and thread-safe\nclass Config {\n  private Config() {}\n  private static class Holder {\n    static final Config INSTANCE = new Config();\n  }\n  static Config getInstance() { return Holder.INSTANCE; }\n}\n\n// Double-checked locking\nclass Registry {\n  private static volatile Registry instance;   // volatile matters\n  private Registry() {}\n  static Registry getInstance() {\n    if (instance == null) {                    // 1st check, no lock\n      synchronized (Registry.class) {\n        if (instance == null) {                // 2nd check, with lock\n          instance = new Registry();\n        }\n      }\n    }\n    return instance;\n  }\n}`},
 {t:`code`,use:true,cap:`How it is used`,code:`Config a = Config.getInstance();
Config b = Config.getInstance();
System.out.println(a == b);                   // true: the very same object

// Typical use: read a shared setting from anywhere (assuming Config has get(key))
String url = Config.getInstance().get("db.url");

// Preferred in Spring: the container keeps one instance and injects it
@Service
class ReportService {
  private final Config config;
  ReportService(Config config) { this.config = config; }   // easy to fake in a test
}`},
 {t:`p`,h:`<h2>Why people criticise it</h2>`},
 {t:`steps`,items:[
   [`Hidden global state`,`Any code can reach it, so dependencies are invisible.`],
   [`Hard to test`,`You cannot easily replace it with a fake in a unit test.`],
   [`Per JVM only`,`With three servers there are three singletons. If you truly need one across a cluster, you need a distributed lock or leader election (for example Redis or ZooKeeper), and that is a different problem.`]]},
 {t:`remember`,h:`<b>Spring singleton scope is not the Singleton pattern.</b> It means one instance per application context, created by the container, and your class stays an ordinary class with a public constructor. It gets you the benefit without the hidden global.`},
 {t:`check`,q:`Why must the field in double-checked locking be <code>volatile</code>?`,a:`Creating an object takes several steps, and without volatile the JVM may let another thread see the reference before the object is fully built. Volatile forbids that reordering, so no thread sees a half-built object.`}
]},

{id:`lesson-24`,track:`patterns`,trackName:`Design patterns`,title:`Builder and Prototype`,min:11,
 promise:`Two creational patterns. Builder is asked far more often, and it solves a problem you have certainly met: constructors with too many parameters.`,
 blocks:[
 {t:`plain`,h:`<b>Builder</b> builds a complex object step by step, with named steps, and produces it at the end. <b>Prototype</b> creates a new object by copying an existing one.`},
 {t:`p`,h:`<h2>The problem Builder solves</h2><p>This is called the telescoping constructor problem. Which argument is which?</p>`},
 {t:`code`,bad:true,cap:`Hard to read, easy to get the order wrong`,code:`new Order("U42", "PUNE-411001", null, true, 2, "DIWALI10", false);`},
 {t:`diagram`,cap:`The client chains named steps on the builder, then build() makes the order.`,d:{alt:`Client uses OrderBuilder which creates Order`,nodes:[
   {id:`c`,x:160,y:10,w:100,t:`Client`,k:`state`},
   {id:`b`,x:10,y:100,w:160,t:`OrderBuilder`,m:[`item(x)`,`coupon(c)`,`address(a)`,`build()`]},
   {id:`o`,x:280,y:100,w:130,t:`Order`,m:[`items`,`coupon`,`address`]}],
  edges:[{a:`c`,b:`b`,k:`uses`,l:`chains calls`},{a:`b`,b:`o`,k:`arrow`,l:`creates`}]}},
 {t:`code`,good:true,cap:`Readable and validated`,code:`Order order = Order.builder()\n    .userId("U42")\n    .address("PUNE-411001")\n    .item("book", 2)\n    .coupon("DIWALI10")\n    .build();\n\nclass Order {\n  private final String userId, address, coupon;\n  private final Map<String, Integer> items;\n\n  private Order(Builder b) {                // only the builder can call\n    this.userId = b.userId; this.address = b.address;\n    this.coupon = b.coupon; this.items = Map.copyOf(b.items);\n  }\n\n  static Builder builder() { return new Builder(); }\n\n  static class Builder {\n    private String userId, address, coupon;\n    private final Map<String, Integer> items = new HashMap<>();\n\n    Builder userId(String v)  { userId = v;  return this; }\n    Builder address(String v) { address = v; return this; }\n    Builder coupon(String v)  { coupon = v;  return this; }\n    Builder item(String n, int q) { items.put(n, q); return this; }\n\n    Order build() {\n      if (userId == null || items.isEmpty())\n        throw new IllegalStateException("userId and items required");\n      return new Order(this);\n    }\n  }\n}`},
 {t:`code`,use:true,cap:`How it is used in a controller`,code:`@PostMapping("/orders")
ResponseEntity<Order> create(@RequestBody OrderRequest r) {
  Order order = Order.builder()
      .userId(r.userId())
      .address(r.address())
      .coupon(r.coupon())            // optional: may be null
      .item(r.sku(), r.qty())
      .build();                      // throws if userId or items are missing

  return ResponseEntity.ok(orderService.save(order));
}`},
 {t:`cards`,items:[
   {h:`Why it is good`,b:`Named steps read clearly, optional fields are easy, the finished object can be immutable, and validation happens in one place (<code>build()</code>).`},
   {h:`In real code`,b:`Lombok's <code>@Builder</code> writes this for you. Spring's <code>UriComponentsBuilder</code> and <code>StringBuilder</code> follow the idea too.`},
   {h:`Cost`,b:`Extra code for the builder class. Not worth it for an object with two or three fields.`}]},
 {t:`p`,h:`<h2>Prototype in a minute</h2><p>If creating an object is expensive (loading data, heavy setup), copy an existing one and change what differs. In Java the usual advice is a <b>copy constructor</b> instead of <code>Cloneable</code>, which is awkward and easy to misuse.</p>`},
 {t:`two`,a:{h:`Shallow copy`,b:`Copies the references. The original and the copy share the same inner objects, so changing one changes the other.`},b:{h:`Deep copy`,b:`Copies the inner objects too. The two are fully independent. Slower, and what you usually want.`}},
 {t:`check`,q:`When would you NOT use a builder?`,a:`When the class has only a few fields and no optional ones. A plain constructor or a Java <code>record</code> is simpler and clearer.`},
 {t:`remember`,h:`<b>Builder: many fields, many optional, readable steps, validated at the end.</b>`}
]},

{id:`lesson-25`,track:`patterns`,trackName:`Design patterns`,title:`Decorator and Proxy`,min:15,
 promise:`Both wrap another object, which is why interviewers love asking how they differ. The answer is about intent.`,
 blocks:[
 {t:`plain`,h:`<b>Decorator</b> wraps an object to <b>add features</b>. <b>Proxy</b> wraps an object to <b>control access</b> to it. Both wrappers share the same interface as the thing they wrap, so callers cannot tell the difference.`},
 {t:`p`,h:`<h2>Decorator: stack features</h2>`},
 {t:`analogy`,h:`Ordering a coffee. Espresso is the base. Add milk, then syrup. Each add-on wraps the previous drink and adds to the price and description. You can stack them in any order and any number.`},
 {t:`diagram`,cap:`Each decorator is a Coffee that holds another Coffee.`,d:{alt:`Class diagram: Coffee interface implemented by Espresso, MilkDecorator and SyrupDecorator, which wrap another Coffee`,nodes:[
   {id:`c`,x:130,y:10,w:160,t:`Coffee`,s:`interface`,m:[`cost()`],k:`iface`},
   {id:`e`,x:10,y:140,w:110,t:`Espresso`,m:[`cost()`]},
   {id:`m`,x:140,y:140,w:130,t:`MilkDecorator`,m:[`Coffee inner`,`cost()`]},
   {id:`s`,x:285,y:140,w:130,t:`SyrupDecorator`,m:[`Coffee inner`,`cost()`]},
   {id:`n`,x:80,y:250,w:260,k:`note`,m:[`cost() = inner.cost() + extra`]}],
  edges:[{a:`e`,b:`c`,k:`implements`},{a:`m`,b:`c`,k:`implements`},{a:`s`,b:`c`,k:`implements`}]}},
 {t:`code`,cap:`Stacking decorators`,code:`interface Coffee { double cost(); }\n\nclass Espresso implements Coffee {\n  public double cost() { return 120; }\n}\n\nclass MilkDecorator implements Coffee {\n  private final Coffee inner;\n  MilkDecorator(Coffee inner) { this.inner = inner; }\n  public double cost() { return inner.cost() + 20; }\n}\n\nclass SyrupDecorator implements Coffee {\n  private final Coffee inner;\n  SyrupDecorator(Coffee inner) { this.inner = inner; }\n  public double cost() { return inner.cost() + 15; }\n}\n\nCoffee order = new SyrupDecorator(new MilkDecorator(new Espresso()));\norder.cost();   // 155`},
 {t:`code`,use:true,cap:`How it is used`,code:`Coffee plain   = new Espresso();
Coffee latte   = new MilkDecorator(new Espresso());
Coffee special = new SyrupDecorator(new MilkDecorator(new Espresso()));

System.out.println(plain.cost());      // 120.0
System.out.println(latte.cost());      // 140.0
System.out.println(special.cost());    // 155.0

// Stacking at run time from what the customer ordered:
Coffee build(List<String> addOns) {
  Coffee c = new Espresso();
  for (String a : addOns) {
    if (a.equals("milk"))  c = new MilkDecorator(c);
    if (a.equals("syrup")) c = new SyrupDecorator(c);
  }
  return c;
}
build(List.of("milk", "syrup", "milk")).cost();    // 120 + 20 + 15 + 20 = 175.0`},
 {t:`p`,h:`<b>You already use it:</b> <code>new BufferedReader(new InputStreamReader(new FileInputStream(f)))</code> stacks features onto a stream, and <code>Collections.unmodifiableList(list)</code> wraps a list.`},
 {t:`p`,h:`<h2>Proxy: control access</h2>`},
 {t:`analogy`,h:`A receptionist. You do not walk into the manager's room. The receptionist checks your appointment first, then lets you through, and may just answer a simple question without bothering the manager.`},
 {t:`diagram`,cap:`The proxy looks like the service, does its checks, then delegates to the real one.`,d:{alt:`Class diagram: Client uses Service interface, implemented by RealService and ServiceProxy, which delegates to RealService`,nodes:[
   {id:`c`,x:10,y:10,w:100,t:`Client`,k:`state`},
   {id:`s`,x:170,y:10,w:150,t:`Service`,s:`interface`,m:[`request()`],k:`iface`},
   {id:`r`,x:10,y:140,w:125,t:`RealService`,m:[`request()`]},
   {id:`p`,x:250,y:140,w:160,t:`ServiceProxy`,m:[`check access / cache`,`request()`]}],
  edges:[{a:`c`,b:`s`,k:`uses`},{a:`r`,b:`s`,k:`implements`},{a:`p`,b:`s`,k:`implements`},{a:`p`,b:`r`,k:`arrow`,l:`delegates`}]}},
 {t:`cards`,items:[
   {h:`Virtual proxy`,b:`Creates the heavy object only when first needed (lazy loading, such as a big image).`},
   {h:`Protection proxy`,b:`Checks permissions before allowing the call.`},
   {h:`Caching proxy`,b:`Returns a saved answer for repeated calls.`},
   {h:`Remote proxy`,b:`Stands in for an object in another machine, so a network call looks like a local one.`}]},
 {t:`code`,cap:`A caching proxy in code`,code:`interface PriceService { double priceOf(String sku); }\n\nclass RealPriceService implements PriceService {\n  public double priceOf(String sku) { /* slow database call */ return 499.0; }\n}\n\nclass CachingPriceProxy implements PriceService {\n  private final PriceService real;\n  private final Map<String, Double> cache = new ConcurrentHashMap<>();\n  CachingPriceProxy(PriceService real) { this.real = real; }\n\n  public double priceOf(String sku) {\n    return cache.computeIfAbsent(sku, real::priceOf);   // real is called only on a miss\n  }\n}`},
 {t:`code`,use:true,cap:`How it is used`,code:`PriceService prices = new CachingPriceProxy(new RealPriceService());\n\nprices.priceOf("SKU-1");    // slow: goes to the real service\nprices.priceOf("SKU-1");    // fast: answered from the proxy's cache\n\n// The caller cannot tell the difference:\n@Service\nclass CartService {\n  private final PriceService prices;          // the proxy or the real one\n  CartService(PriceService prices) { this.prices = prices; }\n\n  double total(List<String> skus) {\n    return skus.stream().mapToDouble(prices::priceOf).sum();\n  }\n}`},
 {t:`p`,h:`<h2>Proxy in Spring, and the gotcha</h2><p><code>@Transactional</code>, <code>@Cacheable</code> and <code>@Async</code> work through proxies. Spring wraps your bean in a proxy that starts the transaction, calls your method, then commits or rolls back. It uses a JDK dynamic proxy when the bean has an interface, otherwise a CGLIB subclass proxy.</p>`},
 {t:`mistake`,h:`<b>Self-invocation.</b> If one method in a class calls another method of the same class, the call goes straight to <code>this</code> and skips the proxy. So <code>@Transactional</code> on the second method does nothing. Move the method to another bean, or inject the bean into itself. This is a very common Spring interview question.`},
 {t:`two`,a:{h:`Decorator`,b:`<b>Intent:</b> add behaviour. Usually the client builds the stack of wrappers itself. You can stack many.`},b:{h:`Proxy`,b:`<b>Intent:</b> control access. Usually one proxy, often created for you (by a framework). The client thinks it holds the real thing.`}},
 {t:`check`,q:`A class wraps a service and logs how long each call takes. Decorator or Proxy?`,a:`It adds behaviour (timing) without controlling access, so Decorator is the honest answer. Many people call it a proxy, because in Spring that is the mechanism (an AOP proxy). Say which you mean: "the intent is a decorator, and Spring implements it with a proxy".`},
 {t:`remember`,h:`<b>Decorator adds. Proxy guards.</b> Same shape, different purpose.`}
]},
