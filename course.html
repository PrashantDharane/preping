{id:`lesson-26`,track:`patterns`,trackName:`Design patterns`,title:`Adapter and Facade (and Bridge)`,min:14,
 promise:`Three structural patterns that are easy to confuse. Each one answers a different question.`,
 blocks:[
 {t:`plain`,h:`<b>Adapter</b> makes an existing class fit an interface you expect. <b>Facade</b> gives one simple door to a messy set of classes. <b>Bridge</b> keeps two things that vary independently from tangling together.`},
 {t:`p`,h:`<h2>Adapter: fix the plug</h2>`},
 {t:`analogy`,h:`A travel adapter. Your charger has a two-pin plug and the wall has a three-pin socket. You do not rebuild either one. The adapter sits between them.`},
 {t:`diagram`,cap:`Your code only knows PaymentGateway. The adapter translates calls to the old bank API.`,d:{alt:`Client uses PaymentGateway interface, implemented by LegacyBankAdapter, which calls LegacyBank`,nodes:[
   {id:`c`,x:10,y:10,w:100,t:`Client`,k:`state`},
   {id:`t`,x:160,y:10,w:250,t:`PaymentGateway`,s:`interface`,m:[`pay(rupees)`],k:`iface`},
   {id:`a`,x:160,y:120,w:250,t:`LegacyBankAdapter`,m:[`pay(rupees)`,`// converts rupees to paise`]},
   {id:`l`,x:160,y:230,w:250,t:`LegacyBank`,m:[`makeTxn(paise, id)`]}],
  edges:[{a:`c`,b:`t`,k:`uses`},{a:`a`,b:`t`,k:`implements`},{a:`a`,b:`l`,k:`arrow`,l:`calls`}]}},
 {t:`code`,cap:`The adapter in Java`,code:`interface PaymentGateway { void pay(double rupees); }\n\n// Old class we cannot change\nclass LegacyBank {\n  void makeTxn(long paise, String id) { /* ... */ }\n}\n\nclass LegacyBankAdapter implements PaymentGateway {\n  private final LegacyBank bank;\n  LegacyBankAdapter(LegacyBank bank) { this.bank = bank; }\n\n  public void pay(double rupees) {\n    long paise = Math.round(rupees * 100);\n    bank.makeTxn(paise, UUID.randomUUID().toString());\n  }\n}`},
 {t:`code`,use:true,cap:`How it is used`,code:`PaymentGateway gateway = new LegacyBankAdapter(new LegacyBank());
gateway.pay(499.50);       // adapter turns it into 49950 paise and calls makeTxn(...)

// The rest of the app only ever sees PaymentGateway:
@Service
class CheckoutService {
  private final PaymentGateway gateway;
  CheckoutService(PaymentGateway gateway) { this.gateway = gateway; }

  void checkout(Order o) { gateway.pay(o.totalRupees()); }
}
// Replace the old bank later? Write NewBankAdapter. CheckoutService is untouched.`},
 {t:`p`,h:`<b>Where you see it:</b> wrapping third-party SDKs so the rest of your code does not depend on them, and Spring MVC's <code>HandlerAdapter</code>, which lets the dispatcher call different kinds of controllers the same way.`},
 {t:`p`,h:`<h2>Facade: one simple door</h2>`},
 {t:`analogy`,h:`A hotel front desk. To get a cab, laundry and a late checkout you could phone three departments. Or you ask the desk, and it handles the rest.`},
 {t:`diagram`,cap:`The client calls one method. The facade calls the four subsystems in the right order.`,d:{alt:`Client calls CheckoutFacade, which calls Inventory, Payment, Shipping and Tax`,nodes:[
   {id:`c`,x:5,y:100,w:85,t:`Client`,k:`state`},
   {id:`f`,x:115,y:84,w:140,t:`CheckoutFacade`,m:[`placeOrder()`]},
   {id:`i`,x:300,y:10,w:110,t:`Inventory`,m:[`reserve()`]},
   {id:`p`,x:300,y:72,w:110,t:`Payment`,m:[`charge()`]},
   {id:`s`,x:300,y:134,w:110,t:`Shipping`,m:[`schedule()`]},
   {id:`t`,x:300,y:196,w:110,t:`Tax`,m:[`calculate()`]}],
  edges:[{a:`c`,b:`f`,k:`arrow`},{a:`f`,b:`i`,k:`arrow`},{a:`f`,b:`p`,k:`arrow`},{a:`f`,b:`s`,k:`arrow`},{a:`f`,b:`t`,k:`arrow`}]}},
 {t:`code`,cap:`A facade`,code:`class CheckoutFacade {\n  private final Inventory inventory;\n  private final Payment payment;\n  private final Shipping shipping;\n  private final Tax tax;\n  // constructor omitted\n\n  Receipt placeOrder(Cart cart, Card card) {\n    inventory.reserve(cart);\n    double total = cart.total() + tax.calculate(cart);\n    payment.charge(card, total);\n    shipping.schedule(cart);\n    return new Receipt(cart, total);\n  }\n}`},
 {t:`code`,use:true,cap:`How it is used`,code:`@RestController
class OrderController {
  private final CheckoutFacade checkout;
  OrderController(CheckoutFacade checkout) { this.checkout = checkout; }

  @PostMapping("/checkout")
  Receipt place(@RequestBody CheckoutRequest r) {
    return checkout.placeOrder(r.cart(), r.card());   // ONE call
  }
}
// The controller knows nothing about inventory, tax, payment or shipping.`},
 {t:`p`,h:`<b>Where you see it:</b> a Spring <code>@Service</code> that coordinates several repositories and clients. Watch the size: if the facade grows into a giant class doing everything, split it.`},
 {t:`p`,h:`<h2>Bridge in one paragraph</h2><p>Suppose notifications come in kinds (alert, reminder) and channels (email, SMS). Subclassing every combination gives AlertEmail, AlertSms, ReminderEmail, ReminderSms, and it explodes. Bridge keeps <b>two separate hierarchies</b>: a Notification that <i>has</i> a Channel. Add a channel and nothing else changes.</p>`},
 {t:`two`,a:{h:`Adapter`,b:`Made <b>after</b> the fact to fix a mismatch between two existing things. Changes the shape of one interface.`},b:{h:`Bridge`,b:`Planned <b>up front</b> to let two dimensions vary on their own. Design, not repair.`}},
 {t:`check`,q:`Adapter versus Facade in one sentence each.`,a:`Adapter changes one interface into another that the client expects. Facade does not convert anything. It hides many classes behind a simpler interface.`},
 {t:`remember`,h:`<b>Adapter: wrong shape, make it fit. Facade: too many parts, give one door. Bridge: two kinds of variation, keep them apart.</b>`}
]},

{id:`lesson-27`,track:`patterns`,trackName:`Design patterns`,title:`Command, Template Method and Chain of Responsibility`,min:16,
 promise:`Three behavioural patterns that appear in framework code you already use. Each has a diagram and a plain example.`,
 blocks:[
 {t:`p`,h:`<h2>Command: turn an action into an object</h2>`},
 {t:`plain`,h:`<b>Command</b> wraps a request as an object with <code>execute()</code> (and often <code>undo()</code>). Because an action is now an object, you can store it, queue it, log it, repeat it or reverse it.`},
 {t:`analogy`,h:`A restaurant order slip. The waiter writes the request on paper and hands it to the kitchen. The slip can wait, be queued, or be cancelled. The waiter does not cook.`},
 {t:`diagram`,cap:`The editor keeps commands. Each command knows its receiver and how to undo itself.`,d:{alt:`Editor holds Command interface, implemented by InsertText and DeleteText, which both call Document`,nodes:[
   {id:`e`,x:10,y:10,w:140,t:`Editor`,m:[`Command cmd`,`run()`,`undo()`]},
   {id:`c`,x:230,y:10,w:180,t:`Command`,s:`interface`,m:[`execute()`,`undo()`],k:`iface`},
   {id:`i`,x:150,y:150,w:120,t:`InsertText`,m:[`execute()`,`undo()`]},
   {id:`d`,x:290,y:150,w:120,t:`DeleteText`,m:[`execute()`,`undo()`]},
   {id:`r`,x:170,y:270,w:140,t:`Document`,m:[`insert()`,`delete()`]}],
  edges:[{a:`e`,b:`c`,k:`has`,l:`holds`},{a:`i`,b:`c`,k:`implements`},{a:`d`,b:`c`,k:`implements`},{a:`i`,b:`r`,k:`arrow`},{a:`d`,b:`r`,k:`arrow`}]}},
 {t:`code`,cap:`Undo with a stack of commands`,code:`interface Command { void execute(); void undo(); }\n\nclass InsertText implements Command {\n  private final Document doc; private final String text; private int pos;\n  InsertText(Document doc, String text) { this.doc = doc; this.text = text; }\n  public void execute() { pos = doc.length(); doc.insert(pos, text); }\n  public void undo()    { doc.delete(pos, text.length()); }\n}\n\nclass Editor {\n  private final Deque<Command> history = new ArrayDeque<>();\n  void run(Command c) { c.execute(); history.push(c); }\n  void undo() { if (!history.isEmpty()) history.pop().undo(); }\n}`},
 {t:`code`,use:true,cap:`How it is used`,code:`Document doc = new Document();
Editor editor = new Editor();

editor.run(new InsertText(doc, "Hello"));
editor.run(new InsertText(doc, " World"));
System.out.println(doc.text());       // Hello World

editor.undo();
System.out.println(doc.text());       // Hello
editor.undo();
System.out.println(doc.text());       // (empty)`},
 {t:`p`,h:`<b>Where you see it:</b> undo and redo, job queues, scheduled tasks (a <code>Runnable</code> is a command), and event sourcing (a log of commands).`},
 {t:`p`,h:`<h2>Template Method: fixed steps, flexible parts</h2>`},
 {t:`plain`,h:`<b>Template Method</b> defines the steps of an algorithm in a parent class, and lets subclasses fill in some of the steps. The order is fixed. Only the details change.`},
 {t:`analogy`,h:`A recipe card for any curry: heat oil, add masala, add the main ingredient, simmer, serve. Chicken, paneer and dal fill in the main ingredient step. The method stays the same.`},
 {t:`diagram`,cap:`export() is final. Subclasses supply read() and write().`,d:{alt:`DataExporter abstract class with final export method, extended by CsvExporter and JsonExporter`,nodes:[
   {id:`t`,x:80,y:10,w:260,t:`DataExporter`,s:`abstract class`,m:[`final export()  // template`,`abstract read()`,`abstract write()`],k:`iface`},
   {id:`c`,x:30,y:150,w:160,t:`CsvExporter`,m:[`read()`,`write()`]},
   {id:`j`,x:230,y:150,w:160,t:`JsonExporter`,m:[`read()`,`write()`]}],
  edges:[{a:`c`,b:`t`,k:`extends`},{a:`j`,b:`t`,k:`extends`}]}},
 {t:`code`,cap:`The template`,code:`abstract class DataExporter {\n  public final void export() {      // final: order cannot be changed\n    List<Row> rows = read();\n    validate(rows);                 // shared step\n    write(rows);\n  }\n  protected abstract List<Row> read();\n  protected abstract void write(List<Row> rows);\n  private void validate(List<Row> rows) { /* same for all */ }\n}`},
 {t:`code`,use:true,cap:`How it is used`,code:`DataExporter csv = new CsvExporter();
csv.export();      // read() -> validate() -> write(): rows go to a CSV file

DataExporter json = new JsonExporter();
json.export();     // same order of steps, JSON output

// A service picks the exporter and always calls the same method:
@Service
class ExportService {
  void run(String format) {
    DataExporter e = format.equals("csv") ? new CsvExporter() : new JsonExporter();
    e.export();
  }
}`},
 {t:`p`,h:`<b>Where you see it:</b> Spring's <code>JdbcTemplate</code> and <code>TransactionTemplate</code> do the boring steps (open connection, close, handle errors) and call your code for the interesting part. The idea is called the <b>Hollywood principle</b>: "do not call us, we will call you". The framework calls your code.`},
 {t:`p`,h:`<h2>Chain of Responsibility: pass it along</h2>`},
 {t:`plain`,h:`<b>Chain of Responsibility</b> passes a request through a line of handlers. Each one either handles it, stops it, or passes it to the next.`},
 {t:`analogy`,h:`Escalating a problem. Support agent, then team lead, then manager. Each resolves it or passes it up. The customer does not need to know who will answer.`},
 {t:`diagram`,cap:`A request passes each check in order. Any filter can stop it early.`,d:{alt:`Request flows through AuthFilter, RateLimitFilter, ValidationFilter and then Controller, with rejection notes`,nodes:[
   {id:`a`,x:90,y:10,w:200,t:`AuthFilter`,m:[`valid token?`]},
   {id:`r`,x:90,y:90,w:200,t:`RateLimitFilter`,m:[`under limit?`]},
   {id:`v`,x:90,y:170,w:200,t:`ValidationFilter`,m:[`body valid?`]},
   {id:`c`,x:90,y:250,w:200,t:`Controller`,m:[`handles request`]},
   {id:`n1`,x:325,y:22,w:85,k:`note`,m:[`stop: 401`]},
   {id:`n2`,x:325,y:102,w:85,k:`note`,m:[`stop: 429`]},
   {id:`n3`,x:325,y:182,w:85,k:`note`,m:[`stop: 400`]}],
  edges:[{a:`a`,b:`r`,k:`arrow`,l:`next`},{a:`r`,b:`v`,k:`arrow`,l:`next`},{a:`v`,b:`c`,k:`arrow`,l:`next`},{a:`a`,b:`n1`,k:`uses`},{a:`r`,b:`n2`,k:`uses`},{a:`v`,b:`n3`,k:`uses`}]}},
 {t:`code`,cap:`A handler chain`,code:`abstract class Handler {\n  private Handler next;\n  Handler then(Handler n) { this.next = n; return n; }\n\n  final void handle(Request r) {\n    if (!check(r)) return;          // reject: stop the chain\n    if (next != null) next.handle(r);\n  }\n  protected abstract boolean check(Request r);\n}\n\nHandler chain = new AuthHandler();\nchain.then(new RateLimitHandler()).then(new ValidationHandler());\nchain.handle(request);`},
 {t:`code`,use:true,cap:`What one handler looks like`,code:`// One handler written out: each filter is a small class like this
class AuthHandler extends Handler {
  protected boolean check(Request r) {
    if (r.token() == null) {
      r.respond(401);       // reject here
      return false;         // stop the chain
    }
    return true;            // pass to the next handler
  }
}
// A request with no token gets 401, and RateLimit and Validation never run.
// A valid request passes Auth, RateLimit and Validation, then reaches the Controller.`},
 {t:`p`,h:`<b>Where you see it:</b> servlet filters, the Spring Security filter chain, and Spring MVC interceptors. Logging frameworks also use it to filter messages by level.`},
 {t:`mistake`,h:`Forgetting what happens when nobody handles the request. Decide: is it an error, or is passing through fine? Say it out loud in the interview.`},
 {t:`check`,q:`Which of these three fits: "a pipeline of validation steps where each step can reject"?`,a:`Chain of Responsibility. Each validator checks, and either rejects (stops) or passes to the next. A new rule is a new handler added to the chain.`}
]},

{id:`lesson-28`,track:`patterns`,trackName:`Design patterns`,title:`Also asked: Composite, Iterator, Flyweight and more`,min:14,
 promise:`The patterns that come up less often. Composite is on the main list, and the rest are short enough to learn in one sitting.`,
 blocks:[
 {t:`p`,h:`<h2>Composite: treat one and many the same</h2>`},
 {t:`plain`,h:`<b>Composite</b> lets you treat a single object and a group of objects through the same interface. It builds tree structures where leaves and branches look alike to the caller.`},
 {t:`analogy`,h:`Folders and files. Asking "how big is it?" works on a file, and also on a folder, which just adds up everything inside, including other folders.`},
 {t:`diagram`,cap:`A Folder is a FileItem and also holds many FileItems, so folders can nest.`,d:{alt:`FileItem interface implemented by File and Folder, and Folder holds many FileItems`,nodes:[
   {id:`i`,x:130,y:10,w:160,t:`FileItem`,s:`interface`,m:[`size()`],k:`iface`},
   {id:`f`,x:10,y:150,w:110,t:`File`,m:[`size()`]},
   {id:`d`,x:190,y:150,w:200,t:`Folder`,m:[`List<FileItem> children`,`size()`]},
   {id:`n`,x:40,y:255,w:340,k:`note`,m:[`a Folder holds 0..* FileItems, files or other folders`]}],
  edges:[{a:`f`,b:`i`,k:`implements`},{a:`d`,b:`i`,k:`implements`}]}},
 {t:`code`,cap:`Recursive size`,code:`interface FileItem { long size(); }\n\nclass File implements FileItem {\n  private final long bytes;\n  File(long bytes) { this.bytes = bytes; }\n  public long size() { return bytes; }\n}\n\nclass Folder implements FileItem {\n  private final List<FileItem> children = new ArrayList<>();\n  void add(FileItem f) { children.add(f); }\n  public long size() {\n    long total = 0;\n    for (FileItem c : children) total += c.size();   // works for files and folders\n    return total;\n  }\n}`},
 {t:`code`,use:true,cap:`How it is used`,code:`Folder root   = new Folder();
Folder photos = new Folder();

photos.add(new File(2_000_000));
photos.add(new File(3_000_000));
root.add(photos);                     // a folder inside a folder
root.add(new File(500_000));

System.out.println(root.size());      // 5500000
// The caller never checks "is this a file or a folder?"`},
 {t:`p`,h:`<b>Used in:</b> file systems, menus with submenus, organisation charts, and UI component trees.`},
 {t:`p`,h:`<h2>Quick cards for the rest</h2>`},
 {t:`cards`,items:[
   {h:`Iterator`,pic:`Walk a collection without knowing its insides`,b:`Java's <code>Iterable</code> and the for-each loop. Fail-fast iterators throw <code>ConcurrentModificationException</code> if the list changes while you walk it.`},
   {h:`Flyweight`,pic:`Share common data to save memory`,b:`Many objects share the same unchanging part. Java's String pool and the Integer cache (-128 to 127) are examples. Intrinsic state is shared. Extrinsic state is passed in.`},
   {h:`Mediator`,pic:`A hub so objects do not talk to each other`,b:`A chat room: users send messages to the room, and the room delivers them. This replaces many direct links with one central coordinator.`},
   {h:`Memento`,pic:`Save a snapshot to restore later`,b:`Editor undo by saving the state. The object that holds snapshots (the caretaker) never looks inside them.`},
   {h:`Visitor`,pic:`Add operations without changing classes`,b:`Used for walking trees such as syntax trees. Needs double dispatch. In modern Java, sealed types and pattern matching in <code>switch</code> often replace it.`},
   {h:`Null Object`,pic:`A do-nothing object instead of null`,b:`A <code>NoDiscount</code> object whose discount is zero means no null checks. <code>Optional</code> serves a similar goal.`},
   {h:`Object Pool`,pic:`Reuse expensive objects`,b:`Connection pools such as HikariCP, and thread pools. Borrow, use, return.`},
   {h:`Prototype`,pic:`Copy instead of build`,b:`Covered in lesson 24.`}]},
 {t:`remember`,h:`If asked about a pattern you do not remember, do not bluff. Say what problem you would expect it to solve, then reason from the problem. That earns more credit than a wrong recollection.`},
 {t:`check`,q:`Why does a connection pool exist?`,a:`Opening a database connection is slow and expensive. A pool keeps a set of open connections that threads borrow and return. It is the Object Pool pattern.`}
]},

{id:`lesson-29`,track:`patterns`,trackName:`Design patterns`,title:`The patterns hiding inside Spring and Java`,min:12,
 promise:`You have used most of these patterns for years without naming them. Naming them is a very common Java and Spring interview question.`,
 blocks:[
 {t:`plain`,h:`"Which design patterns does Spring use?" is a favourite question for experienced Java developers. A good answer gives <b>the pattern, the Spring feature, and what it does</b>, in one line each.`},
 {t:`p`,h:`<h2>How @Transactional actually works</h2>`},
 {t:`diagram`,cap:`The controller thinks it calls OrderService. It really calls a proxy that wraps the call in a transaction.`,d:{alt:`Controller calls a transaction proxy, which begins a transaction and delegates to OrderService`,nodes:[
   {id:`c`,x:150,y:10,w:120,t:`Controller`,k:`state`},
   {id:`p`,x:110,y:90,w:200,t:`TxProxy`,m:[`begin tx`,`commit / rollback`]},
   {id:`s`,x:110,y:210,w:200,t:`OrderService`,m:[`placeOrder()`]}],
  edges:[{a:`c`,b:`p`,k:`arrow`,l:`calls`},{a:`p`,b:`s`,k:`arrow`,l:`delegates`}]}},
 {t:`cards`,items:[
   {h:`Singleton (scope)`,b:`The default bean scope. One instance per application context, created by the container.`},
   {h:`Factory`,b:`<code>BeanFactory</code> and <code>ApplicationContext</code> create and hand out your beans.`},
   {h:`Dependency Injection and IoC`,b:`The container creates objects and passes in their dependencies, instead of classes creating them. This is Inversion of Control.`},
   {h:`Proxy`,b:`AOP: <code>@Transactional</code>, <code>@Cacheable</code>, <code>@Async</code>, method security. JDK dynamic proxies or CGLIB.`},
   {h:`Template Method`,b:`<code>JdbcTemplate</code>, <code>TransactionTemplate</code>, <code>RestTemplate</code>. Fixed steps, your callback for the variable part.`},
   {h:`Observer`,b:`<code>ApplicationEventPublisher</code> and <code>@EventListener</code>.`},
   {h:`Chain of Responsibility`,b:`Servlet filter chain, Spring Security filter chain, <code>HandlerInterceptor</code>.`},
   {h:`Adapter`,b:`<code>HandlerAdapter</code> in Spring MVC lets the dispatcher call different controller styles uniformly.`},
   {h:`Front Controller`,b:`<code>DispatcherServlet</code> receives every request and routes it.`},
   {h:`Strategy`,b:`Many injected implementations of one interface, such as <code>PasswordEncoder</code>. In Java: <code>Comparator</code>.`},
   {h:`Builder`,b:`<code>UriComponentsBuilder</code>, MockMvc request builders, Lombok <code>@Builder</code>.`},
   {h:`Decorator`,b:`<code>HttpServletRequestWrapper</code>, and Java I/O streams such as <code>BufferedReader</code>.`},
   {h:`Repository`,b:`Spring Data repositories give a collection-like interface to stored data.`}]},
 {t:`remember`,h:`A strong answer to "which patterns does Spring use?" names <b>Singleton scope, Factory (BeanFactory), Proxy (AOP and transactions), Template Method (JdbcTemplate), Observer (events) and Front Controller (DispatcherServlet)</b>, and says the one-line job of each.`},
 {t:`check`,q:`Why does <code>@Transactional</code> not work when a method calls another <code>@Transactional</code> method in the same class?`,a:`The transaction is added by a proxy that wraps the bean. A call from inside the class goes straight to <code>this</code> and never passes through the proxy, so no transaction starts. Move the method into another bean.`}
]},

/* ---------- 30 ---------- */
{id:`lesson-30`,track:`patterns`,trackName:`Design patterns`,title:`Pattern questions with full answers`,min:40,
 promise:`The comparison and scenario questions that interviewers use to test whether you really understand patterns, with clear answers you can say in a minute.`,
 blocks:[
 {t:`plain`,h:`Try each question out loud first. A good answer has three parts: <b>what it is, how it differs from the similar one, and when you would choose it.</b>`},
 {t:`qbank`,items:[

 {n:`Strategy versus State`,tag:`Pattern`,where:`A very common comparison question in Java pattern lists.`,
  ask:`Both have a context holding an interface with several implementations. How do they differ?`,
  quality:`Who chooses and changes the behaviour.`,
  steps:[
   [`Strategy`,`The <b>client</b> picks the algorithm and plugs it in. The strategies usually do not know about each other. Example: choosing UPI or card.`],
   [`State`,`The <b>object itself</b> changes behaviour as it moves through stages. The states often know the next state. Example: an order going from placed to shipped.`],
   [`Quick test`,`Does the behaviour change because someone chose it, or because time and events moved the object along? Chosen means Strategy. Moved means State.`]],
  trade:`Strategy is simpler. State has more moving parts because each state must know its transitions.`,
  follow:`Can they be combined? (yes: a state can use strategies for part of its work.)`},

 {n:`Decorator versus Proxy`,tag:`Pattern`,where:`Appears in Java and Spring interview lists.`,
  ask:`Both wrap an object with the same interface. What is the difference?`,
  quality:`Intent, not structure.`,
  steps:[
   [`Decorator`,`Adds behaviour or features. The client often builds stacks of them. Example: milk and syrup on coffee.`],
   [`Proxy`,`Controls access to the object. Typically one proxy, often created by a framework. Examples: lazy loading, permission checks, caching, Spring's transaction proxy.`],
   [`When in doubt`,`Ask whether you are adding something or guarding something.`]],
  trade:`The boundary is blurry. Logging or timing wrappers are called both. Say which intent you mean.`,
  follow:`Which does Spring AOP use? (proxies. JDK dynamic proxy for interfaces, CGLIB for classes.)`},

 {n:`Adapter, Facade and Bridge`,tag:`Pattern`,where:`A frequent "structural patterns" comparison.`,
  ask:`How do you tell these three apart?`,
  quality:`The problem each one solves.`,
  steps:[
   [`Adapter`,`Converts one interface to another expected one. Fixes a mismatch after the fact.`],
   [`Facade`,`Hides many classes behind a simpler interface. Converts nothing.`],
   [`Bridge`,`Separates an abstraction from its implementation so each can vary. Planned in the design from the start.`]],
  trade:`An adapter wraps one thing. A facade wraps several. A bridge is a structure, not a wrapper.`,
  follow:`When does a facade become a problem? (when it grows into a god class. Split it by feature.)`},

 {n:`Factory Method versus Abstract Factory`,tag:`Pattern`,where:`Listed repeatedly in GoF question sets.`,
  ask:`What is the difference, and where does a simple factory fit?`,
  quality:`One product versus a family of products.`,
  steps:[
   [`Simple factory`,`One method with a decision (switch or map). Not an official GoF pattern.`],
   [`Factory method`,`A base class declares a creation method, and subclasses decide what to create.`],
   [`Abstract factory`,`An interface for creating a set of related objects that must match, such as an India or global payment family.`]],
  trade:`Abstract factory adds many classes. Use it only when matching families are really needed.`,
  follow:`Give a Java example. (<code>Calendar.getInstance()</code>, <code>List.of()</code>, or Spring's <code>BeanFactory</code>.)`},

 {n:`Observer versus publish-subscribe`,tag:`Pattern`,where:`Listed among advanced pattern questions.`,
  ask:`They sound the same. What is different?`,
  quality:`Whether something sits between sender and receiver.`,
  steps:[
   [`Observer`,`The subject knows its observers and calls them directly. Same process, immediate.`],
   [`Publish-subscribe`,`A broker (Kafka, a message queue) sits in the middle. Publishers and subscribers never know each other, and can be on different machines and run at different times.`],
   [`Consequences`,`Observer is simple and fast but tightly coupled in time. Pub-sub adds loose coupling and durability, and adds delay and complexity.`]],
  trade:`Use Observer inside one service. Use pub-sub between services.`,
  follow:`How does Spring events relate? (an in-process Observer, not pub-sub, unless you forward events to a broker.)`},

 {n:`Singleton: thread safety, criticism and clusters`,tag:`Pattern`,where:`Singleton thread safety appeared in an India LLD round, and the guides ask follow-ups on lazy initialization.`,
  ask:`How do you make a singleton thread-safe, and what is wrong with it?`,
  quality:`Know four ways and the criticisms.`,
  steps:[
   [`Ways`,`Eager initialization, holder class, enum, double-checked locking with a volatile field.`],
   [`Best answers`,`Enum or holder class: simple and safe.`],
   [`Criticism`,`Hidden global state, hard to test, and only one per JVM.`],
   [`In a cluster`,`Each server has its own. For one across servers, use a distributed lock or leader election with Redis or ZooKeeper.`]],
  trade:`Prefer passing a single shared instance through dependency injection. You get the one-instance benefit without the global.`,
  follow:`Can reflection or serialization break it? (yes for ordinary classes. An enum singleton is safe against both.)`},

 {n:`Builder versus telescoping constructors`,tag:`Pattern`,where:`Asked in beginner and intermediate lists.`,
  ask:`Why use a builder, and how does it help immutability?`,
  quality:`Readability and safe construction.`,
  steps:[
   [`The problem`,`Constructors with many parameters, many optional, are hard to read and easy to call in the wrong order.`],
   [`The fix`,`Named setter-like methods that return the builder, then <code>build()</code> creates the object.`],
   [`Immutability`,`The finished object has only final fields set by the private constructor, so it cannot change after creation. Validation lives in <code>build()</code>.`]],
  trade:`More code. For two or three fields, use a constructor or a <code>record</code>.`,
  follow:`Standard builder versus fluent builder? (fluent returns <code>this</code> from every method so calls chain.)`},

 {n:`Chain of Responsibility: versus if-else and versus Decorator`,tag:`Pattern`,where:`Listed in structural and behavioural comparison questions.`,
  ask:`Why not use if-else, and how is it different from Decorator?`,
  quality:`Flexibility and what each does with the request.`,
  steps:[
   [`Versus if-else`,`A chain can be rearranged, extended and configured without editing a central function. Each handler is separate and testable.`],
   [`Versus Decorator`,`A decorator always passes on to the inner object and adds to the result. A chain handler may <b>stop</b> the request, and often only one handler does the work.`],
   [`Unhandled requests`,`Decide up front: reject with an error, or let it pass through.`]],
  trade:`Order of handlers matters, and a long chain is harder to trace. Log which handler stopped a request.`,
  follow:`Where is it used? (servlet filters, Spring Security filters, interceptors.)`},

 {n:`Template Method versus Strategy`,tag:`Pattern`,where:`Appears with the Hollywood principle in behavioural question sets.`,
  ask:`Both let part of an algorithm vary. Which do you prefer?`,
  quality:`Inheritance versus composition.`,
  steps:[
   [`Template Method`,`Uses inheritance. The parent fixes the steps, subclasses override some. Behaviour is chosen at compile time by the subclass.`],
   [`Strategy`,`Uses composition. An object is given the behaviour, and it can change at run time.`],
   [`Hollywood principle`,`"Do not call us, we will call you." The framework or parent calls your code at the right moment.`]],
  trade:`Prefer Strategy when you need run-time choice or want to avoid deep inheritance. Template Method is fine when the skeleton is stable.`,
  follow:`Example in Spring? (<code>JdbcTemplate</code> uses callbacks, which is closer to Strategy inside a template.)`},

 {n:`Which pattern would you use? (scenario round)`,tag:`Pattern`,where:`The most common form of this question in LLD rounds. Mapping drawn from LLD guides.`,
  ask:`The interviewer gives a problem and asks which pattern fits. How do you answer?`,
  quality:`State the problem first, then the pattern.`,
  steps:[
   [`Payment methods`,`Strategy for each method, with a Factory or Spring map to choose.`],
   [`Notifications on an event`,`Observer, with a Factory to create channels.`],
   [`ATM, vending machine, order lifecycle`,`State, with a service layer for the operations.`],
   [`Coffee shop add-ons`,`Decorator.`],
   [`Logging framework`,`Chain of Responsibility for level filtering, Strategy for output destinations, Decorator for async wrapping, and Singleton for the logger registry.`],
   [`Parking lot, ride sharing`,`Strategy for pricing and matching, Observer for availability and trip updates.`],
   [`Elevator`,`Strategy for dispatch, State for each elevator's mode.`],
   [`Food delivery`,`Observer for order events and Chain of Responsibility for checks. State for the order lifecycle.`],
   [`Movie booking`,`Repository for data access and a Facade for the booking flow.`],
   [`Third-party SDK wrapper`,`Adapter.`]],
  trade:`Do not stack patterns just to show off. Choose one or two, explain why, and say what you are NOT using and why.`,
  follow:`What if the interviewer says you overused patterns? (agree, then simplify: "I would start with the plain version and add the pattern when the second variation appears".)`},

 {n:`Dependency injection, IoC and service locator`,tag:`Pattern`,where:`Common in Spring-focused rounds.`,
  ask:`Explain DI, IoC and the difference from a service locator.`,
  quality:`Who creates the dependencies.`,
  steps:[
   [`Inversion of Control`,`The big idea: the framework controls the flow and object creation, and your code is called.`],
   [`Dependency injection`,`One way to achieve IoC. A class declares what it needs (usually in its constructor) and the container passes it in.`],
   [`Service locator`,`The class asks a registry for what it needs. The dependency is hidden inside the code, which makes testing harder.`],
   [`Why constructor injection`,`Dependencies are explicit and final, and the class is easy to create in a test with fakes.`]],
  trade:`DI needs a container or manual wiring. It gives easier testing and looser coupling.`,
  follow:`Field injection versus constructor injection? (constructor is preferred: required dependencies are clear and fields can be final.)`},

 {n:`Repository versus DAO, and MVC versus MVP and MVVM`,tag:`Pattern`,where:`Listed under architectural patterns in the pattern question sets.`,
  ask:`How do you explain these?`,
  quality:`Keep each to one sentence.`,
  steps:[
   [`DAO`,`Wraps database access for one table or entity: save, find, delete. Close to the database.`],
   [`Repository`,`Presents data as a collection of domain objects, in the language of the business, and may hide several sources. Spring Data repositories are this.`],
   [`MVC`,`Model holds data and rules, View shows it, Controller handles input and connects them. Spring MVC follows this.`],
   [`MVP and MVVM`,`Variants that change how the view and logic connect. In MVP a presenter updates the view. In MVVM a view model exposes data the view binds to.`]],
  trade:`In practice DAO and Repository blur. The key idea is to keep data access away from business logic.`,
  follow:`Where does business logic live in Spring MVC? (the service layer, not the controller.)`},

 {n:`Resilience patterns for microservices`,tag:`Pattern`,where:`Raised in an advanced pattern question about communication and resilience.`,
  ask:`Which patterns keep services working when others fail?`,
  quality:`Name the pattern and what it protects.`,
  steps:[
   [`API Gateway`,`One entry point that handles routing, authentication and rate limits for many services.`],
   [`Circuit breaker`,`After many failures, stop calling the failing service for a while and fail fast, so it can recover and callers do not pile up. Resilience4j in Java.`],
   [`Retry with backoff`,`Try again after growing delays. Only for safe, repeatable calls.`],
   [`Fallback`,`Return a safe default or cached answer when the call fails.`],
   [`Bulkhead`,`Keep separate thread pools for different calls so one slow dependency cannot use up all threads.`]],
  trade:`Retries can multiply load on a struggling service, so combine them with a circuit breaker and limits.`,
  follow:`See the Microservices guide document for the full version.`},

 {n:`How do you avoid overusing patterns?`,tag:`Pattern`,where:`A judgement question for experienced candidates. Guides stress that reasoning matters more than vocabulary.`,
  ask:`How do you decide when a pattern is worth it?`,
  quality:`Show judgement, not enthusiasm.`,
  steps:[
   [`Start simple`,`Write the plain version first.`],
   [`Wait for the second case`,`Add a pattern when a real variation appears, or when you can name the next one.`],
   [`Count the cost`,`Each pattern adds classes and indirection. Is the reader better off?`],
   [`Explain the why`,`"I used Strategy because pricing changes often and I did not want to edit checkout each time."`]],
  trade:`Too few patterns gives rigid code. Too many gives code nobody can follow.`,
  follow:`Give an example where you chose not to use one. (any simple case where one class was enough.)`}
 ]},

var STAGES=[
 {l:'1 server',hurt:'Nothing yet.',fix:'One app server and one database is a perfectly good start. Spend your effort on a clean data model and the right indexes.',cost:'None, and that is the point. Every extra part is something to run and debug.'},
 {l:'Slow queries',hurt:'Pages slow down because the app and database share one machine, and some queries scan whole tables.',fix:'Add indexes. Move the database to its own machine. Use a bigger machine if needed.',cost:'A bigger machine has a ceiling, and one failure still takes everything down.'},
 {l:'Read-heavy',hurt:'The database is busy answering the same read questions again and again.',fix:'Add a cache for popular data. Add read replicas (copies for reading).',cost:'Data can be slightly stale. You now have to decide when to refresh the cache.'},
 {l:'One server is not enough',hurt:'One app server cannot take the traffic, and if it dies, the site is down.',fix:'Run several identical app servers behind a load balancer. Keep them stateless, so any server can handle any request.',cost:'You must move user sessions out of server memory, and handle deployments carefully.'},
 {l:'Slow work blocks users',hurt:'Sending emails or making reports makes users wait. Spikes of traffic can overwhelm the database.',fix:'Put slow work on a queue and let workers process it in the background.',cost:'Duplicates can happen, so workers must be safe to run twice. Users see "pending" for a while.'},
 {l:'Data too big',hurt:'One database cannot hold all the data or take all the writes.',fix:'Split the data across several databases by a key, such as user id. This is sharding.',cost:'Queries across shards are hard, and a popular key can overload one shard.'},
 {l:'Global users',hurt:'Users far from your servers get slow responses, and one data-center outage takes everyone down.',fix:'Serve static files from a CDN. Run in more than one region and route users to the nearest one.',cost:'Data in different regions can briefly disagree, and the bill grows a lot.'}
];

function el(tag,cls,html){var e=document.createElement(tag);if(cls)e.className=cls;if(html!=null)e.innerHTML=html;return e}

function fmt(n){
  if(n>=1e9)return (n/1e9).toFixed(1)+' B';
  if(n>=1e6)return (n/1e6).toFixed(1)+' M';
  if(n>=1e3)return (n/1e3).toFixed(1)+' K';
  return n<10?n.toFixed(1):String(Math.round(n));
}
function fmtBytes(n){var u=['B','KB','MB','GB','TB','PB'],i=0;while(n>=1000&&i<u.length-1){n/=1000;i++}return (n<10?n.toFixed(1):Math.round(n))+' '+u[i]}

  var n;

  case 'p': host.appendChild(el('div','sec',b.h));break;
  case 'plain': n=el('div','box');n.appendChild(el('div','label','In plain words'));n.appendChild(el('p',null,b.h));host.appendChild(n);break;
  case 'analogy': n=el('div','box plain');n.appendChild(el('div','label','Picture it'));n.appendChild(el('p',null,b.h));host.appendChild(n);break;
  case 'mistake': n=el('div','box mistake');n.appendChild(el('div','label','Common mistake'));n.appendChild(el('p',null,b.h));host.appendChild(n);break;
  case 'remember': n=el('div','box remember');n.appendChild(el('div','label','Remember this'));n.appendChild(el('p',null,b.h));host.appendChild(n);break;
  case 'steps':
    n=el('ol','steps');
    b.items.forEach(function(s){var li=el('li',null,'<div><b>'+s[0]+'</b>'+s[1]+'</div>');n.appendChild(li)});
    host.appendChild(n);break;
  case 'two':
    n=el('div','two');
    [b.a,b.b].forEach(function(x){n.appendChild(el('div',null,'<div class="h">'+x.h+'</div><p>'+x.b+'</p>'))});

  case 'cards':
    n=el('div','cards');
    b.items.forEach(function(c){
      n.appendChild(el('div','card','<h3>'+c.h+'</h3>'+(c.pic?'<div class="pic">'+c.pic+'</div>':'')+'<p>'+c.b+'</p>'+(c.small?'<p class="small">'+c.small+'</p>':'')));
    });

  case 'code':
    n=el('div','sec');
    var cap=el('div','cap'+(b.bad?' bad':'')+(b.good?' good':''),b.cap||'');
    if(b.use)cap.className+=' use';

    n.appendChild(cap);n.appendChild(pre);host.appendChild(n);break;

    n.appendChild(btn);n.appendChild(ans);host.appendChild(n);break;
  case 'qbank': host.appendChild(buildQbank(b.items));break;
  case 'diagram': host.appendChild(buildDiagram(b));break;

  }

function buildCalc(){
  var box=el('div','check');
  box.appendChild(el('div','label','Try it'));
  box.appendChild(el('p',null,'Change the numbers and watch what moves. Start with the example from above.'));
  box.appendChild(el('div','fields',
    '<div class="field"><label for="c-dau">Daily users (millions)</label><input id="c-dau" type="number" min="0" step="any" value="10"></div>'+
    '<div class="field"><label for="c-act">Actions per user per day</label><input id="c-act" type="number" min="0" step="any" value="20"></div>'+
    '<div class="field"><label for="c-rpw">Reads for every 1 write</label><input id="c-rpw" type="number" min="0" step="any" value="10"></div>'));
  var out=el('div','out');out.setAttribute('aria-live','polite');box.appendChild(out);
  var msg=el('div','box');box.appendChild(msg);
  function num(id){var v=parseFloat(box.querySelector(id).value);return isFinite(v)&&v>=0?v:0}
  function run(){
    var dau=num('#c-dau')*1e6,act=num('#c-act'),rpw=num('#c-rpw');
    var day=dau*act,avg=day/86400,pk=avg*3,w=pk/(rpw+1),r=pk-w;
    var data=day/(rpw+1)*1000*365;
    out.innerHTML=
      '<div><span>Requests per day</span><b>'+fmt(day)+'</b></div>'+
      '<div><span>Average per second</span><b>'+fmt(avg)+'</b></div>'+
      '<div><span>Busy-hour per second (x3)</span><b>'+fmt(pk)+'</b></div>'+
      '<div><span>Reads per second at peak</span><b>'+fmt(r)+'</b></div>'+
      '<div><span>Writes per second at peak</span><b>'+fmt(w)+'</b></div>'+
      '<div><span>New data per year (1 KB per write)</span><b>'+fmtBytes(data)+'</b></div>';
    var m;
    if(r<1000&&w<500)m='<b>What this means:</b> one well-tuned database can handle this. Keep it simple.';
    else if(r<10000)m='<b>What this means:</b> reads are the pressure. Add a cache and maybe read replicas.';
    else m='<b>What this means:</b> reads are very high. You need a cache layer, and likely a CDN for static files.';
    if(w>=5000)m+=' Writes are high too, so think about a queue and splitting the data.';
    msg.innerHTML='<p>'+m+'</p>';
  }
  box.addEventListener('input',run);run();
  return box;
}

function buildStages(){
  var wrap=el('div','sec'),sel=2;
  var row=el('div','row');wrap.appendChild(row);
  var panel=el('div','check');panel.setAttribute('aria-live','polite');wrap.appendChild(panel);
  function draw(){
    Array.prototype.forEach.call(row.children,function(b,i){b.setAttribute('aria-pressed',i===sel?'true':'false')});
    var s=STAGES[sel];
    panel.innerHTML='<div><div class="label">What hurts</div><p>'+s.hurt+'</p></div>'+
      '<div><div class="label">The fix</div><p>'+s.fix+'</p></div>'+
      '<div><div class="label">What the fix costs</div><p>'+s.cost+'</p></div>';
  }
  STAGES.forEach(function(s,i){
    var b=el('button','stage',s.l);b.type='button';
    b.addEventListener('click',function(){sel=i;draw()});row.appendChild(b);
  });
  draw();return wrap;
}

function buildDiagram(b){
  var spec=b.d,NS='http://www.w3.org/2000/svg';
  function s(tag,attrs,text){var e=document.createElementNS(NS,tag);for(var k in attrs)e.setAttribute(k,attrs[k]);if(text!=null)e.textContent=text;return e}
  var W=spec.w||420,byId={};
  spec.nodes.forEach(function(n){
    var hdr=n.k==='state'?34:(n.k==='note'?0:(n.s?38:28));
    var ml=n.m?n.m.length:0;
    if(n.k==='state')n.h=34;
    else if(n.k==='note')n.h=ml*14+14;
    else n.h=hdr+(ml?10+14*ml:0);
    n.hdr=hdr;byId[n.id]=n;
  });
  var H=0;spec.nodes.forEach(function(n){H=Math.max(H,n.y+n.h)});H+=14;
  var svg=s('svg',{viewBox:'0 0 '+W+' '+H,role:'img','aria-label':spec.alt||''});
  var defs=s('defs',{});
  function marker(id,w,h,rx,ry,child){
    var m=s('marker',{id:id,viewBox:'0 0 '+w+' '+h,refX:rx,refY:ry,markerWidth:w,markerHeight:h,markerUnits:'userSpaceOnUse',orient:'auto'});
    m.appendChild(child);defs.appendChild(m);
  }
  var uid='m'+Math.floor(Math.random()*1e6);
  marker(uid+'t',12,12,11,6,s('path',{d:'M1,1 L11,6 L1,11 z','class':'mk-tri'}));
  marker(uid+'o',12,12,11,6,s('path',{d:'M1,1 L11,6 L1,11','class':'mk-open'}));
  marker(uid+'f',12,12,11,6,s('path',{d:'M1,1 L11,6 L1,11 z','class':'mk-fill'}));
  marker(uid+'d',14,12,0,6,s('path',{d:'M1,6 L7,1 L13,6 L7,11 z','class':'mk-tri'}));
  svg.appendChild(defs);
  function clip(n,tx,ty){
    var cx=n.x+n.w/2,cy=n.y+n.h/2,dx=tx-cx,dy=ty-cy;
    if(dx===0&&dy===0)return [cx,cy];
    var t=Math.min(dx!==0?(n.w/2)/Math.abs(dx):1e9,dy!==0?(n.h/2)/Math.abs(dy):1e9);
    return [cx+dx*t,cy+dy*t];
  }
  spec.edges.forEach(function(e){
    var A=byId[e.a],B=byId[e.b];
    var ax=A.x+A.w/2,ay=A.y+A.h/2,bx=B.x+B.w/2,by=B.y+B.h/2;
    var dx=bx-ax,dy=by-ay,len=Math.sqrt(dx*dx+dy*dy)||1,o=e.o||0;
    var nx=-dy/len*o,ny=dx/len*o;
    var p1=clip(A,bx+nx,by+ny),p2=clip(B,ax+nx,ay+ny);
    p1=[p1[0]+nx,p1[1]+ny];p2=[p2[0]+nx,p2[1]+ny];
    var k=e.k||'arrow',dash=(k==='implements'||k==='uses');
    var line=s('line',{x1:p1[0],y1:p1[1],x2:p2[0],y2:p2[1],'class':'dg-e'+(dash?' dash':'')});
    if(k==='extends'||k==='implements')line.setAttribute('marker-end','url(#'+uid+'t)');
    else if(k==='uses')line.setAttribute('marker-end','url(#'+uid+'o)');
    else if(k==='has'){line.setAttribute('marker-start','url(#'+uid+'d)');line.setAttribute('marker-end','url(#'+uid+'o)')}
    else line.setAttribute('marker-end','url(#'+uid+'f)');
    svg.appendChild(line);
    if(e.l){
      var mx=(p1[0]+p2[0])/2,my=(p1[1]+p2[1])/2,lw=e.l.length*5.6+10;
      svg.appendChild(s('rect',{x:mx-lw/2,y:my-8,width:lw,height:15,rx:3,'class':'dg-lb'}));
      svg.appendChild(s('text',{x:mx,y:my+3.5,'class':'dg-l'},e.l));
    }
  });
  spec.nodes.forEach(function(n){
    var cls=n.k==='iface'?'dg-if':(n.k==='state'?'dg-st':(n.k==='note'?'dg-note':'dg-box'));
    svg.appendChild(s('rect',{x:n.x,y:n.y,width:n.w,height:n.h,rx:n.k==='state'?17:6,'class':cls}));
    if(n.k==='note'){
      (n.m||[]).forEach(function(l,i){svg.appendChild(s('text',{x:n.x+n.w/2,y:n.y+16+i*14,'class':'dg-n'},l))});
      return;
    }
    if(n.s)svg.appendChild(s('text',{x:n.x+n.w/2,y:n.y+15,'class':'dg-s'},'«'+n.s+'»'));
    svg.appendChild(s('text',{x:n.x+n.w/2,y:n.y+(n.k==='state'?22:(n.s?31:19)),'class':'dg-t'},n.t));
    if(n.m&&n.m.length){
      svg.appendChild(s('line',{x1:n.x,y1:n.y+n.hdr,x2:n.x+n.w,y2:n.y+n.hdr,'class':'dg-sep'}));
      n.m.forEach(function(l,i){svg.appendChild(s('text',{x:n.x+8,y:n.y+n.hdr+6+(i+1)*14-3,'class':'dg-m'},l))});
    }
  });
  var wrap=el('div','diagram');
  wrap.appendChild(svg);
  if(b.cap)wrap.appendChild(el('p','dcap',b.cap));
  return wrap;
}

function buildQbank(items){
  var wrap=el('div');
  items.forEach(function(q){
    var d=document.createElement('details');d.className='q';
    var s=document.createElement('summary');
    s.innerHTML='<span class="qleft"><span>'+q.n+'</span><span class="pill">'+q.tag+'</span></span>';
    d.appendChild(s);
    var b=el('div','qbody');
    b.appendChild(el('p','where','<b>Seen in:</b> '+q.where));
    b.appendChild(el('div','qsec','<div class="label">The question</div><p>'+q.ask+'</p>'));
    b.appendChild(el('div','qsec','<div class="label">What matters most</div><p>'+q.quality+'</p>'));
    var st=el('div','qsec','<div class="label">Walk through it</div>');
    var ol=el('ol','steps');
    q.steps.forEach(function(x){ol.appendChild(el('li',null,'<div><b>'+x[0]+'</b>'+x[1]+'</div>'))});
    st.appendChild(ol);b.appendChild(st);
    if(q.code){
      var c=el('div','qsec');
      c.appendChild(el('div','cap',q.code.cap));
      var pre=document.createElement('pre');pre.textContent=q.code.code;c.appendChild(pre);
      if(q.code.use){
        c.appendChild(el('div','cap use','How it is used'));
        var p2=document.createElement('pre');p2.className='use';p2.textContent=q.code.use;c.appendChild(p2);
      }
      b.appendChild(c);
    }
    b.appendChild(el('div','qsec','<div class="label">Trade-offs to say out loud</div><p>'+q.trade+'</p>'));
    b.appendChild(el('div','qsec','<div class="label">Follow-ups to expect</div><p>'+q.follow+'</p>'));
    d.appendChild(b);wrap.appendChild(d);
  });
  return wrap;
}

var P={lld:['Design a parking lot','Design an elevator system','Design Splitwise (shared expenses)','Design a library system','Design a vending machine','Design an LRU cache','Design a chess game','Design an ATM','Design a movie ticket booking system','Design a logging framework'],
 hld:['Design a URL shortener','Design a news feed','Design a chat application','Design a video streaming service','Design a ride-hailing app','Design a notification system','Design a web crawler','Design search autocomplete','Design a payment system','Design a ticket booking system']};
var timerState={remaining:1200,running:false,endAt:0,id:null};
function buildDrill(){
  var box=el('div','check'),kind='lld',cur='';
  box.appendChild(el('div','label','Today\'s drill'));
  var pill=el('span','pill','LLD');var pw=el('div');pw.appendChild(pill);box.appendChild(pw);
  var prompt=el('p',null,'');prompt.style.cssText='font:600 1.2rem/1.4 var(--font-display)';box.appendChild(prompt);
  var r1=el('div','row');
  var bl=el('button','reveal','New LLD prompt'),bh=el('button','reveal','New HLD prompt');bl.type=bh.type='button';
  r1.appendChild(bl);r1.appendChild(bh);box.appendChild(r1);
  var time=el('div','timer','20:00');box.appendChild(time);
  var phase=el('p',null,'Ready when you are.');box.appendChild(phase);
  var r2=el('div','row');
  var st=el('button','btn','Start'),rs=el('button','btn ghost','Reset');st.type=rs.type='button';
  r2.appendChild(st);r2.appendChild(rs);box.appendChild(r2);
  function pick(k){kind=k;var l=P[k],p=cur;while(p===cur)p=l[Math.floor(Math.random()*l.length)];cur=p;prompt.textContent=p;pill.textContent=k.toUpperCase()}
  function render(){
    var rem=timerState.remaining,m=Math.floor(rem/60),s=rem%60;
    time.textContent=(m<10?'0':'')+m+':'+(s<10?'0':'')+s;
    var el_=1200-rem,txt;
    if(rem<=0)txt='Time. Now write one line: what did I skip or hand-wave?';
    else if(!timerState.running&&el_===0)txt='Ready when you are. Talk out loud.';
    else if(el_<300)txt='Clarify: ask questions, pick three must-haves and one key quality.';
    else if(el_<900)txt=kind==='lld'?'Model: nouns, verbs, who owns what, what will change.':'Model: numbers, the two actions, smallest design, what breaks first.';
    else txt='Stress and trade: two users at once, a new requirement, then the template sentence.';
    phase.textContent=txt;
    st.textContent=timerState.running?'Pause':(rem<=0||rem===1200?'Start':'Resume');
  }
  function tick(){
    timerState.remaining=Math.max(0,Math.ceil((timerState.endAt-Date.now())/1000));
    if(timerState.remaining<=0){timerState.running=false;clearInterval(timerState.id);timerState.id=null}
    render();
  }
  st.addEventListener('click',function(){
    if(timerState.running){timerState.running=false;clearInterval(timerState.id);timerState.id=null;render();return}
    if(timerState.remaining<=0)timerState.remaining=1200;
    timerState.running=true;timerState.endAt=Date.now()+timerState.remaining*1000;
    timerState.id=setInterval(tick,500);render();
  });
  rs.addEventListener('click',function(){timerState.running=false;clearInterval(timerState.id);timerState.id=null;timerState.remaining=1200;render()});
  bl.addEventListener('click',function(){pick('lld');render()});
  bh.addEventListener('click',function(){pick('hld');render()});
  pick('lld');render();
  return box;
}

/* ================= PAGE ================= */
var cur=0;
function idx(){
  var h=(location.hash||'').replace('#','');
  for(var i=0;i<L.length;i++)if(L[i].id===h)return i;
  return 0;
}
function drawList(){
  var host=$('#list');host.innerHTML='';
  var last='';
  L.forEach(function(l,i){
    if(l.trackName!==last){last=l.trackName;host.appendChild(el('h3',null,l.trackName))}
    var a=document.createElement('a');a.href='#'+l.id;
    if(i===cur)a.setAttribute('aria-current','page');
    a.innerHTML='<span class="n">'+(i+1)+'</span><span>'+l.title+'</span><span class="'+(done[l.id]?'tick':'min')+'">'+(done[l.id]?'&#10003; done':l.min+' min')+'</span>';
    a.addEventListener('click',function(){closeList()});
    host.appendChild(a);
  });
}
function closeList(){$('#list').classList.remove('open');$('#menu-btn').setAttribute('aria-expanded','false')}
$('#menu-btn').addEventListener('click',function(){
  var o=$('#list').classList.toggle('open');this.setAttribute('aria-expanded',o?'true':'false');
});
function meter(){
  var n=0;L.forEach(function(l){if(done[l.id])n++});
  $('#meter').style.width=Math.round(n/L.length*100)+'%';
}
function draw(){
  cur=idx();
  var l=L[cur];
  document.body.setAttribute('data-track',l.track);
  $('#where').textContent='Lesson '+(cur+1)+' of '+L.length+' · '+l.trackName;
  var host=$('#lesson');host.innerHTML='';
  var head=el('div');
  head.appendChild(el('div','kicker',l.trackName+' · about '+l.min+' minutes'));
  head.appendChild(el('h1',null,l.title));
  head.appendChild(el('p','promise',l.promise));
  host.appendChild(head);
  l.blocks.forEach(function(b){renderBlock(b,host)});
  var dr=el('label','done-row');
  var cb=document.createElement('input');cb.type='checkbox';cb.checked=!!done[l.id];
  cb.addEventListener('change',function(){if(cb.checked)done[l.id]=1;else delete done[l.id];save();meter();drawList()});
  dr.appendChild(cb);dr.appendChild(el('span',null,'I finished this lesson'));
  host.appendChild(dr);
  var nav=el('div','nav');
  var pv=el('button','btn ghost','Previous');pv.type='button';pv.disabled=cur===0;
  var nx=el('button','btn',cur===L.length-1?'Back to lesson 1':'Next lesson');nx.type='button';
  pv.addEventListener('click',function(){if(cur>0)location.hash=L[cur-1].id});
  nx.addEventListener('click',function(){location.hash=L[cur===L.length-1?0:cur+1].id});
  nav.appendChild(pv);nav.appendChild(nx);host.appendChild(nav);
  meter();drawList();
}
window.addEventListener('hashchange',function(){draw();window.scrollTo(0,0)});
draw();
})();
</script>
