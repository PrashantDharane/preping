/* ---------- 1 ---------- */
{id:`lesson-1`,track:`spring`,trackName:`Spring Boot internals`,title:`Spring in one picture, and what gets asked`,min:9,
 promise:`You have used Spring for years. Interviewers now ask how it works underneath. Start with the one idea everything else hangs on.`,
 blocks:[
 {t:`plain`,h:`Spring is a <b>container that builds your objects and wires them together</b>. You describe the classes (beans). Spring creates them, hands each one what it needs (<b>dependency injection</b>), and manages their life. You stop writing <code>new</code> for your services.`},
 {t:`analogy`,h:`A film set. The director (Spring) hires the actors, gives each one their props, and calls "action". An actor never goes shopping for their own props. That is inversion of control: you do not fetch your dependencies, they are delivered.`},
 {t:`diagram`,cap:`Spring reads your classes and settings, builds the beans, and gives you a ready, wired application.`,d:{w:420,alt:`Classes and configuration flow into the ApplicationContext which produces wired beans`,nodes:[
   {id:`in`,t:`Your classes + config`,x:6,y:30,w:140,m:[`@Component`,`@Bean`,`application.yml`]},
   {id:`cx`,t:`ApplicationContext`,s:`the container`,x:170,y:24,w:140,m:[`creates`,`injects`,`manages`]},
   {id:`bn`,t:`Ready beans`,x:332,y:36,w:82,m:[`wired`,`proxied`]}],
  edges:[{a:`in`,b:`cx`},{a:`cx`,b:`bn`}]}},
 {t:`p`,h:`<h2>What the guides say gets asked</h2>`},
 {t:`cards`,items:[
   {h:`Core`,b:`IoC and DI, bean scopes, bean lifecycle, circular dependencies, @Component vs @Bean.`},
   {h:`Spring Boot`,b:`How auto-configuration works, starters, properties and profiles, Actuator.`},
   {h:`Proxies`,b:`How @Transactional and @Async actually work, and why they sometimes silently do nothing.`},
   {h:`Web`,b:`The DispatcherServlet flow, validation, exception handling, filters versus interceptors.`},
   {h:`Production`,b:`Testing slices, configuration per environment, health checks, graceful shutdown.`}]},
 {t:`remember`,h:`Lists of Spring Boot questions for experienced developers keep returning to the same few: <b>auto-configuration, the bean lifecycle, how @Transactional works, circular dependencies and proxy behaviour</b>. Those are lessons 2 to 4.`},
 {t:`code`,use:true,cap:`The smallest Spring Boot app, and what really happens when it starts`,code:`@SpringBootApplication
public class ShopApp {
    public static void main(String[] args) {
        SpringApplication.run(ShopApp.class, args);
    }
}
// run() does the whole job:
// 1. Create the ApplicationContext
// 2. Scan packages for @Component, @Service, @Repository, @Controller
// 3. Apply auto-configuration (DataSource, Jackson, embedded Tomcat... if on the classpath)
// 4. Build and wire all beans, apply proxies
// 5. Start the embedded web server and publish "ready"`},
 {t:`p`,h:`<h2>Why Spring exists, in a pocket-sized version</h2>`},
 {t:`analogy`,h:`Think of a society with a caretaker. You do not hire the plumber, find the electrician and chase the watchman yourself. You tell the caretaker what is wrong, and he sends the right person. Spring is the caretaker for your objects. A class says "I need a Notifier", and Spring finds one and hands it over. The class never says <code>new SmsNotifier()</code> itself.`},
 {t:`plain`,h:`Without Spring, every class builds its own helpers with <code>new</code>. Then swapping the SMS sender for an email sender means editing every class that built one, and testing a class means dragging in the real SMS sender too. The code below is a tiny hand-made "Spring" in plain Java. It does the same two jobs the real one does: remember how to build each object, and build each one only once.`},
 {t:`code`,cap:`Java (plain Java, no Spring needed, compiled and run)`,code:`// Two ordinary classes. Neither one creates the other.
interface Notifier { void send(String to, String msg); }
static class SmsNotifier implements Notifier {
    public void send(String to, String msg) { System.out.println("SMS to " + to + ": " + msg); }
}
static class OrderService {
    private final Notifier notifier;                       // asks for what it needs
    OrderService(Notifier notifier) { this.notifier = notifier; }
    void place(String user) { notifier.send(user, "Order placed"); }
}

// A pocket-sized "Spring": it remembers recipes and builds each object once.
static class MiniContainer {
    private final Map<Class<?>, Supplier<?>> recipes = new HashMap<>();
    private final Map<Class<?>, Object> singletons = new HashMap<>();
    <T> void register(Class<T> type, Supplier<? extends T> recipe) { recipes.put(type, recipe); }
    @SuppressWarnings("unchecked")
    <T> T get(Class<T> type) {
        Object existing = singletons.get(type);
        if (existing == null) {                          // not built yet: follow the recipe, then remember it
            existing = recipes.get(type).get();
            singletons.put(type, existing);
        }
        return (T) existing;                             // built once, reused after that
    }
}

static void s_ioc() {
    MiniContainer spring = new MiniContainer();
    spring.register(Notifier.class, SmsNotifier::new);
    spring.register(OrderService.class, () -> new OrderService(spring.get(Notifier.class)));  // wiring

    OrderService service = spring.get(OrderService.class);
    service.place("asha@example.com");
    System.out.println("same object every time: " + (service == spring.get(OrderService.class)));
}`},
 {t:`code`,use:true,cap:`What it prints`,code:`SMS to asha@example.com: Order placed
same object every time: true`},
 {t:`steps`,items:[[`Read the first block.`,` <code>OrderService</code> only knows the word <code>Notifier</code>. It does not know SMS exists.`],[`Read the container.`,` <code>register</code> stores a recipe. <code>get</code> follows the recipe once and keeps the result.`],[`Read the wiring.`,` The recipe for <code>OrderService</code> asks the container for a <code>Notifier</code>. That one line is what <code>@Autowired</code> or constructor injection does for you.`],[`Read the last line.`,` The same object comes back every time. That is a <b>singleton</b>, Spring's default scope.`]]},
 {t:`plain`,h:`<b>Why this helps testing.</b> Because the helper is passed in, a test can pass in a fake one. No Spring, no database, no SMS gateway. This is the main reason experienced people prefer constructor injection.`},
 {t:`code`,cap:`Java: a test with a fake helper (plain Java)`,code:`static class FakeNotifier implements Notifier {          // a stand-in that just remembers what it was told
    final List<String> sent = new ArrayList<>();
    public void send(String to, String msg) { sent.add(to + ": " + msg); }
}
static void s_test() {
    FakeNotifier fake = new FakeNotifier();
    OrderService service = new OrderService(fake);       // no Spring needed: just pass the helper in
    service.place("ravi@example.com");
    System.out.println("messages sent: " + fake.sent);
    System.out.println("test passed? " + fake.sent.equals(List.of("ravi@example.com: Order placed")));
}`},
 {t:`code`,use:true,cap:`What it prints`,code:`messages sent: [ravi@example.com: Order placed]
test passed? true`},
 {t:`check`,q:`In one sentence each: what is dependency injection, and what is the difference between <code>BeanFactory</code> and <code>ApplicationContext</code>?`,a:`Dependency injection means a class receives the objects it needs from outside instead of creating them. BeanFactory is the basic container that creates beans on demand. ApplicationContext builds on it and adds events, internationalisation, resource loading, annotation-driven config and eager singleton creation. In practice you always use ApplicationContext.`}
]},

/* ---------- 2 ---------- */
{id:`lesson-2`,track:`spring`,trackName:`Spring Boot internals`,title:`Beans: injection, scopes, lifecycle and circular dependencies`,min:17,
 promise:`The questions that sound basic and are not. Know the lifecycle order and the one scope trap, and you stand out.`,
 blocks:[
 {t:`p`,h:`<h2>How to inject: use the constructor</h2>`},
 {t:`code`,bad:true,cap:`Field injection: hides dependencies and is hard to test`,code:`@Service
class PaymentService {
    @Autowired private GatewayClient gateway;   // cannot be final, needs reflection to test
}`},
 {t:`code`,good:true,cap:`Constructor injection: the recommended way`,code:`@Service
class PaymentService {
    private final GatewayClient gateway;
    PaymentService(GatewayClient gateway) { this.gateway = gateway; }   // @Autowired optional with one constructor
}
// In a unit test, no Spring needed:
// new PaymentService(mockGateway)`},
 {t:`cards`,items:[
   {h:`Why constructor injection`,b:`Fields can be <code>final</code>. Required dependencies are explicit. Objects are never half-built. Tests do not need a container. It also exposes circular dependencies early.`},
   {h:`Setter injection`,b:`For optional dependencies that can change.`},
   {h:`@Component vs @Bean`,b:`<code>@Component</code> (and its forms <code>@Service</code>, <code>@Repository</code>, <code>@Controller</code>) marks <b>your own class</b> for scanning. <code>@Bean</code> on a method in a <code>@Configuration</code> class builds an object <b>you do not own</b>, such as a third-party client.`}]},
 {t:`code`,use:true,cap:`How it is used: two implementations, choosing one`,code:`interface Notifier { void send(String to, String msg); }

@Component @Primary                       // chosen when nothing more specific is asked for
class EmailNotifier implements Notifier { ... }

@Component("sms")
class SmsNotifier implements Notifier { ... }

@Service
class OrderService {
    OrderService(Notifier defaultOne,                       // gets EmailNotifier (@Primary)
                 @Qualifier("sms") Notifier smsOne) { ... } // gets SmsNotifier by name
}`},
 {t:`p`,h:`<h2>Scopes</h2>`},
 {t:`cards`,items:[
   {h:`singleton (default)`,b:`One shared instance per container, not per JVM. So it must be <b>stateless</b> or thread-safe.`},
   {h:`prototype`,b:`A new instance every time it is requested.`},
   {h:`request, session`,b:`One per HTTP request or session (web apps).`}]},
 {t:`mistake`,h:`The scope trap: a <b>singleton</b> that has a <b>prototype</b> injected. The prototype is created <b>once</b>, when the singleton is built, and never again. Fix with <code>ObjectProvider&lt;T&gt;</code> and <code>provider.getObject()</code> at each use, or a scoped proxy. Also: keeping per-user data in a singleton field is a race condition.`},
 {t:`analogy`,h:`Singleton and prototype are like a society's water tank and a paper cup. One tank serves the whole building and everyone shares it, so you must never keep your personal belongings in it. A paper cup is fresh for every person, and thrown away after use. The mistake people make is putting one person's data (a user name, a running total) inside a singleton, which is the shared tank.`},
 {t:`code`,cap:`Java: the difference in two lines (plain Java)`,code:`static class Counter { }
static void s_scope() {
    // singleton: the container builds it once and hands out the same one
    Counter single = new Counter();
    Supplier<Counter> singleton = () -> single;
    // prototype: the container builds a fresh one every time you ask
    Supplier<Counter> prototype = Counter::new;

    System.out.println("singleton, asked twice, same object? " + (singleton.get() == singleton.get()));
    System.out.println("prototype, asked twice, same object? " + (prototype.get() == prototype.get()));
}`},
 {t:`code`,use:true,cap:`What it prints`,code:`singleton, asked twice, same object? true
prototype, asked twice, same object? false`},
 {t:`mistake`,h:`Keeping per-request data in a field of a singleton bean. Two users hit the same bean at the same time and see each other's data. Keep state in method variables, or use a request-scoped bean.`},
 {t:`p`,h:`<h2>The bean lifecycle, in order</h2>`},
 {t:`diagram`,cap:`The order interviewers want. Setup hooks run after injection and before the bean is used.`,d:{w:420,alt:`Bean lifecycle steps from instantiation to destruction`,nodes:[
   {id:`a`,t:`1 Create`,s:`constructor`,x:6,y:8,w:92},
   {id:`b`,t:`2 Inject`,s:`dependencies`,x:114,y:8,w:92},
   {id:`c`,t:`3 Aware + pre-init`,s:`BeanPostProcessor`,x:222,y:8,w:120},
   {id:`d`,t:`4 Init`,s:`@PostConstruct`,x:6,y:96,w:112},
   {id:`e`,t:`5 Post-init`,s:`proxies made`,x:130,y:96,w:100},
   {id:`f`,t:`6 In use`,x:244,y:104,w:70,k:`state`},
   {id:`g`,t:`7 Destroy`,s:`@PreDestroy`,x:326,y:96,w:90}],
  edges:[{a:`a`,b:`b`},{a:`b`,b:`c`},{a:`c`,b:`d`},{a:`d`,b:`e`},{a:`e`,b:`f`},{a:`f`,b:`g`}]}},
 {t:`steps`,items:[
   [`1 Create.`,` Spring calls your constructor. The object exists, but its dependencies are not set yet (with constructor injection they arrive as arguments).`],
   [`2 Inject.`,` Spring fills in the rest: setter and field injections, <code>@Value</code> values.`],
   [`3 Aware and pre-init.`,` If the bean asks to know about the container (<code>BeanNameAware</code>, <code>ApplicationContextAware</code>), Spring tells it. Then every <code>BeanPostProcessor</code> gets a look before init.`],
   [`4 Init.`,` Your setup code runs: <code>@PostConstruct</code>, then <code>afterPropertiesSet()</code>, then a custom init method. Dependencies are ready, so this is the safe place to load a cache or open a connection.`],
   [`5 Post-init.`,` The post-processors run again. This is where Spring swaps your bean for a <b>proxy</b> if it needs one, for example for <code>@Transactional</code>. What other beans receive is that proxy.`],
   [`6 In use.`,` The bean serves requests for as long as the application runs. A singleton lives until shutdown.`],
   [`7 Destroy.`,` On shutdown Spring calls <code>@PreDestroy</code> and <code>destroy()</code> so you can close resources. Prototype beans are not destroyed by Spring.`]]},
 {t:`code`,use:true,cap:`How it is used: warm a cache at start and close a client at shutdown`,code:`@Component
class PriceCache {
    private final PriceClient client;
    private Map<String, BigDecimal> prices;
    PriceCache(PriceClient client) { this.client = client; }

    @PostConstruct                    // dependencies are ready here, unlike in a field initialiser
    void load() { prices = client.fetchAll(); }

    @PreDestroy                       // runs on graceful shutdown
    void close() { client.close(); }
}`},
 {t:`analogy`,h:`The bean lifecycle is like hiring an employee. The offer letter (creation), the laptop and ID card handed over (injection), the induction day (init method), the actual work (in use), and the exit formality where the laptop is returned (destroy). Spring runs your methods at the induction day and the exit day, so you can open and close things properly.`},
 {t:`code`,cap:`Java: the five moments, written out by hand (plain Java)`,code:`static class Connection {
    Connection()                 { System.out.println("1. constructor: object is created"); }
    void setUrl(String url)      { System.out.println("2. dependencies set: url = " + url); }
    void init()                  { System.out.println("3. @PostConstruct: open the connection"); }
    void use()                   { System.out.println("4. in use: serving requests"); }
    void destroy()               { System.out.println("5. @PreDestroy: close the connection"); }
}
static void s_lifecycle() {
    Connection c = new Connection();     // Spring creates
    c.setUrl("db://orders");             // Spring injects
    c.init();                            // Spring calls your init method
    c.use();                             // your app runs
    c.destroy();                         // on shutdown Spring calls your cleanup
}`},
 {t:`code`,use:true,cap:`What it prints`,code:`1. constructor: object is created
2. dependencies set: url = db://orders
3. @PostConstruct: open the connection
4. in use: serving requests
5. @PreDestroy: close the connection`},
 {t:`plain`,h:`In real Spring the middle three calls are done for you. You only add <code>@PostConstruct</code> on the method that should run at induction, and <code>@PreDestroy</code> on the one that should run at exit. The order never changes.`},
 {t:`p`,h:`<h2>Circular dependencies</h2>`},
 {t:`plain`,h:`A needs B, and B needs A. With constructor injection Spring cannot build either first, so it fails at startup with <code>BeanCurrentlyInCreationException</code>. Since Spring Boot 2.6 circular references are <b>blocked by default</b>.`},
 {t:`steps`,items:[
   [`Best fix: redesign.`,` A cycle usually means two classes share a responsibility. Pull the shared part into a third class, or use an event so one side no longer calls the other.`],
   [`Quick fix: @Lazy.`,` Put <code>@Lazy</code> on one constructor parameter. Spring injects a proxy and resolves it on first use.`],
   [`Do not: turn the check off.`,` <code>spring.main.allow-circular-references=true</code> hides a design problem.`]]},
 {t:`analogy`,h:`A circular dependency is two people at a doorway, each saying "after you". Neither can enter first. With constructor injection, A cannot be built until B exists, and B cannot be built until A exists, so Spring stops at start-up with a clear error. That is actually helpful: it shows a design problem early. The fix is to move the shared piece into a third class that both can use.`},
 {t:`check`,q:`A singleton service keeps a <code>private User currentUser</code> field set on each request. What goes wrong?`,a:`Spring creates one instance shared by all request threads, so one request overwrites another's user. This is a race that leaks data between users. Keep request data in method parameters or local variables. If you truly need request-scoped state, use a request-scoped bean or <code>ThreadLocal</code> managed carefully.`}
]},

{id:`lesson-3`,track:`spring`,trackName:`Spring Boot internals`,title:`Spring Boot auto-configuration: how the magic works`,min:15,
 promise:`"How does Spring Boot know to set up a DataSource when I never wrote one?" This is the answer.`,
 blocks:[
 {t:`plain`,h:`Spring Boot looks at <b>what is on your classpath</b> and <b>what you have already defined</b>, and fills in sensible defaults for the rest. Add <code>spring-boot-starter-web</code> and you get an embedded Tomcat and Jackson. Add a JDBC driver and a DataSource appears. Define your own and Boot steps aside.`},
 {t:`analogy`,h:`A hotel room set-up. If you ask for a tea kettle, they bring one. If you already brought your own, they do not add a second. Auto-configuration is "add it, unless the guest already has it".`},
 {t:`p`,h:`<h2>What <code>@SpringBootApplication</code> really is</h2>`},
 {t:`cards`,items:[
   {h:`@SpringBootConfiguration`,b:`Marks this as a configuration class.`},
   {h:`@EnableAutoConfiguration`,b:`Turns on the classpath-driven defaults. The key one.`},
   {h:`@ComponentScan`,b:`Scans this package and everything under it for components. That is why the main class should sit in the root package.`}]},
 {t:`p`,h:`<h2>The mechanism, step by step</h2>`},
 {t:`steps`,items:[
   [`A list of candidates.`,` Every Boot library ships a file listing its auto-configuration classes. In Boot 3 this is <code>META-INF/spring/org.springframework.boot.autoconfigure.AutoConfiguration.imports</code>. In Boot 2 it was <code>spring.factories</code>.`],
   [`Spring loads them.`,` <code>@EnableAutoConfiguration</code> imports that list.`],
   [`Each class has conditions.`,` <code>@ConditionalOnClass</code> (is this library present?), <code>@ConditionalOnMissingBean</code> (did the user define one?), <code>@ConditionalOnProperty</code> (is it enabled?).`],
   [`Only matching ones apply.`,` The rest are skipped, quietly.`],
   [`Your config wins.`,` Because of <code>@ConditionalOnMissingBean</code>, a bean you define replaces the default.`]]},
 {t:`code`,cap:`A tiny auto-configuration, as Boot does it`,code:`@AutoConfiguration
@ConditionalOnClass(PdfRenderer.class)                    // only if the library is on the classpath
@EnableConfigurationProperties(PdfProperties.class)
public class PdfAutoConfiguration {

    @Bean
    @ConditionalOnMissingBean                             // back off if the app defines its own
    PdfService pdfService(PdfProperties props) {
        return new PdfService(props.getPageSize());
    }
}
// Register it in:
// META-INF/spring/org.springframework.boot.autoconfigure.AutoConfiguration.imports
//   com.myorg.pdf.PdfAutoConfiguration`},
 {t:`code`,use:true,cap:`How it is used: seeing which defaults applied, and overriding one`,code:`# See exactly what matched and what did not
java -jar app.jar --debug
# prints a "CONDITIONS EVALUATION REPORT": Positive matches / Negative matches

// Override a default by defining your own bean. Boot's ObjectMapper backs off.
@Bean
ObjectMapper objectMapper() {
    return new ObjectMapper()
        .registerModule(new JavaTimeModule())
        .disable(SerializationFeature.WRITE_DATES_AS_TIMESTAMPS);
}`},
 {t:`analogy`,h:`Auto-configuration is like a new phone. It comes with a default browser, a default clock and a default keyboard. The moment you install your own keyboard app and choose it, the phone stops using its default. Spring Boot works the same way: it adds a default only when you have not supplied your own.`},
 {t:`code`,cap:`Java: the "add the default only if missing" idea (plain Java)`,code:`static void s_autoconf() {
    Map<String, String> beans = new LinkedHashMap<>();
    beans.put("dataSource", "MyOwnDataSource");          // you defined one yourself

    // Auto-configuration: "add the default only if there is none"
    beans.putIfAbsent("dataSource", "DefaultH2DataSource");   // skipped, yours wins
    beans.putIfAbsent("objectMapper", "DefaultJsonMapper");   // nobody defined one, default added

    beans.forEach((name, impl) -> System.out.println(name + " -> " + impl));
}`},
 {t:`code`,use:true,cap:`What it prints`,code:`dataSource -> MyOwnDataSource
objectMapper -> DefaultJsonMapper`},
 {t:`plain`,h:`Real Spring Boot does exactly this with the annotation <code>@ConditionalOnMissingBean</code>. "Add this default only if there is no bean of this type yet." That one rule explains why defining your own <code>DataSource</code> or <code>ObjectMapper</code> quietly replaces Boot's.`},
 {t:`steps`,items:[[`Something behaves differently than you expected.`,` Do not guess. Ask Boot what it decided.`],[`Run with the debug flag.`,` <code>--debug</code> or <code>debug=true</code> prints a "conditions evaluation report".`],[`Read two lists.`,` "Positive matches" are defaults that were applied. "Negative matches" are defaults that were skipped, with the reason.`],[`Override on purpose.`,` Define your own bean, or set a property, or exclude the auto-configuration class.`]]},
 {t:`p`,h:`<h2>Configuration: properties, profiles, precedence</h2>`},
 {t:`code`,cap:`Typed properties beat scattered @Value strings`,code:`@ConfigurationProperties(prefix = "payments")
public record PaymentProperties(String baseUrl, Duration timeout, int retries) {}

# application.yml
payments:
  base-url: https://pay.example.in
  timeout: 2s
  retries: 3

# application-prod.yml overrides these only when the "prod" profile is active:
#   java -jar app.jar --spring.profiles.active=prod`},
 {t:`cards`,items:[
   {h:`Precedence, high to low`,b:`Command-line arguments, then environment variables, then profile files (<code>application-prod.yml</code>), then <code>application.yml</code>, then defaults. That is how one image runs in every environment.`},
   {h:`Secrets`,b:`Never in the repo. Use environment variables, Kubernetes secrets, or a vault. Spring reads them the same way.`},
   {h:`Actuator`,b:`Adds <code>/actuator/health</code>, <code>/metrics</code>, <code>/prometheus</code>. Health feeds Kubernetes liveness and readiness probes.`}]},
 {t:`mistake`,h:`Putting the main class in a sub-package, so component scanning misses sibling packages. Or defining your own bean and being surprised that the default "disappeared". That is the <code>@ConditionalOnMissingBean</code> rule working as designed.`},
 {t:`check`,q:`You add a second <code>DataSource</code> bean for a reporting database and the app fails at startup with "expected single matching bean". Why, and what do you do?`,a:`Boot's auto-configured repositories and JPA need exactly one primary DataSource. With two, Spring cannot choose. Mark the main one <code>@Primary</code>, give each a name, and use <code>@Qualifier</code> where you inject. For JPA with two databases you also need two EntityManagerFactory and transaction manager configurations.`}
]},

{id:`lesson-4`,track:`spring`,trackName:`Spring Boot internals`,title:`Proxies, AOP and @Transactional: why it sometimes does nothing`,min:18,
 promise:`The most valuable Spring lesson. Once you see the proxy, every @Transactional puzzle becomes easy.`,
 blocks:[
 {t:`plain`,h:`When you put <code>@Transactional</code> on a method, Spring does not change your class. It wraps your bean in a <b>proxy</b>, a stand-in object. Callers talk to the proxy. The proxy opens a transaction, calls your real method, then commits or rolls back.`},
 {t:`analogy`,h:`A receptionist in front of a doctor. Patients go through the receptionist, who opens the file before and closes it after. If a colleague walks into the doctor's room directly, the receptionist never sees them, and no file is opened.`},
 {t:`diagram`,cap:`Calls from outside pass through the proxy. A call made inside the same class goes straight to the target and skips it.`,d:{w:420,alt:`Caller goes through proxy to target, while internal self-call bypasses the proxy`,nodes:[
   {id:`c`,t:`Caller`,x:6,y:20,w:80,k:`state`},
   {id:`p`,t:`Proxy`,s:`begin / commit`,x:130,y:6,w:110},
   {id:`t`,t:`Your bean`,s:`real method`,x:290,y:6,w:120,m:[`save()`,`this.audit()`]},
   {id:`n`,t:`self-call skips the proxy`,x:130,y:96,w:190,k:`note`,m:[`this.audit() = no transaction`]}],
  edges:[{a:`c`,b:`p`},{a:`p`,b:`t`},{a:`t`,b:`n`,k:`uses`}]}},
 {t:`code`,use:true,cap:`How it is used: a transfer that must succeed or fail as one`,code:`@Service
class TransferService {
    private final AccountRepository accounts;
    TransferService(AccountRepository accounts) { this.accounts = accounts; }

    @Transactional                                   // proxy opens a transaction around this
    public void transfer(long fromId, long toId, BigDecimal amt) {
        Account from = accounts.findById(fromId).orElseThrow();
        Account to   = accounts.findById(toId).orElseThrow();
        from.debit(amt);                             // throws if balance is too low
        to.credit(amt);
    }   // returns normally -> COMMIT.  RuntimeException escapes -> ROLLBACK both changes
}`},
 {t:`p`,h:`<h2>The five ways @Transactional "does nothing"</h2>`},
 {t:`cards`,items:[
   {h:`1. Self-invocation`,b:`<code>this.otherMethod()</code> inside the same class bypasses the proxy. The annotation on <code>otherMethod</code> is ignored. Move it to another bean, or inject the bean itself.`},
   {h:`2. Not a public method on a Spring bean`,b:`Object created with <code>new</code>, a private method, or a final class that cannot be proxied. Treat "public method on a bean" as the safe rule.`},
   {h:`3. Checked exception`,b:`By default rollback happens only for <code>RuntimeException</code> and <code>Error</code>. Use <code>rollbackFor = Exception.class</code> for checked ones.`},
   {h:`4. Exception swallowed`,b:`If you catch the exception inside the method, the proxy never sees it, and it commits.`},
   {h:`5. Different thread`,b:`The transaction is bound to the current thread. Work run in another thread or <code>@Async</code> is outside it.`}]},
 {t:`code`,bad:true,cap:`Bad: the audit transaction never starts`,code:`@Service
class OrderService {
    @Transactional
    public void place(Order o) {
        save(o);
        this.audit(o);                 // direct call: no proxy, so REQUIRES_NEW is ignored
    }
    @Transactional(propagation = Propagation.REQUIRES_NEW)
    public void audit(Order o) { ... }
}`},
 {t:`code`,good:true,cap:`Good: put audit in its own bean so the call goes through its proxy`,code:`@Service
class AuditService {
    @Transactional(propagation = Propagation.REQUIRES_NEW)   // commits even if the caller rolls back
    public void audit(Order o) { ... }
}
@Service
class OrderService {
    private final AuditService audit;
    OrderService(AuditService audit) { this.audit = audit; }
    @Transactional
    public void place(Order o) { save(o); audit.audit(o); }
}`},
 {t:`analogy`,h:`Why does @Transactional sometimes do nothing? Imagine a doctor with a receptionist. Every patient who comes through the front door is handled by the receptionist: she opens the file first and closes it after. But if the doctor turns to his own assistant and says "also check this", that request never goes past the receptionist, so no file is opened. In Spring, the proxy is the receptionist. A call from outside goes through her. A call from one method to another <b>inside the same class</b> does not.`},
 {t:`code`,cap:`Java: a hand-made proxy showing the trap (plain Java, using java.lang.reflect.Proxy)`,code:`interface Transfers { void transfer(); void audit(); }

static class RealTransfers implements Transfers {
    public void transfer() {
        System.out.println("  transfer: moving money");
        this.audit();                                     // a call from inside the same object
    }
    public void audit() { System.out.println("  audit: writing the audit row"); }
}

static void s_proxy() {
    Transfers real = new RealTransfers();
    // The proxy is the receptionist. It does work before and after every call that goes THROUGH it.
    Transfers proxy = (Transfers) Proxy.newProxyInstance(
            Transfers.class.getClassLoader(), new Class<?>[]{Transfers.class},
            (p, method, args) -> {
                System.out.println("BEGIN transaction for " + method.getName());
                try {
                    Object result = method.invoke(real, args);
                    System.out.println("COMMIT for " + method.getName());
                    return result;
                } catch (Exception e) {
                    System.out.println("ROLLBACK for " + method.getName());
                    throw e;
                }
            });

    System.out.println("Calling transfer() through the proxy:");
    proxy.transfer();
    System.out.println();
    System.out.println("Notice: audit() ran, but only transfer() got a BEGIN and COMMIT.");
    System.out.println("The inner this.audit() call never went through the proxy.");
}`},
 {t:`code`,use:true,cap:`What it prints`,code:`Calling transfer() through the proxy:
BEGIN transaction for transfer
  transfer: moving money
  audit: writing the audit row
COMMIT for transfer

Notice: audit() ran, but only transfer() got a BEGIN and COMMIT.
The inner this.audit() call never went through the proxy.`},
 {t:`steps`,items:[[`See who calls whom.`,` The test calls <code>proxy.transfer()</code>. It goes through the proxy, so a transaction starts and commits.`],[`Inside, transfer calls audit.`,` It uses <code>this.audit()</code>. <code>this</code> is the real object, not the proxy.`],[`So audit gets no transaction of its own.`,` If audit had <code>REQUIRES_NEW</code> or any other setting, it would be ignored here.`],[`The fix.`,` Put audit in a different bean and inject it. Then the call goes through that bean's proxy.`]]},
 {t:`p`,h:`<h2>Propagation: what if a transaction already exists?</h2>`},
 {t:`cards`,items:[
   {h:`REQUIRED (default)`,b:`Join the current one, or start one if none exists.`},
   {h:`REQUIRES_NEW`,b:`Pause the current one and start a fresh independent one. Good for audit logs.`},
   {h:`NESTED`,b:`A savepoint inside the current one. Partial rollback is possible.`},
   {h:`SUPPORTS, NOT_SUPPORTED, MANDATORY, NEVER`,b:`Run with it if it exists, always without one, require one, or forbid one.`}]},
 {t:`analogy`,h:`Propagation answers one question: "a transaction is already running, what should I do?". <b>REQUIRED</b> is joining a meeting that has already started: you sit in the same room and share the minutes. If the meeting is cancelled, your part is cancelled too. <b>REQUIRES_NEW</b> is stepping out to a separate room with its own minutes. What you decide there is saved even if the main meeting is later cancelled. That is why it suits things like audit logs, which must survive a rollback.`},
 {t:`p`,h:`<h2>Two kinds of proxy</h2>`},
 {t:`two`,a:{h:`JDK dynamic proxy`,b:`Used when the bean implements an interface. The proxy implements the same interface.`},b:{h:`CGLIB proxy`,b:`A generated subclass of your class. Spring Boot uses this by default. That is why a class or method marked <code>final</code> cannot be proxied.`}},
 {t:`remember`,h:`The same proxy idea powers <code>@Async</code>, <code>@Cacheable</code>, <code>@Retryable</code> and Spring Security's <code>@PreAuthorize</code>. All share the same self-invocation limit. One explanation covers all of them.`},
 {t:`mistake`,h:`Holding a transaction open across a slow remote call, such as an HTTP request to a payment gateway. The database connection is held the whole time. Do the remote call outside the transaction, or split into steps.`},
 {t:`check`,q:`A method marked <code>@Transactional</code> throws <code>IOException</code> (checked). The database change is still committed. Why, and what is the fix?`,a:`Spring rolls back by default only for unchecked exceptions (<code>RuntimeException</code> and <code>Error</code>). A checked exception commits. Fix with <code>@Transactional(rollbackFor = IOException.class)</code> or <code>rollbackFor = Exception.class</code>, or throw an unchecked exception.`}
]},

{id:`lesson-5`,track:`spring`,trackName:`Spring Boot internals`,title:`Spring MVC, validation, errors and testing`,min:16,
 promise:`What happens to an HTTP request inside Spring, and the day-to-day pieces around it that interviewers still ask about.`,
 blocks:[
 {t:`diagram`,cap:`One servlet receives every request and delegates. Filters run before it, interceptors run around the controller.`,d:{w:420,alt:`Request flows through filters, DispatcherServlet, interceptors, controller and message converter`,nodes:[
   {id:`f`,t:`Filters`,s:`servlet`,x:6,y:8,w:84},
   {id:`d`,t:`DispatcherServlet`,s:`front controller`,x:112,y:8,w:130},
   {id:`i`,t:`Interceptors`,s:`MVC level`,x:258,y:8,w:100},
   {id:`h`,t:`HandlerMapping`,s:`which one?`,x:6,y:96,w:130},
   {id:`c`,t:`Controller`,x:154,y:104,w:86},
   {id:`m`,t:`Message converter`,s:`to JSON`,x:256,y:96,w:150}],
  edges:[{a:`f`,b:`d`},{a:`d`,b:`i`},{a:`i`,b:`h`},{a:`h`,b:`c`},{a:`c`,b:`m`}]}},
 {t:`steps`,items:[
   [`Filter chain.`,` Servlet filters run first (security, logging, CORS).`],
   [`DispatcherServlet.`,` The single front controller receives the request.`],
   [`HandlerMapping.`,` Finds the controller method that matches the URL and verb.`],
   [`Argument resolution.`,` Builds the method parameters: <code>@PathVariable</code>, <code>@RequestBody</code> (JSON converted by Jackson), <code>@Valid</code>.`],
   [`Controller runs.`,` Calls your service.`],
   [`Response.`,` With <code>@RestController</code> the return value is written as JSON by a message converter. Exceptions go to <code>@ExceptionHandler</code> methods.`]]},
 {t:`two`,a:{h:`Filter`,b:`Part of the servlet standard. Sees every request, even ones Spring MVC never handles. Good for security, request logging, compression.`},b:{h:`Interceptor`,b:`Part of Spring MVC. Knows which controller will run. Good for per-handler checks, timing, adding model data.`}},
 {t:`code`,use:true,cap:`How it is used: validation and one central error response`,code:`record CreateOrder(@NotBlank String sku, @Min(1) int qty, @Email String email) {}

@RestController
@RequestMapping("/orders")
class OrderController {
    @PostMapping
    ResponseEntity<OrderView> create(@Valid @RequestBody CreateOrder req) {   // bad input -> 400 before this runs
        return ResponseEntity.status(201).body(service.create(req));
    }
}

@RestControllerAdvice
class Errors {
    @ExceptionHandler(MethodArgumentNotValidException.class)
    ResponseEntity<Map<String,String>> invalid(MethodArgumentNotValidException e) {
        var fields = new LinkedHashMap<String,String>();
        e.getBindingResult().getFieldErrors().forEach(f -> fields.put(f.getField(), f.getDefaultMessage()));
        return ResponseEntity.badRequest().body(fields);      // {"qty":"must be greater than or equal to 1"}
    }
}`},
 {t:`analogy`,h:`Spring MVC is a hotel front desk. A guest (HTTP request) arrives. The desk looks at the room number (URL and method) and sends the guest to the right department (your controller method). The department does the work and returns something. The desk then wraps it in a proper response. If something goes wrong, a manager (the exception handler) speaks to the guest politely, so the guest never sees the kitchen mess.`},
 {t:`code`,cap:`Java: a front controller in 25 lines (plain Java, no Spring)`,code:`static class MiniDispatcher {
    private final Map<String, java.util.function.Function<String, String>> routes = new HashMap<>();
    void map(String method, String path, java.util.function.Function<String, String> handler) {
        routes.put(method + " " + path, handler);          // like @GetMapping("/orders")
    }
    String handle(String method, String path, String body) {
        var handler = routes.get(method + " " + path);     // 1. find the controller method
        if (handler == null) return "404 Not Found";
        try {
            return "200 " + handler.apply(body);           // 2. run it, 3. turn the result into a response
        } catch (IllegalArgumentException e) {
            return "400 " + e.getMessage();                // like an @ExceptionHandler
        }
    }
}
static void s_mvc() {
    MiniDispatcher dispatcher = new MiniDispatcher();
    dispatcher.map("GET", "/orders", body -> "[order 1, order 2]");
    dispatcher.map("POST", "/orders", body -> {
        if (body.isBlank()) throw new IllegalArgumentException("sku must not be blank");
        return "created " + body;
    });
    System.out.println(dispatcher.handle("GET", "/orders", ""));
    System.out.println(dispatcher.handle("POST", "/orders", "sku-42"));
    System.out.println(dispatcher.handle("POST", "/orders", ""));
    System.out.println(dispatcher.handle("GET", "/nope", ""));
}`},
 {t:`code`,use:true,cap:`What it prints`,code:`200 [order 1, order 2]
200 created sku-42
400 sku must not be blank
404 Not Found`},
 {t:`plain`,h:`Real Spring MVC does these same steps. <code>@GetMapping</code> and <code>@PostMapping</code> fill in the map of routes. The <code>DispatcherServlet</code> is the front desk. <code>@ExceptionHandler</code> or <code>@RestControllerAdvice</code> is the manager who turns a thrown exception into a clean 400 message.`},
 {t:`p`,h:`<h2>Calling other services</h2>`},
 {t:`cards`,items:[
   {h:`RestTemplate`,b:`Older, blocking, in maintenance mode.`},
   {h:`RestClient`,b:`Added in Spring 6.1 and Boot 3.2. A modern fluent blocking client. The default choice for new blocking code.`},
   {h:`WebClient`,b:`Non-blocking, from WebFlux. Use when you are reactive, or need streaming.`},
   {h:`Always`,b:`Set connect and read <b>timeouts</b>, and add retry and a circuit breaker (Resilience4j) for fragile dependencies.`}]},
 {t:`p`,h:`<h2>Testing: use the smallest slice that works</h2>`},
 {t:`cards`,items:[
   {h:`Plain unit test`,b:`No Spring. Constructor-inject mocks. Fastest, and most of your tests.`},
   {h:`@WebMvcTest`,b:`Loads only controllers, filters and converters. Service is a <code>@MockBean</code>. Tests status codes, validation, JSON shape.`},
   {h:`@DataJpaTest`,b:`Loads only JPA parts with an in-memory or Testcontainers database.`},
   {h:`@SpringBootTest`,b:`The whole application. Slow. Keep for a few end-to-end checks, with Testcontainers for real Postgres or Kafka.`}]},
 {t:`code`,use:true,cap:`How it is used: a controller slice test`,code:`@WebMvcTest(OrderController.class)
class OrderControllerTest {
    @Autowired MockMvc mvc;
    @MockBean OrderService service;

    @Test
    void rejectsZeroQuantity() throws Exception {
        mvc.perform(post("/orders").contentType(APPLICATION_JSON)
               .content("{\\"sku\\":\\"A1\\",\\"qty\\":0,\\"email\\":\\"a@b.in\\"}"))
           .andExpect(status().isBadRequest());
    }
}`},
 {t:`mistake`,h:`Using <code>@SpringBootTest</code> for everything. A suite of 300 such tests takes many minutes, and nobody runs it locally. Push logic into plain classes and test those without Spring.`},
 {t:`analogy`,h:`Choosing a test type is choosing how much of the car to test. To check the engine, you do not need to drive on the highway. <b>A plain unit test</b> tests the engine on a bench: fast, no Spring. <b>@WebMvcTest</b> tests the steering and pedals: only the web layer. <b>@DataJpaTest</b> tests the fuel system: only the database layer. <b>@SpringBootTest</b> is the full road test: slow, so use it sparingly. Pick the smallest one that can catch the bug.`},
 {t:`check`,q:`You need to log the time every request takes, including requests rejected by security. Filter or interceptor?`,a:`A servlet <b>filter</b>, ordered before the security filter chain. An interceptor runs only for requests that reach Spring MVC, so requests rejected earlier by security would not be timed.`}
]},

{id:`lesson-6`,track:`spring`,trackName:`Spring Boot internals`,title:`Spring Boot questions with full answers`,min:45,
 promise:`Twelve questions as they are asked. Say your answer first, then open the walk-through.`,
 blocks:[
 {t:`qbank`,items:[
 {n:`How does Spring Boot auto-configuration work?`,tag:`Boot`,where:`The most repeated Spring Boot question in experienced-developer guides`,
  ask:`How does Spring Boot know what to configure? How can you override or exclude a default?`,
  quality:`Name the three annotations, the imports file, and the conditions.`,
  steps:[[`Entry.`,` <code>@SpringBootApplication</code> includes <code>@EnableAutoConfiguration</code>.`],[`Candidates.`,` Boot reads a list of auto-configuration classes from libraries (the <code>.imports</code> file in Boot 3, <code>spring.factories</code> before).`],[`Conditions.`,` Each class is guarded by <code>@ConditionalOnClass</code>, <code>@ConditionalOnMissingBean</code> or <code>@ConditionalOnProperty</code>.`],[`Override.`,` Define your own bean and the default backs off. Or set properties.`],[`Exclude.`,` <code>@SpringBootApplication(exclude = DataSourceAutoConfiguration.class)</code> or <code>spring.autoconfigure.exclude</code>.`],[`Debug.`,` Run with <code>--debug</code> for the conditions report.`]],
  trade:`Fast start-up of a project, but hidden behaviour. When surprised, read the conditions report.`,
  follow:`How would you write your own starter? What is the order of auto-configurations? What does a starter contain?`},
 {n:`Explain the bean lifecycle`,tag:`Core`,where:`A staple in service-company and product rounds`,
  ask:`Walk me through the life of a bean from creation to destruction.`,
  quality:`The right order and where proxies appear.`,
  steps:[[`Instantiate.`,` Constructor runs.`],[`Populate.`,` Dependencies injected.`],[`Aware callbacks.`,` <code>BeanNameAware</code>, <code>ApplicationContextAware</code>.`],[`Before init.`,` <code>BeanPostProcessor.postProcessBeforeInitialization</code>.`],[`Init.`,` <code>@PostConstruct</code>, <code>afterPropertiesSet</code>, custom init method.`],[`After init.`,` <code>postProcessAfterInitialization</code>. This is where AOP proxies are created.`],[`Use, then destroy.`,` <code>@PreDestroy</code> and <code>destroy()</code> on shutdown. Prototype beans are not destroyed by Spring.`]],
  trade:`Hooks are powerful, but heavy work in <code>@PostConstruct</code> slows start-up and can fail the whole application.`,
  follow:`Where do you load config? What is a BeanPostProcessor used for? What is BeanFactoryPostProcessor?`},
 {n:`How does @Transactional work internally?`,tag:`Proxy`,where:`Very often asked, with the self-invocation follow-up`,
  ask:`How does @Transactional work? Why does it sometimes not roll back?`,
  quality:`Proxy mechanism and the specific failure cases.`,
  steps:[[`Proxy.`,` Spring wraps the bean. A <code>TransactionInterceptor</code> runs around the call.`],[`Flow.`,` Get a connection, begin, call the method, commit if it returns, roll back on a qualifying exception.`],[`Binding.`,` The connection is bound to the thread, so nested calls share it.`],[`Failures.`,` Self-invocation, checked exceptions, swallowed exceptions, non-public or final methods, another thread.`],[`Propagation.`,` REQUIRED by default, REQUIRES_NEW to start a separate one.`]],
  code:{cap:`Reproducing the self-invocation bug`,code:`@Service
class Demo {
    public void outer() { inner(); }          // called from a controller via the proxy
    @Transactional
    public void inner() { ... }               // NOT transactional here: outer called it on 'this'
}`,use:`// Fix 1: move inner() into another bean and inject it.
// Fix 2: put @Transactional on outer() as well.
// Fix 3 (last resort): inject the proxy of this bean (@Lazy self-reference) and call self.inner().`},
  trade:`Proxies are non-invasive but invisible. Learn the limits.`,
  follow:`What does readOnly = true do? What is the isolation default? How does REQUIRES_NEW behave when the outer one rolls back?`},
 {n:`Singleton scope and thread safety`,tag:`Core`,where:`Asked to catch candidates who store state in services`,
  ask:`Spring beans are singletons by default. Is that thread-safe?`,
  quality:`Spring does not make them safe. Stateless design does.`,
  steps:[[`Meaning.`,` One instance per container, shared by all threads.`],[`Safe when.`,` The bean is stateless or its state is immutable or properly guarded.`],[`Unsafe when.`,` Mutable fields hold request data.`],[`Fixes.`,` Keep data in method parameters, use request scope, or <code>ThreadLocal</code> with cleanup.`],[`Related trap.`,` A prototype injected into a singleton is created once. Use <code>ObjectProvider</code>.`]],
  trade:`Singletons are cheap and simple. They push you towards stateless services, which is good for scaling.`,
  follow:`Is a Spring singleton the same as the Singleton pattern? (no: one per container, not per JVM or classloader)`},
 {n:`Circular dependency: how do you solve it?`,tag:`Core`,where:`Common because Boot 2.6 turned the leniency off`,
  ask:`Your app fails with BeanCurrentlyInCreationException. What happened and what do you do?`,
  quality:`Prefer redesign. Know @Lazy and the setting.`,
  steps:[[`Cause.`,` A depends on B and B on A through constructors.`],[`Redesign.`,` Extract the shared logic into C, or replace one call with an event.`],[`@Lazy.`,` On one constructor parameter. A proxy is injected and resolved later.`],[`Setter injection.`,` Technically works, but hides the cycle.`],[`Not recommended.`,` <code>spring.main.allow-circular-references=true</code>.`]],
  trade:`Fixing the design is more work now and avoids confusing bugs later.`,
  follow:`Why did constructor injection make this visible? What is the three-level cache?`},
 {n:`@Component, @Service, @Repository, @Bean`,tag:`Core`,where:`Opening question for many rounds`,
  ask:`What are the differences between these stereotype annotations and @Bean?`,
  quality:`Same mechanism, different meaning, plus one practical difference for @Repository.`,
  steps:[[`@Component.`,` Generic stereotype for scanning.`],[`@Service, @Controller.`,` Specialisations that document the layer. <code>@Controller</code> also enables MVC handling.`],[`@Repository.`,` Also translates persistence exceptions into Spring's <code>DataAccessException</code> hierarchy.`],[`@Bean.`,` Method level, in a configuration class, for objects you do not control.`],[`@Configuration.`,` Its methods are proxied, so repeated calls to one <code>@Bean</code> method return the same singleton.`]],
  trade:`Choose the most specific annotation for readability. Behaviour barely differs apart from the two noted.`,
  follow:`What is the difference between @Configuration and @Component with @Bean methods? (the "lite" mode has no proxy)`},
 {n:`Filter vs Interceptor vs AOP`,tag:`Web`,where:`Often asked with logging and security design`,
  ask:`I want to log every request, check a header on some controllers, and audit calls to service methods. What do I use for each?`,
  quality:`Match the tool to the layer.`,
  steps:[[`Every request.`,` A servlet <code>Filter</code> (<code>OncePerRequestFilter</code>). Runs for all requests, even before Spring MVC.`],[`Some controllers.`,` A <code>HandlerInterceptor</code>, registered for specific paths, with access to the handler.`],[`Service methods.`,` AOP with <code>@Aspect</code> and a pointcut. Works on beans, not on raw HTTP.`],[`Order.`,` Filters, then the DispatcherServlet, then interceptors, then AOP around the bean.`]],
  code:{cap:`A simple timing aspect`,code:`@Aspect @Component
class TimingAspect {
    @Around("within(@org.springframework.stereotype.Service *)")
    Object time(ProceedingJoinPoint pjp) throws Throwable {
        long t = System.nanoTime();
        try { return pjp.proceed(); }
        finally { log.info("{} took {} ms", pjp.getSignature(), (System.nanoTime() - t) / 1_000_000); }
    }
}`,use:`// Every public method of every @Service is now timed. No change to the services themselves.
// Remember: it uses a proxy, so internal self-calls are not timed.`},
  trade:`AOP is neat for cross-cutting concerns but invisible. Do not hide business logic in aspects.`,
  follow:`What is a pointcut and an advice? Which advice types exist? How do you order aspects?`},
 {n:`Profiles, properties and configuration per environment`,tag:`Boot`,where:`Common in DevOps-leaning backend rounds`,
  ask:`How do you run the same build in dev, test and prod with different settings and secrets?`,
  quality:`One artifact, external configuration, no secrets in the repo.`,
  steps:[[`One build.`,` The same jar or image everywhere.`],[`Profiles.`,` <code>application-dev.yml</code>, <code>application-prod.yml</code>, activated with <code>spring.profiles.active</code>.`],[`Precedence.`,` Command line, environment variables, then profile files, then <code>application.yml</code>.`],[`Secrets.`,` Environment variables, Kubernetes Secrets or a vault, never the repo.`],[`Typed access.`,` <code>@ConfigurationProperties</code> with validation, so a missing property fails at start-up.`]],
  trade:`Many profiles drift apart. Keep differences small and put most settings in the base file.`,
  follow:`What is Spring Cloud Config? How do you refresh properties without a restart? (@RefreshScope)`},
 {n:`Actuator and production readiness`,tag:`Boot`,where:`Asked with Kubernetes and monitoring questions`,
  ask:`What do you enable before taking a Spring Boot service to production?`,
  quality:`Health, metrics, logging, shutdown and security of the endpoints.`,
  steps:[[`Health.`,` <code>/actuator/health</code> with liveness and readiness groups for Kubernetes probes.`],[`Metrics.`,` Micrometer exposes JVM, HTTP, pool and custom metrics to Prometheus.`],[`Logging.`,` Structured logs with a correlation id from MDC.`],[`Graceful shutdown.`,` <code>server.shutdown=graceful</code> finishes in-flight requests.`],[`Protect.`,` Expose only the needed endpoints and require authentication for the rest.`]],
  trade:`More endpoints mean more insight and more attack surface.`,
  follow:`Liveness versus readiness? What should a readiness check include? (dependencies needed to serve traffic)`},
 {n:`Handling errors and validation consistently`,tag:`Web`,where:`Typical API design discussion`,
  ask:`How do you return consistent errors from a REST API?`,
  quality:`One central handler, a stable error shape, correct status codes.`,
  steps:[[`Validate at the edge.`,` <code>@Valid</code> with Bean Validation constraints on the request record.`],[`One advice.`,` A <code>@RestControllerAdvice</code> maps exceptions to responses.`],[`Stable shape.`,` Use RFC 7807 problem details, which Spring 6 supports with <code>ProblemDetail</code>.`],[`Right codes.`,` 400 invalid input, 401 and 403 for auth, 404 not found, 409 conflict, 422 business rule, 500 unexpected.`],[`Do not leak.`,` No stack traces to clients. Log them with a correlation id.`]],
  trade:`Business exceptions as 4xx help clients. Mapping everything to 500 hides who is at fault.`,
  follow:`How do you validate path variables? How do you add a trace id to the response?`},
 {n:`Testing a Spring Boot service`,tag:`Testing`,where:`Asked for senior roles that own quality`,
  ask:`How do you structure tests for a service with a REST layer, JPA and Kafka?`,
  quality:`A test pyramid with the right slices.`,
  steps:[[`Unit.`,` Plain JUnit and Mockito for business classes. Majority of tests.`],[`Web slice.`,` <code>@WebMvcTest</code> for validation, status codes and JSON.`],[`Data slice.`,` <code>@DataJpaTest</code> with Testcontainers for the real database engine.`],[`Integration.`,` A few <code>@SpringBootTest</code> flows with Testcontainers for Kafka and Postgres.`],[`Contract.`,` Consumer-driven contracts if services are owned by different teams.`]],
  trade:`In-memory H2 is fast but differs from production SQL. Testcontainers is slower and more faithful.`,
  follow:`@MockBean vs @Mock? How do you test a @Transactional rollback? How do you keep context start-up fast? (reuse the same context configuration)`},
 {n:`Spring Boot 3 and what changed from 2`,tag:`Versions`,where:`Rising in 2026 migration-themed rounds`,
  ask:`What changed in Boot 3, and what would you check when upgrading?`,
  quality:`Java 17 baseline, Jakarta, and the concrete breakages.`,
  steps:[[`Java 17.`,` The minimum version.`],[`Jakarta.`,` <code>javax.*</code> became <code>jakarta.*</code> (servlet, persistence, validation). Imports change.`],[`Spring Security 6.`,` <code>WebSecurityConfigurerAdapter</code> removed. Use a <code>SecurityFilterChain</code> bean.`],[`Auto-configuration.`,` Registration moved to the <code>.imports</code> file.`],[`Native and observability.`,` GraalVM native images and Micrometer observability are first-class.`],[`Path.`,` Go to the latest Boot 2.7 first, fix deprecations, then 3.0, using the migration guide and the properties migrator.`]],
  trade:`Upgrade effort is in dependencies and the javax rename, not in your logic.`,
  follow:`Are trailing-slash URLs still matched? (no, in Spring 6) What is the Spring Boot properties migrator?`}
 ]},

var STAGES=[
 {l:'1 server',hurt:'Nothing yet.',fix:'One app server and one database is a perfectly good start. Spend your effort on a clean data model and the right indexes.',cost:'None, and that is the point. Every extra part is something to run and debug.'},
 {l:'Slow queries',hurt:'Pages slow down because the app and database share one machine, and some queries scan whole tables.',fix:'Add indexes. Move the database to its own machine. Use a bigger machine if needed.',cost:'A bigger machine has a ceiling, and one failure still takes everything down.'},
 {l:'Read-heavy',hurt:'The database is busy answering the same read questions again and again.',fix:'Add a cache for popular data. Add read replicas (copies for reading).',cost:'Data can be slightly stale. You now have to decide when to refresh the cache.'},
 {l:'One server is not enough',hurt:'One app server cannot take the traffic, and if it dies, the site is down.',fix:'Run several identical app servers behind a load balancer. Keep them stateless, so any server can handle any request.',cost:'You must move user sessions out of server memory, and handle deployments carefully.'},
 {l:'Slow work blocks users',hurt:'Sending emails or making reports makes users wait. Spikes of traffic can overwhelm the database.',fix:'Put slow work on a queue and let workers process it in the background.',cost:'Duplicates can happen, so workers must be safe to run twice. Users see "pending" for a while.'},
 {l:'Data too big',hurt:'One database cannot hold all the data or take all the writes.',fix:'Split the data across several databases by a key, such as user id. This is sharding.',cost:'Queries across shards are hard, and a popular key can overload one shard.'},
 {l:'Global users',hurt:'Users far from your servers get slow responses, and one data-center outage takes everyone down.',fix:'Serve static files from a CDN. Run in more than one region and route users to the nearest one.',cost:'Data in different regions can briefly disagree, and the bill grows a lot.'}
];

function el(tag,cls,html){var e=document.createElement(tag);if(cls)e.className=cls;if(html!=null)e.innerHTML=html;return e}

function fmt(n){
  if(n>=1e9)return (n/1e9).toFixed(1)+' B';
  if(n>=1e6)return (n/1e6).toFixed(1)+' M';
  if(n>=1e3)return (n/1e3).toFixed(1)+' K';
  return n<10?n.toFixed(1):String(Math.round(n));
}
function fmtBytes(n){var u=['B','KB','MB','GB','TB','PB'],i=0;while(n>=1000&&i<u.length-1){n/=1000;i++}return (n<10?n.toFixed(1):Math.round(n))+' '+u[i]}

function renderBlock(b,host){
  var n;
  switch(b.t){
  case 'p': host.appendChild(el('div','sec',b.h));break;
  case 'plain': n=el('div','box');n.appendChild(el('div','label','In plain words'));n.appendChild(el('p',null,b.h));host.appendChild(n);break;
  case 'analogy': n=el('div','box plain');n.appendChild(el('div','label','Picture it'));n.appendChild(el('p',null,b.h));host.appendChild(n);break;
  case 'mistake': n=el('div','box mistake');n.appendChild(el('div','label','Common mistake'));n.appendChild(el('p',null,b.h));host.appendChild(n);break;
  case 'remember': n=el('div','box remember');n.appendChild(el('div','label','Remember this'));n.appendChild(el('p',null,b.h));host.appendChild(n);break;
  case 'steps':
    n=el('ol','steps');
    b.items.forEach(function(s){var li=el('li',null,'<div><b>'+s[0]+'</b>'+s[1]+'</div>');n.appendChild(li)});
    host.appendChild(n);break;
  case 'two':
    n=el('div','two');
    [b.a,b.b].forEach(function(x){n.appendChild(el('div',null,'<div class="h">'+x.h+'</div><p>'+x.b+'</p>'))});
    host.appendChild(n);break;
  case 'cards':
    n=el('div','cards');
    b.items.forEach(function(c){
      n.appendChild(el('div','card','<h3>'+c.h+'</h3>'+(c.pic?'<div class="pic">'+c.pic+'</div>':'')+'<p>'+c.b+'</p>'+(c.small?'<p class="small">'+c.small+'</p>':'')));
    });
    host.appendChild(n);break;
  case 'code':
    n=el('div','sec');
    var cap=el('div','cap'+(b.bad?' bad':'')+(b.good?' good':''),b.cap||'');
    if(b.use)cap.className+=' use';
    var pre=document.createElement('pre');pre.textContent=b.code;if(b.use)pre.className='use';
    n.appendChild(cap);n.appendChild(pre);host.appendChild(n);break;
  case 'check':
    n=el('div','check');
    n.appendChild(el('div','label','Check yourself'));
    n.appendChild(el('p','q',b.q));
    var btn=el('button','reveal','Think, then show the answer');btn.type='button';
    var ans=el('div','ans',b.a);ans.hidden=true;
    btn.addEventListener('click',function(){ans.hidden=!ans.hidden;btn.textContent=ans.hidden?'Think, then show the answer':'Hide the answer'});
    n.appendChild(btn);n.appendChild(ans);host.appendChild(n);break;
  case 'qbank': host.appendChild(buildQbank(b.items));break;
  case 'diagram': host.appendChild(buildDiagram(b));break;
  case 'links':
    n=el('div','links');
    b.items.forEach(function(x){var a=document.createElement('a');a.href=x[1];a.target='_blank';a.rel='noopener noreferrer';a.textContent=x[0];n.appendChild(a)});
    host.appendChild(n);break;
  case 'calc': host.appendChild(buildCalc());break;
  case 'stages': host.appendChild(buildStages());break;
  case 'drill': host.appendChild(buildDrill());break;
  }
}

function buildCalc(){
  var box=el('div','check');
  box.appendChild(el('div','label','Try it'));
  box.appendChild(el('p',null,'Change the numbers and watch what moves. Start with the example from above.'));
  box.appendChild(el('div','fields',
    '<div class="field"><label for="c-dau">Daily users (millions)</label><input id="c-dau" type="number" min="0" step="any" value="10"></div>'+
    '<div class="field"><label for="c-act">Actions per user per day</label><input id="c-act" type="number" min="0" step="any" value="20"></div>'+
    '<div class="field"><label for="c-rpw">Reads for every 1 write</label><input id="c-rpw" type="number" min="0" step="any" value="10"></div>'));
  var out=el('div','out');out.setAttribute('aria-live','polite');box.appendChild(out);
  var msg=el('div','box');box.appendChild(msg);
  function num(id){var v=parseFloat(box.querySelector(id).value);return isFinite(v)&&v>=0?v:0}
  function run(){
    var dau=num('#c-dau')*1e6,act=num('#c-act'),rpw=num('#c-rpw');
    var day=dau*act,avg=day/86400,pk=avg*3,w=pk/(rpw+1),r=pk-w;
    var data=day/(rpw+1)*1000*365;
    out.innerHTML=
      '<div><span>Requests per day</span><b>'+fmt(day)+'</b></div>'+
      '<div><span>Average per second</span><b>'+fmt(avg)+'</b></div>'+
      '<div><span>Busy-hour per second (x3)</span><b>'+fmt(pk)+'</b></div>'+
      '<div><span>Reads per second at peak</span><b>'+fmt(r)+'</b></div>'+
      '<div><span>Writes per second at peak</span><b>'+fmt(w)+'</b></div>'+
      '<div><span>New data per year (1 KB per write)</span><b>'+fmtBytes(data)+'</b></div>';
    var m;
    if(r<1000&&w<500)m='<b>What this means:</b> one well-tuned database can handle this. Keep it simple.';
    else if(r<10000)m='<b>What this means:</b> reads are the pressure. Add a cache and maybe read replicas.';
    else m='<b>What this means:</b> reads are very high. You need a cache layer, and likely a CDN for static files.';
    if(w>=5000)m+=' Writes are high too, so think about a queue and splitting the data.';
    msg.innerHTML='<p>'+m+'</p>';
  }
  box.addEventListener('input',run);run();
  return box;
}

function buildStages(){
  var wrap=el('div','sec'),sel=2;
  var row=el('div','row');wrap.appendChild(row);
  var panel=el('div','check');panel.setAttribute('aria-live','polite');wrap.appendChild(panel);
  function draw(){
    Array.prototype.forEach.call(row.children,function(b,i){b.setAttribute('aria-pressed',i===sel?'true':'false')});
    var s=STAGES[sel];
    panel.innerHTML='<div><div class="label">What hurts</div><p>'+s.hurt+'</p></div>'+
      '<div><div class="label">The fix</div><p>'+s.fix+'</p></div>'+
      '<div><div class="label">What the fix costs</div><p>'+s.cost+'</p></div>';
  }
  STAGES.forEach(function(s,i){
    var b=el('button','stage',s.l);b.type='button';
    b.addEventListener('click',function(){sel=i;draw()});row.appendChild(b);
  });
  draw();return wrap;
}

function buildDiagram(b){
  var spec=b.d,NS='http://www.w3.org/2000/svg';
  function s(tag,attrs,text){var e=document.createElementNS(NS,tag);for(var k in attrs)e.setAttribute(k,attrs[k]);if(text!=null)e.textContent=text;return e}
  var W=spec.w||420,byId={};
  spec.nodes.forEach(function(n){
    var hdr=n.k==='state'?34:(n.k==='note'?0:(n.s?38:28));
    var ml=n.m?n.m.length:0;
    if(n.k==='state')n.h=34;
    else if(n.k==='note')n.h=ml*14+14;
    else n.h=hdr+(ml?10+14*ml:0);
    n.hdr=hdr;byId[n.id]=n;
  });
  var H=0;spec.nodes.forEach(function(n){H=Math.max(H,n.y+n.h)});H+=14;
  var svg=s('svg',{viewBox:'0 0 '+W+' '+H,role:'img','aria-label':spec.alt||''});
  var defs=s('defs',{});
  function marker(id,w,h,rx,ry,child){
    var m=s('marker',{id:id,viewBox:'0 0 '+w+' '+h,refX:rx,refY:ry,markerWidth:w,markerHeight:h,markerUnits:'userSpaceOnUse',orient:'auto'});
    m.appendChild(child);defs.appendChild(m);
  }
  var uid='m'+Math.floor(Math.random()*1e6);
  marker(uid+'t',12,12,11,6,s('path',{d:'M1,1 L11,6 L1,11 z','class':'mk-tri'}));
  marker(uid+'o',12,12,11,6,s('path',{d:'M1,1 L11,6 L1,11','class':'mk-open'}));
  marker(uid+'f',12,12,11,6,s('path',{d:'M1,1 L11,6 L1,11 z','class':'mk-fill'}));
  marker(uid+'d',14,12,0,6,s('path',{d:'M1,6 L7,1 L13,6 L7,11 z','class':'mk-tri'}));
  svg.appendChild(defs);
  function clip(n,tx,ty){
    var cx=n.x+n.w/2,cy=n.y+n.h/2,dx=tx-cx,dy=ty-cy;
    if(dx===0&&dy===0)return [cx,cy];
    var t=Math.min(dx!==0?(n.w/2)/Math.abs(dx):1e9,dy!==0?(n.h/2)/Math.abs(dy):1e9);
    return [cx+dx*t,cy+dy*t];
  }
  spec.edges.forEach(function(e){
    var A=byId[e.a],B=byId[e.b];
    var ax=A.x+A.w/2,ay=A.y+A.h/2,bx=B.x+B.w/2,by=B.y+B.h/2;
    var dx=bx-ax,dy=by-ay,len=Math.sqrt(dx*dx+dy*dy)||1,o=e.o||0;
    var nx=-dy/len*o,ny=dx/len*o;
    var p1=clip(A,bx+nx,by+ny),p2=clip(B,ax+nx,ay+ny);
    p1=[p1[0]+nx,p1[1]+ny];p2=[p2[0]+nx,p2[1]+ny];
    var k=e.k||'arrow',dash=(k==='implements'||k==='uses');
    var line=s('line',{x1:p1[0],y1:p1[1],x2:p2[0],y2:p2[1],'class':'dg-e'+(dash?' dash':'')});
    if(k==='extends'||k==='implements')line.setAttribute('marker-end','url(#'+uid+'t)');
    else if(k==='uses')line.setAttribute('marker-end','url(#'+uid+'o)');
    else if(k==='has'){line.setAttribute('marker-start','url(#'+uid+'d)');line.setAttribute('marker-end','url(#'+uid+'o)')}
    else line.setAttribute('marker-end','url(#'+uid+'f)');
    svg.appendChild(line);
    if(e.l){
      var mx=(p1[0]+p2[0])/2,my=(p1[1]+p2[1])/2,lw=e.l.length*5.6+10;
      svg.appendChild(s('rect',{x:mx-lw/2,y:my-8,width:lw,height:15,rx:3,'class':'dg-lb'}));
      svg.appendChild(s('text',{x:mx,y:my+3.5,'class':'dg-l'},e.l));
    }
  });
  spec.nodes.forEach(function(n){
    var cls=n.k==='iface'?'dg-if':(n.k==='state'?'dg-st':(n.k==='note'?'dg-note':'dg-box'));
    svg.appendChild(s('rect',{x:n.x,y:n.y,width:n.w,height:n.h,rx:n.k==='state'?17:6,'class':cls}));
    if(n.k==='note'){
      (n.m||[]).forEach(function(l,i){svg.appendChild(s('text',{x:n.x+n.w/2,y:n.y+16+i*14,'class':'dg-n'},l))});
      return;
    }
    if(n.s)svg.appendChild(s('text',{x:n.x+n.w/2,y:n.y+15,'class':'dg-s'},'«'+n.s+'»'));
    svg.appendChild(s('text',{x:n.x+n.w/2,y:n.y+(n.k==='state'?22:(n.s?31:19)),'class':'dg-t'},n.t));
    if(n.m&&n.m.length){
      svg.appendChild(s('line',{x1:n.x,y1:n.y+n.hdr,x2:n.x+n.w,y2:n.y+n.hdr,'class':'dg-sep'}));
      n.m.forEach(function(l,i){svg.appendChild(s('text',{x:n.x+8,y:n.y+n.hdr+6+(i+1)*14-3,'class':'dg-m'},l))});
    }
  });
  var wrap=el('div','diagram');
  wrap.appendChild(svg);
  if(b.cap)wrap.appendChild(el('p','dcap',b.cap));
  return wrap;
}

function buildQbank(items){
  var wrap=el('div');
  items.forEach(function(q){
    var d=document.createElement('details');d.className='q';
    var s=document.createElement('summary');
    s.innerHTML='<span class="qleft"><span>'+q.n+'</span><span class="pill">'+q.tag+'</span></span>';
    d.appendChild(s);
    var b=el('div','qbody');
    b.appendChild(el('p','where','<b>Seen in:</b> '+q.where));
    b.appendChild(el('div','qsec','<div class="label">The question</div><p>'+q.ask+'</p>'));
    b.appendChild(el('div','qsec','<div class="label">What matters most</div><p>'+q.quality+'</p>'));
    var st=el('div','qsec','<div class="label">Walk through it</div>');
    var ol=el('ol','steps');
    q.steps.forEach(function(x){ol.appendChild(el('li',null,'<div><b>'+x[0]+'</b>'+x[1]+'</div>'))});
    st.appendChild(ol);b.appendChild(st);
    if(q.code){
      var c=el('div','qsec');
      c.appendChild(el('div','cap',q.code.cap));
      var pre=document.createElement('pre');pre.textContent=q.code.code;c.appendChild(pre);
      if(q.code.use){
        c.appendChild(el('div','cap use','How it is used'));
        var p2=document.createElement('pre');p2.className='use';p2.textContent=q.code.use;c.appendChild(p2);
      }
      b.appendChild(c);
    }
    b.appendChild(el('div','qsec','<div class="label">Trade-offs to say out loud</div><p>'+q.trade+'</p>'));
    b.appendChild(el('div','qsec','<div class="label">Follow-ups to expect</div><p>'+q.follow+'</p>'));
    d.appendChild(b);wrap.appendChild(d);
  });
  return wrap;
}

var P={lld:['Design a parking lot','Design an elevator system','Design Splitwise (shared expenses)','Design a library system','Design a vending machine','Design an LRU cache','Design a chess game','Design an ATM','Design a movie ticket booking system','Design a logging framework'],
 hld:['Design a URL shortener','Design a news feed','Design a chat application','Design a video streaming service','Design a ride-hailing app','Design a notification system','Design a web crawler','Design search autocomplete','Design a payment system','Design a ticket booking system']};
var timerState={remaining:1200,running:false,endAt:0,id:null};
function buildDrill(){
  var box=el('div','check'),kind='lld',cur='';
  box.appendChild(el('div','label','Today\'s drill'));
  var pill=el('span','pill','LLD');var pw=el('div');pw.appendChild(pill);box.appendChild(pw);
  var prompt=el('p',null,'');prompt.style.cssText='font:600 1.2rem/1.4 var(--font-display)';box.appendChild(prompt);
  var r1=el('div','row');
  var bl=el('button','reveal','New LLD prompt'),bh=el('button','reveal','New HLD prompt');bl.type=bh.type='button';
  r1.appendChild(bl);r1.appendChild(bh);box.appendChild(r1);
  var time=el('div','timer','20:00');box.appendChild(time);
  var phase=el('p',null,'Ready when you are.');box.appendChild(phase);
  var r2=el('div','row');
  var st=el('button','btn','Start'),rs=el('button','btn ghost','Reset');st.type=rs.type='button';
  r2.appendChild(st);r2.appendChild(rs);box.appendChild(r2);
  function pick(k){kind=k;var l=P[k],p=cur;while(p===cur)p=l[Math.floor(Math.random()*l.length)];cur=p;prompt.textContent=p;pill.textContent=k.toUpperCase()}
  function render(){
    var rem=timerState.remaining,m=Math.floor(rem/60),s=rem%60;
    time.textContent=(m<10?'0':'')+m+':'+(s<10?'0':'')+s;
    var el_=1200-rem,txt;
    if(rem<=0)txt='Time. Now write one line: what did I skip or hand-wave?';
    else if(!timerState.running&&el_===0)txt='Ready when you are. Talk out loud.';
    else if(el_<300)txt='Clarify: ask questions, pick three must-haves and one key quality.';
    else if(el_<900)txt=kind==='lld'?'Model: nouns, verbs, who owns what, what will change.':'Model: numbers, the two actions, smallest design, what breaks first.';
    else txt='Stress and trade: two users at once, a new requirement, then the template sentence.';
    phase.textContent=txt;
    st.textContent=timerState.running?'Pause':(rem<=0||rem===1200?'Start':'Resume');
  }
  function tick(){
    timerState.remaining=Math.max(0,Math.ceil((timerState.endAt-Date.now())/1000));
    if(timerState.remaining<=0){timerState.running=false;clearInterval(timerState.id);timerState.id=null}
    render();
  }
  st.addEventListener('click',function(){
    if(timerState.running){timerState.running=false;clearInterval(timerState.id);timerState.id=null;render();return}
    if(timerState.remaining<=0)timerState.remaining=1200;
    timerState.running=true;timerState.endAt=Date.now()+timerState.remaining*1000;
    timerState.id=setInterval(tick,500);render();
  });
  rs.addEventListener('click',function(){timerState.running=false;clearInterval(timerState.id);timerState.id=null;timerState.remaining=1200;render()});
  bl.addEventListener('click',function(){pick('lld');render()});
  bh.addEventListener('click',function(){pick('hld');render()});
  pick('lld');render();
  return box;
}

/* ================= PAGE ================= */
var cur=0;
function idx(){
  var h=(location.hash||'').replace('#','');
  for(var i=0;i<L.length;i++)if(L[i].id===h)return i;
  return 0;
}
function drawList(){
  var host=$('#list');host.innerHTML='';
  var last='';
  L.forEach(function(l,i){
    if(l.trackName!==last){last=l.trackName;host.appendChild(el('h3',null,l.trackName))}
    var a=document.createElement('a');a.href='#'+l.id;
    if(i===cur)a.setAttribute('aria-current','page');
    a.innerHTML='<span class="n">'+(i+1)+'</span><span>'+l.title+'</span><span class="'+(done[l.id]?'tick':'min')+'">'+(done[l.id]?'&#10003; done':l.min+' min')+'</span>';
    a.addEventListener('click',function(){closeList()});
    host.appendChild(a);
  });
}
function closeList(){$('#list').classList.remove('open');$('#menu-btn').setAttribute('aria-expanded','false')}
$('#menu-btn').addEventListener('click',function(){
  var o=$('#list').classList.toggle('open');this.setAttribute('aria-expanded',o?'true':'false');
});
function meter(){
  var n=0;L.forEach(function(l){if(done[l.id])n++});
  $('#meter').style.width=Math.round(n/L.length*100)+'%';
}
function draw(){
  cur=idx();
  var l=L[cur];
  document.body.setAttribute('data-track',l.track);
  $('#where').textContent='Lesson '+(cur+1)+' of '+L.length+' · '+l.trackName;
  var host=$('#lesson');host.innerHTML='';
  var head=el('div');
  head.appendChild(el('div','kicker',l.trackName+' · about '+l.min+' minutes'));
  head.appendChild(el('h1',null,l.title));
  head.appendChild(el('p','promise',l.promise));
  host.appendChild(head);
  l.blocks.forEach(function(b){renderBlock(b,host)});
  var dr=el('label','done-row');
  var cb=document.createElement('input');cb.type='checkbox';cb.checked=!!done[l.id];
  cb.addEventListener('change',function(){if(cb.checked)done[l.id]=1;else delete done[l.id];save();meter();drawList()});
  dr.appendChild(cb);dr.appendChild(el('span',null,'I finished this lesson'));
  host.appendChild(dr);
  var nav=el('div','nav');
  var pv=el('button','btn ghost','Previous');pv.type='button';pv.disabled=cur===0;
  var nx=el('button','btn',cur===L.length-1?'Back to lesson 1':'Next lesson');nx.type='button';
  pv.addEventListener('click',function(){if(cur>0)location.hash=L[cur-1].id});
  nx.addEventListener('click',function(){location.hash=L[cur===L.length-1?0:cur+1].id});
  nav.appendChild(pv);nav.appendChild(nx);host.appendChild(nav);
  meter();drawList();
}
window.addEventListener('hashchange',function(){draw();window.scrollTo(0,0)});
draw();
})();
